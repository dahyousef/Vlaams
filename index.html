  const box = (n, l, c) => '<div class="tally-box ' + c + '"><div class="t-n">' + n + '</div><div class="t-l">' + l + '</div></div>';

  function defiDone(mins) {
    const out = L.lives <= 0, flawless = L.wrong === 0;
    return '<div class="lesson"><div class="lesson-body"><div class="stage done-stage">' +
      '<div class="done-mark">' + (flawless ? '\u{1F3C6}' : out ? '\u{1F494}' : '⚡') + '</div>' +
      '<h2>' + (flawless ? NL.t.defiFlawless : out ? NL.t.defiOver : NL.t.defiSurvived) + '</h2>' +
      '<p class="done-sub">' + NL.t.defiScoreLine(L.right, L.queue.length) + '</p>' +
      '<div class="tally">' +
      box(L.right, NL.t.tallyScore, L.defiRecord ? 'gold' : 'blue') +
      box(Math.max(L.right, L.prevDefiBest), NL.t.tallyRecord, '') +
      box('+' + L.xp, NL.t.tallyXp, 'gold') +
      box('\u{1F525} ' + L.bestCombo, NL.t.tallyCombo, L.comboRecord ? 'gold' : '') +
      '</div>' +
      (L.defiRecord ? '<p class="record">' + NL.t.defiRecord(L.right, L.prevDefiBest) + '</p>'
        : '<p class="done-sub">' + NL.t.defiToBeat(L.prevDefiBest) + '</p>') +
      '<div class="done-actions">' +
      '<button class="btn btn-primary wide" data-act="defi">' + NL.t.defiAgain + '</button>' +
      '<button class="btn btn-ghost wide" data-go="vandaag">' + NL.t.sessionBack + '</button>' +
      '</div></div></div></div>';
  }

  /* ---------------- interaction ---------------- */
  function click(el, d) {
    if (d.act === 'quit') { if (L && !L.finished) NL.ui.openSheet('quit-session'); else { L = null; NL.ui.go('vandaag'); } return; }
    if (d.act === 'again') { L = null; start('vandaag'); NL.ui.render(); autoplay(); return; }
    if (d.act === 'defi') { L = null; if (!start('defi')) { NL.ui.go('vandaag'); NL.ui.toast(NL.t.defiLocked(DEFI_MIN)); return; } NL.ui.render(); autoplay(); return; }
    if (d.check !== undefined) return check();
    if (d.next !== undefined) return next();
    if (d.skip !== undefined) return skip();
    if (d.quiet !== undefined) return quiet();
    if (!L || L.phase !== 'ask') return;

    const c = cur();
    if (d.opt !== undefined) {
      const i = +d.opt;
      if (c.task.opts && !c.task.opts[i]) return;   // no such option on screen
      L.sel = { i };
      NL.ui.render(); return;
    }
    if (d.pick !== undefined) { L.picked.push(+d.pick); NL.ui.render(); return; }
    if (d.unpick !== undefined) { L.picked = L.picked.filter(x => x !== +d.unpick); NL.ui.render(); return; }
    if (d.ins !== undefined) { L.input += d.ins; NL.ui.render(); return; }
    if (d.match !== undefined) return matchTap(d, c.task);
    if (d.mic !== undefined) return mic(d.mic, c.task);
    if (d.rec !== undefined) return recAction(d.rec, c.task);
    if (d.self !== undefined) {
      L.speech.selfRated = d.self === '1';
      NL.ui.render();
      return;
    }
  }

  function matchTap(d, task) {
    const id = d.match, k = +d.k, side = d.side;
    if (!L.matchSel) { L.matchSel = { id, k, side }; L.matchBad = null; NL.ui.render(); return; }
    if (L.matchSel.id === id) { L.matchSel = null; NL.ui.render(); return; }
    if (L.matchSel.side === side) { L.matchSel = { id, k, side }; NL.ui.render(); return; }
    const lk = side === 'l' ? k : L.matchSel.k, rk = side === 'r' ? k : L.matchSel.k;
    if (EX.registry.match.fits(task, lk, rk)) {
      L.matchGone.push('l' + lk, 'r' + rk); L.matchSel = null; NL.audio.ok();
      NL.speech.say(task.pairs[lk].nl);
      if (EX.registry.match.ready(task, L)) { L.right++; L.xp += 2; setTimeout(next, 500); }
      NL.ui.render();
    } else {
      L.matchBad = id; L.matchSel = null; NL.audio.no();
      NL.ui.render();
      setTimeout(() => { if (L) { L.matchBad = null; NL.ui.render(); } }, 340);
    }
  }

  /* Record-and-compare: the speaking path when no recogniser exists. */
  function recAction(action, task) {
    const sp = L.speech;
    if (action === 'stop') { NL.speech.stopRecord(); return; }
    if (action === 'play') { NL.speech.playRecording(); return; }
    if (action === 'both') { NL.speech.playBoth(task.target); return; }

    sp.recState = 'rec'; sp.recErr = null;
    NL.audio.mic(); NL.ui.render();
    NL.speech.record({
      onstart: () => { sp.recTimer = setTimeout(() => NL.speech.stopRecord(), 7000); },
      onstop: () => {
        if (!L) return;
        clearTimeout(L.speech.recTimer);
        L.speech.recState = 'done';
        NL.ui.render();
      },
      onerror: kind => {
        if (!L) return;
        L.speech.recState = 'idle'; L.speech.recErr = kind;
        NL.ui.render();
      }
    });
  }

  function mic(action, task) {
    const sp = L.speech;
    if (action === 'stop') { NL.speech.abort(); sp.phase = 'idle'; NL.ui.render(); return; }
    sp.phase = 'listening'; sp.partial = ''; sp.error = null;
    NL.audio.mic();
    NL.ui.render();
    NL.speech.listen({
      onpartial: txt => { if (L && L.speech.phase === 'listening') { L.speech.partial = txt; NL.ui.render(); } },
      onerror: kind => {
        if (!L) return;
        L.speech.phase = 'idle'; L.speech.error = kind; L.speech.tries++;
        if (kind === 'denied' || kind === 'network' || kind === 'browser') L.speech.selfRated = null;
        NL.ui.render();
      },
      onend: (text, alts) => {
        if (!L || L.speech.phase !== 'listening') return;
        const res = NL.speech.score(alts && alts.length ? alts : [text], task.target);
        L.speech.phase = 'done';
        L.speech.tries++;
        L.speech.pct = res.pct;
        L.speech.parts = res.parts;
        L.speech.heard = res.heard;
        L.speech.ok = res.pass;
        if (res.pass) NL.audio.ok();
        NL.ui.render();
      }
    });
  }

  function input(el) {
    if (!el.classList.contains('textin') || !L) return;
    const c = cur(), ex = EX.get(c.ex);
    const before = ex.ready(c.task, L);
    L.input = el.value;
    const after = ex.ready(c.task, L);
    if (before !== after) {
      const btn = document.querySelector('[data-check]');
      if (btn) btn.disabled = !after;
    }
  }

  function key(e) {
    if (!L || L.finished) return;
    if (e.key === 'Enter') {
      e.preventDefault();
      if (L.phase === 'ask') check(); else next();
      return;
    }
    if (L.phase !== 'ask') return;
    const c = cur(); if (!c) return;
    const typing = document.activeElement && document.activeElement.tagName === 'INPUT';
    if (/^[1-9]$/.test(e.key) && !typing) {
      const i = +e.key - 1;
      const b = document.querySelector('[data-opt="' + i + '"]') || document.querySelectorAll('.bank .tile')[i];
      if (b && !b.disabled) { e.preventDefault(); b.click(); }
    }
    if (e.key === 'Backspace' && !typing && L.picked.length) { e.preventDefault(); L.picked.pop(); NL.ui.render(); }
    if (e.key === 'r' && !typing) { const s = document.querySelector('[data-say]'); if (s) { e.preventDefault(); s.click(); } }
    if (e.key === 'm' && !typing) { const s = document.querySelector('[data-mic]'); if (s) { e.preventDefault(); s.click(); } }
  }

  function after(a) {
    const inp = document.querySelector('.textin');
    if (inp && L && L.phase === 'ask') { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }

  return {
    render(a) {
      if (!L) {
        if (!start(a)) return emptyState();
        setTimeout(autoplay, 80);
      }
      if (L.finished) return done();
      return view();
    },
    click, input, key, after, active, abandon, defiReady, DEFI_MIN,
    /* Read-only, for the headless tests: they need the live task to answer it. */
    peek: () => cur(),
    begin(source) { L = null; if (start(source)) { setTimeout(autoplay, 60); return true; } return false; }
  };
})();
</script>
<script>
/* Aujourd'hui (la session du jour), Parcours (le programme) et Plus (le reste).
   Une décision par écran : l'action principale d'abord, le reste sous la ligne de flottaison. */
(function () {
  'use strict';
  const U = NL.util, esc = U.esc, t = NL.t;

  /* ---------------------------------------------------- Aujourd'hui */
  NL.screens.vandaag = {
    render() {
      const m = NL.state.meta();
      const cp = NL.content.courseProgress();
      const p = NL.srs.plan();
      const fresh = p.fresh, total = p.total, mins = p.mins;
      const v = NL.speech.voiceInfo();

      let html = '<div class="wrap">';

      /* The one thing this screen is for. Elle nomme l'unité — ou les deux, quand
         la séance en couvre plusieurs : un libellé ne dit jamais une demi-vérité. */
      html += '<section class="card session-card">' +
        '<span class="eyebrow">' + t.todayEyebrow + (p.units ? ' · ' + esc(NL.ui.unitLabel(p.units)) : '') + '</span>' +
        (total === 0 && p.left === 0 && NL.srs.dueItems().length > 0
          ? '<h2>' + t.budgetDone + '</h2>' +
          '<button class="btn btn-blue wide big" data-go="praten">' + t.todayPractise + '</button>'
          : total === 0
          ? '<h2>' + t.todayAllDone + '</h2><p class="sc-sub">' + t.todayAllDoneSub + '</p>' +
          '<button class="btn btn-blue wide big" data-go="praten">' + t.todayPractise + '</button>'
          : '<h2>' + t.todayReady(total) + '</h2>' +
          '<p class="sc-sub">' + t.todaySplit(p.due, fresh, mins) + '</p>' +
          '<button class="btn btn-primary wide big" data-act="start">' + t.todayStart + '</button>') +
        '</section>';

      if (v.quality !== 'be') {
        html += '<button class="notice" data-go="doctor">' +
          '<b>' + (v.quality === 'nl' ? t.voiceNorthTitle : t.voiceNoneTitle) + '</b>' +
          '<p>' + esc(t[v.noteKey]) + ' ' + t.voiceFix + '</p></button>';
      }

      /* La série enregistrée ne change qu'à la séance suivante : un jour sauté, elle est déjà coupée.
         Même compte des jours que creditDay(), qui ne la prolonge que depuis la veille. */
      const streak = m.lastDay && U.dayDiff(m.lastDay, U.dayKey()) <= 1 ? m.streak : 0;
      html += '<div class="tri">' +
        stat(streak, t.statStreak(streak)) +
        stat(cp.met, t.statMet) +
        stat(cp.produce, t.statProduce) +
        '</div>';

      html += '<h3 class="sec">' + t.morepractice + '</h3><div class="cards">';
      html += defiTile(m);
      const scn = (NL.content.scenarios || []).filter(s => (m.scenariosDone || []).indexOf(s.id) < 0)[0] || NL.content.scenarios[0];
      html += tile(scn.icon, NL.gloss.of(scn.title), NL.gloss.of(scn.place), 'scn', scn.id);
      html += tile('\u{1F3A7}', t.listenTitle, t.listenUnderstandSub, 'go', 'luisteren');
      const sheet = NL.content.sheets[(m.doneToday || 0) > 0 ? 1 : 0];
      html += tile(sheet.icon, NL.gloss.of(sheet.title), NL.gloss.of(sheet.blurb), 'sheetid', sheet.id);
      html += '</div></div>';
      return html;
    },
    click(el, d) {
      if (d.act === 'start') { NL.screens.sessie.begin('vandaag'); NL.ui.go('sessie'); return; }
      if (d.act === 'defi') return openDefi();
      if (d.scn) { NL.ui.go('scenario', d.scn); return; }
      if (d.sheetid) { NL.ui.go('spiek', d.sheetid); return; }
    }
  };

  /* Le défi : visible dès le début, verrouillé tant qu'il n'y a pas de quoi le remplir. */
  function defiTile(m) {
    const ready = NL.screens.sessie.defiReady();
    return '<button class="tile-card defi' + (ready ? '' : ' locked') + '" data-act="defi">' +
      '<span class="tc-icon">⚡</span>' +
      '<span class="tc-body"><b>' + t.defiTitle + '</b><i>' +
      (ready ? (m.defiBest ? t.defiSubBest(m.defiBest) : t.defiSub) : t.defiLocked(NL.screens.sessie.DEFI_MIN)) +
      '</i></span><span class="tc-cta">›</span></button>';
  }
  function openDefi() {
    if (!NL.screens.sessie.defiReady()) { NL.ui.toast(t.defiLocked(NL.screens.sessie.DEFI_MIN)); return; }
    NL.screens.sessie.begin('defi'); NL.ui.go('sessie');
  }

  const stat = (n, l) => '<div class="stat-box"><div class="s-n">' + n + '</div><div class="s-l">' + esc(l) + '</div></div>';
  const tile = (icon, title, sub, key, val) =>
    '<button class="tile-card" data-' + key + '="' + esc(val) + '">' +
    '<span class="tc-icon">' + icon + '</span>' +
    '<span class="tc-body"><b>' + esc(title) + '</b><i>' + esc(sub) + '</i></span>' +
    '<span class="tc-cta">›</span></button>';

  /* ---------------------------------------------------- Parcours */
  NL.screens.leerpad = {
    render() {
      const cp = NL.content.courseProgress();
      let html = '<div class="wrap">' +
        '<section class="card lead slim">' +
        '<span class="eyebrow">' + t.pathEyebrow + '</span>' +
        '<h1>' + t.pathTitle + '</h1>' +
        '<p>' + t.pathBody + '</p>' +
        '<p class="muted small">' + t.courseCounts(cp.met, cp.produce, cp.total) + '</p>' +
        '</section>';

      NL.content.units.forEach(u => {
        const open = NL.content.unitOpen(u.id);
        const isNow = cp.current && cp.current.id === u.id;
        const p = NL.content.unitProgress(u.id);
        const g = (u.grammar || []).map(id => (NL.content.patterns || []).find(x => x.id === id)).filter(Boolean);
        html += '<section class="unit-card' + (open ? '' : ' locked') + (isNow ? ' now' : '') + '">' +
          (isNow ? '<span class="now-tag">' + t.currentUnit + '</span>' : '') +
          '<div class="uc-head">' +
          '<span class="uc-icon">' + u.icon + '</span>' +
          '<div class="uc-title"><span class="eyebrow">' + t.unitOne(u.n) + ' · ' + u.level + ' · ' + trackName(u.track) + '</span>' +
          '<h2>' + esc(NL.gloss.of(u.name)) + '<i class="uc-nl" lang="nl-BE">' + esc(u.nlName || '') + '</i></h2></div>' +
          '<span class="uc-pct">' + p.met + '/' + p.total + '</span>' +
          '</div>' +
          '<p class="uc-blurb">' + esc(NL.gloss.of(u.blurb)) + '</p>' +
          '<p class="muted small">' + t.unitCounts(p.met, p.produce, p.total) + '</p>' +
          /* Le seuil est un compte à rebours, pas un mystère. */
          (open && p.toOpen > 0 && u !== NL.content.units[NL.content.units.length - 1]
            ? '<p class="uc-gate">' + t.unitGate(p.toOpen) + '</p>' : '') +
          (g.length ? '<div class="uc-gram">' + g.map(x =>
            '<button class="gram-chip" data-act="gram" data-id="' + x.id + '">' + esc(NL.gloss.of(x.title)) + '</button>').join('') + '</div>' : '') +
          (open
            ? '<button class="btn btn-blue" data-unit="' + u.id + '">' + (p.met ? t.unitPractise : t.unitStart) + '</button>'
            : '<p class="uc-lock">' + t.unitLocked(u.n - 1) + '</p>') +
          '</section>';
      });
      return html + '</div>';
    },
    click(el, d) {
      if (d.unit) { NL.screens.sessie.begin(d.unit); NL.ui.go('sessie'); return; }
      if (d.act === 'gram') {
        const g = (NL.content.patterns || []).find(x => x.id === el.dataset.id);
        if (g) NL.ui.openSheet({ custom: NL.ui.card(esc(NL.gloss.of(g.title)),
          '<p class="rule">' + esc(NL.gloss.of(g.rule)) + '</p><div class="explain">' + NL.gloss.prose(NL.gloss.of(g.explain)) + '</div>' +
          '<div class="ex-list">' + g.drills.slice(0, 3).map(d2 =>
            '<button class="ex-row" data-say="' + esc(d2.nl) + '"><b lang="nl-BE">' + esc(d2.nl) + '</b><i>' + esc(NL.gloss.of(d2)) + '</i></button>').join('') + '</div>',
          '<button class="btn btn-ghost wide" data-close="1">' + t.close + '</button>') });
      }
    }
  };
  const trackName = tr => tr === 'werk' ? t.trackWork : tr === 'leven' ? t.trackLife : t.trackBoth;

  /* ---------------------------------------------------- Plus */
  NL.screens.meer = {
    render() {
      const c = NL.srs.counts();
      const cp = NL.content.courseProgress();
      const mine = NL.content.allItems().filter(it => it.unit === 'eigen').length;
      const m = NL.state.meta();
      const byDay = {};
      NL.state.logs().forEach(l => { const d = U.dayKey(l.t); byDay[d] = (byDay[d] || 0) + 1; });
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const d = U.dayKey(Date.now() - i * U.DAY);
        days.push({ d, n: byDay[d] || 0 });
      }
      const maxN = Math.max(1, ...days.map(x => x.n));

      return '<div class="wrap">' +
        '<div class="cards">' +
        defiTile(m) +
        tile('\u{1F4D2}', t.wordsEyebrow, t.wordsTile(cp.met, cp.produce), 'go', 'woorden') +
        tile('\u{1F3AF}', t.missEyebrow, t.missTile(NL.srs.mistakes().length), 'go', 'fouten') +
        tile('\u{1F4CB}', t.sheetsEyebrow, t.sheetsTitle, 'go', 'spiek') +
        tile('\u{1F1E7}\u{1F1EA}', t.regEyebrow, t.regTitle, 'go', 'register') +
        tile('\u{1F444}', t.soundsEyebrow, t.soundsTitle, 'go', 'klanken') +
        tile('\u{1F517}', 'de / het', t.dehetTitle, 'go', 'dehet') +
        tile('\u{1F50A}', t.docEyebrow, t.docTitle, 'go', 'doctor') +
        '</div>' +

        '<h3 class="sec">' + t.weekTitle + '</h3>' +
        '<section class="card"><div class="spark">' +
        days.map(x => '<div class="spark-col" title="' + x.d + ' : ' + x.n + '">' +
          '<div class="spark-bar" style="height:' + Math.max(4, x.n / maxN * 62) + 'px"></div>' +
          '<span>' + t.days[new Date(x.d).getDay()] + '</span></div>').join('') +
        '</div>' +
        '<div class="mini-stats">' +
        '<span><b>' + cp.met + '</b> ' + t.statMet + '</span>' +
        '<span><b>' + cp.produce + '</b> ' + t.statProduced + '</span>' +
        (mine ? '<span><b>' + mine + '</b> ' + t.statMine + '</span>' : '') +
        '<span><b>' + c.said + '</b> ' + t.statSpoken + '</span>' +
        '<span><b>' + (m.best || 0) + '</b> ' + t.statBest + '</span>' +
        '<span><b>' + (m.bestCombo || 0) + '</b> ' + t.statCombo + '</span>' +
        '<span><b>' + (m.defiBest || 0) + '</b> ' + t.statDefi + '</span>' +
        '<span><b>' + m.xp + '</b> ' + t.tallyXp + '</span>' +
        '</div></section></div>';
    },
    click(el, d) {
      if (d.sheetid) NL.ui.go('spiek', d.sheetid);
      if (d.act === 'defi') openDefi();
    }
  };
})();
</script>
<script>
/* Praten: the scenario list, and the player that makes you say your turn out loud. */
(function () {
  'use strict';
  const U = NL.util, esc = U.esc, ICON = NL.ex.ICON;
  let P = null;

  /* ---------------------------------------------------- list */
  NL.screens.praten = {
    render() {
      const m = NL.state.meta();
      const done = m.scenariosDone || [];
      const groups = [
        { t: NL.t.talkLife, s: NL.t.talkLifeSub, track: 'leven' },
        { t: NL.t.talkWork, s: NL.t.talkWorkSub, track: 'werk' }
      ];
      let html = '<div class="wrap">' +
        '<section class="card lead slim"><span class="eyebrow">' + NL.t.talkEyebrow + '</span>' +
        '<h1>' + NL.t.talkTitle + '</h1>' +
        '<p>' + NL.t.talkBody + '</p></section>';

      groups.forEach(g => {
        html += '<h3 class="sec">' + g.t + '<span class="sec-sub">' + esc(g.s) + '</span></h3>';
        (NL.content.scenarios || []).filter(s => s.track === g.track).forEach(s => {
          const isDone = done.indexOf(s.id) >= 0;
          html += '<button class="scn-card' + (isDone ? ' done' : '') + '" data-scn="' + s.id + '">' +
            '<span class="scn-icon">' + s.icon + '</span>' +
            '<span class="scn-body">' +
            '<span class="eyebrow">' + esc(NL.gloss.of(s.place)) + '</span>' +
            '<b>' + esc(NL.gloss.of(s.title)) + '</b>' +
            '<i>' + esc(NL.gloss.of(s.blurb)) + '</i></span>' +
            '<span class="scn-go">' + (isDone ? NL.t.talkDone : NL.t.start) + '</span></button>';
        });
      });
      return html + '</div>';
    },
    click(el, d) { if (d.scn) NL.ui.go('scenario', d.scn); }
  };

  /* ---------------------------------------------------- player */
  function open(id) {
    const scn = NL.content.scenario(id);
    if (!scn) return false;
    P = { scn, at: 0, phase: 'them', log: [], choice: null, speech: fresh(), spoken: 0, tried: 0 };
    advanceThem();
    return true;
  }
  const fresh = () => ({ phase: 'idle', tries: 0, selfRated: null, partial: '' });

  /* Plays one `them` line into the transcript — one at a time, so the audio never
     stacks up — then works out whose turn it is. */
  function advanceThem() {
    if (P.at < P.scn.steps.length && P.scn.steps[P.at].them) {
      const t = P.scn.steps[P.at].them;
      P.log.push({ who: 'them', nl: t.nl, be: t.be, fr: t.fr, en: t.en });
      P.at++;
      say(t.be || t.nl);
    }
    P.phase = P.at < P.scn.steps.length && P.scn.steps[P.at].them ? 'them'
      : P.at < P.scn.steps.length ? 'choose' : 'done';
    if (P.phase === 'done') finish();
  }

  function say(text, slow) {
    if (NL.state.meta().autoplay === false && !slow) return;
    setTimeout(() => NL.speech.say(text, { rate: slow ? 0.62 : 1 }), 120);
  }

  function finish() {
    const m = NL.state.meta();
    const done = (m.scenariosDone || []).slice();
    if (done.indexOf(P.scn.id) < 0) done.push(P.scn.id);
    NL.state.setMeta({ scenariosDone: done, xp: m.xp + 12 });
    NL.state.creditDay();
    NL.audio.win();
  }

  NL.screens.scenario = {
    render(id) {
      if (!P || (id && P.scn.id !== id)) { if (!open(id)) return '<div class="wrap"><p class="empty">' + NL.t.scnMissing + '</p></div>'; }
      const s = P.scn;
      const step = P.scn.steps[P.at];

      const transcript = P.log.map(b => {
        if (b.who === 'them') {
          return '<div class="bub them">' +
            '<button class="bub-say" data-say="' + esc(b.be || b.nl) + '" aria-label="' + NL.t.replay + '">' + ICON.speaker(17) + '</button>' +
            '<div><p class="bub-nl" lang="nl-BE">' + esc(b.be || b.nl) + '</p>' +
            (b.be && U.norm(b.be) !== U.norm(b.nl) ? '<p class="bub-std">' + NL.t.scnStd + ' <span lang="nl-BE">' + esc(b.nl) + '</span></p>' : '') +
            '<p class="bub-en"' + NL.gloss.langAttr(b) + '>' + esc(NL.gloss.of(b)) + '</p></div></div>';
        }
        return '<div class="bub you"><div><p class="bub-nl" lang="nl-BE">' + esc(b.nl) + '</p>' +
          '<p class="bub-en"' + NL.gloss.langAttr(b) + '>' + esc(NL.gloss.of(b)) + '</p>' +
          (b.score ? '<p class="bub-score">' + esc(b.score) + '</p>' : '') + '</div></div>';
      }).join('');

      let panel = '';
      if (P.phase === 'them') {
        panel = '<button class="btn btn-blue wide" data-step="next">' + NL.t.next + '</button>';
      } else if (P.phase === 'choose') {
        panel = '<p class="ask">' + esc(NL.gloss.of(step.you.ask)) + '</p>' +
          NL.ui.ifText(step.you.hint, 'p', 'ask-hint') +
          '<div class="choices">' + step.you.choices.map((c, i) =>
            '<button class="choice" data-choice="' + i + '"><b lang="nl-BE">' + esc(c.nl) + '</b><i>' + esc(NL.gloss.of(c)) + '</i></button>').join('') +
          '</div>';
      } else if (P.phase === 'speak') {
        const c = step.you.choices[P.choice];
        panel = '<div class="say-now"><p class="say-target" lang="nl-BE">' + esc(c.nl) + '</p>' +
          '<p class="say-en">' + esc(NL.gloss.of(c)) + '</p>' +
          '<button class="speaker slow inline" data-say="' + esc(c.nl) + '" data-slow="1" aria-label="' + NL.t.slow + '">' + ICON.turtle() + '</button></div>' +
          micPanel(P.speech, c.nl) +
          NL.ui.ifText(c.note, 'p', 'say-note');
      } else if (P.phase === 'done') {
        panel = '<div class="scn-done"><h2>' + NL.t.scnOver + '</h2>' +
          '<p>' + esc(NL.gloss.of(s.outro)) + '</p>' +
          '<div class="tally"><div class="tally-box gold"><div class="t-n">+12</div><div class="t-l">' + NL.t.tallyXp + '</div></div>' +
          '<div class="tally-box blue"><div class="t-n">' + P.spoken + '/' + P.tried + '</div><div class="t-l">' + NL.t.micSaidIt + '</div></div></div>' +
          '<button class="btn btn-primary wide" data-step="again">' + NL.t.replay + '</button>' +
          '<button class="btn btn-ghost wide" data-step="back">' + NL.t.scnBack + '</button></div>';
      }

      return '<div class="lesson">' +
        '<div class="lesson-head">' +
        '<button class="iconbtn" data-step="back" aria-label="' + NL.t.back + '">' + NL.ui.I.back + '</button>' +
        '<div class="head-title"><b>' + esc(NL.gloss.of(s.title)) + '</b><i>' + esc(NL.gloss.of(s.place)) + '</i></div>' +
        '<span class="pill">' + Math.min(P.at + 1, s.steps.length) + '/' + s.steps.length + '</span>' +
        '</div>' +
        '<div class="lesson-body"><div class="stage chat">' + transcript + '</div></div>' +
        '<div class="foot chat-foot"><div class="foot-in col">' + panel + '</div></div>' +
        '</div>';
    },

    click(el, d) {
      if (d.step === 'back') { P = null; NL.ui.go('praten'); return; }
      if (d.step === 'again') { const id = P.scn.id; P = null; open(id); NL.ui.render(); return; }
      if (d.step === 'next') { advanceThem(); NL.ui.render(); return; }
      if (d.choice !== undefined) {
        if (P.phase !== 'choose') return;
        P.choice = +d.choice; P.phase = 'speak'; P.speech = fresh(); P.tried++;
        NL.ui.render(); return;
      }
      /* Everything below belongs to your speaking turn and must not fire outside it. */
      if (P.phase !== 'speak') return;
      if (d.mic !== undefined) return mic(d.mic);
      if (d.rec !== undefined) return recAction(d.rec);
      if (d.self !== undefined) { P.speech.selfRated = d.self === '1'; commit(d.self === '1', null); return; }
      if (d.act === 'accept') { commit(!!P.speech.ok, NL.ex.wordScore(P.speech.parts)); return; }
    },
    key(e) {
      if (!P) return;
      if (e.key === 'Enter') {
        e.preventDefault();
        const b = document.querySelector('[data-step="next"],[data-act="accept"]');
        if (b) b.click();
      }
      if (e.key === 'm') { const b = document.querySelector('[data-mic]'); if (b) { e.preventDefault(); b.click(); } }
      if (/^[1-3]$/.test(e.key) && P.phase === 'choose') {
        const b = document.querySelector('[data-choice="' + (+e.key - 1) + '"]');
        if (b) b.click();
      }
    }
  };

  function commit(ok, score) {
    const step = P.scn.steps[P.at];
    if (!step || !step.you || P.choice == null) return;
    const c = step.you.choices[P.choice];
    if (ok) P.spoken++;
    P.log.push({ who: 'you', nl: c.nl, fr: c.fr, en: c.en, score: score });
    P.at++;
    if (c.reply) {
      P.log.push({ who: 'them', nl: c.reply.nl, be: c.reply.be, fr: c.reply.fr, en: c.reply.en });
      say(c.reply.be || c.reply.nl);
      P.phase = P.at < P.scn.steps.length ? (P.scn.steps[P.at].them ? 'them' : 'choose') : 'done';
      if (P.phase === 'done') finish();
      NL.ui.render();
      return;
    }
    advanceThem();
    NL.ui.render();
  }

  function recAction(action) {
    const sp = P.speech;
    const target = P.scn.steps[P.at].you.choices[P.choice].nl;
    if (action === 'stop') { NL.speech.stopRecord(); return; }
    if (action === 'play') { NL.speech.playRecording(); return; }
    if (action === 'both') { NL.speech.playBoth(target); return; }
    sp.recState = 'rec'; sp.recErr = null; NL.audio.mic(); NL.ui.render();
    NL.speech.record({
      onstart: () => { sp.recTimer = setTimeout(() => NL.speech.stopRecord(), 7000); },
      onstop: () => { if (!P) return; clearTimeout(P.speech.recTimer); P.speech.recState = 'done'; NL.ui.render(); },
      onerror: k => { if (!P) return; P.speech.recState = 'idle'; P.speech.recErr = k; NL.ui.render(); }
    });
  }

  function mic(action) {
    const sp = P.speech;
    const step = P.scn.steps[P.at];
    const target = step.you.choices[P.choice].nl;
    if (action === 'stop') { NL.speech.abort(); sp.phase = 'idle'; NL.ui.render(); return; }
    sp.phase = 'listening'; sp.partial = ''; sp.error = null;
    NL.audio.mic(); NL.ui.render();
    NL.speech.listen({
      onpartial: t => { if (P && P.speech.phase === 'listening') { P.speech.partial = t; NL.ui.render(); } },
      onerror: k => { if (!P) return; P.speech.phase = 'idle'; P.speech.error = k; P.speech.tries++; NL.ui.render(); },
      onend: (text, alts) => {
        if (!P || P.speech.phase !== 'listening') return;
        const r = NL.speech.score(alts && alts.length ? alts : [text], target);
        Object.assign(P.speech, { phase: 'done', tries: P.speech.tries + 1, pct: r.pct, parts: r.parts, heard: r.heard, ok: r.pass });
        if (r.pass) NL.audio.ok(); else NL.audio.no();
        NL.ui.render();
      }
    });
  }

  /* Shared look with the speak exercise, so the microphone always behaves the same. */
  function micPanel(sp, target) {
    const blocked = NL.speech.listenBlocked();
    if (blocked) return NL.ex.recordPanel(sp, target, blocked);
    if (sp.phase === 'listening') {
      return '<div class="mic-panel live"><button class="mic big listening" data-mic="stop" aria-label="' + NL.t.stop + '">' + ICON.mic(32) + '</button>' +
        '<p class="mic-why">' + NL.t.micListening + '</p>' + (sp.partial ? '<p class="heard">' + esc(sp.partial) + '</p>' : '') + '</div>';
    }
    if (sp.phase === 'done') {
      return '<div class="mic-panel ' + (sp.ok ? 'good' : 'bad') + '">' +
        '<div class="score-row"><span class="score">' + NL.ex.wordScore(sp.parts) + '</span>' +
        '<span class="score-bar"><span style="width:' + sp.pct + '%"></span></span></div>' +
        '<p class="word-diff">' + sp.parts.map(p =>
          '<span class="' + (p.ok ? (p.close ? 'w-close' : 'w-ok') : 'w-no') + '">' + esc(p.word) + '</span>').join(' ') + '</p>' +
        (sp.heard ? '<p class="heard">' + NL.t.micHeard + ' &ldquo;' + esc(sp.heard) + '&rdquo;</p>' : '') +
        '<div class="mic-actions">' +
        (!sp.ok && sp.tries < 3 ? '<button class="btn btn-blue" data-mic="start">' + NL.t.replay + '</button>' : '') +
        '<button class="btn ' + (sp.ok ? 'btn-good' : 'btn-ghost') + '" data-act="accept">' + (sp.ok ? NL.t.next : NL.t.micAnyway) + '</button>' +
        '</div></div>';
    }
    return '<div class="mic-panel"><button class="mic big" data-mic="start" aria-label="' + NL.t.speak + '">' + ICON.mic(32) + '</button>' +
      '<p class="mic-why">' + (sp.error ? esc(errText(sp.error)) : NL.t.micTap) + '</p>' +
      (sp.error ? NL.ex.selfRate(sp) : '') + '</div>';
  }
  const errText = k => k === 'denied' ? NL.t.micDenied
    : k === 'silence' ? NL.t.micSilence
      : k === 'network' ? NL.t.micNetwork : NL.t.micFail;
})();
</script>
<script>
/* Luisteren: Flemish at full speed with no text, then shadowing.
   Comprehension is the skill that decides whether a conversation survives. */
NL.screens.luisteren = (function () {
  'use strict';
  const U = NL.util, esc = U.esc, ICON = NL.ex.ICON;
  let S = null;

  function begin(mode) {
    const clips = U.shuffle(NL.content.listenClips()).slice(0, 8);
    S = { mode, clips, at: 0, phase: 'play', sel: null, right: 0, plays: 0, speech: { phase: 'idle', tries: 0 }, done: false };
    build();
    setTimeout(play, 200);
  }

  function build() {
    const c = S.clips[S.at];
    /* Une même réplique revient d'un scénario à l'autre : sans ce filtre, la
       bonne traduction pouvait s'afficher deux fois, dont une comptée fausse. */
    const lang = NL.gloss.langOf(c), right = NL.gloss.of(c);
    const seen = new Set();
    const pool = [];
    NL.content.listenClips()
      .filter(x => x.id !== c.id && NL.gloss.has(x, lang) && U.norm(NL.gloss.of(x, lang)) !== U.norm(right))
      .forEach(x => {
        const l = NL.gloss.of(x, lang), k = U.norm(l);
        if (!seen.has(k)) { seen.add(k); pool.push(l); }
      });
    S.opts = U.shuffle([{ label: right, ok: true }].concat(
      U.sample(pool, 2).map(l => ({ label: l, ok: false }))));
    S.plays = 0;
  }

  const play = (slow) => { const c = S.clips[S.at]; if (!c) return; S.plays++; NL.speech.say(c.be || c.nl, { rate: slow ? 0.6 : 1 }); };

  function answer(i) {
    S.sel = i;
    const ok = S.opts[i].ok;
    S.phase = 'shown';
    if (ok) { S.right++; NL.audio.ok(); } else NL.audio.no();
    NL.ui.render();
  }

  function next() {
    NL.speech.abort();
    S.at++;
    S.phase = 'play'; S.sel = null; S.speech = { phase: 'idle', tries: 0 };
    if (S.at >= S.clips.length) {
      S.done = true;
      const m = NL.state.meta();
      NL.state.setMeta({ xp: m.xp + 8 });
      NL.state.creditDay();
      NL.audio.win();
      NL.ui.render();
      return;
    }
    build();
    NL.ui.render();
    setTimeout(() => play(), 180);
  }

  function render() {
    if (!S) return menu();
    if (S.done) return summary();
    const c = S.clips[S.at];
    const pct = Math.round(S.at / S.clips.length * 100);

    let body;
    if (S.mode === 'begrijpen') {
      body = '<div class="listen-stage">' +
        '<button class="mic big play' + (S.phase === 'play' ? ' pulse' : '') + '" data-act="play" aria-label="' + NL.t.listen + '">' + ICON.speaker(36) + '</button>' +
        '<div class="listen-actions">' +
        '<button class="btn btn-ghost" data-act="replay">' + NL.t.replay + '</button>' +
        '<button class="btn btn-ghost" data-act="slow">' + NL.t.slow + '</button>' +
        '</div>' +
        (S.phase === 'shown'
          ? '<div class="reveal"><p class="rev-nl" lang="nl-BE">' + esc(c.be || c.nl) + '</p>' +
          (c.be && U.norm(c.be) !== U.norm(c.nl) ? '<p class="rev-std">' + NL.t.scnStd + ' <span lang="nl-BE">' + esc(c.nl) + '</span></p>' : '') +
          '<p class="rev-src">' + NL.t.listenFrom + ' &ldquo;' + esc(c.from) + '&rdquo;</p></div>'
          : '<p class="listen-hint">' + NL.t.listenNoText + '</p>') +
        '</div>' +
        '<div class="opts">' + S.opts.map((o, i) => {
          let cls = '';
          if (S.phase === 'shown') { if (o.ok) cls = ' ok'; else if (S.sel === i) cls = ' no'; }
          return '<button class="opt' + cls + '" data-opt="' + i + '"' + (S.phase === 'shown' ? ' disabled' : '') + '>' +
            '<span class="opt-key">' + (i + 1) + '</span><span>' + esc(o.label) + '</span></button>';
        }).join('') + '</div>';
    } else {
      const sp = S.speech;
      body = '<div class="listen-stage">' +
        '<button class="mic big play" data-act="play" aria-label="' + NL.t.listen + '">' + ICON.speaker(36) + '</button>' +
        '<p class="rev-nl" lang="nl-BE">' + esc(c.be || c.nl) + '</p>' +
        '<p class="rev-en"' + NL.gloss.langAttr(c) + '>' + esc(NL.gloss.of(c)) + '</p>' +
        '<div class="listen-actions"><button class="btn btn-ghost" data-act="slow">' + NL.t.slow + '</button></div>' +
        '</div>' + shadowPanel(sp);
    }

    return '<div class="lesson">' +
      '<div class="lesson-head">' +
      '<button class="iconbtn" data-act="exit" aria-label="' + NL.t.back + '">' + NL.ui.I.back + '</button>' +
      '<div class="rail"><div class="rail-fill" style="width:' + Math.max(pct, 3) + '%"></div></div>' +
      '<span class="pill">' + (S.at + 1) + '/' + S.clips.length + '</span></div>' +
      '<div class="lesson-body"><div class="stage">' +
      '<div class="kicker"><span class="sub">' + (S.mode === 'begrijpen' ? NL.t.listenUnderstand : NL.t.listenRepeat) + ' &middot; ' + esc(c.from) + '</span>' +
      (S.mode === 'begrijpen' ? NL.t.listenWhatSaid : NL.t.listenRepeatTitle) + '</div>' +
      body + '</div></div>' +
      '<div class="foot"><div class="foot-in">' +
      (S.phase === 'shown' || S.mode === 'nazeggen'
        ? '<button class="btn btn-primary push" data-act="next">' + NL.t.next + '</button>'
        : '<button class="btn btn-ghost" data-act="giveup">' + NL.t.dunno + '</button>') +
      '</div></div></div>';
  }

  function shadowPanel(sp) {
    if (NL.speech.listenBlocked()) {
      return '<div class="mic-panel offline"><p class="mic-why">' + NL.t.micNoBrowser + '</p></div>';
    }
    if (sp.phase === 'listening') {
      return '<div class="mic-panel live"><button class="mic big listening" data-act="micstop">' + ICON.mic(32) + '</button>' +
        '<p class="mic-why">' + NL.t.micListening + '</p>' + (sp.partial ? '<p class="heard">' + esc(sp.partial) + '</p>' : '') + '</div>';
    }
    if (sp.phase === 'done') {
      return '<div class="mic-panel ' + (sp.ok ? 'good' : 'bad') + '">' +
        '<div class="score-row"><span class="score">' + NL.ex.wordScore(sp.parts) + '</span>' +
        '<span class="score-bar"><span style="width:' + sp.pct + '%"></span></span></div>' +
        '<p class="word-diff">' + sp.parts.map(p => '<span class="' + (p.ok ? (p.close ? 'w-close' : 'w-ok') : 'w-no') + '">' + esc(p.word) + '</span>').join(' ') + '</p>' +
        '<div class="mic-actions"><button class="btn btn-blue" data-act="mic">' + NL.t.replay + '</button></div></div>';
    }
    /* Un refus s'affiche : sans ça, toucher le micro ne faisait rien, en silence. */
    return '<div class="mic-panel"><button class="mic big" data-act="mic">' + ICON.mic(32) + '</button>' +
      '<p class="mic-why">' + (sp.error ? esc(sp.error === 'denied' ? NL.t.micDenied : sp.error === 'silence' ? NL.t.micSilence
        : sp.error === 'network' ? NL.t.micNetwork : NL.t.micFail) : NL.t.micTap) + '</p></div>';
  }

  function menu() {
    return '<div class="wrap">' +
      '<section class="card lead slim"><span class="eyebrow">' + NL.t.listenEyebrow + '</span>' +
      '<h1>' + NL.t.listenTitle + '</h1>' +
      '<p>' + NL.t.listenBody + '</p></section>' +
      '<div class="cards">' +
      '<button class="tile-card" data-act="begrijpen"><span class="tc-icon">\u{1F3A7}</span>' +
      '<span class="tc-body"><b>' + NL.t.listenUnderstand + '</b><i>' + NL.t.listenUnderstandSub + '</i></span>' +
      '<span class="tc-cta">' + NL.t.start + '</span></button>' +
      '<button class="tile-card" data-act="nazeggen"><span class="tc-icon">\u{1F5E3}</span>' +
      '<span class="tc-body"><b>' + NL.t.listenRepeat + '</b><i>' + NL.t.listenRepeatSub + '</i></span>' +
      '<span class="tc-cta">' + NL.t.start + '</span></button>' +
      '</div></div>';
  }

  function summary() {
    const pct = Math.round(S.right / S.clips.length * 100);
    return '<div class="lesson"><div class="lesson-body"><div class="stage done-stage">' +
      '<div class="done-mark">\u{1F3A7}</div><h2>' + NL.t.listenDone + '</h2>' +
      '<p class="done-sub">' + (S.mode === 'begrijpen'
        ? (pct >= 70 ? NL.t.listenGoodEar : NL.t.listenHardEar)
        : NL.t.listenShadowDone) + '</p>' +
      '<div class="tally">' +
      (S.mode === 'begrijpen' ? '<div class="tally-box blue"><div class="t-n">' + S.right + '/' + S.clips.length + '</div><div class="t-l">' + NL.t.listenUnderstood + '</div></div>' : '') +
      '<div class="tally-box gold"><div class="t-n">+8</div><div class="t-l">' + NL.t.tallyXp + '</div></div></div>' +
      '<button class="btn btn-primary wide" data-act="menu">' + NL.t.listenMore + '</button>' +
      '<button class="btn btn-ghost wide" data-go="vandaag">' + NL.t.back + '</button>' +
      '</div></div></div>';
  }

  function mic(action) {
    const c = S.clips[S.at];
    if (action === 'stop') { NL.speech.abort(); S.speech.phase = 'idle'; NL.ui.render(); return; }
    S.speech = { phase: 'listening', tries: S.speech.tries, partial: '' };
    NL.audio.mic(); NL.ui.render();
    NL.speech.listen({
      onpartial: t => { if (S && S.speech.phase === 'listening') { S.speech.partial = t; NL.ui.render(); } },
      onerror: k => { if (S) { S.speech.phase = 'idle'; S.speech.error = k; NL.ui.render(); } },
      onend: (text, alts) => {
        if (!S || S.speech.phase !== 'listening') return;
        const r = NL.speech.score(alts && alts.length ? alts : [text], c.nl);
        Object.assign(S.speech, { phase: 'done', tries: S.speech.tries + 1, pct: r.pct, parts: r.parts, heard: r.heard, ok: r.pass });
        if (r.pass) NL.audio.ok();
        NL.ui.render();
      }
    });
  }

  return {
    render,
    click(el, d) {
      if (d.act === 'begrijpen' || d.act === 'nazeggen') { begin(d.act); NL.ui.render(); return; }
      if (d.act === 'menu') { S = null; NL.ui.render(); return; }
      if (d.act === 'exit') { NL.speech.abort(); S = null; NL.ui.go('luisteren'); return; }
      if (!S) return;
      if (d.act === 'play' || d.act === 'replay') { play(); return; }
      if (d.act === 'slow') { play(true); return; }
      if (d.act === 'next') { next(); return; }
      if (d.act === 'giveup') { S.phase = 'shown'; NL.audio.no(); NL.ui.render(); return; }
      if (d.act === 'mic') { mic('start'); return; }
      if (d.act === 'micstop') { mic('stop'); return; }
      if (d.opt !== undefined && S.phase !== 'shown') { answer(+d.opt); return; }
    },
    key(e) {
      if (!S || S.done) return;
      if (e.key === 'Enter') { e.preventDefault(); const b = document.querySelector('[data-act="next"]'); if (b) b.click(); return; }
      if (e.key === 'r' || e.key === ' ') { e.preventDefault(); play(); return; }
      if (/^[1-3]$/.test(e.key) && S.phase !== 'shown' && S.mode === 'begrijpen') {
        const b = document.querySelector('[data-opt="' + (+e.key - 1) + '"]'); if (b) b.click();
      }
    }
  };
})();
</script>
<script>
/* Woordenboek, Spiekbriefjes, the register table, and the sounds reference. */
(function () {
  'use strict';
  const U = NL.util, esc = U.esc, ICON = NL.ex.ICON;
  let query = '', filter = 'alles', adding = false;

  /* L'étiquette « pour qui » d'une section de référence, d'après NL.content.anchors. */
  const anchor = k => {
    const a = NL.content.anchors[k];
    return '<span class="muted anchor" data-anchor="' + a + '">' + NL.t[{ fr: 'anchorFr', en: 'anchorEn', all: 'anchorAll' }[a]] + '</span>';
  };

  const pips = s => {
    let h = '<span class="pips sm">';
    for (let i = 0; i < NL.srs.MAX_STAGE; i++) h += '<i class="' + (i <= s ? 'on' : '') + '"></i>';
    return h + '</span>';
  };

  /* ---------------------------------------------------- Woordenboek */
  NL.screens.woorden = {
    render() {
      const all = NL.content.allItems();
      /* Your own words show from the moment you add them; the rest appear once met. */
      const seen = all.filter(it => NL.srs.stageOf(it) >= 0 || it.unit === 'eigen');
      const q = U.norm(query);
      /* « Fragile » veut dire raté, pas récent : un mot rencontré hier est sur un
         échelon bas et n'a rien de fragile. */
      const missed = new Set(NL.srs.mistakes().map(x => x.item.id));
      let list = (filter === 'eigen' ? all.filter(it => it.unit === 'eigen')
        : filter === 'zwak' ? seen.filter(it => missed.has(it.id))
          : filter === 'sterk' ? all.filter(it => it.unit !== 'eigen' && NL.content.produced(it))   // l'ensemble et le prédicat du compteur « produits »
            : seen);
      if (q) list = all.filter(it => [it.nl, it.be, NL.gloss.of(it, 'fr'), NL.gloss.of(it, 'en')].some(s => !!s && U.norm(s).indexOf(q) >= 0));

      const groups = {};
      list.forEach(it => { (groups[it.unit] = groups[it.unit] || []).push(it); });

      let html = '<div class="wrap">' +
        '<section class="card lead slim"><span class="eyebrow">' + NL.t.wordsEyebrow + '</span>' +
        '<h1>' + NL.t.wordsTitle(seen.length) + '</h1>' +
        '<p>' + NL.t.wordsBody + '</p>' +
        '<button class="btn btn-blue" data-act="addform">' + NL.t.wordsAdd + '</button></section>';

      if (adding) {
        html += '<section class="card add-form">' +
          '<label>' + NL.t.wordsNl + '<input class="textin" id="add-nl" placeholder="' + NL.t.wordsPhNl + '"></label>' +
          '<label>' + NL.t.wordsMeaning + '<input class="textin" id="add-meaning" placeholder="' + NL.t.wordsPhMeaning + '"></label>' +
          '<label>' + NL.t.wordsBe + ' <span class="muted">' + NL.t.wordsOptional + '</span><input class="textin" id="add-be" placeholder=""></label>' +
          '<div class="row"><button class="btn btn-good" data-act="addsave">' + NL.t.save + '</button>' +
          '<button class="btn btn-ghost" data-act="addcancel">' + NL.t.cancel + '</button></div></section>';
      }

      html += '<div class="filters">' +
        '<input class="search" id="wsearch" type="search" placeholder="' + NL.t.wordsSearch + '" value="' + esc(query) + '">' +
        [['alles', NL.t.wordsAll], ['zwak', NL.t.wordsWeak], ['sterk', NL.t.wordsStrong], ['eigen', NL.t.wordsMine]].map(([id, label]) =>
          '<button class="fchip' + (filter === id && !query ? ' on' : '') + '" data-act="filter" data-f="' + id + '">' + label + '</button>').join('') +
        '</div>';

      if (!list.length) {
        /* « Mes mots » ne se remplit pas en faisant des séances : seulement par le bouton. */
        html += '<p class="empty">' + (query ? NL.t.wordsNoResult : filter === 'eigen' ? NL.t.wordsMineNone : NL.t.wordsNothing) + '</p>';
      } else {
        Object.keys(groups).forEach(uid => {
          const u = NL.content.unit(uid);
          html += '<div class="voc-head">' + esc(u ? NL.gloss.of(u.name) : NL.t.wordsMineGroup) + '</div>';
          groups[uid].forEach(it => {
            const s = NL.srs.stageOf(it);
            html += '<div class="vrow">' +
              '<button class="speaker tiny" data-say="' + esc(U.bare(it.nl)) + '" aria-label="' + NL.t.listen + '">' + ICON.speaker(17) + '</button>' +
              '<span class="v-nl"><span lang="nl-BE">' + (it.art ? '<span class="art ' + it.art + '">' + it.art + '</span>' : '') +
              esc(U.bare(it.nl)) + '</span>' +
              (it.be && NL.state.meta().showFlemish !== false ? '<span class="v-be">' + NL.t.wordsHere + ' <span lang="nl-BE">' + esc(it.be) + '</span></span>' : '') +
              '</span>' +
              '<span class="v-en"' + NL.gloss.langAttr(it) + '>' + esc(NL.gloss.bare(it)) + '</span>' +
              pips(s) +
              (it.unit === 'eigen' ? '<button class="iconbtn tiny" data-del="' + it.id + '" aria-label="' + NL.t.del + '">' + NL.ui.I.x + '</button>' : '') +
              '</div>';
          });
        });
      }
      return html + '</div>';
    },
    click(el, d) {
      if (d.act === 'addform') { adding = true; NL.ui.render(); return; }
      if (d.act === 'addcancel') { adding = false; NL.ui.render(); return; }
      if (d.act === 'filter') { filter = el.dataset.f; query = ''; NL.ui.render(); return; }
      if (d.act === 'addsave') {
        const nl = (document.getElementById('add-nl') || {}).value || '';
        const meaning = (document.getElementById('add-meaning') || {}).value || '';
        const be = (document.getElementById('add-be') || {}).value || '';
        if (!nl.trim() || !meaning.trim()) { NL.ui.toast(NL.t.wordsNeedBoth); return; }
        NL.state.addCustom({ nl: nl.trim(), [NL.lang.current()]: meaning.trim(), be: be.trim() || null, kind: nl.trim().split(/\s+/).length > 2 ? 'phrase' : 'word' });
        NL.content.refresh(); adding = false; NL.ui.render(); NL.ui.toast(NL.t.wordsAdded);
        return;
      }
      if (d.del) { NL.state.delCustom(d.del); NL.content.refresh(); NL.ui.render(); return; }
    },
    input(el) { if (el.id === 'wsearch') { query = el.value; NL.ui.render(); const s = document.getElementById('wsearch'); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } } }
  };

  /* ---------------------------------------------------- Spiekbriefjes */
  NL.screens.spiek = {
    render(id) {
      const sheets = NL.content.sheets;
      if (id) {
        const s = sheets.find(x => x.id === id);
        if (s) {
          return '<div class="wrap">' +
            '<button class="backlink" data-go="spiek">' + NL.ui.I.back + ' ' + NL.t.sheetsAll + '</button>' +
            '<section class="card lead slim"><span class="eyebrow">' + NL.t.sheetsEyebrow + '</span> ' + anchor('sheets') +
            '<h1>' + s.icon + ' ' + esc(NL.gloss.of(s.title)) + '</h1><p>' + esc(NL.gloss.of(s.blurb)) + '</p></section>' +
            s.groups.map(g => '<div class="sheet-group"><h4>' + esc(NL.gloss.of(g.h)) + '</h4>' +
              g.rows.map(r => '<button class="sheet-row" data-say="' + esc(r.nl) + '">' +
                '<span class="sr-say">' + ICON.speaker(16) + '</span>' +
                '<span class="sr-body"><b lang="nl-BE">' + esc(r.nl) + '</b><i>' + esc(NL.gloss.of(r)) + '</i>' +
                NL.ui.ifText(r.note, 'em') + '</span></button>').join('') +
              '</div>').join('') +
            '</div>';
        }
      }
      return '<div class="wrap">' +

        '<h1>' + NL.t.sheetsTitle + '</h1>' +
        '<p>' + NL.t.sheetsBody + '</p></section>' +
        '<div class="cards">' + sheets.map(s =>

          '<span class="tc-icon">' + s.icon + '</span>' +

    },
    click(el, d) { if (d.sheetid) NL.ui.go('spiek', d.sheetid); }
  };

  /* ---------------------------------------------------- Register */
  NL.screens.register = {
    render() {
      return '<div class="wrap">' +
        '<section class="card lead slim"><span class="eyebrow">' + NL.t.regEyebrow + '</span> ' + anchor('register') +
        '<h1>' + NL.t.regTitle + '</h1>' +
        '<p>' + NL.t.regBody + '</p></section>' +
        '<div class="reg-table"><div class="reg-head"><span>' + NL.t.regStd + '</span><span>' + NL.t.regBe + '</span></div>' +
        NL.content.register.map(r =>
          '<div class="reg-row">' +
          '<button class="reg-cell std" lang="nl-BE" data-say="' + esc(r.std) + '">' + esc(r.std) + '</button>' +
          '<button class="reg-cell be" data-say="' + esc(r.be) + '">' + '<span lang="nl-BE">' + esc(r.be) + '</span>' +
          NL.ui.ifText(r.note, 'em') + '</button>' +

        '<h3 class="sec">' + NL.t.loansTitle + ' ' + anchor('loans') + '</h3>' +
        '<section class="card lead slim"><p>' + NL.t.loansBody + '</p></section>' +
        '<div class="reg-table"><div class="reg-head"><span>' + NL.t.loansColBe + '</span><span>' + NL.t.loansColFr + '</span></div>' +
        NL.content.loans.map(r =>
          '<div class="reg-row">' +
          '<button class="reg-cell be" lang="nl-BE" data-say="' + esc(r.nl) + '">' + esc(r.nl) + '</button>' +
          '<span class="reg-cell std" lang="fr">' + esc(NL.gloss.of(r)) +
          NL.ui.ifText(r.note, 'em') + '</span>' +
          '</div>').join('') +
        '</div>' +

        '<h3 class="sec">' + NL.t.fauxTitle + ' ' + anchor('faux') + '</h3>' +
        '<section class="card lead slim"><p>' + NL.t.fauxBody + '</p></section>' +
        '<div class="reg-table"><div class="reg-head"><span>' + NL.t.fauxColNl + '</span><span>' + NL.t.fauxColMeaning + '</span></div>' +
        NL.content.faux.map(r =>
          '<div class="reg-row">' +
          '<button class="reg-cell be" lang="nl-BE" data-say="' + esc(r.nl) + '">' + esc(r.nl) + '</button>' +
          '<span class="reg-cell std" lang="fr">' + esc(NL.gloss.of(r)) + '<em>' + esc(r.trap) + '</em></span>' +
          '</div>').join('') +
        '</div>' +

        '<h3 class="sec">' + NL.t.fauxEnTitle + ' ' + anchor('fauxEn') + '</h3>' +
        '<section class="card lead slim"><p>' + NL.t.fauxEnBody + '</p></section>' +
        '<div class="reg-table"><div class="reg-head"><span>' + NL.t.fauxColNl + '</span><span>' + NL.t.fauxColMeaning + '</span></div>' +
        /* r.en, et non NL.gloss.of(r) : les faux amis d'un anglophone sont en anglais dans les
           deux affichages (src/content/reference.js). */
        NL.content.fauxEn.map(r =>
          '<div class="reg-row">' +
          '<button class="reg-cell be" lang="nl-BE" data-say="' + esc(r.nl) + '">' + esc(r.nl) + '</button>' +
          '<span class="reg-cell std" lang="en">' + esc(r.en) + '<em>' + esc(r.trap) + '</em></span>' +
          '</div>').join('') +
        '</div></div>';
    }
  };

  /* ---------------------------------------------------- de / het */
  NL.screens.dehet = {
    render() {
      const col = (title, rules, cls, a) =>
        '<h3 class="sec">' + title + ' ' + anchor(a) + '</h3>' +
        rules.map(r => '<div class="rule-row ' + cls + '">' +
          '<b>' + esc(NL.gloss.of(r.rule)) + (r.sure ? '<span class="sure-tag">' + NL.t.dehetSure + '</span>' : '') + '</b>' +
          '<button class="rule-ex" lang="nl-BE" data-say="' + esc(r.ex) + '">' + esc(r.ex) + '</button></div>').join('');
      return '<div class="wrap">' +
        '<section class="card lead slim"><span class="eyebrow">' + 'de / het' + '</span>' +
        '<h1>' + NL.t.dehetTitle + '</h1><p>' + NL.t.dehetBody + '</p></section>' +
        col(NL.t.dehetHet, NL.content.hetRules, 'het', 'hetRules') +
        col(NL.t.dehetDe, NL.content.deRules, 'de', 'deRules') +
        '</div>';
    }
  };

  /* ---------------------------------------------------- Klanken */
  NL.screens.klanken = {
    render() {
      return '<div class="wrap">' +
        '<section class="card lead slim"><span class="eyebrow">' + NL.t.soundsEyebrow + '</span> ' + anchor('sounds') +
        '<h1>' + NL.t.soundsTitle + '</h1>' +
        '<p>' + NL.t.soundsBody + '</p></section>' +
        NL.content.sounds.map(s =>
          '<div class="snd-row' + (s.good ? ' good' : s.warn ? ' warn' : '') + '"><div class="snd-head"><b lang="nl-BE">' + esc(s.g) + '</b><code>' + esc(s.ipa) + '</code>' +
          (s.good ? '<span class="snd-tag good">' + NL.t.soundsEasy + '</span>' : s.warn ? '<span class="snd-tag warn">' + NL.t.soundsWatch + '</span>' : '') + '</div>' +
          '<p lang="fr">' + NL.gloss.prose(s.say) + '</p></div>').join('') +
        '</div>';
    }
  };
})();

<script>
/* Ce qui résiste : les éléments le plus souvent ratés, et une séance pour les
   attaquer. Tout vient du journal des réponses, enregistré depuis le premier
   jour et qu'aucun écran n'avait jamais relu. */
NL.screens.fouten = (function () {
  'use strict';
  const U = NL.util, esc = U.esc, t = NL.t;
  const SHOWN = 40;

  function render() {
    const list = NL.srs.mistakes();
    let html = '<div class="wrap">' +
      '<section class="card lead slim"><span class="eyebrow">' + t.missEyebrow + '</span>' +
      '<h1>' + (list.length ? t.missTitle(list.length) : t.missEyebrow) + '</h1>' +
      '<p>' + (list.length ? t.missBody : t.missNone) + '</p>' +
      (list.length ? '<button class="btn btn-primary" data-act="start">' +
        t.missStart(Math.min(list.length, NL.srs.MAX_TASKS)) + '</button>' : '') +
      '</section>';

    list.slice(0, SHOWN).forEach(x => {
      const it = x.item;
      html += '<div class="vrow">' +
        '<button class="speaker tiny" data-say="' + esc(U.bare(it.nl)) + '" aria-label="' + t.listen + '">' + NL.ex.ICON.speaker(17) + '</button>' +
        '<span class="v-nl" lang="nl-BE">' + (it.art ? '<span class="art ' + it.art + '">' + it.art + '</span>' : '') + esc(U.bare(it.nl)) + '</span>' +
        '<span class="v-en"' + NL.gloss.langAttr(it) + '>' + esc(NL.gloss.bare(it)) + '</span>' +
        '<span class="muted small">' + t.missRow(x.wrong, x.wrong + x.right) + '</span>' +
        '</div>';
    });
    return html + '</div>';
  }

  return {
    render,
    click(el, d) {
      if (d.act !== 'start') return;
      if (NL.screens.sessie.begin('fouten')) NL.ui.go('sessie');
    }
  };
})();
</script>
<script>
/* Le docteur audio. Il ne décrit pas les problèmes : il les teste.
   Sur Opera, c'est cet écran qui explique pourquoi le micro ne note rien et
   comment récupérer une voix flamande en deux minutes. */
NL.screens.doctor = (function () {
  'use strict';
  const esc = NL.util.esc, t = NL.t;
  const TEST = 'Goeiemorgen, alles goed met u?';
  let S = { heard: null, mic: null, micKey: '', rec: 'idle' };

  /* Le titre et la note d'un palier, lus dans NL.t à chaque dessin : la langue a pu changer. */
  const tierText = (label, note) => ({ get label() { return t[label]; }, get note() { return t[note]; } });
  const TIERS = {
    full: tierText('tierFull', 'tierFullNote'),
    scored: tierText('tierScored', 'tierScoredNote'),
    novoice: tierText('tierNoVoice', 'tierNoVoiceNote'),
    refused: tierText('tierRefused', 'tierRefusedNote'),
    compare: tierText('tierCompare', 'tierCompareNote'),
    self: tierText('tierSelf', 'tierSelfNote')
  };

  function voiceRows() {
    const vs = (NL.speech.voices() || []).filter(v => /^nl/i.test(v.lang));
    if (!vs.length) return '<p class="doc-bad">' + t.docNoVoice + '</p>';
    return '<ul class="doc-list">' + vs.map(v =>
      '<li class="' + (/BE/i.test(v.lang) ? 'good' : '') + '"><b>' + esc(v.name) + '</b><span>' + esc(v.lang) +
      ' · ' + (/BE/i.test(v.lang) ? t.docVoiceBe : t.docVoiceNl) + '</span></li>').join('') + '</ul>';
  }

  /* Ce que l'app a vu casser sur CET appareil. Sur un téléphone il n'y a pas de
     console : sans cette liste, tout ce qu'on peut rapporter est « ça ne marche
     plus ». Rien ne quitte l'appareil — c'est à copier et à envoyer soi-même. */
  function errorBlock() {
    const list = NL.errlog.all();
    if (!list.length) return '<p class="muted small">' + t.errNone + '</p>';
    return '<p class="muted small">' + t.errCount(list.length) + '</p>' +
      '<textarea class="backup-box" id="err-out" readonly spellcheck="false">' + esc(NL.errlog.text()) + '</textarea>' +
      '<div class="row"><button class="btn btn-blue" data-act="errcopy">' + t.errCopy + '</button>' +
      '<button class="btn btn-ghost" data-act="errclear">' + t.errClear + '</button></div>';
  }

  function render() {
    const v = NL.speech.voiceInfo();
    const tier = NL.speech.tier();
    const info = TIERS[tier.id];
    const allVoices = (NL.speech.voices() || []).length;

    return '<div class="lesson"><div class="lesson-head">' +
      '<button class="iconbtn" data-act="back" aria-label="' + t.back + '">' + NL.ui.I.back + '</button>' +
      '<div class="head-title"><b>' + t.docEyebrow + '</b><i>' + t.docTitle + '</i></div>' +
      '</div>' +
      '<div class="lesson-body"><div class="stage doc">' +

      '<section class="doc-tier ' + tier.id + '">' +
      '<span class="eyebrow">' + t.docTierTitle + '</span>' +
      '<h2>' + info.label + '</h2><p>' + info.note + '</p>' +
      (tier.framed ? '<p class="doc-framed">' + t.docFramed + '</p>' : '') +
      '</section>' +

      '<section class="doc-block">' +
      '<h4>' + t.docBrowser + '</h4>' +
      '<p class="doc-line"><b>' + esc(NL.speech.browserName()) + '</b>' +
      (NL.speech.noService() === 'opera' ? ' — ' + t.docNoServiceOpera
        : NL.speech.noService() === 'ios' ? ' — ' + t.docNoServiceIos : '') + '</p>' +
      '</section>' +

      '<section class="doc-block">' +
      '<h4>' + t.docVoices + ' <span class="muted">(' + t.docVoicesTotal(allVoices) + ')</span></h4>' +
      voiceRows() +
      '<div class="row"><button class="btn btn-blue" data-act="play">' + t.docPlayTest + '</button>' +
      '<button class="btn" data-act="recheck">' + t.docRecheck + '</button></div>' +
      (S.heard === null
        ? '<p class="doc-ask">' + t.docHeard + ' <button class="chip" data-act="heard-yes">' + t.yes + '</button> <button class="chip" data-act="heard-no">' + t.no + '</button></p>'
        : '<p class="doc-verdict ' + (S.heard ? 'good' : 'bad') + '">' +
        (S.heard ? t.docHeardYes : t.docHeardNo) + '</p>') +
      '</section>' +

      '<section class="doc-block">' +
      '<h4>' + t.docMic + '</h4>' +
      '<div class="row">' +
      '<button class="btn btn-blue" data-act="' + (S.rec === 'rec' ? 'recstop' : 'rec') + '">' +
      (S.rec === 'rec' ? t.recStop : t.docMicTest) + '</button>' +
      (NL.speech.hasRecording() ? '<button class="btn" data-act="playrec">' + t.recYours + '</button>' : '') +
      '</div>' +
      (S.micKey ? '<p class="doc-verdict ' + (S.mic ? 'good' : 'bad') + '">' + esc(t[S.micKey]) + '</p>' : '') +
      '</section>' +

      '<section class="doc-block"><h4>' + t.errTitle + '</h4>' + errorBlock() + '</section>' +

      (v.quality !== 'be'
        ? '<section class="doc-fix">' +
        '<h4>' + t.docFixTitle + '</h4>' +
        '<ol>' + t.docFixSteps.map(s => '<li>' + esc(s) + '</li>').join('') + '</ol>' +
        '<p class="muted small">' + t.docFixNote + '</p>' +
        '<button class="btn btn-primary wide" data-act="recheck">' + t.docRecheck + '</button>' +
        '</section>'
        : '<section class="doc-fix good"><h4>' + t.docFixDone + '</h4>' +
        '<p class="muted small">' + t.docFixDoneBody(esc(v.name || '')) + '</p></section>') +

      '</div></div></div>';
  }

  return {
    render,
    click(el, d) {
      if (d.act === 'back') { NL.ui.go('meer'); return; }
      if (d.act === 'play') { S.heard = null; NL.speech.say(TEST); NL.ui.render(); return; }
      if (d.act === 'heard-yes') { S.heard = true; NL.ui.render(); return; }
      if (d.act === 'heard-no') { S.heard = false; NL.ui.render(); return; }
      if (d.act === 'recheck') { NL.speech.rescanVoices(); S.heard = null; NL.ui.render(); NL.ui.toast(t.docRechecked); return; }
      if (d.act === 'playrec') { NL.speech.playRecording(); return; }
      if (d.act === 'errclear') { NL.errlog.clear(); NL.ui.render(); return; }
      if (d.act === 'errcopy') {
        const box = document.getElementById('err-out');
        if (box) box.select();
        const done = navigator.clipboard
          ? navigator.clipboard.writeText(NL.errlog.text()).then(() => true).catch(() => false)
          : Promise.resolve(!!(document.execCommand && document.execCommand('copy')));
        Promise.resolve(done).then(good => NL.ui.toast(good ? t.errCopied : t.errCopyByHand));
        return;
      }
      if (d.act === 'recstop') { NL.speech.stopRecord(); return; }
      if (d.act === 'rec') {
        S.rec = 'rec'; S.micKey = 'docSpeakNow'; S.mic = null; NL.ui.render();
        NL.speech.record({
          onstart: () => { setTimeout(() => { if (S.rec === 'rec') NL.speech.stopRecord(); }, 3000); },
          onstop: url => {
            S.rec = 'idle';
            S.mic = !!url;
            S.micKey = url ? 'docRecOk' : 'docRecNone';
            NL.ui.render();
          },
          onerror: kind => {
            S.rec = 'idle'; S.mic = false;
            S.micKey = kind === 'framed'
              ? 'docRecFramed'
              : kind === 'denied' ? 'docRecDenied'
                : kind === 'nomic' ? 'docRecNoMic'
                  : 'docRecOther';
            NL.ui.render();
          }
        });
      }
    },
    key(e) { if (e.key === 'Escape') NL.ui.go('meer'); }
  };
})();
</script>
<script>
/* Compte : connexion par lien magique (ou code), et état de la synchro. */
NL.screens.compte = (function () {
  'use strict';
  const esc = NL.util.esc, t = NL.t;
  const SKIP = 'vlaams/noaccount';
  let step = 'email', email = '', msg = '', busy = false;

  const skipped = () => { try { return localStorage.getItem(SKIP) === '1'; } catch (e) { return false; } };
  const setSkipped = v => { try { v ? localStorage.setItem(SKIP, '1') : localStorage.removeItem(SKIP); } catch (e) {} };

  function when(ts) {
    if (!ts) return t.syncNever;
    const s = Math.round((Date.now() - ts) / 1000);
    return s < 60 ? t.syncJustNow : t.syncAgo(Date.now() - ts);
  }

  function statusLine(st) {
    if (st.state === 'syncing') return t.syncBusy;
    if (st.state === 'offline') return t.syncOffline(st.pending);
    if (st.state === 'error') return t.syncError(st.lastError || '');
    return st.pending ? t.syncPending(st.pending) : t.syncOk(when(st.lastSync));
  }

  function render() {
    const st = NL.sync.status();
    let body;

    if (st.user) {
      body = '<span class="eyebrow">' + t.accEyebrow + '</span>' +
        '<h1>' + t.accSignedIn + '</h1>' +
        '<p class="acc-mail">' + esc(st.user.email || '') + '</p>' +
        '<p class="acc-status ' + st.state + '">' + esc(statusLine(st)) + '</p>' +
        '<div class="acc-actions">' +
        '<button class="btn btn-blue wide" data-act="sync"' + (busy ? ' disabled' : '') + '>' + t.syncNow + '</button>' +
        '<button class="btn btn-ghost wide" data-act="home">' + t.accBack + '</button>' +
        '<button class="btn btn-ghost wide danger" data-act="signout">' + t.accSignOut + '</button>' +
        '</div><p class="acc-note">' + t.accSignOutNote + '</p>';
    } else if (step === 'sent') {
      body = '<span class="eyebrow">' + t.accEyebrow + '</span>' +
        '<h1>' + t.accCheckMail + '</h1>' +
        '<p>' + t.accSentTo(esc(email)) + '</p>' +
        '<label class="acc-field"><span>' + t.accCode + '</span>' +
        '<input class="textin acc-code" id="acc-code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="123456"></label>' +
        (msg ? '<p class="acc-err">' + esc(msg) + '</p>' : '') +
        '<div class="acc-actions">' +
        '<button class="btn btn-primary wide" data-act="verify"' + (busy ? ' disabled' : '') + '>' + t.accVerify + '</button>' +
        '<button class="btn btn-ghost wide" data-act="resend"' + (busy ? ' disabled' : '') + '>' + t.accResend + '</button>' +
        '<button class="btn btn-ghost wide" data-act="change">' + t.accChange + '</button>' +
        '</div>';
    } else {
      body = '<span class="eyebrow">' + t.accEyebrow + '</span>' +
        '<h1>' + t.accTitle + '</h1>' +
        '<p>' + t.accBody + '</p>' +
        '<label class="acc-field"><span>' + t.accEmail + '</span>' +
        '<input class="textin" id="acc-email" type="email" autocomplete="email" value="' + esc(email) + '" placeholder="' + NL.t.accEmailPh + '"></label>' +
        (msg ? '<p class="acc-err">' + esc(msg) + '</p>' : '') +
        '<div class="acc-actions">' +
        '<button class="btn btn-primary wide" data-act="send"' + (busy ? ' disabled' : '') + '>' + (busy ? t.accSending : t.accSend) + '</button>' +
        '<button class="btn btn-ghost wide" data-act="skip">' + t.accSkip + '</button>' +
        '</div><p class="acc-note">' + t.accSkipNote + '</p>';
    }

    return '<div class="lesson"><div class="lesson-body"><div class="stage acc">' +
      '<div class="acc-mark"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M5 18.5c3.5-1.5 4.5-5 4.5-8.5S8 4.5 8 4.5"/><path d="M19 18.5c-3.5-1.5-4.5-5-4.5-8.5S16 4.5 16 4.5"/><path d="M4.5 11.5h15"/></svg></div>' +
      body + '</div></div></div>';
  }

  const val = id => ((document.getElementById(id) || {}).value || '').trim();
  const looksLikeEmail = s => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);

  async function send() {
    email = val('acc-email') || email;
    if (!looksLikeEmail(email)) { msg = t.accBadEmail; NL.ui.render(); return; }
    busy = true; msg = ''; NL.ui.render();
    const r = await NL.sync.signIn(email);
    busy = false;
    if (r.error) msg = t.accFailed(r.error); else step = 'sent';
    NL.ui.render();
  }

  async function verify() {
    const code = val('acc-code');
    if (!/^\d{6,10}$/.test(code)) { msg = t.accBadCode; NL.ui.render(); return; }
    busy = true; msg = ''; NL.ui.render();
    const r = await NL.sync.verifyCode(email, code);
    busy = false;
    if (r.error) { msg = t.accFailed(r.error); NL.ui.render(); return; }
    step = 'email'; setSkipped(false);
    NL.ui.go('vandaag');
  }

  return {
    render,
    skipped,
    click(el, d) {
      if (d.act === 'send' || d.act === 'resend') return send();
      if (d.act === 'verify') return verify();
      if (d.act === 'change') { step = 'email'; msg = ''; NL.ui.render(); return; }
      if (d.act === 'skip') { setSkipped(true); NL.ui.go('vandaag'); return; }
      if (d.act === 'home') { NL.ui.go('vandaag'); return; }
      if (d.act === 'sync') {
        busy = true; NL.ui.render();
        NL.sync.pull().then(() => NL.sync.flush()).then(() => { busy = false; NL.ui.render(); });
        return;
      }
      if (d.act === 'signout') {
        NL.sync.signOut().then(() => { step = 'email'; email = ''; setSkipped(false); NL.ui.go('compte'); });
      }
    },
    key(e) {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      if (NL.sync.user) return;
      if (step === 'sent') verify(); else send();
    }
  };
})();
</script>
<script>
/* Boot. Storage first, because every screen reads from it synchronously. */
(function () {
  'use strict';
  function start() {
    const root = document.getElementById('app');
    NL.errlog.watch();
    NL.state.open().then(() => {
      const wiped = NL.state.migrate();
      NL.lang.apply(true);
      NL.content.refresh();
      NL.state.touchDay();
      NL.ui.bind(root);
      NL.ui.boot();
      if (wiped) NL.ui.toast(NL.t.migrated);
      /* Compte : l'app s'affiche d'abord avec les données locales, la synchro
         suit en arrière-plan. Sans compte ni refus explicite, on propose la
         connexion une fois. */
      NL.sync.init().then(user => {
        if (NL.sync.enabled && !user && !NL.screens.compte.skipped()) NL.ui.go('compte');
      });
      NL.sync.onChange(() => {
        const r = NL.ui.route;
        if (r === 'sessie' || r === 'scenario') return;
        if (r === 'compte' && !NL.sync.user) return;   // ne pas effacer l'adresse en cours de saisie
        NL.ui.render();
      });
      /* Voice lists arrive late in some browsers; repaint once they do. */
      if ('speechSynthesis' in window) {
        setTimeout(() => { NL.speech.rescanVoices(); NL.ui.render(); }, 700);
      }
    });
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
</body>
</html>
