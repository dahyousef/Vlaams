<script>
/* Flattens the curriculum into addressable items and answers questions about
   progress. Every learnable thing gets a stable id; the scheduler works in ids. */
NL.content = NL.content || {};
(function () {
  'use strict';
  let flat = null, index = null, RAW = null;

  /* The course ships neutral so it can live in a public repository, and becomes
     yours through three settings. Content carries {naam}, {stad} and {bedrijf};
     they are substituted once, here, so no screen has to think about it. */
  const DEFAULTS = { naam: 'Tom', stad: 'Gent', bedrijf: 'Novatech' };
  function fill(s) {
    if (typeof s !== 'string' || s.indexOf('{') < 0) return s;
    const m = NL.state.meta();
    return s
      .replace(/\{naam\}/g, m.learnerName || DEFAULTS.naam)
      .replace(/\{stad\}/g, m.town || DEFAULTS.stad)
      .replace(/\{bedrijf\}/g, m.company || DEFAULTS.bedrijf);
  }
  function deepFill(v) {
    if (typeof v === 'string') return fill(v);
    if (Array.isArray(v)) return v.map(deepFill);
    if (v && typeof v === 'object') {
      const o = {};
      Object.keys(v).forEach(k => { o[k] = deepFill(v[k]); });
      return o;
    }
    return v;
  }
  const TOKENED = ['units', 'patterns', 'scenarios', 'sheets', 'hetRules'];

  function build() {
    if (!RAW) {
      RAW = {};
      TOKENED.forEach(k => { RAW[k] = JSON.parse(JSON.stringify(NL.content[k] || [])); });
    }
    TOKENED.forEach(k => { NL.content[k] = deepFill(RAW[k]); });

    flat = [];
    /* A pattern can be referenced by several units; it belongs to the first one
       that teaches it, and must appear exactly once or it gets drilled twice. */
    const claimed = new Set();
    NL.content.units.forEach(u => {
      (u.words || []).forEach((w, i) => flat.push(Object.assign({}, w, {
        id: u.id + ':w' + i, unit: u.id, level: u.level, track: u.track, kind: 'word'
      })));
      (u.phrases || []).forEach((p, i) => flat.push(Object.assign({}, p, {
        id: u.id + ':p' + i, unit: u.id, level: u.level, track: u.track, kind: 'phrase'
      })));
      (u.grammar || []).forEach(gid => {
        if (claimed.has(gid)) return;
        const g = (NL.content.patterns || []).find(x => x.id === gid);
        if (!g) return;
        claimed.add(gid);
        flat.push(Object.assign({}, g, { unit: u.id, level: u.level, track: u.track, kind: 'pattern',
          open: (NL.content.openTasks || {})[g.id] || null }));
      });
    });
    NL.state.customs().forEach(c => flat.push(Object.assign({}, c, { kind: c.kind || 'word', unit: 'eigen', level: 'eigen', track: 'eigen' })));
    /* Palier par défaut, et détection des mots transparents : « de tram »,
       « de garage », « direct » sont offerts à un francophone. */
    flat.forEach(it => {
      it.tier = it.tier || 'produce';
      it.cognate = it.kind === 'word' &&
        NL.util.ratio(NL.util.bare(it.nl), NL.util.bareFr(it.fr)) > 0.62;
    });
    index = new Map(flat.map(it => [it.id, it]));
  }

  const allItems = () => { if (!flat) build(); return flat; };
  const refresh = () => { flat = null; index = null; };
  const byId = id => { if (!index) build(); return index.get(id) || null; };
  const unit = id => NL.content.units.find(u => u.id === id) || null;
  const itemsOf = uid => allItems().filter(it => it.unit === uid);

  /* Deux seuils, tenant compte du palier de chaque élément : un mot du palier
     « reconnaître » plafonne à l'échelon 2 et ne peut pas atteindre l'échelon 5. */
  const READY = it => NL.srs.stageOf(it) >= Math.min(3, NL.srs.maxRung(it));
  const MASTERED = it => NL.srs.stageOf(it) >= Math.min(NL.srs.GRADUATED, NL.srs.maxRung(it));
  const GATE = 0.8;

  const unitComplete = uid => {
    const items = itemsOf(uid);
    return !items.length || items.filter(READY).length / items.length >= GATE;
  };

  /* La frontière : on remonte depuis la première unité tant qu'elle est faite ;
     la première inachevée est la dernière ouverte. L'intervalle ouvert est donc
     contigu PAR CONSTRUCTION — « unité 10 fermée, 11 ouverte » devient
     impossible à produire, et pas seulement corrigé. */
  function frontier() {
    const us = NL.content.units;
    let i = 0;
    while (i < us.length - 1 && unitComplete(us[i].id)) i++;
    return i;
  }

  function unitOpen(uid) {
    if (uid === 'eigen') return true;
    const i = NL.content.units.findIndex(u => u.id === uid);
    return i >= 0 && i <= frontier();
  }

  /* Le pourcentage ne compte QUE la maîtrise : ce que tu as dit à voix haute et
     réussi. Il affiche 0% pendant des jours. C'est la vérité — 33% alors que
     rien n'est appris est pire. */
  function unitProgress(uid) {
    const items = itemsOf(uid);
    if (!items.length) return { pct: 0, met: 0, ready: 0, mastered: 0, total: 0, gate: 0, level: 0 };
    const met = items.filter(it => NL.srs.stageOf(it) >= 0).length;
    const ready = items.filter(READY).length;
    const mastered = items.filter(MASTERED).length;
    const pct = Math.round(mastered / items.length * 100);
    return {
      pct, met, ready, mastered, total: items.length,
      gate: Math.round(ready / items.length * 100),
      level: Math.min(5, Math.floor(pct / 20))
    };
  }

  function courseProgress() {
    const items = allItems().filter(it => it.unit !== 'eigen');
    const mastered = items.filter(MASTERED).length;
    const ready = items.filter(READY).length;
    return {
      pct: Math.round(mastered / items.length * 100),
      mastered, ready, total: items.length,
      unitsDone: NL.content.units.filter(u => unitComplete(u.id)).length,
      current: NL.content.units[frontier()] || null
    };
  }

  const scenario = id => (NL.content.scenarios || []).find(s => s.id === id) || null;

  /* Listening material is generated from what the scenarios already say, so
     comprehension practice always uses sentences a real person would utter. */
  function listenClips() {
    const out = [];
    (NL.content.scenarios || []).forEach(s => {
      s.steps.forEach((st, i) => {
        if (!st.them) return;
        out.push({
          id: s.id + ':l' + i, nl: st.them.nl, be: st.them.be || st.them.nl, fr: st.them.fr,
          from: s.title, icon: s.icon, track: s.track
        });
      });
    });
    return out;
  }

  Object.assign(NL.content, { allItems, refresh, byId, unit, itemsOf, unitOpen, unitComplete, frontier, unitProgress, courseProgress, scenario, listenClips, fill, DEFAULTS });
})();
</script>
<script>
/* The exercise types. Each exposes the same five functions so the session runner
   never needs to know which one it is holding. */
NL.ex = (function () {
  'use strict';
  const U = NL.util, esc = U.esc;

  /* ---------------- shared bits of view ---------------- */
  const ICON = {
    speaker: (s) => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9.5h3.2L12 5.2v13.6L7.2 14.5H4v-5Z"/><path d="M15.2 8.6a4.7 4.7 0 0 1 0 6.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M17.8 6a8.2 8.2 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>',
    turtle: () => '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9.5h3L11 6v12L7 14.5H4v-5Z"/><path d="M14.4 9.2a4 4 0 0 1 0 5.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M18.2 17.6 19.8 19.2M18.2 6.4 19.8 4.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>',
    mic: (s) => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 17.5v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
  };

  const speakerRow = (text, opts) => {
    opts = opts || {};
    return '<div class="speaker-row">' +
      '<button class="speaker" data-say="' + esc(text) + '" aria-label="Écouter">' + ICON.speaker(26) + '</button>' +
      '<button class="speaker slow" data-say="' + esc(text) + '" data-slow="1" aria-label="Lentement">' + ICON.turtle() + '</button>' +
      (opts.show ? '<div class="sentence">' + esc(text) + flemish(opts.be, text) + '</div>' : '') +
      '</div>';
  };

  const flemish = (be, std) => (be && NL.state.meta().showFlemish !== false && U.norm(be) !== U.norm(std))
    ? '<span class="be-line"><span class="be-tag">ici</span>' + esc(be) + '</span>' : '';

  function optList(opts, L, phase) {
    return '<div class="opts">' + opts.map((o, i) => {
      let cls = '';
      if (phase === 'ask') cls = (L.sel && L.sel.i === i) ? ' sel' : '';
      else if (o.ok) cls = ' ok';
      else if (L.sel && L.sel.i === i) cls = ' no';
      return '<button class="opt' + cls + '" data-opt="' + i + '"' + (phase === 'ask' ? '' : ' disabled') + '>' +
        '<span class="opt-key">' + (i + 1) + '</span><span>' + esc(o.label) + '</span></button>';
    }).join('') + '</div>';
  }

  function tileArea(task, L, phase) {
    const src = task.bank;
    const chosen = L.picked.map(i =>
      '<button class="tile" data-unpick="' + i + '"' + (phase === 'ask' ? '' : ' disabled') + '>' + esc(src[i]) + '</button>').join('');
    const bank = src.map((w, i) => {
      const used = L.picked.indexOf(i) >= 0;
      return '<button class="tile' + (used ? ' spent' : '') + '" data-pick="' + i + '"' +
        (phase === 'ask' && !used ? '' : ' disabled') + '>' + esc(w) + '</button>';
    }).join('');
    return '<div class="answer-area' + (L.picked.length ? '' : ' hint') + '">' + chosen + '</div>' +
      '<div class="bank">' + tileShuffleGuard(bank) + '</div>';
  }
  const tileShuffleGuard = html => html || '<span class="muted">—</span>';

  const said = (task, L) => L.picked.map(i => task.bank[i]).join(' ');

  /* Distractors always come from the same unit, so a wrong option is plausible. */
  function others(item, n, field) {
    const pool = NL.content.itemsOf(item.unit).filter(x => x.id !== item.id && x.kind === item.kind);
    return U.sample(pool, n).map(x => field === 'fr' ? U.bareFr(x.fr) : U.bare(x.nl));
  }
  function bankFor(sentence, item, extra) {
    const right = U.tiles(sentence);
    const pool = [];
    NL.content.itemsOf(item.unit).forEach(x => {
      if (x.id === item.id || x.kind !== 'phrase') return;
      U.tiles(x.nl).forEach(t => pool.push(t));
    });
    const noise = U.sample(
      U.uniq(pool).filter(t => !right.some(r => U.norm(r) === U.norm(t))),
      Math.min(extra == null ? 4 : extra, 5)
    );
    return U.shuffle(right.concat(noise));
  }

  /* Picks a content word worth hiding: the longest, least function-like token. */
  function gapWord(sentence, forced) {
    const ts = U.tiles(sentence);
    if (forced && ts.some(t => U.norm(t) === U.norm(forced))) return ts.find(t => U.norm(t) === U.norm(forced));
    const stop = ['de', 'het', 'een', 'ik', 'je', 'ge', 'is', 'en', 'in', 'op', 'te', 'dat', 'niet', 'u', 'van'];
    const cands = ts.filter(t => stop.indexOf(U.norm(t)) < 0 && t.length > 2);
    return (cands.length ? cands : ts).sort((a, b) => b.length - a.length)[0];
  }

  /* ---------------- the types ---------------- */
  const R = {};

  R.pick = {
    id: 'pick', kicker: NL.t.exPick,
    build(item) {
      const right = U.bare(item.nl);
      const opts = U.shuffle([{ label: right, ok: true }].concat(
        others(item, 2, 'nl').map(l => ({ label: l, ok: false }))));
      return { type: 'pick', item, prompt: U.bareFr(item.fr), opts };
    },
    view(t, L, phase) {
      return '<p class="sentence prompt">' + esc(t.prompt) + '</p>' + optList(t.opts, L, phase);
    },
    ready: (t, L) => !!L.sel,
    judge: (t, L) => ({ ok: !!(L.sel && (t.opts[L.sel.i] || {}).ok) }),
    answer: t => U.bare(t.item.nl)
  };

  R.recall = {
    id: 'recall', kicker: NL.t.exRecall,
    build(item) {
      const opts = U.shuffle([{ label: U.bareFr(item.fr), ok: true }].concat(
        others(item, 2, 'fr').map(l => ({ label: l, ok: false }))));
      return { type: 'recall', item, opts };
    },
    view(t, L, phase) {
      return speakerRow(U.bare(t.item.nl), { show: true, be: t.item.be }) + optList(t.opts, L, phase);
    },
    auto: t => U.bare(t.item.nl),
    ready: (t, L) => !!L.sel,
    judge: (t, L) => ({ ok: !!(L.sel && (t.opts[L.sel.i] || {}).ok) }),
    answer: t => U.bareFr(t.item.fr)
  };

  R.article = {
    id: 'article', kicker: NL.t.exArticle,
    build: item => ({ type: 'article', item, opts: [{ label: 'de', ok: item.art === 'de' }, { label: 'het', ok: item.art === 'het' }] }),
    view(t, L, phase) {
      const n = U.bare(t.item.nl);
      return '<div class="speaker-row">' +
        '<button class="speaker" data-say="' + esc(t.item.art + ' ' + n) + '" aria-label="Écouter">' + ICON.speaker(26) + '</button>' +
        '<div class="sentence">&hellip;&nbsp;' + esc(n) + '<span class="gloss">' + esc(U.bareFr(t.item.fr)) + '</span></div></div>' +
        optList(t.opts, L, phase);
    },
    ready: (t, L) => !!L.sel,
    judge: (t, L) => ({ ok: !!(L.sel && (t.opts[L.sel.i] || {}).ok) }),
    answer: t => t.item.art + ' ' + U.bare(t.item.nl)
  };

  R.bank = {
    id: 'bank', kicker: NL.t.exBank,
    build: item => ({ type: 'bank', item, target: item.nl, bank: bankFor(item.nl, item) }),
    view(t, L, phase) {
      return '<div class="sentence prompt">' + esc(t.item.fr) + '</div>' + tileArea(t, L, phase);
    },
    ready: (t, L) => L.picked.length > 0,
    judge: (t, L) => ({ ok: U.norm(said(t, L)) === U.norm(t.target) }),
    answer: t => t.target
  };

  R.order = {
    id: 'order', kicker: NL.t.exOrder,
    build(item) {
      const d = U.one(item.drills || [{ nl: item.nl, fr: item.fr }]);
      return { type: 'order', item, drill: d, target: d.nl, bank: U.shuffle(U.tiles(d.nl)) };
    },
    view(t, L, phase) {
      return '<div class="sentence prompt">' + esc(t.drill.fr) + '</div>' +
        '<div class="rule-chip">' + esc(t.item.rule || '') + '</div>' + tileArea(t, L, phase);
    },
    ready: (t, L) => L.picked.length > 0,
    judge: (t, L) => ({ ok: U.norm(said(t, L)) === U.norm(t.target) }),
    answer: t => t.target
  };

  R.cloze = {
    id: 'cloze', kicker: NL.t.exCloze,
    build(item) {
      const d = item.drills ? U.one(item.drills) : { nl: item.nl, fr: item.fr };
      const gap = gapWord(d.nl, d.gap);
      const opts = U.shuffle([{ label: gap, ok: true }].concat(
        U.sample(U.uniq(NL.content.itemsOf(item.unit)
          .flatMap(x => U.tiles(x.nl || ''))
          .filter(w => w.length > 2 && U.norm(w) !== U.norm(gap))), 2).map(l => ({ label: l, ok: false }))));
      return { type: 'cloze', item, drill: d, gap, opts, shown: d.nl.replace(new RegExp('(^|\\s)' + gap.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?=\\s|$|[.,!?])'), '$1     ') };
    },
    view(t, L, phase) {
      return '<div class="sentence cloze-line">' + esc(t.shown).replace(/ +/, '<span class="gap">' + (phase === 'ask' ? '' : esc(t.gap)) + '</span>') + '</div>' +
        '<div class="gloss-line">' + esc(t.drill.fr) + '</div>' + optList(t.opts, L, phase);
    },
    ready: (t, L) => !!L.sel,
    judge: (t, L) => ({ ok: !!(L.sel && (t.opts[L.sel.i] || {}).ok) }),
    answer: t => t.gap
  };

  R.dictation = {
    id: 'dictation', kicker: NL.t.exDictation,
    build(item) {
      const target = item.kind === 'word' ? U.bare(item.nl) : item.nl;
      return { type: 'dictation', item, target, bank: item.kind === 'word' ? null : bankFor(target, item, 3) };
    },
    view(t, L, phase) {
      const head = speakerRow(t.target, { show: phase !== 'ask', be: t.item.be });
      if (t.bank) return head + tileArea(t, L, phase);
      return head + '<input class="textin" type="text" value="' + esc(L.input) + '" autocomplete="off" ' +
        'autocapitalize="off" spellcheck="false" placeholder="' + NL.t.heardWhat + '"' + (phase === 'ask' ? '' : ' disabled') + '>';
    },
    auto: t => t.target,
    ready: (t, L) => t.bank ? L.picked.length > 0 : L.input.trim().length > 0,
    judge(t, L) {
      const got = t.bank ? said(t, L) : L.input;
      return { ok: t.bank ? U.norm(got) === U.norm(t.target) : U.near(got, t.target, 1) };
    },
    answer: t => t.target
  };

  R.type = {
    id: 'type', kicker: NL.t.exType,
    build(item) {
      return { type: 'type', item, target: item.kind === 'word' ? U.bare(item.nl) : (item.drills ? item.nl : item.nl), prompt: item.kind === 'word' ? U.bareFr(item.fr) : item.fr };
    },
    view(t, L, phase) {
      return '<div class="sentence prompt">' + esc(t.prompt) + '</div>' +
        '<input class="textin" type="text" value="' + esc(L.input) + '" autocomplete="off" autocapitalize="off" ' +
        'spellcheck="false" placeholder="' + NL.t.typeHere + '"' + (phase === 'ask' ? '' : ' disabled') + '>' +
        '<div class="hintline"><span>' + NL.t.specialLetters + '</span>' +
        ['é', 'ë', 'ï', 'ö', 'è', 'ij'].map(c => '<button class="chip" data-ins="' + c + '">' + c + '</button>').join('') +
        '</div>';
    },
    ready: (t, L) => L.input.trim().length > 0,
    judge: (t, L) => ({ ok: U.near(L.input, t.target, 1) }),
    answer: t => t.target
  };

  R.speak = {
    id: 'speak', kicker: NL.t.exSpeak,
    build(item) {
      return { type: 'speak', item, target: item.kind === 'word' ? U.bare(item.nl) : item.nl, prompt: item.kind === 'word' ? U.bareFr(item.fr) : item.fr };
    },
    view(t, L, phase) {
      const sp = L.speech;
      const blocked = NL.speech.listenBlocked();
      let panel;

      if (blocked) {
        panel = recordPanel(sp, t.target, blocked);
      } else if (sp.phase === 'listening') {
        panel = '<div class="mic-panel live"><button class="mic big listening" data-mic="stop" aria-label="' + NL.t.stop + '">' + ICON.mic(34) + '</button>' +
          '<p class="mic-why">' + NL.t.micListening + '</p>' +
          (sp.partial ? '<p class="heard">' + esc(sp.partial) + '</p>' : '') + '</div>';
      } else if (sp.phase === 'done') {
        panel = '<div class="mic-panel ' + (sp.ok ? 'good' : 'bad') + '">' +
          '<div class="score-row"><span class="score">' + sp.pct + '%</span>' +
          '<span class="score-bar"><span style="width:' + sp.pct + '%"></span></span></div>' +
          '<p class="word-diff">' + sp.parts.map(p =>
            '<span class="' + (p.ok ? (p.close ? 'w-close' : 'w-ok') : 'w-no') + '">' + esc(p.word) + '</span>').join(' ') + '</p>' +
          (sp.heard ? '<p class="heard">' + NL.t.micHeard + ' &ldquo;' + esc(sp.heard) + '&rdquo;</p>' : '') +
          (!sp.ok && sp.tries < 3 ? '<div class="mic-actions"><button class="btn btn-blue" data-mic="start">' + NL.t.micRetry(3 - sp.tries) + '</button></div>' : '') +
          '</div>';
      } else {
        panel = '<div class="mic-panel"><button class="mic big" data-mic="start" aria-label="' + NL.t.speak + '">' + ICON.mic(34) + '</button>' +
          '<p class="mic-why">' + (sp.error ? esc(micError(sp.error)) : NL.t.micTap) + '</p></div>';
      }

      return '<div class="sentence prompt">' + esc(t.target) + flemish(t.item.be, t.target) + '</div>' +
        '<div class="gloss-line">' + esc(t.prompt) + '</div>' +
        speakerRow(t.target, {}) + panel;
    },
    ready(t, L) {
      const sp = L.speech;
      return sp.phase === 'done' || sp.selfRated != null;
    },
    judge(t, L) {
      const sp = L.speech;
      const ok = sp.selfRated != null ? !!sp.selfRated : !!sp.ok;
      return { ok, spoken: ok };
    },
    answer: t => t.target
  };

  /* No recogniser available. Record yourself instead and compare against the
     model — no service needed, works offline, works in Opera. Falls through to
     honest self-rating when even the microphone is out of reach. */
  function recordPanel(sp, target, blocked) {
    const T = NL.t;
    const hardStop = !NL.speech.canRecord() ||
      ['framed', 'denied', 'nomic', 'blocked', 'format'].indexOf(sp.recErr) >= 0;

    if (hardStop) {
      return '<div class="mic-panel offline">' +
        '<p class="mic-why">' + (sp.recErr ? recErr(sp.recErr) : blocked === 'offline' ? T.micOffline : T.micNoBrowser) + '</p>' +
        (sp.selfRated == null
          ? '<div class="mic-actions"><button class="btn btn-good" data-self="1">' + T.micSaidIt + '</button>' +
          '<button class="btn btn-ghost" data-self="0">' + T.micNotYet + '</button></div>'
          : '<p class="mic-verdict">' + (sp.selfRated ? T.micNotedOk : T.micNotedNo) + '</p>') +
        '</div>';
    }
    if (sp.recState === 'rec') {
      return '<div class="mic-panel live">' +
        '<button class="mic big listening" data-rec="stop" aria-label="' + T.recStop + '">' + ICON.mic(32) + '</button>' +
        '<p class="mic-why">' + T.recStop + '</p></div>';
    }
    if (sp.recState === 'done') {
      return '<div class="mic-panel compare">' +
        '<div class="mic-actions">' +
        '<button class="btn" data-say="' + esc(target) + '">' + T.recModel + '</button>' +
        '<button class="btn" data-rec="play">' + T.recYours + '</button>' +
        '<button class="btn btn-blue" data-rec="both">' + T.recBoth + '</button>' +
        '</div>' +
        '<p class="mic-why">' + T.recHint + '</p>' +
        (sp.selfRated == null
          ? '<div class="mic-actions"><button class="btn btn-ghost" data-rec="start">' + T.recAgain + '</button>' +
          '<button class="btn btn-good" data-self="1">' + T.micSaidIt + '</button>' +
          '<button class="btn btn-ghost" data-self="0">' + T.micNotYet + '</button></div>'
          : '<p class="mic-verdict">' + (sp.selfRated ? T.micNotedOk : T.micNotedNo) + '</p>') +
        '</div>';
    }
    return '<div class="mic-panel">' +
      '<button class="mic big" data-rec="start" aria-label="' + T.recRecord + '">' + ICON.mic(34) + '</button>' +
      '<p class="mic-why">' + T.recRecord + ' — ' + T.recHint + '</p></div>';
  }

  const recErr = k => k === 'framed'
    ? 'Le micro est bloqué parce que cette page tourne dans un cadre intégré. Ouvre la version hébergée pour t’enregistrer — ici, évalue-toi.'
    : k === 'denied' ? NL.t.micDenied
      : k === 'nomic' ? 'Aucun micro détecté. Dis la phrase à voix haute et évalue-toi.'
        : 'L’enregistrement n’est pas possible ici. Dis-la à voix haute et évalue-toi.';

  function micError(kind) {
    return kind === 'denied' ? NL.t.micDenied
      : kind === 'silence' ? NL.t.micSilence
        : kind === 'network' ? NL.t.micNetwork
          : NL.t.micFail;
  }

  /* ---------------- les types exigeants ---------------- */

  /* Trois mots partagent un article, un non. Transforme de/het en raisonnement
     au lieu d'un pile ou face. */
  R.intrus = {
    id: 'intrus', kicker: NL.t.exIntrus,
    build(item) {
      const pool = NL.content.allItems().filter(x => x.kind === 'word' && x.art && x.id !== item.id);
      const same = U.sample(pool.filter(x => x.art === item.art), 2);
      const other = U.sample(pool.filter(x => x.art !== item.art), 1)[0];
      const opts = U.shuffle(
        [item].concat(same).map(x => ({ label: U.bare(x.nl), ok: false }))
          .concat([{ label: U.bare(other.nl), ok: true, art: other.art }]));
      return { type: 'intrus', item, opts, art: item.art };
    },
    view(t, L, phase) {
      return '<p class="sentence prompt">Trois de ces mots prennent <b>' + t.art + '</b>. Lequel non&nbsp;?</p>' +
        optList(t.opts, L, phase);
    },
    ready: (t, L) => !!L.sel,
    judge: (t, L) => ({ ok: !!(L.sel && (t.opts[L.sel.i] || {}).ok) }),
    answer: t => (t.opts.find(o => o.ok) || {}).label || ''
  };

  /* Une faute est plantée dans la phrase : trouve-la. Le transfert vers la
     relecture de tes propres mails est direct. */
  R.corrige = {
    id: 'corrige', kicker: NL.t.exCorrige,
    build(item) {
      const toks = U.tiles(item.nl);
      const i = 1 + ((Math.random() * Math.max(1, toks.length - 2)) | 0);
      const bad = toks.slice();
      const j = Math.min(i + 1, bad.length - 1);
      const tmp = bad[i]; bad[i] = bad[j]; bad[j] = tmp;
      return { type: 'corrige', item, bad, faulty: i, other: j, target: item.nl };
    },
    view(t, L, phase) {
      return '<div class="gloss-line">' + esc(t.item.fr) + '</div>' +
        '<div class="corrige">' + t.bad.map((w, i) => {
          let cls = '';
          if (phase !== 'ask') { if (i === t.faulty || i === t.other) cls = ' bad'; }
          else if (L.sel && L.sel.i === i) cls = ' sel';
          return '<button class="ctok' + cls + '" data-opt="' + i + '"' + (phase === 'ask' ? '' : ' disabled') + '>' + esc(w) + '</button>';
        }).join('') + '</div>' +
        (phase !== 'ask' ? '<p class="corrige-fix">' + esc(t.target) + '</p>' : '');
    },
    ready: (t, L) => !!L.sel,
    judge: (t, L) => ({ ok: !!L.sel && (L.sel.i === t.faulty || L.sel.i === t.other) }),
    answer: t => t.target
  };

  /* La phrase standard est donnée : comment la dit-on ici ? Unique à cette app,
     et la donnée existe déjà sur chaque élément. */
  R.vlaams = {
    id: 'vlaams', kicker: NL.t.exVlaams,
    build(item) {
      const pool = NL.content.allItems().filter(x =>
        x.be && x.id !== item.id && U.norm(x.be) !== U.norm(x.nl));
      const opts = U.shuffle([{ label: item.be, ok: true }]
        .concat(U.sample(pool, 2).map(x => ({ label: x.be, ok: false }))));
      return { type: 'vlaams', item, opts };
    },
    view(t, L, phase) {
      return '<div class="sentence prompt">' + esc(t.item.nl) + '</div>' +
        '<div class="gloss-line">' + esc(t.item.fr) + '</div>' + optList(t.opts, L, phase);
    },
    ready: (t, L) => !!L.sel,
    judge: (t, L) => ({ ok: !!(L.sel && (t.opts[L.sel.i] || {}).ok) }),
    answer: t => t.item.be
  };

  /* Réponse libre, notée sur ce qu'elle CONTIENT et non sur sa formulation.
     Hors ligne, sans IA. C'est le passage de la reproduction à la composition. */
  function rubric(task, text) {
    const s = String(text || ''), w = U.words(s), met = [];
    (task.need || []).forEach(n => {
      if (n.rx && n.rx.test(s)) { met.push(n.what); return; }
      if (n.any && n.any.some(a => U.norm(s).indexOf(U.norm(a)) >= 0)) { met.push(n.what); return; }
      if (n.min && w.length >= n.min) { met.push(n.what); return; }
    });
    return met;
  }
  R.open = {
    id: 'open', kicker: NL.t.exOpen,
    build: item => ({ type: 'open', item, task: item.open }),
    view(t, L, phase) {
      const met = phase === 'ask' ? null : rubric(t.task, L.input);
      return '<p class="sentence prompt">' + esc(t.task.ask) + '</p>' +
        '<textarea class="textin open-box" rows="3" spellcheck="false" ' +
        'placeholder="' + esc(NL.t.openPlaceholder) + '"' + (phase === 'ask' ? '' : ' disabled') + '>' +
        esc(L.input) + '</textarea>' +
        '<div class="need-list">' + (t.task.need || []).map(n => {
          const on = met ? met.indexOf(n.what) >= 0 : null;
          return '<span class="need' + (on === null ? '' : on ? ' ok' : ' no') + '">' + esc(n.what) + '</span>';
        }).join('') + '</div>' +
        (phase !== 'ask' ? '<p class="model-answer"><i>' + NL.t.openModel + '</i> ' + esc(t.task.model) + '</p>' : '');
    },
    ready: (t, L) => U.words(L.input).length >= 3,
    judge: (t, L) => ({ ok: rubric(t.task, L.input).length === (t.task.need || []).length }),
    answer: t => t.task.model
  };

  R.match = {
    id: 'match', kicker: NL.t.exMatch,
    build(items) {
      const pairs = items.slice(0, 5).map(it => ({ id: it.id, nl: U.bare(it.nl), fr: U.bareFr(it.fr), item: it }));
      return {
        type: 'match', pairs, items,
        left: U.shuffle(pairs.map((p, i) => ({ t: p.nl, k: i, s: 'l' }))),
        right: U.shuffle(pairs.map((p, i) => ({ t: p.fr, k: i, s: 'r' })))
      };
    },
    view(t, L) {
      const cell = c => {
        const id = c.s + c.k, gone = L.matchGone.indexOf(c.k) >= 0;
        const sel = L.matchSel && L.matchSel.id === id, bad = L.matchBad === id;
        return '<button class="pair' + (gone ? ' gone' : '') + (sel ? ' sel' : '') + (bad ? ' shake' : '') + '"' +
          ' data-match="' + id + '" data-k="' + c.k + '" data-side="' + c.s + '"' + (gone ? ' disabled' : '') + '>' +
          '<span class="pair-n">' + (c.s === 'l' ? 'NL' : 'FR') + '</span>' + esc(c.t) + '</button>';
      };
      let rows = '';
      for (let i = 0; i < t.pairs.length; i++) rows += cell(t.left[i]) + cell(t.right[i]);
      return '<div class="pairs">' + rows + '</div>';
    },
    ready: (t, L) => L.matchGone.length >= t.pairs.length,
    judge: () => ({ ok: true }),
    answer: () => ''
  };

  return { registry: R, get: id => R[id] || R.pick, ICON, speakerRow, flemish, recordPanel };
})();
</script>
<script>
/* Shell : routage, chrome, panneaux, et l'unique écouteur d'événements délégué.
   Les écrans sont de simples objets avec render(), et éventuellement click(), key(), input(). */
NL.ui = (function () {
  'use strict';
  const U = NL.util, esc = U.esc, t = NL.t;
  let root = null;
  let route = 'vandaag', arg = null, sheet = null, toastMsg = null, toastT = null;

  const I = {
    flame: '<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c2.2 3.4 1.2 5.1.2 6.3-.9 1.1-2 2-2 3.6a3.1 3.1 0 0 0 1.5 2.7c-.4-1.6.3-2.9 1.4-3.7.2 1.8 1.3 2.3 2.4 3.4a4.6 4.6 0 0 1 1.4 3.3A5.3 5.3 0 0 1 12 21.5a6 6 0 0 1-6-6c0-4.6 4.2-5.9 6-13Z"/></svg>',
    bolt: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 2 4 13.2h5.7L8.9 22 20 10.4h-6.2L13.5 2Z"/></svg>',
    due: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.4V12l3 2" stroke-linecap="round"/></svg>',
    x: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    back: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5 8 12l6.5 7"/></svg>',
    gear: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M21.2 12h-2.4M5.2 12H2.8M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7M18.5 18.5l-1.7-1.7M7.2 7.2 5.5 5.5"/></svg>'
  };

  const NAV_ICON = {
    vandaag: '<path d="M4 6.5h16M4 12h16M4 17.5h10"/>',
    leerpad: '<path d="M6 20V8.5a3.5 3.5 0 0 1 7 0v7a3.5 3.5 0 0 0 7 0V4"/>',
    praten: '<path d="M20 14.5a2.5 2.5 0 0 1-2.5 2.5H9l-5 3.5V6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5Z"/>',
    luisteren: '<path d="M4 13.5a8 8 0 0 1 16 0M4 13.5v3a2.5 2.5 0 0 0 5 0v-3M20 13.5v3a2.5 2.5 0 0 1-5 0v-3"/>',
    meer: '<circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/>'
  };
  const UNDER_MEER = ['woorden', 'spiek', 'register', 'klanken', 'doctor', 'dehet'];
  const FULLSCREEN = { sessie: 1, scenario: 1, placement: 1, doctor: 1, compte: 1 };

  function go(to, a) {
    if (route === 'sessie' && to !== 'sessie' && NL.screens.sessie.active()) { sheet = 'quit-session'; return render(); }
    NL.speech.stop(); NL.speech.abort();
    route = to; arg = a == null ? null : a; sheet = null;
    try { location.hash = '#' + to + (a ? '/' + a : ''); } catch (e) {}
    render();
    const b = document.querySelector('.screen');
    if (b) b.scrollTop = 0;
  }

  function fromHash() {
    const h = (location.hash || '').replace(/^#/, '');
    if (!h) return null;
    const [r, a] = h.split('/');
    return NL.screens[r] ? { r, a: a || null } : null;
  }

  /* The topbar carries identity and one way out. The scoreboard lives on
     Aujourd'hui and Plus, where you go when you want to look at it. */
  function topbar() {
    return '<header class="topbar"><div class="bar-in">' +
      '<div class="brand"><span class="mark">' +
      '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M5 18.5c3.5-1.5 4.5-5 4.5-8.5S8 4.5 8 4.5"/><path d="M19 18.5c-3.5-1.5-4.5-5-4.5-8.5S16 4.5 16 4.5"/><path d="M4.5 11.5h15"/></svg></span>' +
      '<span class="brand-txt"><b>Vlaams</b><i>' + esc(NL.content.fill(t.brandSub)) + '</i></span></div>' +
      '<button class="iconbtn gear" data-sheet="instellingen" aria-label="' + t.setTitle + '">' + I.gear + syncDot() + '</button>' +
      '</div></header>';
  }

  /* Un point discret sur l'engrenage quand la progression n'est pas à l'abri. */
  function syncDot() {
    if (!NL.sync.enabled) return '';
    const st = NL.sync.status();
    if (!st.user) return '<i class="sdot warn"></i>';
    if (st.state === 'error') return '<i class="sdot bad"></i>';
    return '';
  }

  function nav() {
    return '<nav class="nav"><div class="nav-in">' + t.nav.map(n => {
      const on = route === n.id || (n.id === 'meer' && UNDER_MEER.indexOf(route) >= 0);
      return '<button class="nav-btn' + (on ? ' on' : '') + '" data-go="' + n.id + '">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + NAV_ICON[n.id] + '</svg>' +
        '<span class="nav-fr">' + n.fr + '</span><span class="nav-nl">' + n.nl + '</span></button>';
    }).join('') + '</div></nav>';
  }

  function render() {
    applyTheme();
    const S = NL.screens[route] || NL.screens.vandaag;
    const full = !!FULLSCREEN[route];
    const html = full
      ? '<div class="screen full">' + S.render(arg) + '</div>'
      : topbar() + '<main class="screen">' + S.render(arg) + '</main>' + nav();
    root.innerHTML = html + (sheet ? sheetHtml() : '') + (toastMsg ? '<div class="toast">' + esc(toastMsg) + '</div>' : '');
    if (S.after) S.after(arg);
  }

  /* ---------------- panneaux ---------------- */
  function card(title, body, actions) {
    return '<div class="sheet" data-backdrop="1"><div class="sheet-card" role="dialog" aria-modal="true">' +
      '<h3>' + title + '</h3>' + (body || '') + '<div class="sheet-actions">' + actions + '</div></div></div>';
  }

  function sheetHtml() {
    const m = NL.state.meta();
    if (sheet === 'quit-session') {
      return card(t.quitTitle, '<p>' + t.quitBody + '</p>',
        '<button class="btn btn-bad wide" data-quit-yes="1">' + t.quitYes + '</button>' +
        '<button class="btn btn-ghost wide" data-close="1">' + t.quitNo + '</button>');
    }
    if (sheet === 'instellingen') {
      const v = NL.speech.voiceInfo();
      const mic = NL.speech.listenBlocked();
      return card(t.setTitle,
        '<div class="set-block"><h4>' + t.setTheme + '</h4><div class="seg">' +
        [['system', t.setSystem], ['light', t.setLight], ['dark', t.setDark]].map(([k, label]) =>
          '<button class="seg-btn' + (m.theme === k ? ' on' : '') + '" data-theme="' + k + '">' + label + '</button>').join('') +
        '</div></div>' +

        '<div class="set-block"><h4>' + t.setPace + '</h4><div class="seg">' +
        ['calme', 'normal', 'intensif'].map(k =>
          '<button class="seg-btn' + ((m.pace || 'normal') === k ? ' on' : '') + '" data-pace="' + k + '">' +
          t['pace' + k.charAt(0).toUpperCase() + k.slice(1)] + '</button>').join('') + '</div>' +
        '<p class="set-note muted">' + t.paceNote(NL.srs.pace()) + '</p>' +
        '<p class="set-note muted">' + t.paceWhy + '</p></div>' +

        '<div class="set-block"><h4>' + t.setPractice + '</h4>' +
        toggle('showFlemish', t.setFlemish, m.showFlemish !== false) +
        toggle('autoplay', t.setAutoplay, m.autoplay !== false) +
        toggle('sfx', t.setSfx, m.sfx !== false) + '</div>' +

        '<div class="set-block"><h4>' + t.setMine + '</h4>' +
        '<p class="set-note muted">' + t.setMineNote + '</p>' +
        [['learnerName', t.setName, NL.content.DEFAULTS.naam],
         ['town', t.setTown, NL.content.DEFAULTS.stad],
         ['company', t.setCompany, NL.content.DEFAULTS.bedrijf]].map(([k, label, ph]) =>
          '<label class="mine"><span>' + label + '</span>' +
          '<input class="textin" data-mine="' + k + '" value="' + esc(m[k] || '') + '" placeholder="' + esc(ph) + '" spellcheck="false"></label>').join('') +
        '</div>' +

        (NL.sync.enabled ? accountBlock() : '') +

        '<div class="set-block"><h4>' + t.setVoice + '</h4>' +
        '<p class="set-note ' + (v.quality === 'be' ? 'good' : 'warn') + '">' + esc(v.note) +
        (v.name ? ' <span class="muted">(' + esc(v.name) + ')</span>' : '') + '</p>' +
        '<p class="set-note ' + (mic ? 'warn' : 'good') + '">' + esc(micLine(mic)) + '</p>' +
        '<button class="btn btn-blue wide" data-go="doctor">' + t.setDoctor + '</button></div>' +

        '<div class="set-block"><h4>' + t.setExport + '</h4>' +
        '<p class="set-note muted">' + t.setStorage + ' ' + NL.state.storage + '. Une sauvegarde te suit d’un navigateur à l’autre — indispensable avant de passer du lien claude.ai à une adresse à toi.</p>' +
        '<div class="row"><button class="btn" data-export="1">' + t.setExport + '</button>' +
        '<button class="btn" data-import="1">' + t.setImport + '</button></div>' +
        '<div class="row"><button class="btn btn-ghost" data-act="copy-show">Copier le texte</button>' +
        '<button class="btn btn-ghost" data-act="paste-show">Coller une sauvegarde</button></div>' +
        '<input type="file" id="import-file" accept="application/json" hidden></div>',

        '<button class="btn btn-ghost wide" data-close="1">' + t.close + '</button>' +
        '<button class="btn btn-ghost wide danger" data-reset="1">' + t.setReset + '</button>');
    }
    if (sheet === 'reset-confirm') {
      return card(t.setResetTitle, '<p>' + t.setResetBody + '</p>',
        '<button class="btn btn-bad wide" data-reset-yes="1">' + t.setResetYes + '</button>' +
        '<button class="btn btn-ghost wide" data-close="1">' + t.cancel + '</button>');
    }
    if (sheet && sheet.custom) return sheet.custom;
    return '';
  }

  function accountBlock() {
    const st = NL.sync.status();
    if (!st.user) {
      return '<div class="set-block"><h4>' + t.accEyebrow + '</h4>' +
        '<p class="set-note warn">' + t.syncLocalOnly + '</p>' +
        '<button class="btn btn-blue wide" data-go="compte">' + t.accSignInCta + '</button></div>';
    }
    const line = st.state === 'syncing' ? t.syncBusy
      : st.state === 'offline' ? t.syncOffline(st.pending)
      : st.state === 'error' ? t.syncError('')
      : st.pending ? t.syncPending(st.pending)
      : t.syncOk(st.lastSync ? t.syncAgo(Date.now() - st.lastSync) : t.syncNever);
    return '<div class="set-block"><h4>' + t.accEyebrow + '</h4>' +
      '<p class="set-note muted">' + esc(st.user.email || '') + '</p>' +
      '<p class="set-note ' + (st.state === 'error' ? 'warn' : 'good') + '">' + esc(line) + '</p>' +
      '<button class="btn btn-blue wide" data-go="compte">' + t.accManage + '</button></div>';
  }

  const micLine = kind => kind === 'browser' ? t.micNoBrowser
    : kind === 'offline' ? t.micOffline
      : 'Reconnaissance vocale active (nl-BE).';

  const toggle = (k, label, on) =>
    '<label class="tog"><span>' + label + '</span>' +
    '<button class="switch' + (on ? ' on' : '') + '" data-toggle="' + k + '" role="switch" aria-checked="' + !!on + '"><span></span></button></label>';

  function openSheet(s) { sheet = s; render(); }
  function closeSheet() { sheet = null; render(); }

  function toast(msg) {
    toastMsg = msg; render();
    clearTimeout(toastT);
    toastT = setTimeout(() => { toastMsg = null; render(); }, 2400);
  }

  function applyTheme() {
    const th = NL.state.meta().theme;
    const r = document.documentElement;
    if (th === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', th);
  }

  /* ---------------- sauvegarde ---------------- */
  /* Three routes out, because this page runs in three different places.
     Inside the claude.ai viewer a plain <a download> is inert, so the host's
     save capability is tried first; on a hosted or local copy that capability
     does not exist and the anchor works. Copy-paste always works. */
  const backupName = () => 'vlaams-' + U.dayKey() + '.json';
  const backupText = () => JSON.stringify(NL.state.exportAll(), null, 1);

  function anchorDownload(text) {
    const blob = new Blob([text], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = backupName();
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  function doExport() {
    const text = backupText();
    const host = window.claude && typeof window.claude.use === 'function' ? window.claude.use('downloads') : null;
    if (!host) { try { anchorDownload(text); toast(t.exported); } catch (e) { openCopy(text); } return; }
    Promise.resolve(host).then(dl => {
      if (!dl) { try { anchorDownload(text); toast(t.exported); } catch (e) { openCopy(text); } return; }
      dl.save({ filename: backupName(), data: text })
        .then(() => toast(t.exported))
        .catch(err => { if (!err || err.code !== 'declined') openCopy(text); });
    }).catch(() => openCopy(text));
  }

  function openCopy(text) {
    openSheet({ custom: card(t.setExport,
      '<p>Copie ce texte et garde-le. C’est toute ta progression : colle-le dans « ' + t.setImport + ' » sur l’autre appareil.</p>' +
      '<textarea class="backup-box" id="backup-out" readonly spellcheck="false">' + esc(text) + '</textarea>',
      '<button class="btn btn-blue wide" data-act="copy-backup">Copier</button>' +
      '<button class="btn btn-ghost wide" data-close="1">' + t.close + '</button>') });
  }

  function openPaste() {
    openSheet({ custom: card(t.setImport,
      '<p>Colle ici la sauvegarde exportée depuis l’autre appareil.</p>' +
      '<textarea class="backup-box" id="backup-in" spellcheck="false" placeholder="{ &quot;app&quot;: &quot;vlaams-onderweg&quot; … }"></textarea>',
      '<button class="btn btn-good wide" data-act="paste-backup">' + t.setImport + '</button>' +
      '<button class="btn btn-ghost wide" data-close="1">' + t.cancel + '</button>') });
  }

  function restore(raw) {
    let data = null;
    try { data = JSON.parse(raw); } catch (e) { /* reported below */ }
    if (NL.state.importAll(data)) {
      NL.content.refresh(); sheet = null;
      if (NL.sync.user) { NL.sync.queueAll(); NL.sync.flush(); }
      render(); toast(t.imported);
    }
    else toast(t.importFailed);
  }

  function doImport() {
    const inp = document.getElementById('import-file');
    if (!inp) return openPaste();
    inp.onchange = () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => restore(r.result);
      r.readAsText(f);
    };
    try { inp.click(); } catch (e) { openPaste(); }
  }

  /* ---------------- événements ---------------- */
  function bind(el) {
    root = el;

    root.addEventListener('click', e => {
      const hit = e.target.closest('[data-say],[data-go],[data-sheet],[data-close],[data-backdrop],[data-theme],' +
        '[data-toggle],[data-reset],[data-reset-yes],[data-quit-yes],[data-export],[data-import],[data-pace],[data-act]');
      const S = NL.screens[route];

      if (hit) {
        const d = hit.dataset;
        if (d.say !== undefined) { NL.speech.say(d.say, { rate: d.slow ? 0.62 : 1 }); return; }
        if (d.backdrop !== undefined && hit === e.target) { closeSheet(); return; }
        if (d.close !== undefined) { closeSheet(); return; }
        if (d.go) { go(d.go); return; }
        if (d.sheet) { openSheet(d.sheet); return; }
        if (d.theme) { NL.state.setMeta({ theme: d.theme }); render(); return; }
        if (d.pace) { NL.state.setMeta({ pace: d.pace }); render(); return; }
        if (d.toggle) { const m = NL.state.meta(); NL.state.setMeta({ [d.toggle]: m[d.toggle] === false }); render(); return; }
        if (d.export !== undefined) { doExport(); return; }
        if (d.import !== undefined) { doImport(); return; }
        if (d.act === 'copy-show') { openCopy(backupText()); return; }
        if (d.act === 'paste-show') { openPaste(); return; }
        if (d.act === 'copy-backup') {
          const box = document.getElementById('backup-out');
          if (box) {
            box.select();
            const ok = navigator.clipboard
              ? navigator.clipboard.writeText(box.value).then(() => true).catch(() => false)
              : Promise.resolve(document.execCommand && document.execCommand('copy'));
            Promise.resolve(ok).then(good => toast(good ? 'Copié.' : 'Sélectionne le texte et copie-le à la main.'));
          }
          return;
        }
        if (d.act === 'paste-backup') {
          const box = document.getElementById('backup-in');
          if (box) restore(box.value.trim());
          return;
        }
        if (d.reset !== undefined) { sheet = 'reset-confirm'; render(); return; }
        if (d.resetYes !== undefined) {
          Promise.resolve(NL.state.clearAll()).then(() => {
            NL.content.refresh(); sheet = null; route = 'vandaag'; render(); toast(t.wiped);
          });
          return;
        }
        if (d.quitYes !== undefined) { NL.screens.sessie.abandon(); sheet = null; go('vandaag'); return; }
      }

      if (S && S.click) {
        const target = e.target.closest('[data-act],[data-opt],[data-pick],[data-unpick],[data-match],[data-ins],' +
          '[data-mic],[data-self],[data-check],[data-next],[data-skip],[data-start],[data-unit],[data-scn],' +
          '[data-clip],[data-sheetid],[data-choice],[data-step],[data-del],[data-add],[data-rec]');
        if (target) S.click(target, target.dataset, e);
      }
    });

    root.addEventListener('change', e => {
      if (e.target.matches('[data-goal]')) { NL.state.setMeta({ dailyGoal: +e.target.value }); return; }
      const S = NL.screens[route];
      if (S && S.change) S.change(e.target, e);
    });

    root.addEventListener('input', e => {
      if (e.target && e.target.dataset && e.target.dataset.mine) {
        NL.state.setMeta({ [e.target.dataset.mine]: e.target.value.trim() });
        NL.content.refresh();          // the whole course re-reads its placeholders
        return;
      }
      const S = NL.screens[route];
      if (S && S.input) S.input(e.target, e);
    });

    document.addEventListener('keydown', e => {
      if (sheet) { if (e.key === 'Escape') closeSheet(); return; }
      const S = NL.screens[route];
      if (S && S.key) S.key(e);
    });

    window.addEventListener('hashchange', () => {
      const h = fromHash();
      if (h && h.r !== route) { route = h.r; arg = h.a; render(); }
    });
  }

  /* Appelé par la synchro quand une connexion aboutit — au retour du lien
     magique par exemple. */
  function onAuth() { if (route === 'compte') go('vandaag'); else render(); }

  return {
    bind, render, go, toast, openSheet, closeSheet, I, card, onAuth,
    get route() { return route; },
    boot() { const h = fromHash(); if (h) { route = h.r; arg = h.a; } render(); }
  };
})();
NL.screens = NL.screens || {};
</script>
<script>
/* The session runner. Builds a queue from whatever the scheduler says is owed,
   runs it, grades it, and puts failures back on the end. */
NL.screens.sessie = (function () {
  'use strict';
  const U = NL.util, esc = U.esc, EX = NL.ex;
  let L = null;

  const MAX_TASKS = NL.srs.MAX_TASKS;

  function blankTurn() {
    return { sel: null, picked: [], input: '', matchSel: null, matchGone: [], matchBad: null, speech: { phase: 'idle', tries: 0, selfRated: null } };
  }

  function start(source) {
    NL.state.touchDay();
    const m = NL.state.meta();
    const due = NL.srs.dueItems();
    let fresh, pool;

    if (source && source !== 'vandaag') {
      const items = NL.content.itemsOf(source);
      pool = items.filter(it => NL.srs.stageOf(it) >= 0 && NL.state.rec(it.id).due <= Date.now());
      fresh = items.filter(it => NL.srs.stageOf(it) < 0).slice(0, NL.srs.pace().fresh);
    } else {
      const left = NL.srs.budgetLeft();
      pool = due.slice(0, left);
      fresh = NL.srs.freshItems(Math.min(Math.max(0, left - pool.length), NL.srs.pace().fresh));
    }

    const queue = [];
    /* Brand-new items get met as a matching warm-up before anything is demanded. */
    const newWords = fresh.filter(it => it.kind !== 'pattern');
    if (newWords.length >= 4) {
      queue.push({ ex: 'match', task: EX.registry.match.build(newWords.slice(0, 5)), items: newWords.slice(0, 5) });
    }
    /* Grammar rules are nine items among four hundred, so uniform sampling buries
       them — a whole week could pass without one. Give them a guaranteed seat. */
    const pats = pool.filter(it => it.kind === 'pattern').slice(0, 2);
    const others = pool.filter(it => pats.indexOf(it) < 0).slice(0, MAX_TASKS - pats.length);
    /* Le gouverneur : on retient les deux derniers types servis pour qu'aucun
       ne se répète coup sur coup. */
    const rest = U.shuffle(pats.concat(others, fresh));
    const recent = [];
    rest.forEach(it => {
      const name = NL.srs.exerciseFor(it, new Set(recent));
      const ex = EX.get(name);
      try {
        queue.push({ ex: name, task: ex.build(it), items: [it] });
        recent.push(name);
        if (recent.length > 2) recent.shift();
      } catch (e) { /* un élément mal formé est simplement sauté */ }
    });

    /* Étalement optimal. Choisir « le premier qui diffère » ne suffit pas : quand
       un type domine la file, il faut le répartir activement. On puise donc à
       tour de rôle dans le plus gros paquet restant, ce qui est l'ordonnancement
       qui minimise réellement les voisins identiques. La mémoire traverse aussi
       les séances : sans elle, chaque nouvelle séance repart aveugle. */
    const head = queue.length && queue[0].ex === 'match' ? [queue.shift()] : [];
    const bucket = {};
    queue.forEach(x => { (bucket[x.ex] = bucket[x.ex] || []).push(x); });
    queue.length = 0;                      // la file est vidée : on la reconstruit étalée
    const spread = [];
    let last = head.length ? head[0].ex : NL.state.meta().lastEx || null;
    const left = () => Object.keys(bucket).filter(k => bucket[k].length);
    while (left().length) {
      const keys = left().sort((a, b) => bucket[b].length - bucket[a].length);
      const k = keys.find(x => x !== last) || keys[0];
      spread.push(bucket[k].shift());
      last = k;
    }
    queue.push.apply(queue, head.concat(spread));
    if (queue.length) NL.state.setMeta({ lastEx: queue[queue.length - 1].ex });

    if (queue.length === 0) { L = null; return false; }

    L = Object.assign(blankTurn(), {
      source: source || 'vandaag', queue: queue.slice(0, MAX_TASKS + 1), at: 0,
      phase: 'ask', right: 0, wrong: 0, spoken: 0, xp: 0, started: Date.now(), finished: false,
      newCount: fresh.length
    });
    return true;
  }

  const cur = () => L && L.queue[L.at];
  const active = () => !!(L && !L.finished);
  const abandon = () => { NL.speech.abort(); L = null; };

  function autoplay() {
    const c = cur();
    if (!c || NL.state.meta().autoplay === false) return;
    const ex = EX.get(c.ex);
    if (ex.auto) { const txt = ex.auto(c.task); if (txt) setTimeout(() => NL.speech.say(txt), 150); }
  }

  /* ---------------- grading ---------------- */
  function check() {
    const c = cur(); if (!c) return;
    const ex = EX.get(c.ex);
    if (!ex.ready(c.task, L)) return;
    const v = ex.judge(c.task, L);
    L.phase = v.ok ? 'ok' : 'no';
    L.lastSpoken = !!v.spoken;

    c.items.forEach(it => NL.srs.grade(it, v.ok, { spoken: v.spoken, ex: c.ex }));
    NL.srs.spend(1);

    if (v.ok) {
      L.right++;
      L.xp += c.ex === 'speak' ? 4 : 2;
      if (c.ex === 'speak') L.spoken++;
      NL.audio.ok();
    } else {
      L.wrong++;
      NL.audio.no();
      if (L.queue.length < MAX_TASKS + 6) L.queue.push({ ex: c.ex, task: c.task, items: c.items, retry: true });
    }
    NL.ui.render();
  }

  function next() {
    NL.speech.abort(); NL.speech.clearRecording();
    L.at++;
    Object.assign(L, blankTurn());
    L.phase = 'ask';
    if (L.at >= L.queue.length) return finish();
    NL.ui.render();
    autoplay();
  }

  function skip() {
    const c = cur(); if (!c) return;
    c.items.forEach(it => NL.srs.grade(it, false, { ex: c.ex }));
    NL.srs.spend(1);
    L.wrong++;
    L.phase = 'no';
    if (L.queue.length < MAX_TASKS + 6) L.queue.push({ ex: c.ex, task: c.task, items: c.items, retry: true });
    NL.audio.no();
    NL.ui.render();
  }

  function finish() {
    L.finished = true;
    const m = NL.state.meta();
    NL.state.setMeta({ xp: m.xp + L.xp });
    NL.state.creditDay(L.newCount);
    NL.audio.win();
    NL.ui.render();
  }

  /* ---------------- view ---------------- */
  function view() {
    const c = cur();
    const ex = EX.get(c.ex);
    const pct = Math.round(L.at / L.queue.length * 100);
    const it = c.items[0];
    const unit = NL.content.unit(it.unit);
    const stage = NL.srs.stageOf(it);

    return '<div class="lesson">' +
      '<div class="lesson-head">' +
      '<button class="iconbtn" data-act="quit" aria-label="' + NL.t.quitYes + '">' + NL.ui.I.x + '</button>' +
      '<div class="rail"><div class="rail-fill" style="width:' + Math.max(pct, 3) + '%"></div></div>' +
      '<span class="pill">' + (L.at + 1) + '/' + L.queue.length + '</span>' +
      '</div>' +

      '<div class="lesson-body"><div class="stage">' +
      '<div class="kicker"><span class="sub">' +
      esc(unit ? unit.name : 'Mes mots') +
      (c.retry ? ' · ' + NL.t.again2 : '') +
      '</span>' + esc(ex.kicker) + stagePips(stage, it) + '</div>' +
      ex.view(c.task, L, L.phase) +
      '</div></div>' +
      foot(c, ex) +
      '</div>';
  }

  function stagePips(stage, item) {
    const top = NL.srs.maxRung(item);
    const r = Math.max(0, stage);
    let s = '<span class="pips">';
    for (let i = 0; i < top; i++) s += '<i class="' + (i <= stage ? 'on' : '') + '"></i>';
    s += '<b>' + NL.t.rungs[Math.min(r, NL.t.rungs.length - 1)] + '</b>';
    return s + '</span>';
  }

  function foot(c, ex) {
    if (c.ex === 'match') {
      return '<div class="foot"><div class="foot-in">' +
        '<p class="foot-hint">' + NL.t.matchHint + '</p>' +
        '<button class="btn btn-ghost" data-skip="1">' + NL.t.skip + '</button></div></div>';
    }
    if (L.phase === 'ask') {
      const ready = ex.ready(c.task, L);
      return '<div class="foot"><div class="foot-in">' +
        '<button class="btn btn-ghost" data-skip="1">' + NL.t.skip + '</button>' +
        '<button class="btn btn-primary push" data-check="1"' + (ready ? '' : ' disabled') + '>' + NL.t.check + '</button>' +
        '</div></div>';
    }
    const ok = L.phase === 'ok';
    const ans = ex.answer(c.task);
    const it = c.items[0];
    const note = ok ? U.one(NL.t.praise)
      : NL.t.wrongTitle;
    const be = (it && it.be && NL.state.meta().showFlemish !== false) ? it.be : null;
    return '<div class="foot ' + (ok ? 'ok' : 'no') + '"><div class="foot-in">' +
      '<div class="verdict ' + (ok ? 'ok' : 'no') + '">' +
      '<span class="v-icon">' + (ok
        ? '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>'
        : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>') + '</span>' +
      '<div><h5>' + note + '</h5>' +
      (ans ? '<p><b>' + esc(ans) + '</b></p>' : '') +
      (be ? '<p class="v-be">' + NL.t.hereThey + ' <b>' + esc(be) + '</b></p>' : '') +
      (it && it.note ? '<p class="v-note">' + esc(it.note) + '</p>' : '') +
      '</div></div>' +
      '<button class="btn ' + (ok ? 'btn-good' : 'btn-bad') + ' push" data-next="1">' + NL.t.next + '</button>' +
      '</div></div>';
  }

  function emptyState() {
    return '<div class="lesson"><div class="lesson-head">' +
      '<button class="iconbtn" data-act="quit" aria-label="' + NL.t.back + '">' + NL.ui.I.x + '</button></div>' +
      '<div class="lesson-body"><div class="stage empty-stage">' +
      '<h2>' + NL.t.nothingDue + '</h2>' +
      '<p>' + NL.t.nothingDueBody + '</p>' +
      '<button class="btn btn-primary" data-go="leerpad">' + NL.t.nothingDueGo + '</button>' +
      '</div></div></div>';
  }

  function done() {
    const acc = (L.right + L.wrong) ? Math.round(L.right / (L.right + L.wrong) * 100) : 100;
    const mins = Math.max(1, Math.round((Date.now() - L.started) / 60000));
    const m = NL.state.meta();
    return '<div class="lesson"><div class="lesson-body"><div class="stage done-stage">' +
      '<div class="done-mark">' + (L.wrong === 0 ? '\u{1F3AF}' : '\u{2713}') + '</div>' +
      '<h2>' + (L.wrong === 0 ? NL.t.doneFlawless : NL.t.doneOk) + '</h2>' +
      '<p class="done-sub">' + (L.spoken > 0
        ? NL.t.doneSpoken(L.spoken)
        : NL.t.doneNoSpoken) + '</p>' +
      '<div class="tally">' +
      box('+' + L.xp, NL.t.tallyXp, 'gold') + box(acc + '%', NL.t.tallyRight, 'blue') +
      box(m.streak, NL.t.tallyDays, 'green') + box(mins + 'm', NL.t.tallyTime, '') +
      '</div>' +
      '<div class="done-actions">' +
      '<button class="btn btn-primary wide" data-act="again">' + NL.t.sessionMore + '</button>' +
      '<button class="btn btn-ghost wide" data-go="vandaag">' + NL.t.sessionBack + '</button>' +
      '</div></div></div></div>';
  }
  const box = (n, l, c) => '<div class="tally-box ' + c + '"><div class="t-n">' + n + '</div><div class="t-l">' + l + '</div></div>';

  /* ---------------- interaction ---------------- */
  function click(el, d) {
    if (d.act === 'quit') { if (L && !L.finished) NL.ui.openSheet('quit-session'); else { L = null; NL.ui.go('vandaag'); } return; }
    if (d.act === 'again') { L = null; start('vandaag'); NL.ui.render(); autoplay(); return; }
    if (d.check !== undefined) return check();
    if (d.next !== undefined) return next();
    if (d.skip !== undefined) return skip();
    if (!L || L.phase !== 'ask') return;

    const c = cur();
    if (d.opt !== undefined) {
      const i = +d.opt;
      if (c.task.opts && !c.task.opts[i]) return;   // no such option on screen
      L.sel = { i };
      NL.ui.render(); return;
    }
    if (d.pick !== undefined) { L.picked.push(+d.pick); NL.ui.render(); return; }
    if (d.unpick !== undefined) { L.picked = L.picked.filter(x => x !== +d.unpick); NL.ui.render(); return; }
    if (d.ins !== undefined) { L.input += d.ins; NL.ui.render(); return; }
    if (d.match !== undefined) return matchTap(d, c.task);
    if (d.mic !== undefined) return mic(d.mic, c.task);
    if (d.rec !== undefined) return recAction(d.rec, c.task);
    if (d.self !== undefined) {
      L.speech.selfRated = d.self === '1';
      NL.ui.render();
      return;
    }
  }

  function matchTap(d, task) {
    const id = d.match, k = +d.k, side = d.side;
    if (!L.matchSel) { L.matchSel = { id, k, side }; L.matchBad = null; NL.ui.render(); return; }
    if (L.matchSel.id === id) { L.matchSel = null; NL.ui.render(); return; }
    if (L.matchSel.side === side) { L.matchSel = { id, k, side }; NL.ui.render(); return; }
    if (L.matchSel.k === k) {
      L.matchGone.push(k); L.matchSel = null; NL.audio.ok();
      NL.speech.say(task.pairs[k].nl);
      if (L.matchGone.length >= task.pairs.length) { L.right++; L.xp += 2; setTimeout(next, 500); }
      NL.ui.render();
    } else {
      L.matchBad = id; L.matchSel = null; NL.audio.no();
      NL.ui.render();
      setTimeout(() => { if (L) { L.matchBad = null; NL.ui.render(); } }, 340);
    }
  }

  /* Record-and-compare: the speaking path when no recogniser exists. */
  function recAction(action, task) {
    const sp = L.speech;
    if (action === 'stop') { NL.speech.stopRecord(); return; }
    if (action === 'play') { NL.speech.playRecording(); return; }
    if (action === 'both') { NL.speech.playBoth(task.target); return; }

    sp.recState = 'rec'; sp.recErr = null;
    NL.audio.mic(); NL.ui.render();
    NL.speech.record({
      onstart: () => { sp.recTimer = setTimeout(() => NL.speech.stopRecord(), 7000); },
      onstop: () => {
        if (!L) return;
        clearTimeout(L.speech.recTimer);
        L.speech.recState = 'done';
        NL.ui.render();
      },
      onerror: kind => {
        if (!L) return;
        L.speech.recState = 'idle'; L.speech.recErr = kind;
        NL.ui.render();
      }
    });
  }

  function mic(action, task) {
    const sp = L.speech;
    if (action === 'stop') { NL.speech.abort(); sp.phase = 'idle'; NL.ui.render(); return; }
    sp.phase = 'listening'; sp.partial = ''; sp.error = null;
    NL.audio.mic();
    NL.ui.render();
    NL.speech.listen({
      onpartial: txt => { if (L && L.speech.phase === 'listening') { L.speech.partial = txt; NL.ui.render(); } },
      onerror: kind => {
        if (!L) return;
        L.speech.phase = 'idle'; L.speech.error = kind; L.speech.tries++;
        if (kind === 'denied' || kind === 'network' || kind === 'browser') L.speech.selfRated = null;
        NL.ui.render();
      },
      onend: (text, alts) => {
        if (!L || L.speech.phase !== 'listening') return;
        const res = NL.speech.score(alts && alts.length ? alts : [text], task.target);
        L.speech.phase = 'done';
        L.speech.tries++;
        L.speech.pct = res.pct;
        L.speech.parts = res.parts;
        L.speech.heard = res.heard;
        L.speech.ok = res.pass;
        if (res.pass) NL.audio.ok();
        NL.ui.render();
      }
    });
  }

  function input(el) {
    if (!el.classList.contains('textin') || !L) return;
    const c = cur(), ex = EX.get(c.ex);
    const before = ex.ready(c.task, L);
    L.input = el.value;
    const after = ex.ready(c.task, L);
    if (before !== after) {
      const btn = document.querySelector('[data-check]');
      if (btn) btn.disabled = !after;
    }
  }

  function key(e) {
    if (!L || L.finished) return;
    if (e.key === 'Enter') {
      e.preventDefault();
      if (L.phase === 'ask') check(); else next();
      return;
    }
    if (L.phase !== 'ask') return;
    const c = cur(); if (!c) return;
    const typing = document.activeElement && document.activeElement.tagName === 'INPUT';
    if (/^[1-9]$/.test(e.key) && !typing) {
      const i = +e.key - 1;
      const b = document.querySelector('[data-opt="' + i + '"]') || document.querySelectorAll('.bank .tile')[i];
      if (b && !b.disabled) { e.preventDefault(); b.click(); }
    }
    if (e.key === 'Backspace' && !typing && L.picked.length) { e.preventDefault(); L.picked.pop(); NL.ui.render(); }
    if (e.key === 'r' && !typing) { const s = document.querySelector('[data-say]'); if (s) { e.preventDefault(); s.click(); } }
    if (e.key === 'm' && !typing) { const s = document.querySelector('[data-mic]'); if (s) { e.preventDefault(); s.click(); } }
  }

  function after(a) {
    const inp = document.querySelector('.textin');
    if (inp && L && L.phase === 'ask') { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }

  return {
    render(a) {
      if (!L) {
        if (!start(a)) return emptyState();
        setTimeout(autoplay, 80);
      }
      if (L.finished) return done();
      return view();
    },
    click, input, key, after, active, abandon,
    /* Read-only, for the headless tests: they need the live task to answer it. */
    peek: () => cur(),
    begin(source) { L = null; if (start(source)) { setTimeout(autoplay, 60); return true; } return false; }
  };
})();
</script>
<script>
/* Aujourd'hui (la session du jour), Parcours (le programme) et Plus (le reste).
   Une décision par écran : l'action principale d'abord, le reste sous la ligne de flottaison. */
(function () {
  'use strict';
  const U = NL.util, esc = U.esc, t = NL.t;

  const pct = n => Math.max(0, Math.min(100, Math.round(n)));
  const bar = (p, cls) => '<span class="bar"><span class="bar-fill ' + (cls || '') + '" style="width:' + pct(p) + '%"></span></span>';

  /* ---------------------------------------------------- Aujourd'hui */
  NL.screens.vandaag = {
    render() {
      const m = NL.state.meta();
      const c = NL.srs.counts();
      const cp = NL.content.courseProgress();
      const p = NL.srs.plan();
      const fresh = p.fresh, total = p.total, mins = p.mins;
      const v = NL.speech.voiceInfo();

      let html = '<div class="wrap">';

      if (!m.placed && c.seen === 0) {
        html += '<section class="card lead">' +
          '<h1>' + t.firstTitle + '</h1>' +
          '<p>' + t.firstBody + '</p>' +
          '<div class="lead-actions">' +
          '<button class="btn btn-primary" data-go="placement">' + t.firstDoTest + '</button>' +
          '<button class="btn btn-ghost" data-act="skip-place">' + t.firstSkip + '</button>' +
          '</div></section>';
      }

      /* The one thing this screen is for. */
      html += '<section class="card session-card">' +
        '<span class="eyebrow">' + t.todayEyebrow + '</span>' +
        (total === 0
          ? '<h2>' + t.todayAllDone + '</h2><p class="sc-sub">' + t.todayAllDoneSub + '</p>' +
          '<button class="btn btn-blue wide big" data-go="praten">' + t.todayPractise + '</button>'
          : '<h2>' + t.todayReady(total) + '</h2>' +
          '<p class="sc-sub">' + t.todaySplit(Math.min(p.due, total - fresh), fresh, mins) + '</p>' +
          '<button class="btn btn-primary wide big" data-act="start">' + t.todayStart + '</button>') +
        '</section>';

      if (v.quality !== 'be') {
        html += '<button class="notice" data-go="doctor">' +
          '<b>' + (v.quality === 'nl' ? 'Voix du nord des Pays-Bas' : 'Aucune voix néerlandaise') + '</b>' +
          '<p>' + esc(v.note) + ' Touche ici pour tester et corriger.</p></button>';
      }

      html += '<div class="tri">' +
        stat(m.streak, t.statStreak(m.streak)) +
        stat(c.said, t.statSaid) +
        stat(cp.pct + '%', t.statCourse) +
        '</div>';

      html += '<h3 class="sec">' + t.morepractice + '</h3><div class="cards">';
      const scn = (NL.content.scenarios || []).filter(s => (m.scenariosDone || []).indexOf(s.id) < 0)[0] || NL.content.scenarios[0];
      html += tile(scn.icon, scn.title, scn.place, 'scn', scn.id);
      html += tile('\u{1F3A7}', t.listenTitle, t.listenUnderstandSub, 'go', 'luisteren');
      const sheet = NL.content.sheets[(m.doneToday || 0) > 0 ? 1 : 0];
      html += tile(sheet.icon, sheet.title, sheet.blurb, 'sheetid', sheet.id);
      html += '</div></div>';
      return html;
    },
    click(el, d) {
      if (d.act === 'start') { NL.screens.sessie.begin('vandaag'); NL.ui.go('sessie'); return; }
      if (d.act === 'skip-place') { NL.state.setMeta({ placed: true }); NL.ui.render(); return; }
      if (d.scn) { NL.ui.go('scenario', d.scn); return; }
      if (d.sheetid) { NL.ui.go('spiek', d.sheetid); return; }
    }
  };

  const stat = (n, l) => '<div class="stat-box"><div class="s-n">' + n + '</div><div class="s-l">' + esc(l) + '</div></div>';
  const tile = (icon, title, sub, key, val) =>
    '<button class="tile-card" data-' + key + '="' + esc(val) + '">' +
    '<span class="tc-icon">' + icon + '</span>' +
    '<span class="tc-body"><b>' + esc(title) + '</b><i>' + esc(sub) + '</i></span>' +
    '<span class="tc-cta">›</span></button>';

  /* ---------------------------------------------------- Parcours */
  NL.screens.leerpad = {
    render() {
      const cp = NL.content.courseProgress();
      let html = '<div class="wrap">' +
        '<section class="card lead slim">' +
        '<span class="eyebrow">' + t.pathEyebrow + '</span>' +
        '<h1>' + t.pathTitle + '</h1>' +
        '<p>' + t.pathBody + '</p>' +
        '<div class="prog-line">' + bar(cp.pct) + '<b>' + cp.pct + '%</b></div>' +
        '<p class="muted small">' + t.masteredOf(cp.mastered, cp.total) + '</p>' +
        '</section>';

      NL.content.units.forEach(u => {
        const open = NL.content.unitOpen(u.id);
        const isNow = cp.current && cp.current.id === u.id;
        const p = NL.content.unitProgress(u.id);
        const g = (u.grammar || []).map(id => (NL.content.patterns || []).find(x => x.id === id)).filter(Boolean);
        html += '<section class="unit-card' + (open ? '' : ' locked') + (isNow ? ' now' : '') + '">' +
          (isNow ? '<span class="now-tag">' + t.currentUnit + '</span>' : '') +
          '<div class="uc-head">' +
          '<span class="uc-icon">' + u.icon + '</span>' +
          '<div class="uc-title"><span class="eyebrow">Unité ' + u.n + ' · ' + u.level + ' · ' + trackName(u.track) + '</span>' +
          '<h2>' + esc(u.name) + '<i class="uc-nl">' + esc(u.nlName || '') + '</i></h2></div>' +
          '<span class="uc-pct" title="' + t.unitLevel(p.level) + '">' + p.pct + '%</span>' +
          '</div>' +
          '<p class="uc-blurb">' + esc(u.blurb) + '</p>' +
          '<div class="prog-line">' + bar(p.pct) + '<span class="muted small">' + t.metOf(p.met, p.total) + '</span></div>' +
          (open && !NL.content.unitComplete(u.id)
            ? '<p class="uc-gate">' + t.unitGate(p.gate, 80) + '</p>' : '') +
          (g.length ? '<div class="uc-gram">' + g.map(x =>
            '<button class="gram-chip" data-act="gram" data-id="' + x.id + '">' + esc(x.title) + '</button>').join('') + '</div>' : '') +
          (open
            ? '<button class="btn btn-blue" data-unit="' + u.id + '">' + (p.met ? t.unitPractise : t.unitStart) + '</button>'
            : '<p class="uc-lock">' + t.unitLocked(u.n - 1) + '</p>') +
          '</section>';
      });
      return html + '</div>';
    },
    click(el, d) {
      if (d.unit) { NL.screens.sessie.begin(d.unit); NL.ui.go('sessie'); return; }
      if (d.act === 'gram') {
        const g = (NL.content.patterns || []).find(x => x.id === el.dataset.id);
        if (g) NL.ui.openSheet({ custom: NL.ui.card(esc(g.title),
          '<p class="rule">' + esc(g.rule) + '</p><div class="explain">' + g.explain + '</div>' +
          '<div class="ex-list">' + g.drills.slice(0, 3).map(d2 =>
            '<button class="ex-row" data-say="' + esc(d2.nl) + '"><b>' + esc(d2.nl) + '</b><i>' + esc(d2.fr) + '</i></button>').join('') + '</div>',
          '<button class="btn btn-ghost wide" data-close="1">' + t.close + '</button>') });
      }
    }
  };
  const trackName = tr => tr === 'werk' ? t.trackWork : tr === 'leven' ? t.trackLife : t.trackBoth;

  /* ---------------------------------------------------- Plus */
  NL.screens.meer = {
    render() {
      const c = NL.srs.counts();
      const m = NL.state.meta();
      const byDay = {};
      NL.state.logs().forEach(l => { const d = U.dayKey(l.t); byDay[d] = (byDay[d] || 0) + 1; });
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const d = U.dayKey(Date.now() - i * U.DAY);
        days.push({ d, n: byDay[d] || 0 });
      }
      const maxN = Math.max(1, ...days.map(x => x.n));

      return '<div class="wrap">' +
        '<div class="cards">' +
        tile('\u{1F4D2}', t.wordsEyebrow, c.seen + ' vus, ' + c.mature + ' solides', 'go', 'woorden') +
        tile('\u{1F4CB}', t.sheetsEyebrow, t.sheetsTitle, 'go', 'spiek') +
        tile('\u{1F1E7}\u{1F1EA}', t.regEyebrow, t.regTitle, 'go', 'register') +
        tile('\u{1F444}', t.soundsEyebrow, t.soundsTitle, 'go', 'klanken') +
        tile('\u{1F517}', 'de / het', t.dehetTitle, 'go', 'dehet') +
        tile('\u{1F50A}', t.docEyebrow, t.docTitle, 'go', 'doctor') +
        tile('\u{1F4CF}', 'Test de niveau', m.placed ? 'Le refaire' : 'Pas encore fait', 'go', 'placement') +
        '</div>' +

        '<h3 class="sec">' + t.weekTitle + '</h3>' +
        '<section class="card"><div class="spark">' +
        days.map(x => '<div class="spark-col" title="' + x.d + ' : ' + x.n + '">' +
          '<div class="spark-bar" style="height:' + Math.max(4, x.n / maxN * 62) + 'px"></div>' +
          '<span>' + t.days[new Date(x.d).getDay()] + '</span></div>').join('') +
        '</div>' +
        '<div class="mini-stats">' +
        '<span><b>' + c.learning + '</b> ' + t.statLearning + '</span>' +
        '<span><b>' + c.mature + '</b> ' + t.statStrong + '</span>' +
        '<span><b>' + c.said + '</b> ' + t.statSpoken + '</span>' +
        '<span><b>' + (m.best || 0) + '</b> ' + t.statBest + '</span>' +
        '<span><b>' + m.xp + '</b> XP</span>' +
        '</div></section></div>';
    },
    click(el, d) { if (d.sheetid) NL.ui.go('spiek', d.sheetid); }
  };
})();
