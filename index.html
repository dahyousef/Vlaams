<script>
/* Le planificateur. C'est lui, et pas un arbre de leçons, qui décide.
   rung   = position sur l'échelle de production
   due    = quand l'élément revient
   budget = ce qui empêche la dette de révisions d'exploser */
NL.srs = (function () {
  'use strict';
  const { clamp, DAY, HOUR, dayKey } = NL.util;

  const MAX_TASKS = 22;             // les places d'une séance : un élément par place
  const MAX_STAGE = 6;
  const PRODUCE = 4;                // l'échelon de l'écrit est passé : l'élément se produit
  /* La part de chaque séance réservée à ce qui n'a jamais été rencontré. Sans
     elle, les révisions finissent par occuper toutes les places et plus rien de
     neuf n'arrive. Elle se calcule sur la SÉANCE, jamais sur le budget du jour :
     le budget vaut plusieurs séances, et en réserver 30 % dépasserait la séance. */
  const NEW_SHARE = 0.3, NEW_MIN = 4;
  /* Un élément rencontré revient une fois dans la même séance : il coûte donc
     deux exercices. Au-delà de la moitié des places, la séance doublerait. */
  const NEW_MAX = MAX_TASKS / 2;
  const RETIRE_AT = 200 * DAY;
  const MAX_INTERVAL = 365 * DAY;   // au-delà, l'élément est acquis, pas oublié      // au-delà, l'élément sort du paquet quotidien

  /* Tous les mots ne méritent pas la même montée. Le vocabulaire compris est
     toujours plus large que le vocabulaire produit : on comprend 4 000 mots, on
     en produit 1 500. Le palier dit jusqu'où un élément doit grimper.

     AUCUN élément ne déclare de palier, et c'est VOULU. Deux règles ont été
     étudiées et rejetées :
       - par fréquence : le corpus de sous-titres classe « de bakker », « de
         apotheek », « trager » et « goeiedag » comme rares. Ce sont exactement
         les mots qu'il faut savoir DIRE en Flandre ;
       - par ressemblance écrite : « speciaal », « de trein », « het water » ont
         l'air offerts et ne se prononcent pas du tout comme leur traduction.
         Se ressembler à l'écrit ne dit rien du son, et c'est le son que le
         barreau « à voix haute » travaille.
     Le mécanisme reste en place : il redeviendra utile quand il y aura de la
     lecture, donc du vocabulaire qu'on doit comprendre sans devoir le produire.
     Voir la spécification (issue #12) avant de le remplir. */
  const TIER_MAX = { produce: 6, write: 4, recognise: 2 };
  const maxRung = item => TIER_MAX[(item && item.tier) || 'produce'];

  /* Un rythme, et le prix honnête qui va avec. */
  const PACE = {
    calme:     { cap: 70,  mins: 15 },
    normal:    { cap: 120, mins: 25 },
    intensif:  { cap: 200, mins: 45 }
  };
  const pace = () => PACE[NL.state.meta().pace || 'normal'] || PACE.normal;

  /* Chaque échelon propose un ENSEMBLE de types, pas un seul. Avec quatorze
     passages par élément, la variété n'est pas un ornement : c'est la seule
     chose qui rend 26 000 exercices supportables. */
  /* Un cran plus exigeant : la découverte alterne les deux sens, et l'oreille
     (la dictée) arrive dès le deuxième barreau au lieu d'attendre le troisième. */
  /* « Dis-le » dès l'échelon 3 pour les mots, les phrases et les expressions :
     au seul échelon 5, la première demande à voix haute tombait cinq semaines
     après la rencontre. Voir exerciseFor() pour qui y a droit d'office, et
     firstAloud() pour ce que vaut cette première fois. */
  /* À l'échelon 3, l'exercice écrit se tape. C'est lui qui mène à l'échelon 4,
     où l'élément compte parmi ceux que l'on sait produire : choisir un trou,
     toucher la faute ou ranger des tuiles ne le prouve pas. La dictée d'un mot
     se tape, et le mot la garde à côté d'« écrire » : avec « écrire » seul, les
     exercices se suivaient pareils et l'étalement ne faisait plus mieux que le
     hasard (test/pace.js). Celle d'une phrase ou d'une expression se range en
     tuiles : les phrases empruntent donc « écrire » à l'échelon 4, et une
     règle de grammaire n'y garde qu'« écrire ». « Dis-le » reste où il était. */
  const RUNGS = {
    word: [
      ['pick', 'recall'],
      ['article', 'intrus', 'dictation'],
      ['dictation', 'type'],
      ['type', 'dictation', 'speak'],
      ['type', 'cloze', 'dictation'],
      ['speak'],
      ['speak', 'type', 'dictation', 'cloze']
    ],
    phrase: [
      ['pick', 'recall'],
      ['bank', 'vlaams', 'cloze'],
      ['cloze', 'corrige', 'dictation'],
      ['speak', 'type'],
      ['type', 'cloze', 'corrige'],
      ['speak'],
      ['speak', 'type', 'open', 'corrige', 'dictation']
    ],
    chunk: [
      ['pick', 'recall'],
      ['bank', 'vlaams'],
      ['cloze'],
      ['type', 'speak'],
      ['type', 'dictation', 'cloze'],
      ['speak'],
      ['speak', 'type', 'cloze']
    ],
    pattern: [
      ['order'],
      ['order', 'corrige'],
      ['cloze', 'corrige'],
      ['type'],
      ['speak', 'open'],
      ['speak'],
      ['open', 'speak']
    ]
  };

  /* Aucun intervalle enregistré ne descend sous un jour. Le renforcement quelques
     minutes après la rencontre existe toujours, mais c'est la séance en cours
     qui le fait (src/ui/session.js) : enregistré comme une échéance, il
     disputait les places de la séance à tout le reste. L'échéance tombe au début du jour
     local situé `interval` jours après la réponse, et jamais moins de huit heures après
     elle (#28) : un élément rencontré aujourd'hui revient demain, quelle que soit l'heure.
     Voir docs/adr/0001. */
  const STEP = [1 * DAY, 1 * DAY, 1 * DAY, 3 * DAY, 8 * DAY, 21 * DAY];

  /* Des jours civils, pas des durées : sinon celui qui étudie à la même heure ne trouve
     rien d'échu le lendemain, et la nuit du changement d'heure décale tout. Au sommet,
     l'intervalle grandit sans tomber juste sur des jours : il est arrondi au plus proche. */
  const dueAt = (now, interval) => {
    const [y, m, d] = dayKey(now).split('-').map(Number);
    const days = Math.max(1, Math.round(interval / DAY));
    return Math.max(new Date(y, m - 1, d + days).getTime(), now + 8 * HOUR);
  };

  const blank = (id, kind) => ({
    id, kind: kind || 'word', stage: 0, due: 0, interval: 0,
    ease: 2.5, reps: 0, lapses: 0, last: 0, said: false, retired: false, lastEx: null
  });
  const recOf = item => NL.state.rec(item.id) || blank(item.id, item.kind);

  /* ---------------- choix de l'exercice ---------------- */
  /* `avoid` = les types déjà servis dans cette séance. Le gouverneur évite ce que
     l'élément a eu la dernière fois, puis ce qui vient de passer.
     `quiet` = une séance où l'on ne peut pas parler : rien à voix haute. */
  function exerciseFor(item, avoid, quiet) {
    const r = recOf(item);
    /* Un mot transparent n'a pas besoin qu'on lui enseigne son sens : sa
       première rencontre se fait à l'échelon suivant. Rien d'autre n'est sauté —
       ressembler à un mot connu ne dit ni son article ni comment il sonne. */
    const rung = (r.reps === 0 && item.cognate) ? 1 : clamp(r.stage, 0, 6);
    const set = (RUNGS[item.kind] || RUNGS.word)[rung] || ['pick'];
    let usable = set.filter(n => supports(item, n));
    if (quiet) usable = usable.filter(n => n !== 'speak');
    if (!usable.length) usable = [fallback(item)];
    /* Un élément jamais dit à voix haute l'est dès que son échelon le propose.
       Tiré au sort parmi les exercices de l'échelon, « dis-le » ne tombait qu'une
       fois sur deux ou trois, et le reste attendait l'échelon 5. */
    if (!r.said && usable.indexOf('speak') >= 0) return 'speak';

    let pick = usable.filter(n => n !== r.lastEx);
    if (!pick.length) pick = usable;
    if (avoid && avoid.size) {
      const fresher = pick.filter(n => !avoid.has(n));
      if (fresher.length) pick = fresher;
    }
    return pick[(Math.random() * pick.length) | 0];
  }

  /* Un type n'est proposé que si l'élément peut réellement le porter. */
  function supports(item, name) {
    /* Un mot muni d'une phrase d'exemple peut porter les exercices de phrase :
       c'est la phrase qu'on remet en ordre, pas le mot tout seul. */
    const carrier = (item.drills && item.drills.length) ? item.drills[0].nl : (item.nl || '');
    const words = NL.util.tiles(carrier).length;
    switch (name) {
      case 'article': return !!item.art;
      case 'vlaams': return !!item.be && NL.util.norm(item.be) !== NL.util.norm(item.nl);
      case 'bank': case 'cloze': case 'order': case 'corrige': return words >= 3;
      case 'open': return !!item.open;
      case 'intrus': return item.kind === 'word' && !!item.art;
      default: return true;
    }
  }
  const fallback = item => (NL.util.tiles(item.nl || '').length >= 3 ? 'type' : 'pick');

  /* Vrai quand le prochain exercice de l'élément ne peut être que parlé : son
     échelon n'offre rien d'autre, ou bien il n'a jamais été dit et son échelon
     propose de le dire. Une séance où l'on ne peut pas parler laisse ces
     éléments attendre plutôt que de leur donner autre chose. */
  function needsVoice(item) {
    const r = recOf(item);
    const usable = ((RUNGS[item.kind] || RUNGS.word)[clamp(r.stage, 0, 6)] || []).filter(n => supports(item, n));
    return usable.indexOf('speak') >= 0 && (!r.said || usable.length === 1);
  }

  /* Vrai quand l'élément n'a jamais été dit et que son échelon propose de le
     dire à côté d'un autre exercice. Le dire ne déplace alors rien : réussi, il
     est dit et garde son échelon, et c'est l'exercice écrit qui suit, dans la
     même séance, qui le fait monter. Sans cela, lire un mot à voix haute
     suffirait à le compter parmi ceux que l'on sait produire. */
  function firstAloud(item) {
    const r = recOf(item);
    const usable = ((RUNGS[item.kind] || RUNGS.word)[clamp(r.stage, 0, 6)] || []).filter(n => supports(item, n));
    return !r.said && usable.length > 1 && usable.indexOf('speak') >= 0;
  }

  /* ---------------- notation ---------------- */
  function grade(item, ok, opts) {
    const r = recOf(item);
    const now = Date.now();
    const top = maxRung(item);
    r.kind = item.kind || r.kind;
    r.reps++; r.last = now;
    if (opts && opts.ex) r.lastEx = opts.ex;

    /* Dit pour la première fois, là où l'échelon propose aussi autre chose :
       l'élément est dit, et rien d'autre ne bouge. Un second exercice, en fin de
       séance, le redemande par écrit, et c'est cette réponse-là qui le fait
       monter. Si la séance s'arrête avant, il revient demain, par écrit. */
    const first = !!opts && opts.ex === 'speak' && firstAloud(item);
    if (ok && first && opts.spoken) {
      r.said = true;
      r.interval = STEP[0];
    } else if (ok) {
      if (opts && opts.spoken) r.said = true;
      /* Un transparent (de tram, de garage, direct) a été rencontré à l'échelon 1 :
         sa première réussite le mène donc à l'échelon 2. Un seul échelon sauté,
         celui du sens. Voir docs/adr/0004. */
      const jump = (r.reps === 1 && item.cognate) ? 2 : 1;
      r.stage = clamp(r.stage + jump, 0, top);
      /* Le défi ne fait pas passer à un élément jamais dit à voix haute le premier
         échelon où son genre le fait dire — le 3, et le 4 pour une règle de
         grammaire : son premier exercice parlé y vient encore. */
      const aloudAt = (RUNGS[item.kind] || RUNGS.word).findIndex(set => set.indexOf('speak') >= 0);
      if (opts && opts.defi && !r.said && aloudAt >= 0 && r.stage > aloudAt) r.stage = Math.max(aloudAt, r.stage - jump);
      r.ease = clamp(r.ease + 0.05, 1.3, 2.9);
      /* PIÈGE 1 — au sommet de son palier, l'intervalle doit continuer de croître.
         Figé sur STEP[rung], l'élément revient tous les jours, à vie. */
      r.interval = r.stage >= top
        ? Math.min(MAX_INTERVAL, Math.round((r.interval || STEP[Math.min(top, STEP.length - 1)]) * r.ease))
        : STEP[r.stage];
      if (r.stage >= top && r.interval > RETIRE_AT) r.retired = true;
    } else {
      r.lapses++;
      /* PIÈGE 2 — une rechute rentre dans l'échelle, elle ne repart pas du bas
         pour remonter en multipliant : sinon l'élément oscille sous son
         plafond sans jamais en sortir. */
      /* Jamais en dessous de l'échelon 1 : on ne te REPRÉSENTE pas un mot que tu
         connais depuis des mois, on te le redemande autrement. */
      /* Un exercice parlé raté tant que l'élément n'a jamais été dit ne coûte
         aucun échelon. La phrase est à l'écran : ce n'est pas un oubli, c'est la
         prononciation ou le micro, et redescendre de deux échelons renverrait
         l'élément se faire reconnaître. Il garde sa place et revient demain. */
      const unsaid = !r.said && !!opts && opts.ex === 'speak';
      if (!unsaid) {
        /* Un transparent ne tombe jamais à l'échelon 0 non plus : il serait alors
           interrogé sur le sens qu'on lui avait épargné (docs/adr/0004). */
        r.stage = clamp(r.stage - 2, (r.reps > 1 || item.cognate) ? 1 : 0, top);
        r.ease = clamp(r.ease - 0.2, 1.3, 2.9);
      }
      r.interval = unsaid ? STEP[0] : STEP[Math.min(r.stage, STEP.length - 1)];
      r.retired = false;
    }
    r.due = dueAt(now, r.interval);
    NL.state.setRec(r);
    NL.state.logReview({ id: item.id, t: now, ok: !!ok, stage: r.stage, kind: r.kind, ex: (opts && opts.ex) || null });
    return r;
  }

  /* Place un élément directement sur un échelon : c'est ainsi que les tests posent un état. */
  function seed(item, stage) {
    const r = blank(item.id, item.kind);
    r.stage = clamp(stage, 0, maxRung(item));
    r.reps = 1;
    r.interval = STEP[Math.min(r.stage, STEP.length - 1)];
    r.due = Date.now() + r.interval;
    NL.state.setRec(r);
    return r;
  }

  const isSeen = item => !!NL.state.rec(item.id);
  const stageOf = item => { const r = NL.state.rec(item.id); return r ? r.stage : -1; };
  const atTop = item => { const r = NL.state.rec(item.id); return !!r && r.stage >= maxRung(item); };

  /* Les vrais retards passent devant. Un arriéré tombé au même instant est
     départagé par un tirage qui dépend de l'élément et du nombre d'exercices
     faits aujourd'hui : il change d'une séance à l'autre, mais pas entre l'écran
     qui annonce la séance et la séance elle-même. */
  const tieBreak = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  function dueItems(now) {
    now = now || Date.now();
    const m = NL.state.meta();
    const salt = ':' + (m.exDay || '') + ':' + (m.exToday || 0);
    return NL.content.allItems()
      .filter(it => { const r = NL.state.rec(it.id); return r && !r.retired && r.due <= now; })
      .map(it => ({ it, due: NL.state.rec(it.id).due, k: tieBreak(it.id + salt) }))
      .sort((a, b) => a.due - b.due || a.k - b.k)
      .map(x => x.it);
  }

  function counts() {
    const now = Date.now();
    let due = 0, said = 0, retired = 0;
    NL.state.allRecs().forEach(r => {
      if (r.retired) { retired++; return; }
      if (r.due <= now) due++;
      if (r.said) said++;
    });
    return { due, said, retired, seen: NL.state.seenCount() };
  }

  /* ---------------- ce qui résiste ---------------- */
  /* Chaque réponse est enregistrée depuis le premier jour, et aucun écran ne
     l'avait jamais relue. Les éléments sont classés par nombre de réponses
     fausses sur les deux derniers mois, le plus raté d'abord. Un élément
     toujours réussi n'y figure pas ; une réponse qui nomme un élément disparu
     du cours est ignorée plutôt que de casser l'écran. */
  const MISS_WINDOW = 62 * DAY;
  function mistakes(now) {
    now = now || Date.now();
    const by = new Map();
    NL.state.logs().forEach(l => {
      if (!l || !l.id || l.t < now - MISS_WINDOW) return;
      const item = NL.content.byId(l.id);
      if (!item) return;
      /* Un refus de la reconnaissance vocale ne dit rien de la mémoire. */
      if (l.ex === 'speak') return;
      const x = by.get(l.id) || { item, wrong: 0, right: 0, last: 0 };
      if (l.ok) x.right++; else { x.wrong++; x.last = Math.max(x.last, l.t); }
      by.set(l.id, x);
    });
    return [...by.values()].filter(x => x.wrong > 0).sort((a, b) => b.wrong - a.wrong || b.last - a.last);
  }

  /* ---------------- budget quotidien ---------------- */
  /* Le seul mécanisme qui empêche la dette de révisions de transformer le mois six
     en deux heures par jour. Ce qui déborde attend, et ne s'affiche jamais comme
     un arriéré culpabilisant. */
  function budgetLeft() {
    const m = NL.state.meta();
    const today = NL.util.dayKey();
    const done = m.exDay === today ? (m.exToday || 0) : 0;
    return Math.max(0, pace().cap - done);
  }
  function spend(n) {
    const m = NL.state.meta();
    const today = NL.util.dayKey();
    NL.state.setMeta({ exDay: today, exToday: (m.exDay === today ? (m.exToday || 0) : 0) + (n || 1) });
  }

  /* Les n premiers éléments jamais rencontrés des unités ouvertes, dans l'ordre
     du cours. `uid` restreint à une unité. */
  function freshItems(n, uid) {
    const out = [];
    if (n <= 0) return out;
    const open = NL.content.frontier();
    const at = {};
    NL.content.units.forEach((u, i) => { at[u.id] = i; });
    /* Les mots que la personne a ajoutés passent devant le cours : rangés en fin
       de liste, ils attendaient que tout le reste ait été rencontré. */
    const all = NL.content.allItems();
    for (const it of all.filter(x => x.unit === 'eigen').concat(all.filter(x => x.unit !== 'eigen'))) {
      if (out.length >= n) break;
      if (NL.state.rec(it.id)) continue;
      if (uid && it.unit !== uid) continue;
      if (it.unit !== 'eigen' && !(at[it.unit] <= open)) continue;
      out.push(it);
    }
    return out;
  }

  /* LE seul endroit qui décide de ce qu'une séance contient. L'écran qui
     l'annonce et la séance elle-même posent tous deux la question ici : ils ne
     peuvent donc pas se contredire.
       source   'vandaag' (défaut) ou l'identifiant d'une unité
       opts     { quiet, without } : une séance où l'on ne peut pas parler laisse
                attendre ce qui ne peut être que dit, et ne reprend pas les
                éléments (`without`, un Set d'identifiants) qu'elle contient déjà
       → { due, fresh, left }   deux listes d'éléments, et le budget restant */
  function compose(source, now, opts) {
    const uid = source && source !== 'vandaag' ? source : null;
    /* Travailler une unité précise est un choix : le budget du jour ne la bride pas. */
    const left = uid ? Infinity : budgetLeft();
    const places = Math.min(MAX_TASKS, left);
    if (places <= 0) return { due: [], fresh: [], left };

    let due = dueItems(now);
    if (uid) due = due.filter(it => it.unit === uid);
    if (opts && opts.quiet) due = due.filter(it => !needsVoice(it) && !(opts.without && opts.without.has(it.id)));
    const unmet = freshItems(MAX_TASKS, uid);

    /* La réserve sort AVANT que les révisions remplissent le reste, et elle
       disparaît d'elle-même quand il ne reste rien à rencontrer. */
    const reserve = Math.min(unmet.length, places, Math.max(NEW_MIN, Math.ceil(places * NEW_SHARE)));
    let nDue = Math.min(due.length, places - reserve);
    let nNew = Math.min(unmet.length, Math.max(reserve, Math.min(NEW_MAX, Math.floor((places + reserve - nDue) / 2))));
    /* Les règles de grammaire sont neuf parmi quatre cents : sans siège garanti,
       une semaine entière peut passer sans en revoir une. */
    const pick = n => {
      const pats = due.filter(it => it.kind === 'pattern').slice(0, Math.min(2, n));
      return pats.concat(due.filter(it => pats.indexOf(it) < 0).slice(0, n - pats.length));
    };
    /* Budget presque épuisé : on rabote les révisions d'abord. La réserve survit
       au rabotage — c'est précisément ce qu'elle doit faire. Le coût se compte
       sur la séance servie : une rencontre, ou un élément dit pour la première
       fois, en vaut deux quand son second exercice trouve sa place (voir
       lace()), un seul sinon. */
    while (exercises(pick(nDue), unmet.slice(0, nNew)) > left && nDue > 0) nDue--;
    while (exercises(pick(nDue), unmet.slice(0, nNew)) > left && nNew > 1) nNew--;
    /* Le rabotage a pu prendre trop : les rencontres gardées, une révision de
       plus pèse parfois moins que ce qu'elle rend possible (le renforcement de
       chaque rencontre). On les rend une à une tant que la séance servie tient
       dans ce qui reste du jour. La réserve n'y est pas touchée. */
    while (nDue < due.length && nDue + nNew < places && exercises(pick(nDue + 1), unmet.slice(0, nNew)) <= left) nDue++;
    return { due: pick(nDue), fresh: unmet.slice(0, nNew), left };
  }

  /* ---------------- la disposition d'une séance ---------------- */
  /* Un second exercice — le renforcement d'une rencontre, ou l'écrit qui suit une
     première réponse à voix haute — ne vient qu'avec au moins SECOND_GAP exercices
     entre lui et le dernier exercice de son élément : écrire un mot qu'on vient
     de voir à l'écran ne prouve rien. Là où cet écart ne tient pas, il n'est pas
     servi, et l'élément reste comme après une séance quittée entre les deux :
     il revient le lendemain. Une reprise après une réponse fausse est une
     correction, non un second exercice : cet écart ne la lie pas. */
  const SECOND_GAP = 3;
  const apart = (first, at) => at - first > SECOND_GAP;

  /* Tresse les rencontres, les révisions et les seconds exercices. C'est LA
     disposition d'une séance : plan() la compte sur les éléments, la séance la
     remplit avec leurs exercices.
       meetings, reviews  les premiers exercices, dans l'ordre
       toSay(x)           vrai pour une première réponse à voix haute
       second(x)          ce qui tient la place du second exercice de x
     Les renforcements se glissent à intervalles réguliers dans ce qui suit leur
     rencontre : groupés en fin de séance, ils formeraient une longue file du même
     exercice. L'écrit qui suit une première réponse à voix haute ferme la séance,
     le plus loin possible d'elle ; trois révisions ordinaires sont gardées pour la
     fin, afin qu'il ne la suive jamais aussitôt. Ce qui n'a pas trouvé sa place à
     la fin n'est pas servi. La longueur ne dépend que du nombre de rencontres, de
     premières fois et de révisions ordinaires, jamais de leur ordre : l'annonce
     et la séance comptent donc la même chose. */
  function lace(meetings, reviews, toSay, second) {
    const plain = reviews.filter(x => !toSay(x)).slice(-SECOND_GAP);
    const base = meetings.concat(reviews.filter(x => plain.indexOf(x) < 0), plain);
    const every = Math.max(1, Math.floor(base.length / Math.max(1, meetings.length)));
    const out = [], waiting = [], aloud = [];
    let i = 0, since = 0;
    while (i < base.length || waiting.length) {
      if (waiting.length && apart(waiting[0].at, out.length) && (i >= base.length || since >= every)) {
        out.push(second(waiting.shift().x)); since = 0;
        continue;
      }
      if (i >= base.length) break;
      const x = base[i];
      if (i < meetings.length) waiting.push({ at: out.length, x });
      else if (toSay(x)) aloud.push({ at: out.length, x });
      out.push(x); i++; since++;
    }
    aloud.forEach(a => { if (apart(a.at, out.length)) out.push(second(a.x)); });
    return out;
  }

  /* Ce qu'une séance coûte en exercices : la longueur de sa disposition. Une
     rencontre en coûte deux, une première fois à voix haute aussi, quand leur
     second exercice trouve sa place ; une seule sinon. */
  const exercises = (due, fresh) => lace(fresh, due, firstAloud, x => x).length;

  /* Ce que l'écran d'accueil annonce : les comptes de compose(), rien d'autre.
       total = éléments ; tasks = exercices, comptés par exercises() */
  function plan() {
    const c = compose('vandaag');
    const tasks = exercises(c.due, c.fresh);
    return {
      due: c.due.length, fresh: c.fresh.length, total: c.due.length + c.fresh.length,
      tasks, left: c.left, mins: Math.max(1, Math.round(tasks * 0.22)),
      units: unitSpan(c.due.concat(c.fresh))
    };
  }

  /* Les unités que couvre une liste d'éléments : la première et la dernière. */
  function unitSpan(items) {
    const ns = [];
    items.forEach(it => { const u = NL.content.unit(it.unit); if (u) ns.push(u.n); });
    return ns.length ? { from: Math.min.apply(null, ns), to: Math.max.apply(null, ns) } : null;
  }

  return {
    RUNGS, STEP, PACE, MAX_STAGE, MAX_TASKS, PRODUCE, NEW_SHARE, NEW_MIN, NEW_MAX, TIER_MAX, RETIRE_AT,
    maxRung, pace, exerciseFor, firstAloud, needsVoice, supports, grade, seed, isSeen, stageOf, atTop,
    dueItems, counts, freshItems, compose, plan, unitSpan, mistakes, recOf, budgetLeft, spend,
    SECOND_GAP, apart, lace
  };
})();
</script>
<script>
/* Speech in both directions, degrading honestly when the browser cannot help. */
NL.speech = (function () {
  'use strict';
  const { norm, words, diffWords, ratio } = NL.util;

  /* Words a recogniser may drop without changing what you said. Negation
     (niet, geen, nooit) and place words are deliberately absent — losing those
     inverts the sentence. */
  const FUNCTION_WORDS = new Set(['de', 'het', 'een', 'ik', 'je', 'jij', 'ge', 'gij', 'u',
    'hij', 'zij', 'ze', 'wij', 'we', 'er', 'en', 'in', 'op', 'aan', 'te', 'van', 'met',
    'voor', 'bij', 'naar', 'dat', 'dit', 'is', 'om', 'zo', 'ook', 'wel', 'eens', 'hè', 'al']);

  /* ---------------- out: text to speech ---------------- */
  let voices = [], pool = [], chosen = null, localPick = null, quality = 'none';

  /* Windows ships two generations of Dutch voices side by side: the old local
     ones (Bart) and the neural ones rendered server-side (Dena, Arnaud, marked
     "Natural" or "Online"). The neural ones are worth having, but they go silent
     without a connection — so the best local voice is kept as the understudy. */
  const natural = v => /natural|neural|online/i.test(v.name || '');
  const rank = (a, b) => (natural(b) - natural(a)) || ((b.localService ? 0 : 1) - (a.localService ? 0 : 1));

  function scan() {
    if (!('speechSynthesis' in window)) return;
    voices = speechSynthesis.getVoices() || [];
    const be = voices.filter(v => /^nl[-_]BE/i.test(v.lang));
    const nl = voices.filter(v => /^nl/i.test(v.lang));
    pool = (be.length ? be : nl).slice().sort(rank);
    quality = be.length ? 'be' : nl.length ? 'nl' : (voices.length ? 'none' : 'unknown');
    chosen = pool[0] || null;
    localPick = pool.filter(v => v.localService)[0] || null;
  }

  /* Hors ligne, une voix neuronale ne rend rien du tout : on bascule sur la voix
     locale plutôt que de laisser l'exercice muet. */
  function voiceNow() {
    const off = typeof navigator !== 'undefined' && navigator.onLine === false;
    if (off && chosen && !chosen.localService && localPick) return localPick;
    return chosen;
  }
  if ('speechSynthesis' in window) {
    scan();
    speechSynthesis.addEventListener('voiceschanged', scan);
  }

  const canSpeak = () => 'speechSynthesis' in window;
  const voiceInfo = () => ({
    quality,                                  // 'be' | 'nl' | 'none' | 'unknown'
    name: voiceNow() ? voiceNow().name : null,
    lang: voiceNow() ? voiceNow().lang : null,
    noteKey: quality === 'be' ? 'voiceNoteBe'
      : quality === 'nl' ? 'voiceNoteNl'
        : 'voiceNoteNone'
  });

  let lastSpoken = 0;
  function say(text, opts) {
    opts = opts || {};
    if (!canSpeak() || !text) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text));
      const v = voiceNow();
      u.lang = quality === 'be' ? 'nl-BE' : 'nl-NL';
      if (v) u.voice = v;
      u.rate = opts.rate || 1;
      u.pitch = 1;
      if (opts.onend) u.onend = opts.onend;
      lastSpoken = Date.now();
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  const stop = () => { try { speechSynthesis.cancel(); } catch (e) {} };

  /* ---------------- in: speech recognition ---------------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;

  const UA = (typeof navigator !== 'undefined' && navigator.userAgent) || '';
  /* Opera defines webkitSpeechRecognition but ships no service behind it: calls
     fail silently or report a network error, which would otherwise be reported to
     the user as "check your connection". Treat it as having none. */
  const OPERA = /OPR\/|Opera/i.test(UA);

  /* Même mensonge sur iPhone : Apple n'active la reconnaissance que dans Safari
     lui-même. Chrome, Edge et Firefox y sont Safari déguisé — ils exposent
     webkitSpeechRecognition et répondent « service-not-allowed ». Sans ça, l'app
     promettrait un micro qui ne répond jamais. */
  const IOS = /iPad|iPhone|iPod/.test(UA) ||
    (/Macintosh/.test(UA) && typeof navigator !== 'undefined' && navigator.maxTouchPoints > 1);
  const IOS_SHELL = IOS && /CriOS|EdgiOS|FxiOS|OPiOS|OPT\//.test(UA);
  const NO_SERVICE = OPERA || IOS_SHELL;
  /* Pourquoi il n'y a pas de service : l'interface n'explique pas iOS comme Opera. */
  const noService = () => OPERA ? 'opera' : IOS_SHELL ? 'ios' : null;

  function browserName() {
    if (OPERA) return 'Opera';
    if (/CriOS/.test(UA)) return 'Chrome (iPhone)';
    if (/EdgiOS/.test(UA)) return 'Edge (iPhone)';
    if (/FxiOS/.test(UA)) return 'Firefox (iPhone)';
    if (/Edg\//.test(UA)) return 'Edge';
    if (/Firefox\//.test(UA)) return 'Firefox';
    if (/Chrome\//.test(UA)) return 'Chrome';
    if (/Safari\//.test(UA)) return 'Safari';
    return NL.t.browserYours;
  }

  const canListen = () => !!SR && !NO_SERVICE && navigator.onLine !== false;
  const listenBlocked = () => (!SR || NO_SERVICE) ? 'browser' : navigator.onLine === false ? 'offline' : null;

  /* Un refus du micro se retient : sans ça, le docteur audio annonce « la
     reconnaissance fonctionne » juste après que le navigateur l'a refusée. Une
     écoute ou un enregistrement réussi l'efface. */
  let refused = false;
  const micRefused = () => refused;

  let active = null;
  function listen(opts) {
    opts = opts || {};
    if (!SR) { opts.onerror && opts.onerror('browser'); return null; }
    abort();
    let r;
    try { r = new SR(); } catch (e) { opts.onerror && opts.onerror('browser'); return null; }
    r.lang = 'nl-BE';
    r.interimResults = true;
    r.maxAlternatives = 5;
    r.continuous = false;

    let finalText = '', alts = [];
    r.onresult = e => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const res = e.results[i];
        if (res.isFinal) {
          finalText += res[0].transcript + ' ';
          for (let k = 0; k < res.length; k++) alts.push(res[k].transcript);
        } else {
          opts.onpartial && opts.onpartial(res[0].transcript);
        }
      }
    };
    r.onerror = e => {
      const kind = e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'denied'
        : e.error === 'no-speech' ? 'silence'
          : e.error === 'network' ? 'network' : e.error || 'error';
      active = null;
      if (kind === 'denied') refused = true;
      opts.onerror && opts.onerror(kind);
    };
    r.onend = () => {
      active = null;
      if (finalText.trim()) refused = false;
      opts.onend && opts.onend(finalText.trim(), alts);
    };

    try { r.start(); active = r; } catch (e) { opts.onerror && opts.onerror('error'); return null; }
    return r;
  }
  function abort() { if (active) { try { active.abort(); } catch (e) {} active = null; } }

  /* ---------------- record and compare ----------------
     Opera has no recognition service, so scoring is impossible there. Recording
     yourself and playing it against the model needs no service at all, works
     offline, and is how language labs worked for fifty years. */
  let mediaRec = null, chunks = [], lastUrl = null;
  const canRecord = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  const hasRecording = () => !!lastUrl;

  function record(opts) {
    opts = opts || {};
    if (!canRecord()) { opts.onerror && opts.onerror('browser'); return; }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      refused = false;
      chunks = [];
      let mr;
      try { mr = new MediaRecorder(stream); }
      catch (e) { try { mr = new MediaRecorder(stream, { mimeType: 'audio/webm' }); } catch (e2) { opts.onerror && opts.onerror('format'); return; } }
      mediaRec = mr;
      mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      mr.onstop = () => {
        stream.getTracks().forEach(tr => tr.stop());
        if (lastUrl) URL.revokeObjectURL(lastUrl);
        try {
          lastUrl = URL.createObjectURL(new Blob(chunks, { type: mr.mimeType || 'audio/webm' }));
        } catch (e) { lastUrl = null; }
        mediaRec = null;
        opts.onstop && opts.onstop(lastUrl);
      };
      mr.start();
      opts.onstart && opts.onstart();
    }).catch(err => {
      /* In an embedded frame the permission may never even be offered. */
      const name = err && err.name;
      if (name === 'NotAllowedError') refused = true;
      opts.onerror && opts.onerror(
        name === 'NotAllowedError' ? (window.self !== window.top ? 'framed' : 'denied')
          : name === 'NotFoundError' ? 'nomic' : 'blocked');
    });
  }
  function stopRecord() { try { if (mediaRec && mediaRec.state !== 'inactive') mediaRec.stop(); } catch (e) {} }
  function playRecording(onend) {
    if (!lastUrl) return null;
    const a = new Audio(lastUrl);
    if (onend) a.onended = onend;
    a.play().catch(() => {});
    return a;
  }
  /* Model first, then your own voice, with a beat between them. */
  function playBoth(text) {
    say(text, { onend: () => setTimeout(() => playRecording(), 350) });
  }
  function clearRecording() {
    if (lastUrl) { URL.revokeObjectURL(lastUrl); lastUrl = null; }
  }

  /* ---------------- scoring ---------------- */
  /* Scores the best of the alternatives the recogniser offered, so a single
     misheard word does not sink an otherwise correct sentence. */
  function score(heardList, target) {
    const cands = (Array.isArray(heardList) ? heardList : [heardList]).filter(Boolean);
    if (!cands.length) return { pct: 0, parts: diffWords('', target), heard: '', pass: false };
    let best = null;
    cands.forEach(h => {
      const parts = diffWords(h, target);
      const hit = parts.filter(p => p.ok).length;
      const extra = Math.max(0, words(h).length - words(target).length);
      const pct = Math.round(Math.max(0, hit / Math.max(1, parts.length) - extra * 0.06) * 100);
      if (!best || pct > best.pct) best = { pct, parts, heard: h };
    });
    /* Passing is not a percentage. Recognisers routinely swallow small
       grammatical words without it meaning you said the sentence wrong, so those
       are forgiven — but a missed content word changes what you said, and a
       percentage bar would happily let "ik ben Frans aan het leren" through. */
    const missed = best.parts.filter(p => !p.ok).map(p => norm(p.word));
    const slack = Math.max(1, Math.floor(words(target).length / 6));
    best.pass = norm(best.heard) === norm(target) || missed.length === 0 ||
      (missed.every(m => FUNCTION_WORDS.has(m)) && missed.length <= slack);
    best.missed = missed;
    return best;
  }

  /* Which tier this browser puts you in — the audio doctor reports this. */
  function tier() {
    const framed = window.self !== window.top;
    if (refused) return { id: 'refused', framed };
    /* « Noté, accent du nord » suppose une voix des Pays-Bas. Sans aucune voix
       néerlandaise, c'est un autre niveau, et il faut le dire. */
    if (canListen() && quality === 'be') return { id: 'full', framed };
    if (canListen() && quality === 'nl') return { id: 'scored', framed };
    if (canListen()) return { id: 'novoice', framed };
    if (canRecord()) return { id: 'compare', framed };
    return { id: 'self', framed };
  }

  return {
    canSpeak, say, stop, voiceInfo, rescanVoices: scan, voices: () => voices,
    canListen, listenBlocked, noService, listen, abort, score, ratio, micRefused,
    canRecord, hasRecording, record, stopRecord, playRecording, playBoth, clearRecording, tier, browserName
  };
})();
</script>
<script>
/* Interface sounds. Synthesised, so nothing to download and nothing to cache. */
NL.audio = (function () {
  'use strict';
  let ctx = null;
  const on = () => NL.state.meta().sfx !== false;

  function tone(seq, type) {
    if (!on()) return;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      seq.forEach(([f, t, v]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type || 'sine';
        o.frequency.setValueAtTime(f, ctx.currentTime + t);
        g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(v || 0.12, ctx.currentTime + t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.2);
        o.connect(g); g.connect(ctx.destination);
        o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.24);
      });
    } catch (e) {}
  }

  return {
    ok:   () => tone([[620, 0], [880, 0.08]]),
    no:   () => tone([[190, 0], [140, 0.09]], 'sawtooth'),
    win:  () => tone([[523, 0], [659, 0.08], [784, 0.16], [1047, 0.24]]),
    tick: () => tone([[440, 0, 0.05]]),
    mic:  () => tone([[880, 0, 0.07], [1175, 0.06, 0.07]])
  };
})();
</script>
<script>
/* Synchronisation avec Supabase.

   L'appareil reste la source de vérité immédiate : chaque écriture part d'abord
   dans IndexedDB, comme avant, puis dans une boîte d'envoi persistée. La boîte
   se vide vers la base dès qu'il y a du réseau. Dans le train, rien ne change ;
   au retour, tout rattrape.

   Conflits : par élément, la révision la plus récente gagne. Pour les réglages,
   une fusion champ par champ — l'XP d'un appareil ne doit pas effacer celle de
   l'autre.

   Sans configuration (pas d'URL Supabase au build), tout ce module est inerte et
   l'app fonctionne en local exactement comme avant. */
NL.sync = (function () {
  'use strict';
  const cfg = window.NL_CONFIG || {};
  const lib = window.supabase;
  const enabled = !!(cfg.supabaseUrl && cfg.supabaseAnonKey && lib && lib.createClient);

  const QKEY = 'vlaams/outbox';
  const OWNER = 'vlaams/owner';
  const PAGE = 1000;
  const LOG_DAYS = 62;            // deux mois : ce que l'écran des fautes relit

  let client = null, user = null;
  let state = enabled ? 'idle' : 'off';     // off | idle | syncing | error | offline
  let lastSync = null, lastError = null, timer = null, flushing = null;
  const subs = [];

  /* ---------------- boîte d'envoi ---------------- */
  const empty = () => ({ recs: {}, customs: {}, meta: false, logs: [], reset: 0 });
  let box = load();
  function load() {
    try { return Object.assign(empty(), JSON.parse(localStorage.getItem(QKEY) || '{}')); }
    catch (e) { return empty(); }
  }
  function persist() { try { localStorage.setItem(QKEY, JSON.stringify(box)); } catch (e) {} }
  const pending = () => Object.keys(box.recs).length + Object.keys(box.customs).length +
    (box.meta ? 1 : 0) + box.logs.length + (box.reset ? 1 : 0);

  const owner = () => { try { return localStorage.getItem(OWNER); } catch (e) { return null; } };
  const setOwner = id => { try { id ? localStorage.setItem(OWNER, id) : localStorage.removeItem(OWNER); } catch (e) {} };

  function notify() { subs.forEach(fn => { try { fn(status()); } catch (e) {} }); }
  const onChange = fn => subs.push(fn);

  /* Chaque écriture locale atterrit ici. On ne garde que la dernière version
     d'un élément : dix révisions hors ligne ne font qu'une ligne à envoyer. */
  NL.state.onWrite((type, v) => {
    if (!enabled) return;
    if (type === 'rec') box.recs[v.id] = 1;
    else if (type === 'meta') box.meta = true;
    else if (type === 'custom') box.customs[v.id] = 1;
    else if (type === 'custom-del') box.customs[v] = 'deleted';
    else if (type === 'log') { box.logs.push(v); if (box.logs.length > 5000) box.logs.shift(); }
    /* Une remise à zéro : ce qui en descendait n'est plus à envoyer, et le
       serveur devra effacer la même chose avant d'être relu. Sans compte, elle
       reste sur l'appareil : à la connexion suivante, elle effacerait sinon
       tout l'historique du compte, sur le serveur et sur chacun de ses appareils.
       Connecté mais pas encore rattaché, elle est déjà celle du compte. */
    else if (type === 'reset') {
      if (owner() || user) box.reset = Math.max(box.reset || 0, v);
      prune(v); box.meta = true;
    }
    persist();
    schedule();
  });

  /* Ce qu'une remise à zéro retire de la boîte : les fiches effacées, et les
     lignes de journal qui descendent d'avant la coupe. Ce qui a été écrit
     depuis — une progression anonyme, par exemple — attend son envoi. */
  function prune(cut) {
    Object.keys(box.recs).forEach(id => { if (!NL.state.rec(id)) delete box.recs[id]; });
    box.logs = box.logs.filter(l => ((l && l.base) || 0) >= cut);
  }

  function queueAll() {
    NL.state.allRecs().forEach(r => { box.recs[r.id] = 1; });
    NL.state.customs().forEach(c => { box.customs[c.id] = 1; });
    NL.state.logs().forEach(l => box.logs.push(l));
    box.meta = true;
    persist();
  }

  function schedule(ms) {
    if (!user) return;
    clearTimeout(timer);
    timer = setTimeout(() => flush(), ms == null ? 2500 : ms);
  }

  /* ---------------- connexion ---------------- */
  async function init() {
    if (!enabled) return null;
    client = lib.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'pkce' }
    });
    client.auth.onAuthStateChange((event, session) => {
      const next = session && session.user;
      if (event === 'SIGNED_IN' && next && (!user || user.id !== next.id)) {
        user = next;
        adopt().then(() => { notify(); if (NL.ui && NL.ui.onAuth) NL.ui.onAuth(); });
      }
      if (event === 'SIGNED_OUT') { user = null; notify(); }
    });
    try {
      const { data } = await client.auth.getSession();
      user = data && data.session ? data.session.user : null;
    } catch (e) { user = null; }
    if (user) adopt().then(notify, notify);   // l'interface s'affiche sans attendre le réseau
    window.addEventListener('online', () => { state = 'idle'; notify(); if (!reattach()) flush(); });
    window.addEventListener('offline', () => { state = 'offline'; notify(); });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') flush();
      else if (user && !reattach()) pull().then(() => flush());   // retour sur l'onglet : rattraper les autres appareils
    });
    setInterval(() => { if (!reattach()) flush(); }, 60000);
    return user;
  }

  /* Connecté mais pas rattaché : l'adoption a échoué sur le réseau. Chaque
     occasion de synchroniser la retente ; sinon la synchro resterait éteinte
     jusqu'au prochain chargement. Rend vrai quand une adoption est en route. */
  function reattach() {
    if (!user || attached()) return false;
    adopt().then(notify, notify);
    return true;
  }

  /* Rattache les données de cet appareil au compte connecté.
     - appareil vierge ou déjà à ce compte : on tire puis on pousse ;
     - progression anonyme : elle est adoptée par le compte ;
     - un AUTRE compte avait utilisé cet appareil : ses données sont effacées
       d'abord, pour ne jamais mélanger deux personnes. */
  /* Le retour du lien magique déclenche à la fois l’événement de connexion et
     getSession : un seul rattachement par compte. */
  let adopting = null, adoptedFor = null;
  /* Le compte auquel CETTE page a rattaché l'appareil. Distinct de vlaams/owner :
     si l'écriture de celui-ci échoue, la page reste rattachée au lieu de refaire
     l'adoption à chaque occasion — ou d'attendre, depuis pull(), l'adoption même
     qui l'appelle. */
  let attachedTo = null;
  function adopt() {
    if (adoptedFor === user.id && adopting) return adopting;
    adoptedFor = user.id;
    adopting = doAdopt().catch(e => { adoptedFor = null; throw e; });
    return adopting;
  }
  async function doAdopt() {
    const prev = owner();
    if (prev && prev !== user.id) {
      await NL.state.clearAll();
      box = empty(); persist();
    } else if (!prev) {
      /* La progression anonyme rejoint le compte telle quelle : elle descend
         désormais de la dernière remise à zéro du compte, si bien qu'une remise
         à zéro du compte ne l'efface pas, et qu'une remise à zéro faite ici
         sans compte ne passe pas au compte. Même sans rien à adopter : une
         remise à zéro faite sans compte ne laisse souvent rien sur l'appareil,
         mais son instant passerait au compte par la fusion des réglages. Les
         lignes déjà dans la boîte sont rebasées aussi : après un rechargement,
         ce sont d'autres objets que celles du journal. */
      let remote;
      try { remote = await readMeta(); }
      catch (e) { adoptedFor = null; fail(e); return; }   // rien n'est rattaché : reattach() réessaiera
      /* Une remise à zéro pressée connecté, avant ce rattachement, est celle du
         compte : le rebasage ne la défait pas. */
      const at = Math.max((remote && remote.resetAt) || 0, box.reset || 0, NL.state.ENGINE_EPOCH);
      NL.state.rebase(at);
      box.logs.forEach(l => { if (l && typeof l === 'object') l.base = at; });
      if (NL.state.seenCount() + NL.state.customs().length > 0) queueAll();
    }
    setOwner(user.id); attachedTo = user.id;
    await pull();
    await flush();
  }

  /* Tant que l'appareil n'est pas rattaché au compte connecté, rien ne part ni
     n'arrive : sa progression n'a pas encore été rebasée sur celle du compte,
     et une remise à zéro faite sans compte partirait avec elle. */
  const attached = () => !!user && attachedTo === user.id;

  async function signIn(email) {
    if (!enabled) return { error: 'off' };
    const { error } = await client.auth.signInWithOtp({
      email, options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: true }
    });
    return { error: error ? error.message : null };
  }

  /* Le code à six chiffres : indispensable quand le lien s'ouvre dans un autre
     navigateur que celui où tu l'as demandé — cas courant avec Outlook. */
  async function verifyCode(email, token) {
    if (!enabled) return { error: 'off' };
    const { data, error } = await client.auth.verifyOtp({ email, token: String(token).trim(), type: 'email' });
    if (error) return { error: error.message };
    if (data && data.user && (!user || user.id !== data.user.id)) { user = data.user; await adopt(); notify(); }
    return { error: null };
  }

  /* Déconnexion : on envoie ce qui reste, puis on efface l'appareil. La personne
     suivante ne voit rien de la progression ; seule la langue d'affichage reste
     (clearAll la garde, sans updatedAt). Le compte suivant en hérite s'il n'en a
     pas, et l'envoie ; s'il en a une, c'est la sienne qui l'emporte. Pas encore
     rattaché, ce qui a été fait ici n'est pas encore au compte : on le
     rattache d'abord. */
  async function signOut() {
    if (!enabled || !user) return;
    if (!attached()) { try { await adopt(); } catch (e) {} }
    try { await flush(); } catch (e) {}
    await client.auth.signOut();
    await NL.state.clearAll();
    box = empty(); persist(); setOwner(null);
    user = null; adopting = null; adoptedFor = null; attachedTo = null; notify();
  }

  /* ---------------- tirer ---------------- */
  /* Les lectures se bornent au compte comme les effacements : la politique de
     sécurité des lignes le fait déjà, ce filtre le fait encore si elle tombe. */
  async function selectAll(table, filter) {
    const rows = [];
    for (let from = 0; ; from += PAGE) {
      let q = client.from(table).select('*').eq('user_id', user.id);
      if (filter) q = filter(q);
      const { data, error } = await q.range(from, from + PAGE - 1);
      if (error) throw error;
      rows.push.apply(rows, data || []);
      if (!data || data.length < PAGE) return rows;
    }
  }

  /* Les remises à zéro passent AVANT tout le reste, dans les deux sens.
     La nôtre d'abord : le serveur efface ce que cet appareil a effacé, sinon la
     lecture qui suit le lui rendrait. Puis celle des autres : si le serveur
     porte une remise à zéro plus récente, la copie locale est périmée et rien
     d'elle ne doit repartir. Rend les réglages du serveur, déjà lus. */
  async function settleResets() {
    if (box.reset) {
      await eraseBefore(box.reset);
      box.reset = 0; box.meta = true; persist();
    }
    const remote = await readMeta();
    /* Des réglages de l'ancien moteur : personne n'a encore migré ce compte. Le
       premier appareil qui les voit efface ce que la migration aurait effacé. */
    if (remote && attached() && (!remote.progress || (remote.dataVersion || 1) < 3)) {
      await eraseBefore(NL.state.ENGINE_EPOCH);
    }
    if (remote && (remote.resetAt || 0) > (NL.state.meta().resetAt || 0)) {
      NL.state.resetProgress(remote.resetAt, true);
      prune(remote.resetAt); persist();
      NL.content.refresh();
    }
    return remote;
  }

  /* Le filtre sur user_id double la politique de sécurité des lignes : si elle
     tombait un jour, la remise à zéro d'une personne n'effacerait pas les autres. */
  async function eraseBefore(at) {
    let r = await client.from('srs_records').delete().eq('user_id', user.id).lt('updated_at', at);
    if (r.error) throw r.error;
    r = await client.from('review_log').delete().eq('user_id', user.id).lt('t', at);
    if (r.error) throw r.error;
  }

  async function readMeta() {
    const { data, error } = await client.from('user_meta').select('*').eq('user_id', user.id).range(0, 0);
    if (error) throw error;
    return data && data[0] ? data[0].data : null;
  }

  /* Les réglages fusionnés prennent la place de ceux d'ici. Une langue d'affichage
     qui change ainsi vient d'un autre appareil : NL.lang le voit, et le dira dans l'avis. */
  function takeMeta(merged) {
    NL.lang.fromAccount(() => NL.state.setMeta(merged, true));
  }

  /* Une ligne du serveur qui descend d'une remise à zéro antérieure à la nôtre
     est en cours d'effacement ; sans `base`, elle vient de la version
     précédente, qui écrit encore après l'époque. Ni l'une ni l'autre n'entre. */
  const stale = (row, cut) => ((row.data && row.data.base) || 0) < cut;

  async function pull() {
    if (!user) return;
    /* « Synchroniser maintenant » après une adoption échouée : la retenter.
       L'adoption tire elle-même une fois rattachée. */
    if (!attached()) { try { await adopt(); } catch (e) { fail(e); } return; }
    state = 'syncing'; notify();
    try {
      const remoteMeta = await settleResets();
      const cut = NL.state.meta().resetAt || 0;
      const recs = await selectAll('srs_records');
      recs.forEach(row => {
        if (stale(row, cut)) return;
        const local = NL.state.rec(row.item_id);
        if (box.recs[row.item_id] && local && (local.updatedAt || 0) >= row.updated_at) return;
        if (!local || (local.updatedAt || 0) < row.updated_at) {
          NL.state.setRec(Object.assign({}, row.data, { id: row.item_id, updatedAt: row.updated_at }), true);
        }
      });

      const words = await selectAll('custom_words');
      words.forEach(row => {
        const local = NL.state.customs().find(c => c.id === row.id);
        if ((local && (local.updatedAt || 0) >= row.updated_at) || box.customs[row.id]) return;
        if (row.deleted) { if (local) NL.state.delCustom(row.id, true); }
        else NL.state.putCustom(Object.assign({}, row.data, { id: row.id, updatedAt: row.updated_at }), true);
      });

      if (remoteMeta) {
        const merged = mergeMeta(NL.state.meta(), remoteMeta);
        takeMeta(merged);
        if (JSON.stringify(merged) !== JSON.stringify(remoteMeta)) { box.meta = true; persist(); }
      } else {
        box.meta = true; persist();
      }

      const since = Date.now() - LOG_DAYS * 86400000;
      const have = new Set(NL.state.logs().map(l => l.t + '|' + l.id));
      const logs = await selectAll('review_log', q => q.gte('t', since));
      logs.sort((a, b) => a.t - b.t).forEach(row => {
        if (!stale(row, cut) && !have.has(row.t + '|' + row.item_id)) NL.state.logReview(row.data, true);
      });

      NL.content.refresh();
      done();
    } catch (e) { fail(e); }
  }

  /* ---------------- pousser ---------------- */
  function flush() {
    if (!enabled || !attached()) return Promise.resolve();
    if (typeof navigator !== 'undefined' && navigator.onLine === false) { state = 'offline'; notify(); return Promise.resolve(); }
    if (flushing) return flushing;
    flushing = doFlush().finally(() => { flushing = null; });
    return flushing;
  }

  async function doFlush() {
    if (!pending()) { done(); return; }
    state = 'syncing'; notify();
    let remoteMeta = null;
    try { remoteMeta = await settleResets(); }
    catch (e) { fail(e); schedule(30000); return; }
    if (!pending()) { done(); return; }
    /* On prend un instantané et on vide la boîte : ce qui s'écrit PENDANT
       l'envoi repart dans une boîte neuve au lieu d'être effacé par erreur. */
    const snap = box; box = empty(); persist();
    try {
      const uid = user.id;
      const recRows = Object.keys(snap.recs).map(id => NL.state.rec(id)).filter(Boolean).map(r => ({
        user_id: uid, item_id: r.id, data: r, updated_at: r.updatedAt || Date.now()
      }));
      for (let i = 0; i < recRows.length; i += 500) {
        const { error } = await client.from('srs_records').upsert(recRows.slice(i, i + 500), { onConflict: 'user_id,item_id' });
        if (error) throw error;
      }

      const now = Date.now();
      const wordRows = Object.keys(snap.customs).map(id => {
        if (snap.customs[id] === 'deleted') return { user_id: uid, id, data: {}, deleted: true, updated_at: now };
        const c = NL.state.customs().find(x => x.id === id);
        return c ? { user_id: uid, id, data: c, deleted: false, updated_at: c.updatedAt || now } : null;
      }).filter(Boolean);
      if (wordRows.length) {
        const { error } = await client.from('custom_words').upsert(wordRows, { onConflict: 'user_id,id' });
        if (error) throw error;
      }

      if (snap.meta) {
        /* Les réglages se fusionnent avec la copie du serveur AVANT l'envoi :
           l'XP gagnée ailleurs pendant que cet appareil était hors ligne reste. */
        if (remoteMeta) takeMeta(mergeMeta(NL.state.meta(), remoteMeta));
        const m = NL.state.meta();
        const { error } = await client.from('user_meta').upsert(
          { user_id: uid, data: m, updated_at: m.updatedAt || now }, { onConflict: 'user_id' });
        if (error) throw error;
      }

      const logRows = snap.logs.filter(l => l && l.id && l.t).map(l => ({ user_id: uid, t: l.t, item_id: l.id, data: l }));
      for (let i = 0; i < logRows.length; i += 500) {
        const { error } = await client.from('review_log').upsert(logRows.slice(i, i + 500),
          { onConflict: 'user_id,t,item_id', ignoreDuplicates: true });
        if (error) throw error;
      }
      done();
    } catch (e) {
      /* Échec : on remet l'instantané dans la boîte, fusionné avec ce qui est
         arrivé entre-temps. Rien n'est perdu ; on réessaie plus tard. */
      Object.assign(snap.recs, box.recs);
      Object.assign(snap.customs, box.customs);
      snap.meta = snap.meta || box.meta;
      snap.logs = snap.logs.concat(box.logs);
      box = snap; persist();
      fail(e);
      schedule(30000);
    }
  }

  function done() { state = 'idle'; lastSync = Date.now(); lastError = null; notify(); }
  function fail(e) {
    state = (typeof navigator !== 'undefined' && navigator.onLine === false) ? 'offline' : 'error';
    lastError = (e && e.message) || String(e);
    notify();
  }

  /* ---------------- fusion des réglages ---------------- */
  /* Le cumul se prend au maximum, les listes s'unissent, la série suit le jour
     le plus récent, et le reste — thème, rythme, prénom — revient à la version
     modifiée en dernier. */
  function mergeMeta(a, b) {
    a = a || {}; b = b || {};
    const newer = (a.updatedAt || 0) >= (b.updatedAt || 0) ? a : b;
    const out = Object.assign({}, newer === a ? b : a, newer);
    out.xp = Math.max(a.xp || 0, b.xp || 0);
    out.best = Math.max(a.best || 0, b.best || 0, a.streak || 0, b.streak || 0);
    const la = a.lastDay || '', lb = b.lastDay || '';
    if (la !== lb) { const w = la > lb ? a : b; out.lastDay = w.lastDay; out.streak = w.streak; }
    else out.streak = Math.max(a.streak || 0, b.streak || 0);
    ['doneDay', 'exDay'].forEach(k => {
      const cnt = k === 'doneDay' ? 'doneToday' : 'exToday';
      const da = a[k] || '', db = b[k] || '';
      if (da === db) out[cnt] = Math.max(a[cnt] || 0, b[cnt] || 0);
      else { const w = da > db ? a : b; out[k] = w[k]; out[cnt] = w[cnt]; }
    });
    out.placed = !!(a.placed || b.placed);
    /* Le robot de sauvegarde écrit lastBackup sans toucher à updatedAt : le côté
       le plus récent peut porter la date d'avant. Elle ne fait que croître. */
    if (a.lastBackup || b.lastBackup) out.lastBackup = Math.max(a.lastBackup || 0, b.lastBackup || 0);
    /* La frontière ne recule jamais et les listes de choses faites s'unissent —
       sauf remise à zéro : tout ce qui relève de la progression suit alors le
       côté qui porte la plus récente, sinon l'autre appareil rendrait ce qu'on
       vient d'effacer.
       Elles se lisent dans `progress`, et là seulement : la version précédente
       réécrit le premier niveau par maximum et union et recopie `progress` sans
       le toucher. Un côté sans `progress` n'apporte rien. */
    const pa = a.progress || {}, pb = b.progress || {};
    const ra = a.resetAt || 0, rb = b.resetAt || 0;
    const later = ra > rb ? pa : pb;
    out.resetAt = Math.max(ra, rb);
    out.reached = ra === rb ? Math.max(pa.reached || 0, pb.reached || 0) : (later.reached || 0);
    ['scenariosDone', 'listenDone'].forEach(k => {
      out[k] = ra === rb ? Array.from(new Set([].concat(pa[k] || [], pb[k] || []))) : (later[k] || []).slice();
    });
    out.progress = { reached: out.reached, scenariosDone: out.scenariosDone.slice(), listenDone: out.listenDone.slice() };
    /* Une version de données ne redescend jamais : un appareil neuf ne reprend
       pas le dataVersion 2 d'un compte que personne n'a encore migré. */
    out.dataVersion = Math.max(a.dataVersion || 1, b.dataVersion || 1);
    out.updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0);
    return out;
  }

  function status() {
    return { enabled, state, user: user ? { id: user.id, email: user.email } : null, pending: pending(), lastSync, lastError };
  }

  return {
    enabled, init, signIn, verifyCode, signOut, pull, flush, queueAll, status, onChange, mergeMeta,
    get user() { return user; }
  };
})();
</script>

<script>
/* Règles de grammaire. Chaque règle est elle-même un item du planificateur,
   travaillée en remettant des phrases en ordre, en comblant des trous, en tapant
   puis en disant. Classées par ce que chacune débloque dans une conversation,
   pas par l'ordre d'un manuel. */
NL.content = NL.content || {};
NL.content.patterns = (function () {
  'use strict';
  const D = (nl, g, gap) => ({ nl, ...NL.gloss.pair(g), gap });

  return [
    {
      id: 'g-v2', unit: 'overleven', level: 'A1',
      title: { fr: 'Le verbe en deuxième position', en: 'The verb in second position' },
      rule: { fr: 'Peu importe ce qui vient en premier, le verbe est le deuxième élément.', en: 'Whatever comes first, the verb is the second element.' },
      nl: 'Morgen ga ik naar Brussel.', fr: 'Demain je vais à Bruxelles.', en: 'Tomorrow I’m going to Brussels.',
      explain: {
        fr: 'C’est la colonne vertébrale de toute phrase néerlandaise. Le verbe conjugué occupe la <b>deuxième</b> position — pas le deuxième mot, le deuxième <i>élément</i>. Commence par un complément de temps et le sujet passe derrière le verbe : <span class="ex">Morgen <b>ga</b> ik naar Brussel</span>, jamais <i lang="nl-BE">Morgen ik ga</i>. Le français ne fait pas ça, donc l’erreur revient pendant des années. La corriger tôt change immédiatement ta façon de sonner.',
        en: 'This is the backbone of every Dutch sentence. The conjugated verb takes the <b>second</b> position — not the second word, the second <i>element</i>. Start with a time phrase and the subject drops behind the verb: <span class="ex">Morgen <b>ga</b> ik naar Brussel</span>, never <i lang="nl-BE">Morgen ik ga</i>. English does not do this, so the mistake keeps coming back for years. Fixing it early changes how you sound straight away.'
      },
      drills: [
        D('Morgen ga ik naar Brussel.', { fr: 'Demain je vais à Bruxelles.', en: 'Tomorrow I’m going to Brussels.' }, 'ga'),
        D('Vandaag werk ik van thuis.', { fr: 'Aujourd’hui je travaille de chez moi.', en: 'Today I’m working from home.' }, 'werk'),
        D('Om acht uur vertrekt de trein.', { fr: 'Le train part à huit heures.', en: 'The train leaves at eight o’clock.' }, 'vertrekt'),
        D('In {stad} wonen wij al vijf jaar.', { fr: 'Nous habitons à {stad} depuis cinq ans.', en: 'We have lived in {stad} for five years.' }, 'wonen'),
        D('Daarna ga ik naar de bakker.', { fr: 'Ensuite je vais chez le boulanger.', en: 'Then I’m going to the baker’s.' }, 'ga')
      ]
    },
    {
      id: 'g-present', unit: 'ikengij', level: 'A1',
      title: { fr: 'Le présent : radical, radical+t, radical+en', en: 'The present tense: stem, stem+t, stem+en' },
      rule: { fr: 'ik werk / jij werkt / hij werkt / wij werken.', en: 'ik werk / jij werkt / hij werkt / wij werken.' },
      nl: 'Ik werk bij {bedrijf}.', fr: 'Je travaille chez {bedrijf}.', en: 'I work at {bedrijf}.',
      explain: {
        fr: 'Trois formes et tu as tout le présent : <span class="ex">ik werk</span>, <span class="ex">jij/hij werkt</span>, <span class="ex">wij/jullie/zij werken</span>. Bien plus simple que le français, qui en a cinq. Un seul piège : quand <b lang="nl-BE">jij</b> passe derrière le verbe — dans une question, ou après un complément de temps — le <span class="ex">-t</span> disparaît. <span class="ex">Werk jij morgen?</span>, pas <i lang="nl-BE">werkt jij</i>. Uniquement avec jij, jamais avec hij.',
        en: 'Three forms and you have the whole present tense: <span class="ex">ik werk</span>, <span class="ex">jij/hij werkt</span>, <span class="ex">wij/jullie/zij werken</span>. One trap: when <b lang="nl-BE">jij</b> comes after the verb — in a question, or after a time phrase — the <span class="ex">-t</span> disappears. <span class="ex">Werk jij morgen?</span>, not <i lang="nl-BE">werkt jij</i>. Only with jij, never with hij.'
      },
      drills: [
        D('Ik werk bij {bedrijf}.', { fr: 'Je travaille chez {bedrijf}.', en: 'I work at {bedrijf}.' }, 'werk'),
        D('Hij woont in Aalst.', { fr: 'Il habite à Alost.', en: 'He lives in Aalst.' }, 'woont'),
        D('Wij wonen in {stad}.', { fr: 'Nous habitons à {stad}.', en: 'We live in {stad}.' }, 'wonen'),
        D('Spreek jij Nederlands?', { fr: 'Tu parles néerlandais ?', en: 'Do you speak Dutch?' }, 'Spreek'),
        D('Zij komt om zeven uur.', { fr: 'Elle vient à sept heures.', en: 'She is coming at seven o’clock.' }, 'komt')
      ]
    },
    {
      id: 'g-gegij', unit: 'ikengij', level: 'A1',
      title: { fr: 'Ge et gij : ce que tu entends vraiment', en: 'Ge and gij: what you really hear' },
      rule: { fr: 'Dis « je ». Attends-toi à « ge ». C’est la même chose.', en: 'Say “je”. Expect “ge”. It is the same thing.' },
      nl: 'Hebt ge dat verstaan?', fr: 'Tu as compris ?', en: 'Did you understand that? (informal)',
      explain: {
        fr: 'Les manuels enseignent <span class="ex">jij/je</span>. Le Brabant flamand dit <span class="ex">gij/ge</span> — à la boulangerie, au club de foot, et en face de toi au bureau. Ce n’est ni grossier ni purement dialectal : c’est simplement le sud. Les verbes suivent : <span class="ex">gij zijt</span> (jij bent), <span class="ex">gij hebt</span>, <span class="ex">gij kunt</span>, et les questions se contractent : <span class="ex">Kunde?</span> (kun je), <span class="ex">Hebde?</span> (heb je), <span class="ex">Zijde?</span> (ben je). <b>Produis « je » et tu es toujours correct. Reconnais « ge » ou tu perds la moitié de ce qu’on te dit.</b>',
        en: 'Textbooks teach <span class="ex">jij/je</span>. Flemish Brabant says <span class="ex">gij/ge</span> — at the bakery, at the football club, and across the desk from you at work. It is neither rude nor purely dialect: it is simply the south. The verbs follow: <span class="ex">gij zijt</span> (jij bent), <span class="ex">gij hebt</span>, <span class="ex">gij kunt</span>, and questions contract: <span class="ex">Kunde?</span> (kun je), <span class="ex">Hebde?</span> (heb je), <span class="ex">Zijde?</span> (ben je). <b>Produce “je” and you are always correct. Recognise “ge” or you lose half of what is said to you.</b>'
      },
      drills: [
        D('Hebt ge dat verstaan?', { fr: 'Tu as compris ?', en: 'Did you understand that?' }, 'ge'),
        D('Zijt ge klaar?', { fr: 'Tu es prêt ?', en: 'Are you ready?' }, 'Zijt'),
        D('Kunt ge mij helpen?', { fr: 'Tu peux m’aider ?', en: 'Can you help me?' }, 'ge'),
        D('Waar woont ge?', { fr: 'Tu habites où ?', en: 'Where do you live?' }, 'ge')
      ]
    },
    {
      id: 'g-getallen', unit: 'tijd', level: 'A1',
      title: { fr: 'Les unités avant les dizaines', en: 'Units before tens' },
      rule: { fr: '21 se dit een-en-twintig : le petit chiffre d’abord.', en: '21 is said een-en-twintig: the small digit first.' },
      nl: 'Het kost eenentwintig euro.', fr: 'Ça coûte vingt-et-un euros.', en: 'It costs twenty-one euros.',
      explain: {
        fr: 'Le néerlandais dit les unités avant les dizaines : <span class="ex">eenentwintig</span> (21), <span class="ex">vierenzestig</span> (64), <span class="ex">negenennegentig</span> (99). En un seul mot, sans espace. C’est pour ça qu’un prix ou un numéro de téléphone semble mélangé : tu entends le deuxième chiffre avant le premier. Bonne nouvelle pour toi : <span class="ex">zeventig</span> = septante et <span class="ex">negentig</span> = nonante, exactement comme en Belgique. Le français de France, lui, t’aurait imposé un détour par soixante-dix.',
        en: 'Dutch says the units before the tens: <span class="ex">eenentwintig</span> (21, literally “one-and-twenty”), <span class="ex">vierenzestig</span> (64), <span class="ex">negenennegentig</span> (99). As a single word, with no space. That is why a price or a phone number seems jumbled: you hear the second digit before the first. Good news: <span class="ex">zeventig</span> is simply seventy and <span class="ex">negentig</span> is simply ninety.'
      },
      drills: [
        D('Het kost eenentwintig euro.', { fr: 'Ça coûte vingt-et-un euros.', en: 'It costs twenty-one euros.' }, 'eenentwintig'),
        D('Ik ben tweeënveertig jaar.', { fr: 'J’ai quarante-deux ans.', en: 'I am forty-two years old.' }, 'tweeënveertig'),
        D('Dat is vijfenzestig euro.', { fr: 'Ça fait soixante-cinq euros.', en: 'That is sixty-five euros.' }, 'vijfenzestig'),
        D('Zij is zeventig jaar.', { fr: 'Elle a septante ans.', en: 'She is seventy years old.' }, 'zeventig')
      ]
    },
    {
      id: 'g-halfuur', unit: 'tijd', level: 'A1',
      title: { fr: 'Half drie, c’est 2h30', en: 'Half drie means 2:30' },
      rule: { fr: 'half + heure = trente minutes AVANT cette heure.', en: 'half + hour = thirty minutes BEFORE that hour.' },
      nl: 'De vergadering begint om half drie.', fr: 'La réunion commence à deux heures et demie.', en: 'The meeting starts at half past two.',
      explain: {
        fr: 'Le néerlandais compte <b>vers</b> l’heure qui vient. <span class="ex">Half drie</span> = une demi-heure avant trois heures, donc 2h30 — et non 3h30. Le français fait l’inverse : « trois heures et demie » = 3h30. Même logique pour <span class="ex">kwart voor</span> (moins le quart) et <span class="ex">kwart na</span> (et quart). La Flandre dit aussi <span class="ex">tien voor half vier</span> pour 15h20, compté à rebours depuis la demie. Te tromper une fois te coûte une réunion.',
        en: 'Dutch counts <b>towards</b> the coming hour. <span class="ex">Half drie</span> = half an hour before three o’clock, so 2:30 — not 3:30. English “half three” is 3:30, so the trap is real. Same logic for <span class="ex">kwart voor</span> (quarter to) and <span class="ex">kwart na</span> (quarter past). Flanders also says <span class="ex">tien voor half vier</span> for 15:20, counted back from the half hour. Get it wrong once and you miss a meeting.'
      },
      drills: [
        D('De vergadering begint om half drie.', { fr: 'La réunion commence à 14h30.', en: 'The meeting starts at 14:30.' }, 'half'),
        D('Het is kwart voor acht.', { fr: 'Il est huit heures moins le quart.', en: 'It is quarter to eight.' }, 'voor'),
        D('Ik vertrek om half negen.', { fr: 'Je pars à 8h30.', en: 'I leave at 8:30.' }, 'half')

    },
    {
      id: 'g-dehet', unit: 'bakker', level: 'A1',
      title: { fr: 'De ou het, et le -e en plus', en: 'De or het, and the extra -e' },
      rule: { fr: 'een groot huis, mais het grote huis.', en: 'een groot huis, but het grote huis.' },
      nl: 'Het grote huis staat in de straat.', fr: 'La grande maison est dans la rue.', en: 'The big house is in the street.',
      explain: {
        fr: 'Environ trois noms sur quatre prennent <span class="ex">de</span>, le reste prend <span class="ex">het</span>. <b>Ne traduis jamais depuis le français</b> : <span class="ex">het huis</span> est neutre alors que « la maison » est féminine, <span class="ex">het bureau</span> est neutre alors que « le bureau » est masculin. Les genres ne se correspondent pas du tout. Bonne nouvelle : ce n’est pas totalement arbitraire — voir la fiche <i>Les familles de het</i>. Le gain vient avec l’adjectif : il prend <span class="ex">-e</span> partout — <span class="ex">de grote fiets</span>, <span class="ex">het grote huis</span>, <span class="ex">een grote fiets</span> — sauf après <b lang="nl-BE">een</b> devant un mot <b>het</b> : <span class="ex">een groot huis</span>. Après le verbe, toujours nu : <span class="ex">het huis is groot</span>.',
        en: 'About three nouns in four take <span class="ex">de</span>, the rest take <span class="ex">het</span>. <b>Never guess from the meaning</b>: English has no grammatical gender to lean on, so learn the article together with the noun — <span class="ex">het huis</span>, <span class="ex">de tafel</span>. Good news: it is not entirely arbitrary — see the sheet <i>The het families</i>. The payoff comes with the adjective: it takes <span class="ex">-e</span> everywhere — <span class="ex">de grote fiets</span>, <span class="ex">het grote huis</span>, <span class="ex">een grote fiets</span> — except after <b lang="nl-BE">een</b> before a <b>het</b> word: <span class="ex">een groot huis</span>. After the verb, always bare: <span class="ex">het huis is groot</span>.'
      },

      nl: 'Ons huis staat naast onze tuin.', fr: 'Notre maison est à côté de notre jardin.', en: 'Our house is next to our garden.',

<script>
/* D'autres façons de dire la même chose.

   La table donne, pour un élément, ce que la réponse tapée accepte en plus de
   la cible et de la variante flamande, et ce que le panneau liste après coup
   (« On dit aussi : … »). Du néerlandais seulement, jamais stocké : l'élément
   du contenu la porte, pas l'enregistrement de la personne.

   Les éléments s'accrochent par leur forme exacte, article compris : si un mot
   est renommé dans le lexique, sa ligne ne suit pas en silence. */
(function () {
  'use strict';
  const ALSO = {
    /* « bonjour » et « salut », c'est le même salut : hallo, goeiedag et dag
       s'acceptent l'un l'autre (hallo et goeiedag par leur sens commun). */
    'goeiedag': ['dag'],
    'hallo': ['dag'],
    'dag': ['hallo', 'goeiedag'],
    'dank u wel': ['dank u', 'bedankt']
  };

  const missing = [];
  const hit = new Set();
  NL.content.units.forEach(u => (u.words || []).concat(u.phrases || []).forEach(it => {
    if (ALSO[it.nl]) { it.also = ALSO[it.nl]; hit.add(it.nl); }
  }));
  Object.keys(ALSO).forEach(nl => { if (!hit.has(nl)) missing.push(nl); });
  NL.content.alsoReport = { attached: hit.size, missing };
})();
</script>

/* Réponses libres, attachées aux règles de grammaire.

<script>
/* Flattens the curriculum into addressable items and answers questions about
   progress. An item's id is its unit and its position in it (`overleven:w3`):
   words and phrases are only ever appended, and `test/content.js` pins every id
   to its Dutch. */
NL.content = NL.content || {};
(function () {
  'use strict';
  let flat = null, index = null, RAW = null;

  /* The course ships neutral so it can live in a public repository, and becomes
     yours through three settings. Content carries {naam}, {stad} and {bedrijf};
     they are substituted once, here, so no screen has to think about it. */
  const DEFAULTS = { naam: 'Tom', stad: 'Gent', bedrijf: 'Novatech' };
  function fill(s) {
    if (typeof s !== 'string' || s.indexOf('{') < 0) return s;
    const m = NL.state.meta();
    return s
      .replace(/\{naam\}/g, m.learnerName || DEFAULTS.naam)
      .replace(/\{stad\}/g, m.town || DEFAULTS.stad)
      .replace(/\{bedrijf\}/g, m.company || DEFAULTS.bedrijf);
  }
  function deepFill(v) {
    if (typeof v === 'string') return fill(v);
    if (Array.isArray(v)) return v.map(deepFill);
    if (v && typeof v === 'object') {
      const o = {};
      Object.keys(v).forEach(k => { o[k] = deepFill(v[k]); });
      return o;
    }
    return v;
  }
  const TOKENED = ['units', 'patterns', 'scenarios', 'sheets', 'hetRules'];

  function build() {
    if (!RAW) {
      RAW = {};
      TOKENED.forEach(k => { RAW[k] = JSON.parse(JSON.stringify(NL.content[k] || [])); });
    }
    TOKENED.forEach(k => { NL.content[k] = deepFill(RAW[k]); });

    flat = [];
    /* A pattern can be referenced by several units; it belongs to the first one
       that teaches it, and must appear exactly once or it gets drilled twice. */
    const claimed = new Set();
    NL.content.units.forEach(u => {
      (u.words || []).forEach((w, i) => flat.push(Object.assign({}, w, {
        id: u.id + ':w' + i, unit: u.id, level: u.level, track: u.track, kind: 'word'
      })));
      (u.phrases || []).forEach((p, i) => flat.push(Object.assign({}, p, {
        id: u.id + ':p' + i, unit: u.id, level: u.level, track: u.track, kind: 'phrase'
      })));
      (u.grammar || []).forEach(gid => {
        if (claimed.has(gid)) return;
        const g = (NL.content.patterns || []).find(x => x.id === gid);
        if (!g) return;
        claimed.add(gid);
        flat.push(Object.assign({}, g, { unit: u.id, level: u.level, track: u.track, kind: 'pattern',
          open: (NL.content.openTasks || {})[g.id] || null }));
      });
    });
    NL.state.customs().forEach(c => flat.push(Object.assign({}, c, { kind: c.kind || 'word', unit: 'eigen', level: 'eigen', track: 'eigen' })));
    /* Palier par défaut, et détection des mots transparents : « de tram »,
       « de garage », « direct » sont offerts à un francophone. */
    flat.forEach(it => {
      it.tier = it.tier || 'produce';
      it.cognate = NL.gloss.cognate(it);
    });
    index = new Map(flat.map(it => [it.id, it]));
  }

  const allItems = () => { if (!flat) build(); return flat; };
  const refresh = () => { flat = null; index = null; };
  const byId = id => { if (!index) build(); return index.get(id) || null; };
  const unit = id => NL.content.units.find(u => u.id === id) || null;
  const itemsOf = uid => allItems().filter(it => it.unit === uid);

  /* Deux comptes, et pas de troisième. Rencontré : l'élément a été vu au moins
     une fois. Produit : il a passé l'échelon de l'écrit — en tenant compte du
     palier, puisqu'un mot du palier « reconnaître » plafonne à l'échelon 2. */
  const MET = it => NL.srs.stageOf(it) >= 0;
  const PRODUCED = it => NL.srs.stageOf(it) >= Math.min(NL.srs.PRODUCE, NL.srs.maxRung(it));

  /* Une unité ouvre la suivante quand les trois quarts de ses éléments ont été
     RENCONTRÉS. Le seuil portait sur un échelon qui demande au moins deux jours
     de bonnes réponses : une unité entièrement rencontrée n'ouvrait pas la
     suivante, et il ne restait alors rien de neuf à servir. */
  const GATE = 0.75;
  const gateSize = n => Math.ceil(n * GATE);

  const unitComplete = uid => {
    const items = itemsOf(uid);
    return items.filter(MET).length >= gateSize(items.length);
  };

  /* La frontière : on remonte depuis la première unité tant qu'elle est faite ;
     la première inachevée est la dernière ouverte. L'intervalle ouvert est donc
     contigu PAR CONSTRUCTION — « unité 10 fermée, 11 ouverte » devient
     impossible à produire, et pas seulement corrigé. */
  function frontier() {
    const us = NL.content.units;
    let i = 0;
    while (i < us.length - 1 && unitComplete(us[i].id)) i++;
    /* Une unité ouverte le reste : la frontière ne recule jamais, et le
       maximum atteint reste contigu. */
    const reached = Math.min(NL.state.meta().reached || 0, us.length - 1);
    if (i > reached) { NL.state.setMeta({ reached: i }); return i; }
    return reached;
  }

  function unitOpen(uid) {
    if (uid === 'eigen') return true;
    const i = NL.content.units.findIndex(u => u.id === uid);
    return i >= 0 && i <= frontier();
  }

  /* Des comptes, jamais de pourcentage : un compte bouge tous les jours, et ne
     peut pas être exact et muet à la fois. Voir docs/adr/0002.
       toOpen = combien d'éléments restent à rencontrer avant l'unité suivante */
  function unitProgress(uid) {
    const items = itemsOf(uid);
    const met = items.filter(MET).length;
    return {
      met, produce: items.filter(PRODUCED).length, total: items.length,
      toOpen: Math.max(0, gateSize(items.length) - met)
    };
  }

  function courseProgress() {
    const items = allItems().filter(it => it.unit !== 'eigen');
    return {
      met: items.filter(MET).length, produce: items.filter(PRODUCED).length, total: items.length,
      current: NL.content.units[frontier()] || null
    };
  }

  const scenario = id => (NL.content.scenarios || []).find(s => s.id === id) || null;

  /* Listening material is generated from what the scenarios already say, so
     comprehension practice always uses sentences a real person would utter. */
  function listenClips() {
    const out = [];
    (NL.content.scenarios || []).forEach(s => {
      s.steps.forEach((st, i) => {
        if (!st.them) return;
        out.push({
          id: s.id + ':l' + i, nl: st.them.nl, be: st.them.be || st.them.nl, fr: st.them.fr, en: st.them.en,
          from: NL.gloss.of(s.title), icon: s.icon, track: s.track
        });
      });
    });
    return out;
  }

  Object.assign(NL.content, { allItems, refresh, byId, unit, itemsOf, unitOpen, unitComplete, frontier, unitProgress, courseProgress, met: MET, produced: PRODUCED, scenario, listenClips, fill, DEFAULTS });
})();
</script>
<script>
/* La langue d'affichage : un seul endroit la décide, un seul endroit l'applique.
   Absente des réglages, c'est l'anglais. Un changement ne s'applique jamais en
   pleine séance ni en pleine conversation : le shell n'appelle `apply` qu'en
   dehors d'elles, au premier écran dessiné ensuite. Le bandeau d'avis n'est pas
