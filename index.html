<script>
/* Persistence. IndexedDB with an in-memory mirror so rendering stays synchronous,
   and a localStorage fallback for browsers or modes where IDB is unavailable. */
NL.state = (function () {
  'use strict';
  /* Storage keys deliberately keep their original spelling: renaming them would
     orphan every database and every backup file already out there. */
  const DB = 'vlaams-onderweg', VER = 1;
  const STORES = ['srs', 'meta', 'log', 'custom'];
  let db = null, useIDB = false;

  const LS = 'vlaams/fallback';
  const mem = { srs: new Map(), custom: new Map(), log: [] };

  const defaults = () => ({
    xp: 0, streak: 0, best: 0, lastDay: null, theme: 'system',
    placed: false, dailyGoal: 20, doneToday: 0, doneDay: null,
    mic: true, autoplay: true, showFlemish: true, unlocked: 1,
    scenariosDone: [], listenDone: [], firstRun: true,
    learnerName: '', town: '', company: '',
    pace: 'normal', exDay: null, exToday: 0, dataVersion: 2, lastEx: null
  });
  let meta = defaults();

  /* Une seule fois : la progression fabriquée par l'ancien test de placement
     — des unités entières créditées sur une réponse chanceuse — est effacée.
     XP, série, réglages et mots personnels survivent. */
  function migrate() {
    if ((meta.dataVersion || 1) >= 2) return false;
    mem.srs.clear();
    if (useIDB) { try { db.transaction('srs', 'readwrite').objectStore('srs').clear(); } catch (e) {} }
    setMeta({ dataVersion: 2, placed: false, exDay: null, exToday: 0 });
    return true;
  }

  function open() {
    return new Promise(resolve => {
      let req;
      try { req = indexedDB.open(DB, VER); } catch (e) { return resolve(loadLS()); }
      if (!req) return resolve(loadLS());
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('srs')) d.createObjectStore('srs', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'k' });
        if (!d.objectStoreNames.contains('log')) d.createObjectStore('log', { autoIncrement: true });
        if (!d.objectStoreNames.contains('custom')) d.createObjectStore('custom', { keyPath: 'id' });
      };
      req.onerror = () => resolve(loadLS());
      req.onsuccess = e => {
        db = e.target.result; useIDB = true;
        Promise.all([all('srs'), all('custom'), get('meta', 'meta'), all('log')]).then(([s, c, m, l]) => {
          s.forEach(r => mem.srs.set(r.id, r));
          c.forEach(r => mem.custom.set(r.id, r));
          /* Le journal était enregistré mais jamais relu : le graphique de la
             semaine ne montrait que la séance en cours. */
          mem.log = (l || []).slice(-4000);
          if (m && m.v) meta = Object.assign(defaults(), m.v);
          resolve();
        }).catch(() => resolve(loadLS()));
      };
    });
  }

  function loadLS() {
    useIDB = false;
    try {
      const raw = JSON.parse(localStorage.getItem(LS) || '{}');
      (raw.srs || []).forEach(r => mem.srs.set(r.id, r));
      (raw.custom || []).forEach(r => mem.custom.set(r.id, r));
      if (raw.meta) meta = Object.assign(defaults(), raw.meta);
    } catch (e) { /* private mode: run from memory only */ }
  }
  const saveLS = NL.util.debounce(() => {
    if (useIDB) return;
    try {
      localStorage.setItem(LS, JSON.stringify({
        srs: [...mem.srs.values()], custom: [...mem.custom.values()], meta
      }));
    } catch (e) {}
  }, 400);

  const tx = (store, mode) => db.transaction(store, mode).objectStore(store);
  function get(store, key) {
    return new Promise((res, rej) => { const r = tx(store, 'readonly').get(key); r.onsuccess = () => res(r.result); r.onerror = rej; });
  }
  function all(store) {
    return new Promise((res, rej) => { const r = tx(store, 'readonly').getAll(); r.onsuccess = () => res(r.result || []); r.onerror = rej; });
  }
  function put(store, val) {
    if (!useIDB) { saveLS(); return Promise.resolve(); }
    return new Promise(res => { const r = tx(store, 'readwrite').put(val); r.onsuccess = res; r.onerror = res; });
  }
  function clearAll() {
    mem.srs.clear(); mem.custom.clear(); mem.log = []; meta = defaults();
    if (!useIDB) { try { localStorage.removeItem(LS); } catch (e) {} return Promise.resolve(); }
    return Promise.all(STORES.map(s => new Promise(res => {
      const r = db.transaction(s, 'readwrite').objectStore(s).clear(); r.onsuccess = res; r.onerror = res;
    })));
  }

  /* ---- abonnés aux écritures ----
     La synchro écoute ici. Une écriture « silencieuse » vient du serveur : elle
     est appliquée localement sans être renvoyée, sinon chaque tirage deviendrait
     un envoi et deux appareils se renverraient la balle à l'infini. */
  const listeners = [];
  const onWrite = fn => listeners.push(fn);
  const emit = (type, value) => listeners.forEach(fn => { try { fn(type, value); } catch (e) {} });

  /* ---- SRS records ---- */
  const rec = id => mem.srs.get(id) || null;
  function setRec(r, silent) {
    if (!silent) r.updatedAt = Date.now();
    mem.srs.set(r.id, r); put('srs', r); saveLS();
    if (!silent) emit('rec', r);
  }
  const allRecs = () => [...mem.srs.values()];
  const seenCount = () => mem.srs.size;

  /* ---- meta ---- */
  const m = () => meta;
  function setMeta(patch, silent) {
    Object.assign(meta, patch);
    if (!silent) meta.updatedAt = Date.now();
    put('meta', { k: 'meta', v: meta }); saveLS();
    if (!silent) emit('meta', meta);
  }

  /* ---- review log, for the stats strip ---- */
  function logReview(entry, silent) {
    mem.log.push(entry);
    if (mem.log.length > 4000) mem.log.shift();
    if (useIDB) { try { db.transaction('log', 'readwrite').objectStore('log').put(entry); } catch (e) {} }
    if (!silent) emit('log', entry);
  }
  const logs = () => mem.log;

  /* ---- user's own words ---- */
  function addCustom(w) {
    const r = Object.assign({ id: 'x-' + Date.now().toString(36), kind: 'word', unit: 'eigen', level: 'eigen' }, w);
    return putCustom(r);
  }
  function putCustom(r, silent) {
    if (!silent) r.updatedAt = Date.now();
    mem.custom.set(r.id, r); put('custom', r); saveLS();
    if (!silent) emit('custom', r);
    return r;
  }
  function delCustom(id, silent) {
    mem.custom.delete(id); mem.srs.delete(id);
    if (useIDB) {
      try { db.transaction('custom', 'readwrite').objectStore('custom').delete(id); } catch (e) {}
      try { db.transaction('srs', 'readwrite').objectStore('srs').delete(id); } catch (e) {}
    }
    saveLS();
    if (!silent) emit('custom-del', id);
  }
  const customs = () => [...mem.custom.values()];

  /* ---- backup ----
     Moving from the artifact URL to a hosted one is a different origin, which
     means a different database and an empty one. Without this, months of reviews
     vanish on the move. */
  function exportAll() {
    return {
      app: 'vlaams-onderweg', v: 1, at: Date.now(),
      meta, srs: [...mem.srs.values()], custom: [...mem.custom.values()],
      log: mem.log.slice(-2000)
    };
  }
  function importAll(data) {
    if (!data || data.app !== 'vlaams-onderweg' || !Array.isArray(data.srs)) return false;
    mem.srs.clear(); mem.custom.clear();
    data.srs.forEach(r => { if (r && r.id) { mem.srs.set(r.id, r); put('srs', r); } });
    (data.custom || []).forEach(r => { if (r && r.id) { mem.custom.set(r.id, r); put('custom', r); } });
    if (data.meta) { meta = Object.assign(defaults(), data.meta); put('meta', { k: 'meta', v: meta }); }
    mem.log = Array.isArray(data.log) ? data.log : [];
    saveLS();
    return true;
  }

  /* ---- day accounting ---- */
  function touchDay() {
    const d = NL.util.dayKey();
    if (meta.doneDay !== d) setMeta({ doneDay: d, doneToday: 0 });
  }
  function creditDay(newItems) {
    const d = NL.util.dayKey();
    const n = Math.max(1, newItems == null ? 1 : newItems);
    const patch = { doneDay: d, doneToday: (meta.doneDay === d ? meta.doneToday : 0) + n };
    if (meta.lastDay !== d) {
      patch.streak = (meta.lastDay && NL.util.dayDiff(meta.lastDay, d) === 1) ? meta.streak + 1 : 1;
      patch.lastDay = d;
      patch.best = Math.max(meta.best || 0, patch.streak);
    }
    setMeta(patch);
  }

  return { open, migrate, onWrite, rec, setRec, allRecs, seenCount, meta: m, setMeta, logReview, logs, addCustom, putCustom, delCustom, customs, clearAll, touchDay, creditDay, exportAll, importAll, get storage() { return useIDB ? 'IndexedDB' : 'localStorage'; } };
})();
</script>
<script>
/* Le planificateur. C'est lui, et pas un arbre de leçons, qui décide.
   rung   = position sur l'échelle de production
   due    = quand l'élément revient
   budget = ce qui empêche la dette de révisions d'exploser */
NL.srs = (function () {
  'use strict';
  const { clamp, MIN, DAY } = NL.util;

  const MAX_TASKS = 22;
  const MAX_STAGE = 6;
  const GRADUATED = 5;              // atteint uniquement en disant l'élément à voix haute
  const RETIRE_AT = 200 * DAY;
  const MAX_INTERVAL = 365 * DAY;   // au-delà, l'élément est acquis, pas oublié      // au-delà, l'élément sort du paquet quotidien

  /* Tous les mots ne méritent pas la même montée. Le vocabulaire compris est
     toujours plus large que le vocabulaire produit : on comprend 4 000 mots, on
     en produit 1 500. Le palier dit jusqu'où un élément doit grimper. */
  const TIER_MAX = { produce: 6, write: 4, recognise: 2 };
  const maxRung = item => TIER_MAX[(item && item.tier) || 'produce'];

  /* Un rythme, et le prix honnête qui va avec. */
  const PACE = {
    calme:     { cap: 70,  fresh: 15, mins: 15 },
    normal:    { cap: 120, fresh: 25, mins: 25 },
    intensif:  { cap: 200, fresh: 40, mins: 45 }
  };
  const pace = () => PACE[NL.state.meta().pace || 'normal'] || PACE.normal;

  /* Chaque échelon propose un ENSEMBLE de types, pas un seul. Avec quatorze
     passages par élément, la variété n'est pas un ornement : c'est la seule
     chose qui rend 26 000 exercices supportables. */
  const RUNGS = {
    word: [
      ['pick'],
      ['article', 'recall', 'intrus'],
      ['dictation', 'type'],
      ['type', 'cloze'],
      ['type', 'cloze', 'dictation'],
      ['speak'],
      ['speak', 'type', 'dictation', 'cloze']
    ],
    phrase: [
      ['pick'],
      ['bank', 'vlaams'],
      ['cloze', 'corrige'],
      ['dictation', 'corrige'],
      ['type', 'cloze', 'corrige'],
      ['speak'],
      ['speak', 'type', 'open', 'corrige', 'dictation']
    ],
    chunk: [
      ['pick'],
      ['bank', 'vlaams'],
      ['cloze'],
      ['type', 'dictation'],
      ['type', 'dictation', 'cloze'],
      ['speak'],
      ['speak', 'type', 'cloze']
    ],
    pattern: [
      ['order'],
      ['order', 'corrige'],
      ['cloze', 'corrige'],
      ['type', 'order'],
      ['speak', 'open'],
      ['speak'],
      ['open', 'speak']
    ]
  };

  /* Sous la journée, l'élément reste dans la même séance ; au-dessus, SM-2 prend le relais. */
  const STEP = [2 * MIN, 12 * MIN, 1 * DAY, 3 * DAY, 8 * DAY, 21 * DAY];

  const blank = (id, kind) => ({
    id, kind: kind || 'word', stage: 0, due: 0, interval: 0,
    ease: 2.5, reps: 0, lapses: 0, last: 0, said: false, retired: false, lastEx: null
  });
  const recOf = item => NL.state.rec(item.id) || blank(item.id, item.kind);

  /* ---------------- choix de l'exercice ---------------- */
  /* `avoid` = les types déjà servis dans cette séance. Le gouverneur évite ce que
     l'élément a eu la dernière fois, puis ce qui vient de passer. */
  function exerciseFor(item, avoid) {
    const r = recOf(item);
    const set = (RUNGS[item.kind] || RUNGS.word)[clamp(r.stage, 0, 6)] || ['pick'];
    let usable = set.filter(n => supports(item, n));
    if (!usable.length) usable = [fallback(item)];

    let pick = usable.filter(n => n !== r.lastEx);
    if (!pick.length) pick = usable;
    if (avoid && avoid.size) {
      const fresher = pick.filter(n => !avoid.has(n));
      if (fresher.length) pick = fresher;
    }
    return pick[(Math.random() * pick.length) | 0];
  }

  /* Un type n'est proposé que si l'élément peut réellement le porter. */
  function supports(item, name) {
    const words = NL.util.tiles(item.nl || '').length;
    switch (name) {
      case 'article': return !!item.art;
      case 'vlaams': return !!item.be && NL.util.norm(item.be) !== NL.util.norm(item.nl);
      case 'bank': case 'cloze': case 'order': case 'corrige': return words >= 3;
      case 'open': return !!item.open;
      case 'intrus': return item.kind === 'word' && !!item.art;
      default: return true;
    }
  }
  const fallback = item => (NL.util.tiles(item.nl || '').length >= 3 ? 'type' : 'pick');

  /* ---------------- notation ---------------- */
  function grade(item, ok, opts) {
    const r = recOf(item);
    const now = Date.now();
    const top = maxRung(item);
    r.kind = item.kind || r.kind;
    r.reps++; r.last = now;
    if (opts && opts.ex) r.lastEx = opts.ex;

    if (ok) {
      if (opts && opts.spoken) r.said = true;
      /* Les transparents (de tram, de garage, direct) ne méritent pas douze
         passages : la première réussite en saute deux. */
      const jump = (r.reps === 1 && item.cognate) ? 3 : 1;
      r.stage = clamp(r.stage + jump, 0, top);
      r.ease = clamp(r.ease + 0.05, 1.3, 2.9);
      /* PIÈGE 1 — au sommet de son palier, l'intervalle doit continuer de croître.
         Figé sur STEP[rung], l'élément revient tous les jours, à vie. */
      r.interval = r.stage >= top
        ? Math.min(MAX_INTERVAL, Math.round((r.interval || STEP[Math.min(top, STEP.length - 1)]) * r.ease))
        : STEP[r.stage];
      if (r.stage >= top && r.interval > RETIRE_AT) r.retired = true;
    } else {
      r.lapses++;
      /* PIÈGE 2 — une rechute rentre dans l'échelle, elle ne repart pas de deux
         minutes pour remonter en multipliant : sinon l'élément oscille sous son
         plafond sans jamais en sortir. */
      /* Jamais en dessous de l'échelon 1 : on ne te REPRÉSENTE pas un mot que tu
         connais depuis des mois, on te le redemande autrement. */
      r.stage = clamp(r.stage - 2, r.reps > 1 ? 1 : 0, top);
      r.ease = clamp(r.ease - 0.2, 1.3, 2.9);
      r.interval = STEP[Math.min(r.stage, STEP.length - 1)];
      r.retired = false;
    }
    r.due = now + r.interval;
    NL.state.setRec(r);
    NL.state.logReview({ id: item.id, t: now, ok: !!ok, stage: r.stage, kind: r.kind, ex: (opts && opts.ex) || null });
    return r;
  }

  /* Place un élément directement sur un échelon — test de placement, mots transparents. */
  function seed(item, stage) {
    const r = blank(item.id, item.kind);
    r.stage = clamp(stage, 0, maxRung(item));
    r.reps = 1;
    r.interval = STEP[Math.min(r.stage, STEP.length - 1)];
    r.due = Date.now() + r.interval;
    NL.state.setRec(r);
    return r;
  }

  const isSeen = item => !!NL.state.rec(item.id);
  const stageOf = item => { const r = NL.state.rec(item.id); return r ? r.stage : -1; };
  const atTop = item => { const r = NL.state.rec(item.id); return !!r && r.stage >= maxRung(item); };

  function dueItems(now) {
    now = now || Date.now();
    const list = NL.content.allItems().filter(it => {
      const r = NL.state.rec(it.id);
      return r && !r.retired && r.due <= now;
    });
    /* Mélange puis tri stable par échéance : les vrais retards passent devant,
       mais un arriéré tombé au même instant est puisé uniformément au lieu de
       rendre la même tranche à chaque séance. */
    return NL.util.shuffle(list).sort((a, b) => NL.state.rec(a.id).due - NL.state.rec(b.id).due);
  }

  function counts() {
    const now = Date.now();
    let due = 0, learning = 0, mature = 0, said = 0, retired = 0;
    NL.state.allRecs().forEach(r => {
      if (r.retired) { retired++; mature++; return; }
      if (r.due <= now) due++;
      if (r.stage >= GRADUATED) mature++; else learning++;
      if (r.said) said++;
    });
    return { due, learning, mature, said, retired, seen: NL.state.seenCount() };
  }

  /* ---------------- budget quotidien ---------------- */
  /* Le seul mécanisme qui empêche la dette de révisions de transformer le mois six
     en deux heures par jour. Ce qui déborde attend, et ne s'affiche jamais comme
     un arriéré culpabilisant. */
  function budgetLeft() {
    const m = NL.state.meta();
    const today = NL.util.dayKey();
    const done = m.exDay === today ? (m.exToday || 0) : 0;
    return Math.max(0, pace().cap - done);
  }
  function spend(n) {
    const m = NL.state.meta();
    const today = NL.util.dayKey();
    NL.state.setMeta({ exDay: today, exToday: (m.exDay === today ? (m.exToday || 0) : 0) + (n || 1) });
  }

  /* Du nouveau seulement si la journée a de la place une fois les révisions faites. */
  function freshItems(n) {
    const out = [];
    for (const it of NL.content.allItems()) {
      if (out.length >= n) break;
      if (NL.state.rec(it.id)) continue;
      if (!NL.content.unitOpen(it.unit)) continue;
      out.push(it);
    }
    return out;
  }

  function plan() {
    const left = budgetLeft();
    const due = Math.min(dueItems().length, left);
    const room = Math.max(0, left - due);
    const fresh = freshItems(Math.min(room, pace().fresh)).length;
    const total = Math.min(due + fresh, MAX_TASKS);
    return { due, fresh, total, left, mins: Math.max(1, Math.round(total * 0.22)) };
  }

  return {
    RUNGS, STEP, PACE, MAX_STAGE, MAX_TASKS, GRADUATED, TIER_MAX, RETIRE_AT,
    maxRung, pace, exerciseFor, supports, grade, seed, isSeen, stageOf, atTop,
    dueItems, counts, freshItems, plan, recOf, budgetLeft, spend
  };
})();
</script>
<script>
/* Speech in both directions, degrading honestly when the browser cannot help. */
NL.speech = (function () {
  'use strict';
  const { norm, words, diffWords, ratio } = NL.util;

  /* Words a recogniser may drop without changing what you said. Negation
     (niet, geen, nooit) and place words are deliberately absent — losing those
     inverts the sentence. */
  const FUNCTION_WORDS = new Set(['de', 'het', 'een', 'ik', 'je', 'jij', 'ge', 'gij', 'u',
    'hij', 'zij', 'ze', 'wij', 'we', 'er', 'en', 'in', 'op', 'aan', 'te', 'van', 'met',
    'voor', 'bij', 'naar', 'dat', 'dit', 'is', 'om', 'zo', 'ook', 'wel', 'eens', 'hè', 'al']);

  /* ---------------- out: text to speech ---------------- */
  let voices = [], chosen = null, quality = 'none';

  function scan() {
    if (!('speechSynthesis' in window)) return;
    voices = speechSynthesis.getVoices() || [];
    const be = voices.filter(v => /^nl[-_]BE/i.test(v.lang));
    const nl = voices.filter(v => /^nl/i.test(v.lang));
    if (be.length) { chosen = be[0]; quality = 'be'; }
    else if (nl.length) { chosen = nl[0]; quality = 'nl'; }
    else { chosen = null; quality = voices.length ? 'none' : 'unknown'; }
  }
  if ('speechSynthesis' in window) {
    scan();
    speechSynthesis.addEventListener('voiceschanged', scan);
  }

  const canSpeak = () => 'speechSynthesis' in window;
  const voiceInfo = () => ({
    quality,                                  // 'be' | 'nl' | 'none' | 'unknown'
    name: chosen ? chosen.name : null,
    lang: chosen ? chosen.lang : null,
    note: quality === 'be' ? 'Voix flamande trouvée.'
      : quality === 'nl' ? 'Seule une voix des Pays-Bas est installée : l’audio a donc l’accent du nord, avec un g raclé là où la Flandre utilise un g doux.'
        : 'Aucune voix néerlandaise trouvée. L’audio retombe sur la voix par défaut du navigateur et ne sonnera pas néerlandais.'
  });

  let lastSpoken = 0;
  function say(text, opts) {
    opts = opts || {};
    if (!canSpeak() || !text) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text));
      u.lang = quality === 'be' ? 'nl-BE' : 'nl-NL';
      if (chosen) u.voice = chosen;
      u.rate = opts.rate || 1;
      u.pitch = 1;
      if (opts.onend) u.onend = opts.onend;
      lastSpoken = Date.now();
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  const stop = () => { try { speechSynthesis.cancel(); } catch (e) {} };

  /* ---------------- in: speech recognition ---------------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;

  const UA = (typeof navigator !== 'undefined' && navigator.userAgent) || '';
  /* Opera defines webkitSpeechRecognition but ships no service behind it: calls
     fail silently or report a network error, which would otherwise be reported to
     the user as "check your connection". Treat it as having none. */
  const OPERA = /OPR\/|Opera/i.test(UA);
  function browserName() {
    if (OPERA) return 'Opera';
    if (/Edg\//.test(UA)) return 'Edge';
    if (/Firefox\//.test(UA)) return 'Firefox';
    if (/Chrome\//.test(UA)) return 'Chrome';
    if (/Safari\//.test(UA)) return 'Safari';
    return 'ton navigateur';
  }

  const canListen = () => !!SR && !OPERA && navigator.onLine !== false;
  const listenBlocked = () => (!SR || OPERA) ? 'browser' : navigator.onLine === false ? 'offline' : null;

  let active = null;
  function listen(opts) {
    opts = opts || {};
    if (!SR) { opts.onerror && opts.onerror('browser'); return null; }
    abort();
    let r;
    try { r = new SR(); } catch (e) { opts.onerror && opts.onerror('browser'); return null; }
    r.lang = 'nl-BE';
    r.interimResults = true;
    r.maxAlternatives = 5;
    r.continuous = false;

    let finalText = '', alts = [];
    r.onresult = e => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const res = e.results[i];
        if (res.isFinal) {
          finalText += res[0].transcript + ' ';
          for (let k = 0; k < res.length; k++) alts.push(res[k].transcript);
        } else {
          opts.onpartial && opts.onpartial(res[0].transcript);
        }
      }
    };
    r.onerror = e => {
      const kind = e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'denied'
        : e.error === 'no-speech' ? 'silence'
          : e.error === 'network' ? 'network' : e.error || 'error';
      active = null;
      opts.onerror && opts.onerror(kind);
    };
    r.onend = () => { active = null; opts.onend && opts.onend(finalText.trim(), alts); };

    try { r.start(); active = r; } catch (e) { opts.onerror && opts.onerror('error'); return null; }
    return r;
  }
  function abort() { if (active) { try { active.abort(); } catch (e) {} active = null; } }

  /* ---------------- record and compare ----------------
     Opera has no recognition service, so scoring is impossible there. Recording
     yourself and playing it against the model needs no service at all, works
     offline, and is how language labs worked for fifty years. */
  let mediaRec = null, chunks = [], lastUrl = null;
  const canRecord = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  const hasRecording = () => !!lastUrl;

  function record(opts) {
    opts = opts || {};
    if (!canRecord()) { opts.onerror && opts.onerror('browser'); return; }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      chunks = [];
      let mr;
      try { mr = new MediaRecorder(stream); }
      catch (e) { try { mr = new MediaRecorder(stream, { mimeType: 'audio/webm' }); } catch (e2) { opts.onerror && opts.onerror('format'); return; } }
      mediaRec = mr;
      mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      mr.onstop = () => {
        stream.getTracks().forEach(tr => tr.stop());
        if (lastUrl) URL.revokeObjectURL(lastUrl);
        try {
          lastUrl = URL.createObjectURL(new Blob(chunks, { type: mr.mimeType || 'audio/webm' }));
        } catch (e) { lastUrl = null; }
        mediaRec = null;
        opts.onstop && opts.onstop(lastUrl);
      };
      mr.start();
      opts.onstart && opts.onstart();
    }).catch(err => {
      /* In an embedded frame the permission may never even be offered. */
      const name = err && err.name;
      opts.onerror && opts.onerror(
        name === 'NotAllowedError' ? (window.self !== window.top ? 'framed' : 'denied')
          : name === 'NotFoundError' ? 'nomic' : 'blocked');
    });
  }
  function stopRecord() { try { if (mediaRec && mediaRec.state !== 'inactive') mediaRec.stop(); } catch (e) {} }
  function playRecording(onend) {
    if (!lastUrl) return null;
    const a = new Audio(lastUrl);
    if (onend) a.onended = onend;
    a.play().catch(() => {});
    return a;
  }
  /* Model first, then your own voice, with a beat between them. */
  function playBoth(text) {
    say(text, { onend: () => setTimeout(() => playRecording(), 350) });
  }
  function clearRecording() {
    if (lastUrl) { URL.revokeObjectURL(lastUrl); lastUrl = null; }
  }

  /* ---------------- scoring ---------------- */
  /* Scores the best of the alternatives the recogniser offered, so a single
     misheard word does not sink an otherwise correct sentence. */
  function score(heardList, target) {
    const cands = (Array.isArray(heardList) ? heardList : [heardList]).filter(Boolean);
    if (!cands.length) return { pct: 0, parts: diffWords('', target), heard: '', pass: false };
    let best = null;
    cands.forEach(h => {
      const parts = diffWords(h, target);
      const hit = parts.filter(p => p.ok).length;
      const extra = Math.max(0, words(h).length - words(target).length);
      const pct = Math.round(Math.max(0, hit / Math.max(1, parts.length) - extra * 0.06) * 100);
      if (!best || pct > best.pct) best = { pct, parts, heard: h };
    });
    /* Passing is not a percentage. Recognisers routinely swallow small
       grammatical words without it meaning you said the sentence wrong, so those
       are forgiven — but a missed content word changes what you said, and a
       percentage bar would happily let "ik ben Frans aan het leren" through. */
    const missed = best.parts.filter(p => !p.ok).map(p => norm(p.word));
    const slack = Math.max(1, Math.floor(words(target).length / 6));
    best.pass = norm(best.heard) === norm(target) || missed.length === 0 ||
      (missed.every(m => FUNCTION_WORDS.has(m)) && missed.length <= slack);
    best.missed = missed;
    return best;
  }

  /* Which tier this browser puts you in — the audio doctor reports this. */
  function tier() {
    const framed = window.self !== window.top;
    if (canListen() && quality === 'be') return { id: 'full', framed };
    if (canListen()) return { id: 'scored', framed };
    if (canRecord()) return { id: 'compare', framed };
    return { id: 'self', framed };
  }

  return {
    canSpeak, say, stop, voiceInfo, rescanVoices: scan, voices: () => voices,
    canListen, listenBlocked, listen, abort, score, ratio,
    canRecord, hasRecording, record, stopRecord, playRecording, playBoth, clearRecording, tier, browserName
  };
})();
</script>
<script>
/* Interface sounds. Synthesised, so nothing to download and nothing to cache. */
NL.audio = (function () {
  'use strict';
  let ctx = null;
  const on = () => NL.state.meta().sfx !== false;

  function tone(seq, type) {
    if (!on()) return;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      seq.forEach(([f, t, v]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type || 'sine';
        o.frequency.setValueAtTime(f, ctx.currentTime + t);
        g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(v || 0.12, ctx.currentTime + t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.2);
        o.connect(g); g.connect(ctx.destination);
        o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.24);
      });
    } catch (e) {}
  }

  return {
    ok:   () => tone([[620, 0], [880, 0.08]]),
    no:   () => tone([[190, 0], [140, 0.09]], 'sawtooth'),
    win:  () => tone([[523, 0], [659, 0.08], [784, 0.16], [1047, 0.24]]),
    tick: () => tone([[440, 0, 0.05]]),
    mic:  () => tone([[880, 0, 0.07], [1175, 0.06, 0.07]])
  };
})();
</script>
<script>
/* Synchronisation avec Supabase.

   L'appareil reste la source de vérité immédiate : chaque écriture part d'abord
   dans IndexedDB, comme avant, puis dans une boîte d'envoi persistée. La boîte
   se vide vers la base dès qu'il y a du réseau. Dans le train, rien ne change ;
   au retour, tout rattrape.

   Conflits : par élément, la révision la plus récente gagne. Pour les réglages,
   une fusion champ par champ — l'XP d'un appareil ne doit pas effacer celle de
   l'autre.

   Sans configuration (pas d'URL Supabase au build), tout ce module est inerte et
   l'app fonctionne en local exactement comme avant. */
NL.sync = (function () {
  'use strict';
  const cfg = window.NL_CONFIG || {};
  const lib = window.supabase;
  const enabled = !!(cfg.supabaseUrl && cfg.supabaseAnonKey && lib && lib.createClient);

  const QKEY = 'vlaams/outbox';
  const OWNER = 'vlaams/owner';
  const PAGE = 1000;
  const LOG_DAYS = 45;

  let client = null, user = null;
  let state = enabled ? 'idle' : 'off';     // off | idle | syncing | error | offline
  let lastSync = null, lastError = null, timer = null, flushing = null;
  const subs = [];

  /* ---------------- boîte d'envoi ---------------- */
  const empty = () => ({ recs: {}, customs: {}, meta: false, logs: [] });
  let box = load();
  function load() {
    try { return Object.assign(empty(), JSON.parse(localStorage.getItem(QKEY) || '{}')); }
    catch (e) { return empty(); }
  }
  function persist() { try { localStorage.setItem(QKEY, JSON.stringify(box)); } catch (e) {} }
  const pending = () => Object.keys(box.recs).length + Object.keys(box.customs).length +
    (box.meta ? 1 : 0) + box.logs.length;

  const owner = () => { try { return localStorage.getItem(OWNER); } catch (e) { return null; } };
  const setOwner = id => { try { id ? localStorage.setItem(OWNER, id) : localStorage.removeItem(OWNER); } catch (e) {} };

  function notify() { subs.forEach(fn => { try { fn(status()); } catch (e) {} }); }
  const onChange = fn => subs.push(fn);

  /* Chaque écriture locale atterrit ici. On ne garde que la dernière version
     d'un élément : dix révisions hors ligne ne font qu'une ligne à envoyer. */
  NL.state.onWrite((type, v) => {
    if (!enabled) return;
    if (type === 'rec') box.recs[v.id] = 1;
    else if (type === 'meta') box.meta = true;
    else if (type === 'custom') box.customs[v.id] = 1;
    else if (type === 'custom-del') box.customs[v] = 'deleted';
    else if (type === 'log') { box.logs.push(v); if (box.logs.length > 5000) box.logs.shift(); }
    persist();
    schedule();
  });

  function queueAll() {
    NL.state.allRecs().forEach(r => { box.recs[r.id] = 1; });
    NL.state.customs().forEach(c => { box.customs[c.id] = 1; });
    NL.state.logs().forEach(l => box.logs.push(l));
    box.meta = true;
    persist();
  }

  function schedule(ms) {
    if (!user) return;
    clearTimeout(timer);
    timer = setTimeout(() => flush(), ms == null ? 2500 : ms);
  }

  /* ---------------- connexion ---------------- */
  async function init() {
    if (!enabled) return null;
    client = lib.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'pkce' }
    });
    client.auth.onAuthStateChange((event, session) => {
      const next = session && session.user;
      if (event === 'SIGNED_IN' && next && (!user || user.id !== next.id)) {
        user = next;
        adopt().then(() => { notify(); if (NL.ui && NL.ui.onAuth) NL.ui.onAuth(); });
      }
      if (event === 'SIGNED_OUT') { user = null; notify(); }
    });
    try {
      const { data } = await client.auth.getSession();
      user = data && data.session ? data.session.user : null;
    } catch (e) { user = null; }
    if (user) adopt().then(notify, notify);   // l'interface s'affiche sans attendre le réseau
    window.addEventListener('online', () => { state = 'idle'; notify(); flush(); });
    window.addEventListener('offline', () => { state = 'offline'; notify(); });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') flush();
      else if (user) pull().then(() => flush());   // retour sur l'onglet : rattraper les autres appareils
    });
    setInterval(() => flush(), 60000);
    return user;
  }

  /* Rattache les données de cet appareil au compte connecté.
     - appareil vierge ou déjà à ce compte : on tire puis on pousse ;
     - progression anonyme : elle est adoptée par le compte ;
     - un AUTRE compte avait utilisé cet appareil : ses données sont effacées
       d'abord, pour ne jamais mélanger deux personnes. */
  /* Le retour du lien magique déclenche à la fois l’événement de connexion et
     getSession : un seul rattachement par compte. */
  let adopting = null, adoptedFor = null;
  function adopt() {
    if (adoptedFor === user.id && adopting) return adopting;
    adoptedFor = user.id;
    adopting = doAdopt().catch(e => { adoptedFor = null; throw e; });
    return adopting;
  }
  async function doAdopt() {
    const prev = owner();
    if (prev && prev !== user.id) {
      await NL.state.clearAll();
      box = empty(); persist();
    } else if (!prev && NL.state.seenCount() + NL.state.customs().length > 0) {
      queueAll();
    }
    setOwner(user.id);
    await pull();
    await flush();
  }

  async function signIn(email) {
    if (!enabled) return { error: 'off' };
    const { error } = await client.auth.signInWithOtp({
      email, options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: true }
    });
    return { error: error ? error.message : null };
  }

  /* Le code à six chiffres : indispensable quand le lien s'ouvre dans un autre
     navigateur que celui où tu l'as demandé — cas courant avec Outlook. */
  async function verifyCode(email, token) {
    if (!enabled) return { error: 'off' };
    const { data, error } = await client.auth.verifyOtp({ email, token: String(token).trim(), type: 'email' });
    if (error) return { error: error.message };
    if (data && data.user && (!user || user.id !== data.user.id)) { user = data.user; await adopt(); notify(); }
    return { error: null };
  }

  /* Déconnexion : on envoie ce qui reste, puis on efface l'appareil pour que la
     personne suivante ne voie rien. */
  async function signOut() {
    if (!enabled || !user) return;
    try { await flush(); } catch (e) {}
    await client.auth.signOut();
    await NL.state.clearAll();
    box = empty(); persist(); setOwner(null);
    user = null; adopting = null; adoptedFor = null; notify();
  }

  /* ---------------- tirer ---------------- */
  async function selectAll(table, filter) {
    const rows = [];
    for (let from = 0; ; from += PAGE) {
      let q = client.from(table).select('*');
      if (filter) q = filter(q);
      const { data, error } = await q.range(from, from + PAGE - 1);
      if (error) throw error;
      rows.push.apply(rows, data || []);
      if (!data || data.length < PAGE) return rows;
    }
  }

  async function pull() {
    if (!user) return;
    state = 'syncing'; notify();
    try {
      const recs = await selectAll('srs_records');
      recs.forEach(row => {
        const local = NL.state.rec(row.item_id);
        if (box.recs[row.item_id] && local && (local.updatedAt || 0) >= row.updated_at) return;
        if (!local || (local.updatedAt || 0) < row.updated_at) {
          NL.state.setRec(Object.assign({}, row.data, { id: row.item_id, updatedAt: row.updated_at }), true);
        }
      });

      const words = await selectAll('custom_words');
      words.forEach(row => {
        const local = NL.state.customs().find(c => c.id === row.id);
        if ((local && (local.updatedAt || 0) >= row.updated_at) || box.customs[row.id]) return;
        if (row.deleted) { if (local) NL.state.delCustom(row.id, true); }
        else NL.state.putCustom(Object.assign({}, row.data, { id: row.id, updatedAt: row.updated_at }), true);
      });

      const metaRows = await selectAll('user_meta');
      if (metaRows[0]) {
        const merged = mergeMeta(NL.state.meta(), metaRows[0].data);
        NL.state.setMeta(merged, true);
        if (JSON.stringify(merged) !== JSON.stringify(metaRows[0].data)) { box.meta = true; persist(); }
      } else {
        box.meta = true; persist();
      }

      const since = Date.now() - LOG_DAYS * 86400000;
      const have = new Set(NL.state.logs().map(l => l.t + '|' + l.id));
      const logs = await selectAll('review_log', q => q.gte('t', since));
      logs.sort((a, b) => a.t - b.t).forEach(row => {
        if (!have.has(row.t + '|' + row.item_id)) NL.state.logReview(row.data, true);
      });

      NL.content.refresh();
      done();
    } catch (e) { fail(e); }
  }

  /* ---------------- pousser ---------------- */
  function flush() {
    if (!user || !enabled) return Promise.resolve();
    if (typeof navigator !== 'undefined' && navigator.onLine === false) { state = 'offline'; notify(); return Promise.resolve(); }
    if (flushing) return flushing;
    flushing = doFlush().finally(() => { flushing = null; });
    return flushing;
  }

  async function doFlush() {
    if (!pending()) { done(); return; }
    state = 'syncing'; notify();
    /* On prend un instantané et on vide la boîte : ce qui s'écrit PENDANT
       l'envoi repart dans une boîte neuve au lieu d'être effacé par erreur. */
    const snap = box; box = empty(); persist();
    try {
      const uid = user.id;
      const recRows = Object.keys(snap.recs).map(id => NL.state.rec(id)).filter(Boolean).map(r => ({
        user_id: uid, item_id: r.id, data: r, updated_at: r.updatedAt || Date.now()
      }));
      for (let i = 0; i < recRows.length; i += 500) {
        const { error } = await client.from('srs_records').upsert(recRows.slice(i, i + 500), { onConflict: 'user_id,item_id' });
        if (error) throw error;
      }

      const now = Date.now();
      const wordRows = Object.keys(snap.customs).map(id => {
        if (snap.customs[id] === 'deleted') return { user_id: uid, id, data: {}, deleted: true, updated_at: now };
        const c = NL.state.customs().find(x => x.id === id);
        return c ? { user_id: uid, id, data: c, deleted: false, updated_at: c.updatedAt || now } : null;
      }).filter(Boolean);
      if (wordRows.length) {
        const { error } = await client.from('custom_words').upsert(wordRows, { onConflict: 'user_id,id' });
        if (error) throw error;
      }

      if (snap.meta) {
        /* Les réglages se fusionnent avec la copie du serveur AVANT l'envoi :
           l'XP gagnée ailleurs pendant que cet appareil était hors ligne reste. */
        const { data: remote, error: readErr } = await client.from('user_meta').select('*').range(0, 0);
        if (readErr) throw readErr;
        if (remote && remote[0]) NL.state.setMeta(mergeMeta(NL.state.meta(), remote[0].data), true);
        const m = NL.state.meta();
        const { error } = await client.from('user_meta').upsert(
          { user_id: uid, data: m, updated_at: m.updatedAt || now }, { onConflict: 'user_id' });
        if (error) throw error;
      }

      const logRows = snap.logs.filter(l => l && l.id && l.t).map(l => ({ user_id: uid, t: l.t, item_id: l.id, data: l }));
      for (let i = 0; i < logRows.length; i += 500) {
        const { error } = await client.from('review_log').upsert(logRows.slice(i, i + 500),
          { onConflict: 'user_id,t,item_id', ignoreDuplicates: true });
        if (error) throw error;
      }
      done();
    } catch (e) {
      /* Échec : on remet l'instantané dans la boîte, fusionné avec ce qui est
         arrivé entre-temps. Rien n'est perdu ; on réessaie plus tard. */
      Object.assign(snap.recs, box.recs);
      Object.assign(snap.customs, box.customs);
      snap.meta = snap.meta || box.meta;
      snap.logs = snap.logs.concat(box.logs);
      box = snap; persist();
      fail(e);
      schedule(30000);
    }
  }

  function done() { state = 'idle'; lastSync = Date.now(); lastError = null; notify(); }
  function fail(e) {
    state = (typeof navigator !== 'undefined' && navigator.onLine === false) ? 'offline' : 'error';
    lastError = (e && e.message) || String(e);
    notify();
  }

  /* ---------------- fusion des réglages ---------------- */
  /* Le cumul se prend au maximum, les listes s'unissent, la série suit le jour
     le plus récent, et le reste — thème, rythme, prénom — revient à la version
     modifiée en dernier. */
  function mergeMeta(a, b) {
    a = a || {}; b = b || {};
    const newer = (a.updatedAt || 0) >= (b.updatedAt || 0) ? a : b;
    const out = Object.assign({}, newer === a ? b : a, newer);
    out.xp = Math.max(a.xp || 0, b.xp || 0);
    out.best = Math.max(a.best || 0, b.best || 0, a.streak || 0, b.streak || 0);
    const la = a.lastDay || '', lb = b.lastDay || '';
    if (la !== lb) { const w = la > lb ? a : b; out.lastDay = w.lastDay; out.streak = w.streak; }
    else out.streak = Math.max(a.streak || 0, b.streak || 0);
    ['doneDay', 'exDay'].forEach(k => {
      const cnt = k === 'doneDay' ? 'doneToday' : 'exToday';
      const da = a[k] || '', db = b[k] || '';
      if (da === db) out[cnt] = Math.max(a[cnt] || 0, b[cnt] || 0);
      else { const w = da > db ? a : b; out[k] = w[k]; out[cnt] = w[cnt]; }
    });
    ['scenariosDone', 'listenDone'].forEach(k => {
      out[k] = Array.from(new Set([].concat(a[k] || [], b[k] || [])));
    });
    out.placed = !!(a.placed || b.placed);
    out.updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0);
    return out;
  }

  function status() {
    return { enabled, state, user: user ? { id: user.id, email: user.email } : null, pending: pending(), lastSync, lastError };
  }

  return {
    enabled, init, signIn, verifyCode, signOut, pull, flush, queueAll, status, onChange, mergeMeta,
    get user() { return user; }
  };
})();
</script>
<script>
/* Lexique A1, unités 1 à 6.
   nl = néerlandais standard, ce que tu écris dans un mail au travail.
   fr = français de Belgique (septante, nonante).
   be = ce qu'on dit vraiment en Brabant flamand. Produis le nl, comprends le be.
   note = ce qu'un manuel ne dit jamais. */
NL.content = NL.content || {};
NL.content.units = NL.content.units || [];
(function () {
  'use strict';
  const W = (nl, fr, art, be, note) => ({ kind: 'word', nl, fr, art, be, note });
  const P = (nl, fr, be, note) => ({ kind: 'phrase', nl, fr, be, note });
  const U = o => NL.content.units.push(o);

  U({
    id: 'overleven', n: 1, name: 'Survivre', nlName: 'Overleven', level: 'A1', track: 'leven', icon: '\u{1F9ED}',
    blurb: 'Les phrases qui gardent la conversation en néerlandais au lieu de la laisser basculer en français.',
    grammar: ['g-v2'],
    words: [
      W('hallo', 'bonjour', null, 'hey, salut', 'En Flandre, « hey » et « salut » servent pour dire bonjour ET au revoir.'),
      W('goeiedag', 'bonjour', null, 'goeiendag', 'Le bonjour passe-partout dans un magasin. Le nord dit « goedendag ».'),
