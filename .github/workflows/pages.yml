# Builds from source and publishes to GitHub Pages.
# The build is never trusted blindly: every test suite has to pass first, in the
# four voice/browser combinations that matter, or nothing is deployed.
name: Build, test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build index.html and artifact.html
        run: sh build.sh

      - name: Test
        run: |
          set -e
          node test/smoke.js    "$PWD"
          node test/sim.js      "$PWD"
          node test/firstrun.js "$PWD"
          for c in "nl-BE OPR" "nl-NL OPR" "none OPR" "nl-BE EDG"; do
            set -- $c
            echo "--- journey $1 $2 ---"
            node test/journey.js "$PWD" "$1" "$2"
          done

      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r icons _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
