# Every push is tested. Deployment is Vercel's job: it builds from the same
# commit through vercel.json, so a red run here means don't trust that deploy.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Une seule liste de tests, la même qu'en local : test/run-all.sh.
      - name: Build and test
        run: sh test/run-all.sh

      - name: Build with sync switched on
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: test-key
        run: |
          sh build.sh
          grep -q 'supabaseUrl:"https://example.supabase.co"' dist/index.html
          grep -q 'FunctionsRelayError' dist/index.html
          ! grep -q 'FunctionsRelayError' artifact.html
