<title>Vlaams</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Vlaams — design system.
   Bottle green carries structure, amber carries action, green/red mean only
   right/wrong. Stone neutrals biased slightly green so nothing reads as default grey. */

:root{
  --stone:#F1F2EE; --card:#FFFFFF; --sunk:#E7EAE3;
  --ink:#15211C; --ink-2:#4A5B53; --ink-3:#84958C;
  --line:#DDE1D9; --line-2:#C4CBBE;
  --groen:#1F4B3F; --groen-deep:#123027; --groen-soft:#E1EDE7;
  --amber:#D98324; --amber-deep:#A4600F; --amber-soft:#FBEDDB;
  --goed:#2E7D4F; --goed-deep:#1C5334; --goed-soft:#E2F0E7;
  --fout:#C43A32; --fout-deep:#8E241E; --fout-soft:#FBE6E4;
  --goud:#B9871F; --goud-soft:#F8EFD9;
  --r:14px; --r-lg:20px;
  --display:"Archivo","Segoe UI",system-ui,sans-serif;
  --body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --shadow:0 1px 2px rgba(21,33,28,.06), 0 8px 24px -16px rgba(21,33,28,.22);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --stone:#0E1512; --card:#17211D; --sunk:#202C26;
    --ink:#E9EFEA; --ink-2:#A3B4AB; --ink-3:#6F837A;
    --line:#25332C; --line-2:#35473E;
    --groen:#54A186; --groen-deep:#2C6353; --groen-soft:#15251F;
    --amber:#F09A3E; --amber-deep:#A4600F; --amber-soft:#2B2114;
    --goed:#4CB579; --goed-deep:#9BDFB8; --goed-soft:#122820;
    --fout:#E8615A; --fout-deep:#FFB8B2; --fout-soft:#2B1614;
    --goud:#DDB05A; --goud-soft:#2A2314;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --stone:#0E1512; --card:#17211D; --sunk:#202C26;
  --ink:#E9EFEA; --ink-2:#A3B4AB; --ink-3:#6F837A;
  --line:#25332C; --line-2:#35473E;
  --groen:#54A186; --groen-deep:#2C6353; --groen-soft:#15251F;
  --amber:#F09A3E; --amber-deep:#A4600F; --amber-soft:#2B2114;
  --goed:#4CB579; --goed-deep:#9BDFB8; --goed-soft:#122820;
  --fout:#E8615A; --fout-deep:#FFB8B2; --fout-soft:#2B1614;
  --goud:#DDB05A; --goud-soft:#2A2314;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stone);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}
h1,h2,h3,h4,h5{font-family:var(--display);font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
.muted{color:var(--ink-3)} .small{font-size:13px}
.ex{font-family:var(--mono);font-size:.92em;background:var(--sunk);padding:1px 6px;border-radius:5px}
.eyebrow{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--groen);display:block}
.empty{text-align:center;color:var(--ink-3);padding:42px 18px}

/* ---------- buttons ---------- */
.btn{border-radius:var(--r);padding:13px 20px;font-family:var(--display);font-weight:700;font-size:14.5px;
  letter-spacing:.01em;background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line-2);
  transition:transform .07s,box-shadow .07s,background .14s,opacity .14s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line-2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--amber);color:#231202;box-shadow:0 3px 0 var(--amber-deep)}
.btn-primary:active:not(:disabled){box-shadow:0 1px 0 var(--amber-deep)}
.btn-blue{background:var(--groen);color:#fff;box-shadow:0 3px 0 var(--groen-deep)}
.btn-blue:active:not(:disabled){box-shadow:0 1px 0 var(--groen-deep)}
.btn-good{background:var(--goed);color:#fff;box-shadow:0 3px 0 #1C5334}
.btn-bad{background:var(--fout);color:#fff;box-shadow:0 3px 0 #8E241E}
.btn-ghost{background:transparent;box-shadow:none;color:var(--ink-2);padding:12px 14px}
.btn-ghost:hover{color:var(--ink);background:var(--sunk)}
.btn-ghost:active{transform:none;box-shadow:none}
.btn-ghost.danger{color:var(--fout)}
.wide{width:100%}
.big{padding:17px 22px;font-size:16px}
.push{margin-left:auto}
.iconbtn{padding:8px;border-radius:10px;color:var(--ink-3);display:inline-grid;place-items:center}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.iconbtn.tiny{padding:4px}

/* ---------- chrome ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.bar-in{max-width:980px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:34px;height:34px;border-radius:10px;background:var(--groen);display:grid;place-items:center;flex:none}
.brand-txt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-txt b{font-family:var(--display);font-size:15.5px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.brand-txt i{font-family:var(--mono);font-style:normal;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.stats{display:flex;align-items:center;gap:13px}
.stat{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.stat.streak{color:var(--amber)} .stat.xp{color:var(--goud)}
.stat.due.hot{color:var(--goed)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav-btn{padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-3);font-size:10.5px;font-weight:600;letter-spacing:.01em}
.nav-btn svg{width:22px;height:22px}
.nav-btn.on{color:var(--groen)}
.nav-btn.on svg{stroke-width:2.4}

.screen{max-width:980px;margin:0 auto;padding-bottom:78px}
.screen.full{max-width:none;padding:0;height:100dvh;overflow:hidden}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 24px}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.card + .card,.cards,.sec,.tri{margin-top:14px}
.lead h1{font-size:25px;margin:4px 0 8px}
.lead p{margin:0;color:var(--ink-2);font-size:14.5px;max-width:58ch}
.lead.slim{padding:18px 20px}
.lead-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.sec{font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-3);margin:26px 0 10px;display:flex;flex-direction:column;gap:2px}
.sec-sub{font-family:var(--body);font-size:13px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink-3)}
.anchor{font-family:var(--body);font-size:13px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink-3)}

.session-card{border-color:var(--groen);border-width:1.5px}
.sc-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.sc-goal{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.session-card h2{font-size:23px}
.sc-sub{margin:6px 0 0;color:var(--ink-2);font-size:14px}
.sc-split{display:flex;gap:16px;margin:16px 0 18px;flex-wrap:wrap}
.seg-stat{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.seg-stat b{font-family:var(--mono);font-size:15px;color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.amber{background:var(--amber)} .dot.green{background:var(--goed)} .dot.blue{background:var(--groen)}

.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 12px;text-align:center}
.s-n{font-family:var(--mono);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.s-l{font-size:11.5px;color:var(--ink-3);margin-top:2px}

.notice{margin-top:14px;background:var(--amber-soft);border:1px solid var(--amber);border-radius:var(--r);padding:13px 15px}
.notice b{font-family:var(--display);font-size:14px;display:block;margin-bottom:3px;color:var(--amber-deep)}
.notice p{margin:0;font-size:13.5px;color:var(--ink-2)}

.cards{display:flex;flex-direction:column;gap:10px}
.tile-card,.scn-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;transition:border-color .14s,transform .07s}
.tile-card:hover,.scn-card:hover{border-color:var(--groen)}
.tile-card:active,.scn-card:active{transform:translateY(1px)}
.tc-icon,.scn-icon{font-size:24px;flex:none;width:38px;height:38px;display:grid;place-items:center;background:var(--sunk);border-radius:11px}
.tc-body,.scn-body{display:flex;flex-direction:column;min-width:0;flex:1}
.tc-body b,.scn-body b{font-family:var(--display);font-size:15px;font-weight:700}
.tc-body i,.scn-body i{font-style:normal;font-size:13px;color:var(--ink-3);line-height:1.4}
.tc-cta,.scn-go{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--groen);flex:none}
.scn-card.done .scn-go{color:var(--ink-3)}

/* ---------- leerpad ---------- */
.unit-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;margin-top:12px}
.unit-card.locked{opacity:.62}
.uc-head{display:flex;align-items:center;gap:13px}
.uc-icon{font-size:24px;width:42px;height:42px;display:grid;place-items:center;background:var(--groen-soft);border-radius:12px;flex:none}
.uc-title{flex:1;min-width:0}
.uc-title h2{font-size:18px;margin-top:1px}
.uc-pct{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--groen);font-variant-numeric:tabular-nums}
.uc-blurb{margin:10px 0 12px;font-size:14px;color:var(--ink-2)}
.prog-line{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar{flex:1;height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar-fill{display:block;height:100%;border-radius:99px;background:var(--groen)}
.prog-line b{font-family:var(--mono);font-size:13px;color:var(--groen)}
.uc-gram{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:13px}
.gram-chip{font-size:12px;background:var(--sunk);border-radius:8px;padding:5px 10px;color:var(--ink-2)}
.gram-chip:hover{background:var(--groen-soft);color:var(--groen)}
.uc-lock{margin:0;font-size:13px;color:var(--ink-3)}

/* ---------- lesson shell ---------- */
.lesson{display:flex;flex-direction:column;height:100dvh;background:var(--stone)}
.lesson-head{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:720px;margin:0 auto;width:100%}
.rail{flex:1;height:12px;border-radius:99px;background:var(--sunk);overflow:hidden}
.rail-fill{height:100%;border-radius:99px;background:var(--goed);transition:width .3s cubic-bezier(.2,.8,.3,1)}
.pill{font-family:var(--mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.combo{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--goud-deep, var(--ink-2));background:var(--goud-soft);border:1px solid var(--goud);border-radius:99px;padding:2px 9px;font-variant-numeric:tabular-nums;white-space:nowrap;animation:combo-pop .25s ease-out}
.combo.hot{background:var(--amber-soft);border-color:var(--amber)}
@keyframes combo-pop{from{transform:scale(.8)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.combo{animation:none}}
.lives{font-size:13px;letter-spacing:1px;white-space:nowrap}
.lives i{font-style:normal;color:var(--ink-3)}
.record{font-weight:700;color:var(--goed-deep);margin:0 0 14px}
.place-verdict{margin:12px 0 0;font-size:15px}
.place-verdict.ok{color:var(--goed-deep)} .place-verdict.no{color:var(--fout-deep)}
.tile-card.defi{border-color:var(--goud)}
.tile-card.defi.locked{opacity:.6}
.head-title{flex:1;display:flex;flex-direction:column;line-height:1.2;min-width:0}
.head-title b{font-family:var(--display);font-size:14.5px}
.head-title i{font-style:normal;font-size:11px;color:var(--ink-3)}
.lesson-body{flex:1;overflow-y:auto;padding:4px 16px 18px;-webkit-overflow-scrolling:touch}
.stage{max-width:600px;margin:0 auto}
.kicker{font-family:var(--display);font-weight:700;font-size:19px;margin:6px 0 20px;display:flex;flex-direction:column;gap:5px}
.kicker .sub{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.pips{display:inline-flex;gap:3px;margin-top:4px}
.pips i{width:16px;height:3px;border-radius:2px;background:var(--line-2)}
.pips i.on{background:var(--groen)}
.pips.sm i{width:7px;height:5px;border-radius:1.5px}

.sentence{font-size:21px;font-weight:500;line-height:1.4}
.sentence.prompt{margin:0 0 22px}
.gloss,.gloss-line{display:block;color:var(--ink-3);font-size:14px;margin-top:5px;font-weight:400}
.gloss-line{margin:-14px 0 20px}
.be-line{display:block;font-size:15px;color:var(--amber-deep);margin-top:6px;font-weight:500}
.be-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;background:var(--amber-soft);
  color:var(--amber-deep);padding:2px 6px;border-radius:5px;margin-right:7px;vertical-align:1px}

.speaker-row{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.speaker{width:56px;height:56px;border-radius:15px;background:var(--groen);color:#fff;display:grid;place-items:center;
  box-shadow:0 3px 0 var(--groen-deep);flex:none;transition:transform .07s,box-shadow .07s}
.speaker:active{transform:translateY(2px);box-shadow:0 1px 0 var(--groen-deep)}
.speaker.slow{width:44px;height:44px;border-radius:12px;background:var(--card);color:var(--groen);box-shadow:0 3px 0 var(--line-2)}
.speaker.slow:active{box-shadow:0 1px 0 var(--line-2)}
.speaker.inline{width:36px;height:36px;border-radius:10px}
.speaker.tiny{width:28px;height:28px;border-radius:8px;background:transparent;color:var(--groen);box-shadow:none}
.speaker.tiny:active{transform:scale(.9);box-shadow:none}
.speaker-row .sentence{flex:1;min-width:180px}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1.5px solid var(--line);
  border-radius:var(--r);padding:14px 16px;font-size:16.5px;font-weight:500;box-shadow:0 2px 0 var(--line);
  transition:transform .07s,box-shadow .07s,background .14s,border-color .14s,color .14s}
.opt:active{transform:translateY(2px);box-shadow:0 0 0 var(--line)}
.opt.sel{background:var(--groen-soft);border-color:var(--groen);box-shadow:0 2px 0 var(--groen);color:var(--groen)}
.opt.ok{background:var(--goed-soft);border-color:var(--goed);box-shadow:0 2px 0 var(--goed);color:var(--goed-deep)}
.opt.no{background:var(--fout-soft);border-color:var(--fout);box-shadow:0 2px 0 var(--fout);color:var(--fout-deep)}
.opt-key{font-family:var(--mono);font-size:11px;font-weight:600;width:22px;height:22px;border-radius:6px;
  border:1.5px solid var(--line-2);display:grid;place-items:center;color:var(--ink-3);flex:none}
.opt.sel .opt-key{border-color:var(--groen);color:var(--groen)}
.opt.ok .opt-key{border-color:var(--goed);color:var(--goed-deep)}
.opt.no .opt-key{border-color:var(--fout);color:var(--fout-deep)}

.answer-area{min-height:96px;border-top:1.5px solid var(--line);border-bottom:1.5px solid var(--line);
  padding:13px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.answer-area.hint::before{content:"Touche les mots ci-dessous";color:var(--ink-3);font-size:14px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 13px;font-size:16.5px;
  font-weight:500;box-shadow:0 2px 0 var(--line);transition:transform .07s,box-shadow .07s}
.tile:active{transform:translateY(2px);box-shadow:0 0 0 var(--line)}
.tile.spent{opacity:.28;pointer-events:none;background:var(--sunk);border-color:var(--sunk);color:transparent;box-shadow:none}

.pairs{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pair{display:flex;align-items:center;gap:8px;text-align:left;background:var(--card);border:1.5px solid var(--line);
  border-radius:var(--r);padding:13px 11px;font-size:15px;font-weight:500;box-shadow:0 2px 0 var(--line);
  transition:transform .07s,box-shadow .07s,background .14s,border-color .14s,opacity .2s}
.pair:active{transform:translateY(2px);box-shadow:0 0 0 var(--line)}
.pair.sel{background:var(--groen-soft);border-color:var(--groen);box-shadow:0 2px 0 var(--groen);color:var(--groen)}
.pair.gone{opacity:.25;pointer-events:none;background:var(--goed-soft);border-color:var(--goed);box-shadow:none}
.pair.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pair-n{font-family:var(--mono);font-size:10px;color:var(--ink-3);flex:none}

.textin,.search{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);
  padding:14px 15px;font-size:17px;box-shadow:0 2px 0 var(--line)}
.textin:focus,.search:focus{border-color:var(--groen);outline:none;box-shadow:0 2px 0 var(--groen)}
.hintline{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:13px;color:var(--ink-3)}
.chip{font-family:var(--mono);font-size:13px;font-weight:600;background:var(--sunk);border-radius:6px;padding:4px 9px;color:var(--ink-2)}
.chip:hover{background:var(--groen-soft);color:var(--groen)}

.cloze-line{margin-bottom:6px}
.gap{display:inline-block;min-width:96px;border-bottom:2.5px solid var(--amber);margin:0 3px;
  text-align:center;color:var(--amber-deep);font-weight:600}
.rule-chip{font-family:var(--mono);font-size:11.5px;color:var(--groen);background:var(--groen-soft);
  border-radius:7px;padding:5px 9px;display:inline-block;margin-bottom:16px}

/* ---------- microphone ---------- */
.mic-panel{margin-top:22px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);
  padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.mic-panel.good{border-color:var(--goed);background:var(--goed-soft)}
.mic-panel.bad{border-color:var(--fout);background:var(--fout-soft)}
.mic-panel.offline{border-style:dashed}
.mic{width:76px;height:76px;border-radius:50%;background:var(--amber);color:#231202;display:grid;place-items:center;
  box-shadow:0 4px 0 var(--amber-deep);transition:transform .07s,box-shadow .07s}
.mic:active{transform:translateY(3px);box-shadow:0 1px 0 var(--amber-deep)}
.mic.play{background:var(--groen);color:#fff;box-shadow:0 4px 0 var(--groen-deep)}
.mic.listening{background:var(--fout);color:#fff;box-shadow:0 4px 0 var(--fout-deep);animation:pulse 1.3s ease-in-out infinite}
.mic.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.mic-why{margin:0;font-size:13.5px;color:var(--ink-2);max-width:42ch}
.mic-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.mic-verdict{margin:0;font-weight:600;font-size:14px}
.heard{margin:0;font-family:var(--mono);font-size:13px;color:var(--ink-3)}
.score-row{display:flex;align-items:center;gap:12px;width:100%;max-width:300px}
.score{font-family:var(--mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.score-bar{flex:1;height:9px;border-radius:99px;background:var(--sunk);overflow:hidden}
.score-bar span{display:block;height:100%;border-radius:99px;background:currentColor}
.mic-panel.good .score,.mic-panel.good .score-bar{color:var(--goed)}
.mic-panel.bad .score,.mic-panel.bad .score-bar{color:var(--fout)}
.word-diff{margin:0;font-size:19px;font-weight:500;line-height:1.6}
.word-diff span{padding:1px 4px;border-radius:5px}
.w-ok{color:var(--goed-deep);background:var(--goed-soft)}
.w-close{color:var(--goud);background:var(--goud-soft)}
.w-no{color:var(--fout-deep);background:var(--fout-soft);text-decoration:underline wavy var(--fout) 1.5px;text-underline-offset:4px}

/* ---------- footer ---------- */
.foot{border-top:1px solid var(--line);background:var(--card)}
.foot.ok{background:var(--goed-soft);border-top-color:var(--goed)}
.foot.no{background:var(--fout-soft);border-top-color:var(--fout)}
.foot-in{max-width:600px;margin:0 auto;padding:14px 16px calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.foot-in.col{flex-direction:column;align-items:stretch;gap:10px}
.foot-hint{margin:0;flex:1;font-size:13.5px;color:var(--ink-3)}
.verdict{flex:1;min-width:200px;display:flex;gap:11px;align-items:flex-start}
.v-icon{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff}
.verdict.ok .v-icon{background:var(--goed)} .verdict.no .v-icon{background:var(--fout)}
.verdict h5{font-size:15.5px;font-weight:700}
.verdict.ok h5,.verdict.ok p{color:var(--goed-deep)}
.verdict.no h5,.verdict.no p{color:var(--fout-deep)}
.verdict p{margin:2px 0 0;font-size:14.5px}
.v-be{opacity:.9;font-size:13.5px !important}
.v-note{font-size:13px !important;opacity:.85;max-width:52ch}

/* ---------- done screens ---------- */
.done-stage,.empty-stage{text-align:center;padding-top:34px}
.done-mark{font-size:46px;margin-bottom:10px}
.done-stage h2,.empty-stage h2{font-size:26px;margin-bottom:8px}
.done-sub{color:var(--ink-2);font-size:14.5px;max-width:44ch;margin:0 auto 4px}
.empty-stage p{color:var(--ink-2);max-width:44ch;margin:0 auto 20px}
.tally{display:flex;gap:9px;justify-content:center;margin:22px 0;flex-wrap:wrap}
.tally-box{flex:1;min-width:74px;border:1.5px solid var(--line);border-radius:var(--r);padding:11px 6px;background:var(--card)}
.tally-box.gold{border-color:var(--goud);background:var(--goud-soft)}
.tally-box.blue{border-color:var(--groen);background:var(--groen-soft)}
.tally-box.green{border-color:var(--goed);background:var(--goed-soft)}
.t-n{font-family:var(--mono);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.t-l{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
.done-actions{display:flex;flex-direction:column;gap:9px;max-width:340px;margin:0 auto}

/* ---------- chat / scenario ---------- */
.stage.chat{display:flex;flex-direction:column;gap:12px;padding-top:10px}
.bub{display:flex;gap:9px;max-width:88%}
.bub.them{align-self:flex-start}
.bub.you{align-self:flex-end;flex-direction:row-reverse}
.bub > div{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:11px 14px}
.bub.you > div{background:var(--groen);border-color:var(--groen);border-radius:16px 16px 4px 16px}
.bub-say{width:30px;height:30px;border-radius:9px;background:var(--sunk);color:var(--groen);display:grid;place-items:center;flex:none;align-self:flex-end}
.bub-nl{margin:0;font-size:16px;font-weight:500}
.bub.you .bub-nl{color:#fff}
.bub-std{margin:3px 0 0;font-size:12px;font-family:var(--mono);color:var(--ink-3)}
.bub-en{margin:4px 0 0;font-size:13px;color:var(--ink-3)}
.bub.you .bub-en{color:rgba(255,255,255,.72)}
.bub-score{margin:4px 0 0;font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.6)}
.chat-foot .ask{margin:0;font-family:var(--display);font-weight:700;font-size:15px}
.ask-hint{margin:2px 0 0;font-size:13px;color:var(--ink-3)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;
  display:flex;flex-direction:column;gap:2px;box-shadow:0 2px 0 var(--line)}
.choice:hover{border-color:var(--groen)}
.choice:active{transform:translateY(2px);box-shadow:0 0 0 var(--line)}
.choice b{font-size:16px;font-weight:600}
.choice i{font-style:normal;font-size:13px;color:var(--ink-3)}
.say-now{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.say-target{margin:0;font-size:21px;font-weight:600}
.say-en{margin:0;font-size:13.5px;color:var(--ink-3)}
.say-note{margin:0;font-size:13px;color:var(--ink-3);text-align:center;max-width:46ch;align-self:center}
.scn-done{text-align:center}
.scn-done h2{font-size:22px;margin-bottom:6px}
.scn-done p{color:var(--ink-2);font-size:14px;max-width:48ch;margin:0 auto}

/* ---------- listening ---------- */
.listen-stage{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:24px}
.listen-actions{display:flex;gap:8px}
.listen-hint{margin:0;font-size:13px;color:var(--ink-3)}
.reveal{background:var(--sunk);border-radius:var(--r);padding:13px 16px}
.rev-nl{margin:0;font-size:19px;font-weight:500}
.rev-std,.rev-src{margin:4px 0 0;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.rev-en{margin:0;font-size:14px;color:var(--ink-3)}

/* ---------- sheets / dialogs ---------- */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(9,18,14,.55);display:grid;place-items:center;padding:18px}
.sheet-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;max-width:440px;
  width:100%;max-height:88dvh;overflow-y:auto;box-shadow:0 20px 50px rgba(9,18,14,.35)}
.sheet-card h3{font-size:20px;margin-bottom:10px}
.sheet-card > p{margin:0 0 16px;color:var(--ink-2);font-size:14.5px}
.sheet-actions{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.set-block{margin-bottom:18px}
.set-block h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px}
.seg{display:flex;gap:6px}
.seg-btn{flex:1;padding:9px 6px;border-radius:10px;background:var(--sunk);font-size:13px;font-weight:600;color:var(--ink-2)}
.seg-btn.on{background:var(--groen);color:#fff}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;font-size:14px}
.switch{width:44px;height:26px;border-radius:99px;background:var(--line-2);position:relative;flex:none;transition:background .16s}
.switch span{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .16s}
.switch.on{background:var(--goed)}
.switch.on span{transform:translateX(18px)}
.goal{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;padding:7px 0}
.goal select{background:var(--sunk);border:0;border-radius:9px;padding:7px 10px;font-size:14px}
.set-note{margin:6px 0 0;font-size:13px;color:var(--ink-2)}
.set-note.good{color:var(--goed)} .set-note.warn{color:var(--amber-deep)}
.rule{font-family:var(--mono);font-size:12.5px;color:var(--groen);background:var(--groen-soft);padding:8px 11px;border-radius:9px;margin:0 0 12px !important}
.explain{font-size:14.5px;color:var(--ink-2);line-height:1.6}
.ex-list{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.ex-row{text-align:left;background:var(--sunk);border-radius:10px;padding:9px 12px;display:flex;flex-direction:column}
.ex-row b{font-size:15px} .ex-row i{font-style:normal;font-size:12.5px;color:var(--ink-3)}

.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--stone);
  padding:11px 18px;border-radius:99px;font-size:14px;box-shadow:var(--shadow);max-width:90vw;
  pointer-events:none}

/* ---------- woordenboek ---------- */
.filters{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 6px}
.filters .search{flex:1 1 100%;padding:11px 14px;font-size:15px}
.fchip{font-size:12.5px;background:var(--sunk);border-radius:99px;padding:6px 13px;color:var(--ink-2);font-weight:600}
.fchip.on{background:var(--groen);color:#fff}
.voc-head{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;
  color:var(--groen);padding:22px 2px 8px;border-bottom:1.5px solid var(--line)}
.vrow{display:flex;align-items:center;gap:9px;padding:10px 2px;border-bottom:1px solid var(--line)}
.v-nl{font-weight:600;font-size:15.5px;display:flex;flex-direction:column;min-width:0}
.v-be{font-weight:400;font-size:12px;color:var(--amber-deep);font-family:var(--mono)}
.v-en{margin-left:auto;text-align:right;color:var(--ink-3);font-size:14px}
.art{font-family:var(--mono);font-size:9.5px;font-weight:600;color:#fff;background:var(--groen);border-radius:4px;
  padding:2px 5px;margin-right:6px;vertical-align:2px;letter-spacing:.04em}
.art.het{background:var(--amber);color:#231202}
.add-form{display:flex;flex-direction:column;gap:11px;margin-top:12px}
.add-form label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-3)}
.add-form .textin{font-size:15px;padding:11px 13px}
.row{display:flex;gap:9px}

/* ---------- spiekbriefjes ---------- */
.backlink{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-3);padding:4px 0 12px}
.backlink:hover{color:var(--groen)}
.sheet-group{margin-top:20px}
.sheet-group h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:8px}
.sheet-row{display:flex;gap:11px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 14px;margin-bottom:7px;align-items:flex-start}
.sheet-row:hover{border-color:var(--groen)}
.sr-say{color:var(--groen);flex:none;margin-top:2px}
.sr-body{display:flex;flex-direction:column;gap:1px;min-width:0}
.sr-body b{font-size:15.5px;font-weight:600}
.sr-body i{font-style:normal;font-size:13.5px;color:var(--ink-2)}
.sr-body em{font-style:normal;font-size:12.5px;color:var(--amber-deep);margin-top:3px}

/* ---------- register / klanken ---------- */
.reg-table{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.reg-head{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);font-family:var(--mono);font-size:10.5px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.reg-head span{padding:9px 13px}
.reg-row{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.reg-cell{text-align:left;padding:11px 13px;font-size:15px;display:flex;flex-direction:column;gap:2px}
.reg-cell.std{color:var(--ink-2)}
.reg-cell.be{color:var(--amber-deep);font-weight:600;border-left:1px solid var(--line);background:var(--amber-soft)}
.reg-cell em{font-style:normal;font-size:11.5px;color:var(--ink-3);font-weight:400}
.reg-cell:hover{background:var(--groen-soft)}
.snd-row{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:9px}
.snd-head{display:flex;align-items:baseline;gap:10px;margin-bottom:5px}
.snd-head b{font-family:var(--display);font-size:17px}
.snd-head code{font-family:var(--mono);font-size:12.5px;color:var(--groen);background:var(--groen-soft);padding:2px 7px;border-radius:5px}
.snd-row p{margin:0;font-size:14px;color:var(--ink-2)}

/* ---------- stats strip ---------- */
.spark{display:flex;align-items:flex-end;gap:10px;justify-content:space-between;height:84px}
.spark-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end}
.spark-bar{width:100%;max-width:30px;border-radius:5px 5px 2px 2px;background:var(--groen)}
.spark-col span{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.mini-stats{display:flex;flex-wrap:wrap;gap:10px 20px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}
.mini-stats b{font-family:var(--mono);color:var(--ink);font-size:15px}

/* ---------- desktop ---------- */
@media (min-width:900px){
  .nav{top:0;bottom:0;right:auto;width:212px;border-top:0;border-right:1px solid var(--line);padding:76px 12px 0}
  .nav-in{grid-template-columns:1fr;gap:2px;max-width:none}
  .nav-btn{flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;border-radius:11px;font-size:14.5px}
  .nav-btn.on{background:var(--groen-soft)}
  .topbar{padding-left:212px}
  .screen{padding-left:212px;padding-bottom:24px}
  .screen.full{padding-left:0}
  .wrap{max-width:680px;padding:26px 24px 40px}
  .lead h1{font-size:29px}
  .sentence{font-size:23px}
  .tile-card,.scn-card{padding:16px 18px}
}
@media (max-width:420px){
  .brand-txt i{display:none}
  .stats{gap:9px}
  .lead h1{font-size:22px}
  .session-card h2{font-size:20px}
  .pairs{gap:7px}
  .pair{font-size:14px;padding:11px 9px}
}

/* ============================================================
   Phase 2 — interface française, plus calme, docteur audio
   ============================================================ */

/* --- navigation bilingue : français lisible, néerlandais qui s'infiltre --- */
.nav-btn{gap:2px}
.nav-fr{font-size:10.5px;font-weight:600;line-height:1.1}
.nav-nl{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;opacity:.55;line-height:1.1}
.nav-btn.on .nav-nl{opacity:.8}

/* --- respiration : la phrase néerlandaise est l'objet d'étude --- */
.wrap{padding:24px 18px 28px}
.card{padding:22px}
.session-card h2{font-size:25px;line-height:1.2;margin-top:6px}
.session-card .btn.big{margin-top:20px}
.sc-sub{margin:8px 0 0;font-size:14.5px;max-width:46ch}
.stage{max-width:620px}
.kicker{margin:10px 0 26px}
.sentence{font-size:22px;line-height:1.45}
.sentence.prompt{margin-bottom:26px}
.lesson-body{padding:6px 18px 22px}
.opts{gap:11px}
.opt{padding:16px 17px}
.tri{margin-top:18px}
.sec{margin:30px 0 12px}

/* le bandeau de diagnostic est cliquable : il mène au docteur */
.notice{display:block;width:100%;text-align:left;margin-top:16px;background:var(--amber-soft);
  border:1px solid var(--amber);border-radius:var(--r);padding:14px 16px;transition:transform .07s}
.notice:active{transform:translateY(1px)}
.notice b{font-family:var(--display);font-size:14px;display:block;margin-bottom:3px;color:var(--amber-deep)}
.notice p{margin:0;font-size:13.5px;color:var(--ink-2)}

/* le nom néerlandais de l'unité, discret */
.uc-title h2{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.uc-nl{font-family:var(--mono);font-style:normal;font-size:11px;font-weight:500;color:var(--ink-3);letter-spacing:.02em}

/* --- enregistre et compare --- */
.mic-panel.compare{border-color:var(--groen);background:var(--groen-soft);gap:14px}
.mic-panel.compare .mic-actions{width:100%;justify-content:center}
.mic-panel.compare .btn{padding:11px 16px;font-size:13.5px}
.mic-panel .mic-why{max-width:44ch}

/* --- docteur audio --- */
.stage.doc{display:flex;flex-direction:column;gap:14px;padding-bottom:20px}
.doc-capability{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:18px}
.doc-capability.full{border-color:var(--goed);background:var(--goed-soft)}
.doc-capability.scored{border-color:var(--goud);background:var(--goud-soft)}
.doc-capability.compare{border-color:var(--groen);background:var(--groen-soft)}
.doc-capability.self,.doc-capability.novoice,.doc-capability.refused{border-color:var(--amber);background:var(--amber-soft)}
.doc-capability h2{font-size:20px;margin:4px 0 6px}
.doc-capability p{margin:0;font-size:14px;color:var(--ink-2);max-width:52ch}
.doc-framed{margin-top:10px !important;font-size:13px !important;padding-top:10px;border-top:1px dashed var(--line-2)}
.doc-block{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.doc-block h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.doc-line{margin:0;font-size:15px}
.doc-list{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:6px}
.doc-list li{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:8px 11px;background:var(--sunk);border-radius:9px}
.doc-list li.good{background:var(--goed-soft);color:var(--goed-deep)}
.doc-list li span{font-family:var(--mono);font-size:12px;opacity:.8}
.doc-bad{margin:0 0 12px;color:var(--fout);font-size:14px}
.doc-ask{margin:12px 0 0;font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.doc-verdict{margin:12px 0 0;font-size:14px;font-weight:600}
.doc-verdict.good{color:var(--goed)} .doc-verdict.bad{color:var(--fout)}
.doc-fix{background:var(--amber-soft);border:1.5px solid var(--amber);border-radius:var(--r-lg);padding:18px}
.doc-fix.good{background:var(--goed-soft);border-color:var(--goed)}
.doc-fix h4{font-family:var(--display);font-size:15.5px;font-weight:700;color:var(--amber-deep);margin-bottom:10px;text-transform:none;letter-spacing:0}
.doc-fix.good h4{color:var(--goed-deep)}
.doc-fix ol{margin:0 0 12px;padding-left:20px;font-size:14px;color:var(--ink-2);display:flex;flex-direction:column;gap:7px}
.doc-fix .btn{margin-top:6px}

/* --- réglages : sauvegarde --- */
.set-block .row{gap:8px;margin-top:10px}
.set-block .row .btn{flex:1;padding:11px 10px;font-size:13px}
.backup-box{width:100%;min-height:150px;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 13px;font-family:var(--mono);font-size:11.5px;line-height:1.5;color:var(--ink-2);resize:vertical;margin-bottom:4px}

/* --- personnalisation --- */
.mine{display:flex;flex-direction:column;gap:5px;margin-bottom:9px;font-size:13px;color:var(--ink-3)}
.mine .textin{font-size:15px;padding:10px 12px}

/* --- phase 2 : échelons nommés, unité courante, nouveaux exercices --- */
.pips{align-items:center;gap:4px}
.pips b{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);margin-left:5px}
.unit-card.now{border-color:var(--amber);border-width:1.5px;position:relative}
.now-tag{position:absolute;top:-9px;left:16px;background:var(--amber);color:#231202;
  font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 9px;border-radius:6px}
.uc-gate{margin:-4px 0 12px;font-size:12.5px;color:var(--amber-deep)}
.corrige{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.ctok{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 13px;
  font-size:17px;font-weight:500;box-shadow:0 2px 0 var(--line)}
.ctok:active{transform:translateY(2px);box-shadow:0 0 0 var(--line)}
.ctok.sel{background:var(--groen-soft);border-color:var(--groen);color:var(--groen)}
.ctok.bad{background:var(--fout-soft);border-color:var(--fout);color:var(--fout-deep)}

<script>
/* Vlaams — small shared helpers. No dependencies. */
window.NL = window.NL || {};
NL.util = (function () {
  'use strict';

  const esc = s => String(s == null ? '' : s)
    .replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const shuffle = a => {
    const r = a.slice();
    for (let i = r.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [r[i], r[j]] = [r[j], r[i]]; }
    return r;
  };
  const sample = (a, n) => shuffle(a).slice(0, n);
  const one = a => a[(Math.random() * a.length) | 0];
  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
  const uniq = a => [...new Set(a)];

  /* Comparison. Accents are kept (Dutch uses them), punctuation and case are not. */
  const norm = s => String(s || '').toLowerCase()
    .replace(/[’‘´`]/g, "'").replace(/[“”]/g, '"')
    .replace(/[.,!?;:"()…]/g, '')
    .replace(/\s+/g, ' ').trim();

  const words = s => norm(s).split(' ').filter(Boolean);
  /* Tiles keep their visible punctuation off, but the display string stays intact. */
  const tiles = s => String(s).split(/\s+/).map(t => t.replace(/[.,!?;:"()]/g, '')).filter(Boolean);

  /* L'article ne se retire que d'un MOT. Une phrase le garde : sinon « Het
     regent weer. » s'affiche « regent weer. ». Et l'article doit être suivi d'un
     espace (ou d'une apostrophe en français) : sans ça, « leur » devenait « ur »,
     « durer » « rer », et « un » tout seul une option vide. */
  const sentence = s => /[.!?…]\s*$/.test(s);
  const bare = nl => { const s = String(nl); return sentence(s) ? s : s.replace(/^(de|het|een)\s+(?=\S)/i, ''); };
  /* Strips the French article so a gloss can be shown bare in a tile or an option. */
  const bareFr = fr => {
    const s = String(fr);
    return sentence(s) ? s : s.replace(/^(?:(?:les|le|la|une|un|des|du|de la)\s+|(?:de l[’']|l[’']))(?=\S)/i, '');
  };

  function lev(a, b) {
    if (a === b) return 0;
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      const row = [i];
      for (let j = 1; j <= b.length; j++) {
        row[j] = Math.min(prev[j] + 1, row[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = row;
    }
    return prev[b.length];
  }
  const near = (a, b, tol) => {
    a = norm(a); b = norm(b);
    if (a === b) return true;
    const d = lev(a, b);
    return d <= (tol == null ? Math.max(1, Math.floor(b.length / 8)) : tol);
  };
  /* Une faute de frappe pardonnée sur « dag » ou « hun », c'est un tiers du mot :
     les mots courts s'écrivent exactement, une lettre de marge à partir de six. */
  const tolFor = s => norm(s).replace(/\s+/g, '').length < 6 ? 0 : 1;
  /* Réponse tapée à un MOT : « de fiets » ou « een beetje » ne sont pas faux
     parce qu'on a mis l'article — c'est même plus juste. */
  const typedOk = (input, target, tol) => {
    const t = tol == null ? tolFor(target) : tol;
    return near(input, target, t) || near(bare(String(input).trim()), target, t);
  };
  const ratio = (a, b) => {
    a = norm(a); b = norm(b);
    const m = Math.max(a.length, b.length);
    return m ? 1 - lev(a, b) / m : 1;
  };

  /* Aligns what was heard against what was expected, word by word. */
  function diffWords(said, target) {
    const S = words(said), T = words(target);
    const used = new Array(S.length).fill(false);
    return T.map((t, i) => {
      let bestJ = -1, bestR = 0;
      const from = Math.max(0, i - 2), to = Math.min(S.length, i + 3);
      for (let j = from; j < to; j++) {
        if (used[j]) continue;
        const r = ratio(S[j], t);
        if (r > bestR) { bestR = r; bestJ = j; }
      }
      if (bestR >= 0.72 && bestJ >= 0) { used[bestJ] = true; return { word: t, ok: true, heard: S[bestJ], close: bestR < 0.99 }; }
      return { word: t, ok: false, heard: bestJ >= 0 && bestR > 0.4 ? S[bestJ] : null };
    });
  }

  const dayKey = (d) => {
    const x = d ? new Date(d) : new Date();
    return new Date(x.getTime() - x.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  };
  const dayDiff = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
  /* Le jour local n jours plus tôt, compté sur le calendrier et jamais en 24 heures :
     à Bruxelles, le dernier dimanche d'octobre dure 25 heures, celui de mars 23 (#105).
     La même heure, n dates plus tôt ; dayKey() en tire la clé, getDay() le nom du jour. */
  const daysBack = n => { const x = new Date(); x.setDate(x.getDate() - n); return x; };

  const MIN = 60000, HOUR = 60 * MIN, DAY = 24 * HOUR;
  function ago(ms) {
    const d = Math.abs(ms);
    if (d < HOUR) return Math.max(1, Math.round(d / MIN)) + ' min';
    if (d < DAY) return Math.round(d / HOUR) + ' u';
    if (d < 60 * DAY) return Math.round(d / DAY) + ' d';
    return Math.round(d / (30 * DAY)) + ' mnd';
  }

  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

  return { esc, shuffle, sample, one, clamp, uniq, norm, words, tiles, bare, bareFr, lev, near, tolFor, typedOk, ratio, diffWords, dayKey, dayDiff, daysBack, ago, debounce, MIN, HOUR, DAY };
})();
</script>
<script>
/* Le sens et les textes : UN seul endroit les lit.
   Un élément porte son sens en deux langues côte à côte (`fr`, `en`) ; un texte
   (nom, note, règle…) est soit une chaîne française, soit une paire { fr, en }.
   Les écrans ne lisent jamais `x.fr` : ils passent par ici, et la langue lue
   est choisie en un point (`use`). Tant que personne n'appelle `use`, on lit le
   français : l'écran est celui d'avant. */
NL.gloss = (function () {
  'use strict';
  const U = NL.util;
  let lang = 'fr';

  const use = l => { lang = l === 'en' ? 'en' : 'fr'; };
  const current = () => lang;
  const other = l => l === 'en' ? 'fr' : 'en';

  /* Ce qui est lu dans `l` : une chaîne non vide, pas un trou. */
  const has = (x, l) => !!x && typeof x === 'object' && typeof x[l] === 'string' && x[l].trim() !== '';

  /* La langue dans laquelle `x` se lit : une chaîne simple est du français ;
     sinon la langue courante, ou l'autre si `x` n'a rien dans la courante. */
  function langOf(x) {
    if (typeof x === 'string') return 'fr';
    return has(x, lang) ? lang : other(lang);
  }

  /* Le texte à montrer. Une paire de texte ou un élément, indifféremment. Une
     note qui vaut `null` dans la langue lue n'a rien à dire à ce lecteur. */
  function of(x, l) {
    if (typeof x === 'string') return x;
    if (x == null) return '';
    const want = l || lang;
    if (x[want] === null) return '';
    const v = has(x, want) ? x[want] : x[other(want)];
    return typeof v === 'string' ? v : '';
  }

  /* Les langues lues, dans un ordre fixe. Un sens se copie langue par langue d'ici,
     et une troisième langue est une ligne de plus. */
  const LANGS = ['fr', 'en'];

  /* Le sens de `x`, dans chaque langue lue qu'il porte : un objet neuf. Un `null`
     reste (« rien à dire », voir `of`) ; une langue absente ne devient pas une clé. */
  function meaning(x) {
    const m = {};
    LANGS.forEach(l => { if (x && x[l] !== undefined) m[l] = x[l]; });
    return m;
  }

  const pair = g => typeof g === 'string' ? { fr: g } : meaning(g);

  /* Le sens sans son article : « le pain » → « pain », « the bread » → « bread ».
     Une phrase garde son premier mot, comme U.bareFr. */
  function bare(item, l) {
    const w = l || langOf(item);
    const s = typeof item === 'string' ? item : (item && typeof item[w] === 'string' ? item[w] : '');
    if (w === 'fr') return U.bareFr(s);
    if (/[.!?…]\s*$/.test(s)) return s;
    return s.replace(/^(?:the|an|a)\s+(?=\S)/i, '');
  }

  /* Les sens, séparés par « / », chacun normalisé. */
  const senses = (item, l) => has(item, l)
    ? bare(item, l).split(/\s*\/\s*/).map(U.norm).filter(Boolean) : [];

  /* Même sens pour la note et les frères : un sens français commun, ou le même
     néerlandais sans article. C'est la règle d'avant, et le français seul y décide. */
  function sameSense(a, b) {
    const fa = senses(a, 'fr'), fb = senses(b, 'fr');
    if (fa.some(x => fb.indexOf(x) >= 0)) return true;
    return U.norm(U.bare(a.nl)) === U.norm(U.bare(b.nl));
  }
  /* Pour les mauvaises options : le même sens dans l'une ou l'autre langue. */
  function sameMeaning(a, b) {
    if (sameSense(a, b)) return true;
    const ea = senses(a, 'en'), eb = senses(b, 'en');
    return ea.some(x => eb.indexOf(x) >= 0);
  }

  /* Des mots français qui finissent comme un infinitif sans en être un. */
  const NOT_VERBS = ['hier', 'entre', 'contre', 'propre'];

  /* La nature du mot, grossièrement : « oui » face à « sorry / spreken / ja » se
     résout sans connaître le mot, parce qu'un verbe ne répond pas à « oui ». */
  function wordClass(x, l) {
    if (x.kind !== 'word') return x.kind;
    if (x.art) return 'noun';
    const w = l || langOf(x);
    const first = bare(x, w).split(/\s*\/\s*/)[0];
    if (w === 'en') {
      if (/^to\s+\S/.test(first) && /en$/.test(U.bare(x.nl))) return 'verb';
      return 'other';
    }
    if (/^\S+(er|ir|re|oir)$/.test(first) && first.indexOf('-') < 0 && NOT_VERBS.indexOf(first) < 0 && /en$/.test(U.bare(x.nl))) return 'verb';
    return 'other';
  }

  /* Un mot transparent : son néerlandais ressemble à son sens, dans la langue lue. */
  function cognate(item) {
    if (item.kind !== 'word') return false;
    const w = langOf(item);
    const g = w === 'en' ? bare(item, 'en').replace(/^to\s+(?=\S)/i, '') : bare(item, 'fr');
    return U.ratio(U.bare(item.nl), g) > 0.62;
  }

  /* Une prose du cours qui porte des exemples en néerlandais : <span class="ex">, et toute balise
     class="nl" (<i class="nl">Morgen ik ga</i>), est du néerlandais, et le dit à un lecteur d'écran.
     C'est ici, et nulle part ailleurs, que cette règle s'applique : le cours n'écrit aucun lang="…". */
  const prose = html => String(html == null ? '' : html).replace(/<(\w+) class="(ex|nl)">/g, '<$1 class="$2"' + attr('nl') + '>');

  /* La balise de chaque langue, pour un lecteur d'écran : les langues lues et le néerlandais
     du cours. C'est la seule table : aucun autre fichier n'écrit lang="…". */
  const TAGS = { fr: 'fr', en: 'en-GB', nl: 'nl-BE' };
  /* La balise d'une langue : celle de la page (NL.lang), d'un sens, d'un passage néerlandais. */
  const tag = l => TAGS[l];
  /* L'attribut lang d'une langue, espace compris : attr('nl') pour du néerlandais. */
  const attr = l => ' lang="' + tag(l) + '"';
  /* L'attribut lang d'un sens ou d'un texte montré : la langue où il se lit. */
  const langAttr = x => attr(langOf(x));
  /* Une prose du cours en texte simple (une note, une règle, une consigne), lue par of() et
     échappée : ce qu'elle cite entre « » ou “ ” est du néerlandais, déclaré nl-BE. Les guillemets
     et les espaces qui les bordent restent dehors ; une citation vide ne déclare rien. */
  const QUOTES = /(«\s*)([^«»]*?[^\s«»])(\s*»)|(“\s*)([^“”]*?[^\s“”])(\s*”)/g;
  const mark = (open, inner, close) => open + '<span' + attr('nl') + '>' + inner + '</span>' + close;
  const quoted = x => U.esc(of(x)).replace(QUOTES, (m, a, q, b, c, r, d) => a !== undefined ? mark(a, q, b) : mark(c, r, d));

  return { LANGS, TAGS, prose, quoted, use, current, other, has, langOf, tag, attr, langAttr, of, meaning, pair, bare, senses, sameSense, sameMeaning, wordClass, cognate };
})();
</script>
<script>
/* Le journal d'erreurs local.

   Sur un téléphone il n'y a pas de console : quand un écran meurt, tout ce qu'on
   peut rapporter est « ça ne marche plus ». Ce journal garde les vingt dernières
   erreurs, sur l'appareil et nulle part ailleurs — il n'est ni synchronisé ni
   envoyé. L'écran « Son et micro » les affiche et permet de les copier. */
NL.errlog = (function () {
  'use strict';
  const KEY = 'vlaams/errors', KEEP = 20;

  const all = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } };

  /* `where` dit d'où vient l'erreur quand ce n'est pas la fenêtre elle-même. */
  function note(err, where) {
    const list = all();
    list.push({
      t: Date.now(), where: where || '', route: (NL.ui && NL.ui.route) || '',
      msg: String((err && err.message) || err).slice(0, 300),
      stack: String((err && err.stack) || '').split('\n').slice(0, 4).join('\n').slice(0, 600)
    });
    try { localStorage.setItem(KEY, JSON.stringify(list.slice(-KEEP))); } catch (e) {}
  }

  const clear = () => { try { localStorage.removeItem(KEY); } catch (e) {} };

  /* Le texte à copier : une erreur par paragraphe, la plus récente en dernier. */
  const text = () => all().map(e =>
    new Date(e.t).toISOString() + ' [' + (e.route || '?') + (e.where ? ' · ' + e.where : '') + '] ' + e.msg +
    (e.stack ? '\n' + e.stack : '')).join('\n\n');

  function watch() {
    window.addEventListener('error', e => note((e && e.error) || (e && e.message), 'window'));
    window.addEventListener('unhandledrejection', e => note(e && e.reason, 'promise'));
  }

  return { note, all, clear, text, watch, KEEP };
})();
</script>

<script>
/* Persistence. IndexedDB with an in-memory mirror so rendering stays synchronous,
   and a localStorage fallback for browsers or modes where IDB is unavailable. */
NL.state = (function () {
  'use strict';
  /* Storage keys deliberately keep their original spelling: renaming them would
     orphan every database and every backup file already out there. */
  const DB = 'vlaams-onderweg', VER = 1;
  const STORES = ['srs', 'meta', 'log', 'custom'];
  let db = null, useIDB = false;

  const LS = 'vlaams/fallback';
  const mem = { srs: new Map(), custom: new Map(), log: [] };

  /* Tout ce qui a été appris avec l'ancien moteur — retours à douze minutes,
     unités créditées par le test de niveau — est antérieur à cet instant. La
     date est FIXE, et non « maintenant » : un second appareil qui migre un jour
     plus tard effacerait sinon ce que le premier a appris entre-temps. C'est
     aussi un plancher : tout appareil de cette version naît après la migration. */
  const ENGINE_EPOCH = Date.UTC(2026, 9, 13);

  const defaults = () => ({
    xp: 0, streak: 0, best: 0, lastDay: null, theme: 'system',
    placed: false, dailyGoal: 20, doneToday: 0, doneDay: null,
    mic: true, autoplay: true, showFlemish: true, unlocked: 1,
    scenariosDone: [], listenDone: [], firstRun: true,
    learnerName: '', town: '', company: '',
    pace: 'normal', exDay: null, exToday: 0, dataVersion: 3, lastEx: null,
    reached: 0,                // index of the furthest unit ever opened; never goes back
    resetAt: ENGINE_EPOCH,     // l'instant de la dernière remise à zéro ; ce qui descend d'une plus ancienne est effacé
    progress: { reached: 0, scenariosDone: [], listenDone: [] }   // la copie de confiance, voir setMeta
  });
  let meta = defaults();

  /* Le journal garde deux mois de réponses au rythme le plus soutenu : c'est ce
     que l'écran des fautes relit. */
  const LOG_KEEP = 12000;

  const progressOf = x => ({
    reached: x.reached || 0,
    scenariosDone: (x.scenariosDone || []).slice(), listenDone: (x.listenDone || []).slice()
  });

  /* La progression de l'ancien moteur est effacée, ici et sur le serveur.
     Réglages, score et mots personnels survivent.
     dataVersion ne suffit pas à dire si c'est fait : la version précédente
     recopie les réglages d'un appareil qui a migré sans rien effacer chez elle.
     Ce sont donc les données qui le disent. Une fiche ou une ligne de journal
     qui descend d'avant le plancher — sans `base`, elle vient de la version
     précédente — est effacée ; une frontière ou des listes qui ne sont plus
     égales à `progress` ont été réécrites par la version précédente, et
     reprennent la copie de confiance. Rend vrai quand quelque chose a été
     effacé ; la seconde fois, il n'y a plus rien à effacer. */
  function migrate() {
    const floor = Math.max(meta.resetAt || 0, ENGINE_EPOCH);
    const old = x => (x.base || 0) < floor;
    const trusted = progressOf(meta.progress || {});
    const rewritten = JSON.stringify(progressOf(meta)) !== JSON.stringify(trusted);
    const had = rewritten || [...mem.srs.values()].some(old) || mem.log.some(old);
    if (had) drop(floor);
    if (had || (meta.dataVersion || 1) < 3 || (meta.resetAt || 0) < floor) {
      setMeta(Object.assign({ dataVersion: 3, resetAt: floor }, trusted));
    }
    /* Le serveur n'efface que ce qui précède l'époque, jamais une date plus
       récente : ce qu'un autre appareil a appris depuis sur ce moteur reste. */
    if (had) emit('reset', ENGINE_EPOCH);
    return had;
  }

  /* Remet la PROGRESSION à zéro : les fiches, le journal des réponses, la
     frontière, et les conversations et écoutes cochées — repartir de zéro en
     gardant « six conversations faites », ce n'est pas repartir de zéro.
     Réglages, score et mots personnels restent, et le compteur du jour aussi :
     une remise à zéro efface la progression, pas l'effort déjà fait aujourd'hui.
       before  n'efface que ce qui descend d'une remise à zéro antérieure à cet instant (défaut : tout)
       silent   la remise à zéro vient du serveur : elle n'y repart pas
     L'instant est gardé dans les réglages (resetAt) : c'est lui qui dit aux
     autres appareils que leur copie est périmée. */
  function resetProgress(before, silent) {
    const cut = before || Date.now();
    drop(cut);
    setMeta({
      resetAt: Math.max(meta.resetAt || 0, cut), reached: 0, scenariosDone: [], listenDone: []
    }, silent);
    if (!silent) emit('reset', cut);
  }

  /* La coupe se fait sur `base`, la remise à zéro dont chaque fiche et chaque
     ligne descend, et non sur sa date : un appareil périmé qui répond hors
     ligne après une remise à zéro faite ailleurs écrit des fiches datées
     d'après, mais bâties sur des échelons effacés. Sans `base`, une donnée vient
     de la version précédente : elle compte pour 0. */
  function drop(cut) {
    [...mem.srs.values()].forEach(r => { if ((r.base || 0) < cut) mem.srs.delete(r.id); });
    mem.log = mem.log.filter(l => (l.base || 0) >= cut);
    rewrite();
  }
  /* withCustom : les mots personnels aussi (une restauration les remplace ; une
     remise à zéro les garde). */
  function rewrite(withCustom) {
    if (useIDB) {
      try {
        const s = db.transaction('srs', 'readwrite').objectStore('srs');
        s.clear(); mem.srs.forEach(r => s.put(r));
        const l = db.transaction('log', 'readwrite').objectStore('log');
        l.clear(); mem.log.forEach(e => l.put(e));
        if (withCustom) {
          const c = db.transaction('custom', 'readwrite').objectStore('custom');
          c.clear(); mem.custom.forEach(r => c.put(r));
        }
      } catch (e) {}
    }
    saveLS();
  }

  /* Une progression anonyme rejoint un compte telle quelle : elle descend
     désormais de la dernière remise à zéro du compte. L'instant peut reculer,
     et c'est voulu : une remise à zéro faite ici sans compte ne devient pas
     celle du compte. Silencieux : la synchro envoie tout juste après. */
  function rebase(at) {
    mem.srs.forEach(r => { r.base = at; });
    mem.log.forEach(l => { l.base = at; });
    rewrite();
    setMeta({ resetAt: at }, true);
  }

  function open() {
    return new Promise(resolve => {
      let req;
      try { req = indexedDB.open(DB, VER); } catch (e) { return resolve(loadLS()); }
      if (!req) return resolve(loadLS());
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('srs')) d.createObjectStore('srs', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'k' });
        if (!d.objectStoreNames.contains('log')) d.createObjectStore('log', { autoIncrement: true });
        if (!d.objectStoreNames.contains('custom')) d.createObjectStore('custom', { keyPath: 'id' });
      };
      req.onerror = () => resolve(loadLS());
      req.onsuccess = e => {
        db = e.target.result; useIDB = true;
        Promise.all([all('srs'), all('custom'), get('meta', 'meta'), all('log')]).then(([s, c, m, l]) => {
          s.forEach(r => mem.srs.set(r.id, r));
          c.forEach(r => mem.custom.set(r.id, r));
          /* Le journal était enregistré mais jamais relu : le graphique de la
             semaine ne montrait que la séance en cours. */
          mem.log = (l || []).slice(-LOG_KEEP);
          if (m && m.v) meta = Object.assign(defaults(), m.v);
          resolve();
        }).catch(() => resolve(loadLS()));
      };
    });
  }

  function loadLS() {
    useIDB = false;
    try {
      const raw = JSON.parse(localStorage.getItem(LS) || '{}');
      (raw.srs || []).forEach(r => mem.srs.set(r.id, r));
      (raw.custom || []).forEach(r => mem.custom.set(r.id, r));
      if (raw.meta) meta = Object.assign(defaults(), raw.meta);
      /* Le journal aussi : sans lui, « Ce qui résiste » repartait vide à chaque
         rechargement sur le repli. */
      mem.log = (raw.log || []).slice(-LOG_KEEP);
    } catch (e) { /* private mode: run from memory only */ }
  }
  /* Le repli n'a que quelques Mo : il ne garde que les dernières lignes du journal. */
  const LS_LOG_KEEP = 3000;
  const saveLS = NL.util.debounce(() => {
    if (useIDB) return;
    try {
      localStorage.setItem(LS, JSON.stringify({
        srs: [...mem.srs.values()], custom: [...mem.custom.values()], meta,
        log: mem.log.slice(-LS_LOG_KEEP)
      }));
    } catch (e) {}
  }, 400);

  const tx = (store, mode) => db.transaction(store, mode).objectStore(store);
  function get(store, key) {
    return new Promise((res, rej) => { const r = tx(store, 'readonly').get(key); r.onsuccess = () => res(r.result); r.onerror = rej; });
  }
  function all(store) {
    return new Promise((res, rej) => { const r = tx(store, 'readonly').getAll(); r.onsuccess = () => res(r.result || []); r.onerror = rej; });
  }
  function put(store, val) {
    if (!useIDB) { saveLS(); return Promise.resolve(); }
    return new Promise(res => { const r = tx(store, 'readwrite').put(val); r.onsuccess = res; r.onerror = res; });
  }
  /* La langue d'affichage est un choix de l'appareil, pas de la progression : des réglages
     reconstruits sans langue gardent celle de l'appareil. */
  const withDeviceLang = next => {
    if (!next.displayLang && meta.displayLang) next.displayLang = meta.displayLang;
    return next;
  };
  function clearAll() {
    mem.srs.clear(); mem.custom.clear(); mem.log = [];
    meta = withDeviceLang(defaults());
    const lang = meta.displayLang;
    /* La langue reste aussi sur l'appareil, pour le rechargement qui suit une déconnexion. Écrite
       en silence : sans emit ni updatedAt, elle ne passe pas devant les réglages d'un compte. */
    const keep = () => { if (lang) setMeta({ displayLang: lang }, true); };
    if (!useIDB) { try { localStorage.removeItem(LS); } catch (e) {} keep(); return Promise.resolve(); }
    return Promise.all(STORES.map(s => new Promise(res => {
      const r = db.transaction(s, 'readwrite').objectStore(s).clear(); r.onsuccess = res; r.onerror = res;
    }))).then(keep);
  }

  /* ---- abonnés aux écritures ----
     La synchro écoute ici. Une écriture « silencieuse » vient du serveur : elle
     est appliquée localement sans être renvoyée, sinon chaque tirage deviendrait
     un envoi et deux appareils se renverraient la balle à l'infini. */
  const listeners = [];
  const onWrite = fn => listeners.push(fn);
  const emit = (type, value) => listeners.forEach(fn => { try { fn(type, value); } catch (e) {} });

  /* ---- SRS records ---- */
  const rec = id => mem.srs.get(id) || null;
  function setRec(r, silent, at) {
    /* `base` : la remise à zéro en vigueur quand la fiche est écrite ici. Une
       fiche venue du serveur garde la sienne. `at` : l'instant dont la fiche
       date, quand ce n'est pas celui de l'écriture — un repli d'alias date de
       la plus récente des fiches qu'il replie (srs.js). */
    if (!silent) { r.updatedAt = at || Date.now(); r.base = meta.resetAt; }
    mem.srs.set(r.id, r); put('srs', r); saveLS();
    if (!silent) emit('rec', r);
  }
  const allRecs = () => [...mem.srs.values()];
  const seenCount = () => mem.srs.size;

  /* ---- meta ---- */
  const m = () => meta;
  function setMeta(patch, silent) {
    Object.assign(meta, patch);
    /* La frontière et les listes voyagent aussi dans `progress`, que seule
       cette version écrit. La version précédente la recopie telle quelle et
       réécrit le premier niveau par maximum et union : ce qu'elle a touché se
       reconnaît à ce que les deux ne sont plus égaux. */
    meta.progress = progressOf(meta);
    if (!silent) meta.updatedAt = Date.now();
    put('meta', { k: 'meta', v: meta }); saveLS();
    if (!silent) emit('meta', meta);
  }

  /* ---- review log, for the stats strip ---- */
  function logReview(entry, silent) {
    if (!silent) entry.base = meta.resetAt;
    mem.log.push(entry);
    if (mem.log.length > LOG_KEEP) mem.log.shift();
    if (useIDB) { try { db.transaction('log', 'readwrite').objectStore('log').put(entry); } catch (e) {} }
    else saveLS();
    if (!silent) emit('log', entry);
  }
  const logs = () => mem.log;

  /* ---- user's own words ---- */
  function addCustom(w) {
    const r = Object.assign({ id: 'x-' + Date.now().toString(36), kind: 'word', unit: 'eigen', level: 'eigen' }, w);
    return putCustom(r);
  }
  function putCustom(r, silent) {
    if (!silent) r.updatedAt = Date.now();
    mem.custom.set(r.id, r); put('custom', r); saveLS();
    if (!silent) emit('custom', r);
    return r;
  }
  function delCustom(id, silent) {
    mem.custom.delete(id); mem.srs.delete(id);
    if (useIDB) {
      try { db.transaction('custom', 'readwrite').objectStore('custom').delete(id); } catch (e) {}
      try { db.transaction('srs', 'readwrite').objectStore('srs').delete(id); } catch (e) {}
    }
    saveLS();
    if (!silent) emit('custom-del', id);
  }
  const customs = () => [...mem.custom.values()];

  /* ---- backup ----
     Moving from the artifact URL to a hosted one is a different origin, which
     means a different database and an empty one. Without this, months of reviews
     vanish on the move. */
  function exportAll() {
    return {
      app: 'vlaams-onderweg', v: 1, at: Date.now(),
      meta, srs: [...mem.srs.values()], custom: [...mem.custom.values()],
      log: mem.log.slice()      // tout le journal : il tient au plus LOG_KEEP lignes
    };
  }
  /* Une sauvegarde exportée avant ENGINE_EPOCH vient de l'ancien moteur : sa
     progression n'a plus de sens, et la migration l'effacerait au chargement. */
  const isOldBackup = data => !!data && (data.at || 0) < ENGINE_EPOCH;
  function importAll(data) {
    if (!data || data.app !== 'vlaams-onderweg' || !Array.isArray(data.srs)) return false;
    /* Restaurer une sauvegarde est une remise à zéro suivie d'un rechargement :
       les fiches et les lignes sont datées de maintenant et descendent de cet
       instant, sinon les autres appareils et la migration les prendraient pour
       de la progression effacée. Une sauvegarde de l'ancien moteur rend ce
       qu'une remise à zéro garde — réglages hors progression, score, mots
       personnels — et ni fiche ni ligne de journal. */
    const old = isOldBackup(data);
    const stamp = Date.now();
    mem.srs.clear(); mem.custom.clear();
    if (!old) data.srs.forEach(r => { if (r && r.id) { r.updatedAt = stamp; r.base = stamp; mem.srs.set(r.id, r); } });
    (data.custom || []).forEach(r => { if (r && r.id) mem.custom.set(r.id, r); });
    mem.log = !old && Array.isArray(data.log) ? data.log : [];
    mem.log.forEach(l => { if (l && typeof l === 'object') l.base = stamp; });
    /* Les trois magasins sont réécrits en entier : écrire les fiches restaurées
       par-dessus laissait dans IndexedDB celles d'après la sauvegarde, et
       l'ancien journal, que la migration effaçait au chargement suivant en
       annonçant que le moteur avait changé ; un mot ajouté après la sauvegarde
       revenait de même. */
    rewrite(true);
    /* Une sauvegarde d'avant la langue d'affichage n'efface pas le choix de l'appareil. */
    if (data.meta) meta = withDeviceLang(Object.assign(defaults(), data.meta));
    setMeta(Object.assign({ resetAt: stamp, updatedAt: stamp },
      old ? { dataVersion: 3, reached: 0, scenariosDone: [], listenDone: [] } : {}), true);
    emit('reset', stamp);
    return true;
  }

  /* ---- day accounting ---- */
  function touchDay() {
    const d = NL.util.dayKey();
    if (meta.doneDay !== d) setMeta({ doneDay: d, doneToday: 0 });
  }
  function creditDay(newItems) {
    const d = NL.util.dayKey();
    const n = Math.max(1, newItems == null ? 1 : newItems);
    const patch = { doneDay: d, doneToday: (meta.doneDay === d ? meta.doneToday : 0) + n };
    if (meta.lastDay !== d) {
      patch.streak = (meta.lastDay && NL.util.dayDiff(meta.lastDay, d) === 1) ? meta.streak + 1 : 1;
      patch.lastDay = d;
      patch.best = Math.max(meta.best || 0, patch.streak);
    }
    setMeta(patch);
  }

  return { open, migrate, resetProgress, rebase, ENGINE_EPOCH, onWrite, rec, setRec, allRecs, seenCount, meta: m, setMeta, logReview, logs, addCustom, putCustom, delCustom, customs, clearAll, touchDay, creditDay, exportAll, importAll, isOldBackup, get storage() { return useIDB ? 'IndexedDB' : 'localStorage'; } };
})();
</script>
<script>
/* Le planificateur. C'est lui, et pas un arbre de leçons, qui décide.
   rung   = position sur l'échelle de production
   due    = quand l'élément revient
   budget = ce qui empêche la dette de révisions d'exploser */
NL.srs = (function () {
  'use strict';
  const { clamp, DAY, HOUR, dayKey } = NL.util;

  const MAX_TASKS = 22;             // les places d'une séance : un élément par place
  const MAX_STAGE = 6;
  const PRODUCE = 4;                // l'échelon de l'écrit est passé : l'élément se produit
  /* La part de chaque séance réservée à ce qui n'a jamais été rencontré. Sans
     elle, les révisions finissent par occuper toutes les places et plus rien de
     neuf n'arrive. Elle se calcule sur la SÉANCE, jamais sur le budget du jour :
     le budget vaut plusieurs séances, et en réserver 30 % dépasserait la séance. */
  const NEW_SHARE = 0.3, NEW_MIN = 4;
  /* Un élément rencontré revient une fois dans la même séance : il coûte donc
     deux exercices. Au-delà de la moitié des places, la séance doublerait. */
  const NEW_MAX = MAX_TASKS / 2;
  const RETIRE_AT = 200 * DAY;
  const MAX_INTERVAL = 365 * DAY;   // au-delà, l'élément est acquis, pas oublié      // au-delà, l'élément sort du paquet quotidien

  /* Tous les mots ne méritent pas la même montée. Le vocabulaire compris est
     toujours plus large que le vocabulaire produit : on comprend 4 000 mots, on
     en produit 1 500. Le palier dit jusqu'où un élément doit grimper.

     AUCUN élément ne déclare de palier, et c'est VOULU. Deux règles ont été
     étudiées et rejetées :
       - par fréquence : le corpus de sous-titres classe « de bakker », « de
         apotheek », « trager » et « goeiedag » comme rares. Ce sont exactement
         les mots qu'il faut savoir DIRE en Flandre ;
       - par ressemblance écrite : « speciaal », « de trein », « het water » ont
         l'air offerts et ne se prononcent pas du tout comme leur traduction.
         Se ressembler à l'écrit ne dit rien du son, et c'est le son que le
         barreau « à voix haute » travaille.
     Le mécanisme reste en place : il redeviendra utile quand il y aura de la
     lecture, donc du vocabulaire qu'on doit comprendre sans devoir le produire.
     Voir la spécification (issue #12) avant de le remplir. */
  const TIER_MAX = { produce: 6, write: 4, recognise: 2 };
  const maxRung = item => TIER_MAX[(item && item.tier) || 'produce'];

  /* Un rythme, et le prix honnête qui va avec. */
  const PACE = {
    calme:     { cap: 70,  mins: 15 },
    normal:    { cap: 120, mins: 25 },
    intensif:  { cap: 200, mins: 45 }
  };
  const pace = () => PACE[NL.state.meta().pace || 'normal'] || PACE.normal;

  /* Chaque échelon propose un ENSEMBLE de types, pas un seul. Avec quatorze
     passages par élément, la variété n'est pas un ornement : c'est la seule
     chose qui rend 26 000 exercices supportables. */
  /* Un cran plus exigeant : la découverte alterne les deux sens, et l'oreille
     (la dictée) arrive dès le deuxième barreau au lieu d'attendre le troisième. */
  /* « Dis-le » dès l'échelon 3 pour les mots, les phrases et les expressions :
     au seul échelon 5, la première demande à voix haute tombait cinq semaines
     après la rencontre. Voir exerciseFor() pour qui y a droit d'office, et
     firstAloud() pour ce que vaut cette première fois. */
  /* À l'échelon 3, l'exercice écrit se tape. C'est lui qui mène à l'échelon 4,
     où l'élément compte parmi ceux que l'on sait produire : choisir un trou,
     toucher la faute ou ranger des tuiles ne le prouve pas. La dictée d'un mot
     se tape, et le mot la garde à côté d'« écrire » : avec « écrire » seul, les
     exercices se suivaient pareils et l'étalement ne faisait plus mieux que le
     hasard (test/pace.js). Celle d'une phrase ou d'une expression se range en
     tuiles : les phrases empruntent donc « écrire » à l'échelon 4, et une
     règle de grammaire n'y garde qu'« écrire ». « Dis-le » reste où il était. */
  /* « Comment le dit-on ici ? » vient à l'échelon 1 d'un mot comme d'une phrase : un mot qui a
     sa forme flamande la rencontre là, quand la première forme de sa liste n'est pas son
     néerlandais (supports). */
  const RUNGS = {
    word: [
      ['pick', 'recall'],
      ['article', 'intrus', 'dictation', 'vlaams'],
      ['dictation', 'type'],
      ['type', 'dictation', 'speak'],
      ['type', 'cloze', 'dictation'],
      ['speak'],
      ['speak', 'type', 'dictation', 'cloze']
    ],
    phrase: [
      ['pick', 'recall'],
      ['bank', 'vlaams', 'cloze'],
      ['cloze', 'corrige', 'dictation'],
      ['speak', 'type'],
      ['type', 'cloze', 'corrige'],
      ['speak'],
      ['speak', 'type', 'open', 'corrige', 'dictation']
    ],
    chunk: [
      ['pick', 'recall'],
      ['bank', 'vlaams'],
      ['cloze'],
      ['type', 'speak'],
      ['type', 'dictation', 'cloze'],
      ['speak'],
      ['speak', 'type', 'cloze']
    ],
    pattern: [
      ['order'],
      ['order', 'corrige'],
      ['cloze', 'corrige'],
      ['type'],
      ['speak', 'open'],
      ['speak'],
      ['open', 'speak']
    ]
  };

  /* Aucun intervalle enregistré ne descend sous un jour. Le renforcement quelques
     minutes après la rencontre existe toujours, mais c'est la séance en cours
     qui le fait (src/ui/session.js) : enregistré comme une échéance, il
     disputait les places de la séance à tout le reste. L'échéance tombe au début du jour
     local situé `interval` jours après la réponse, et jamais moins de huit heures après
     elle (#28) : un élément rencontré aujourd'hui revient demain, quelle que soit l'heure.
     Voir docs/adr/0001. */
  const STEP = [1 * DAY, 1 * DAY, 1 * DAY, 3 * DAY, 8 * DAY, 21 * DAY];

  /* Des jours civils, pas des durées : sinon celui qui étudie à la même heure ne trouve
     rien d'échu le lendemain, et la nuit du changement d'heure décale tout. Au sommet,
     l'intervalle grandit sans tomber juste sur des jours : il est arrondi au plus proche. */
  const dueAt = (now, interval) => {
    const [y, m, d] = dayKey(now).split('-').map(Number);
    const days = Math.max(1, Math.round(interval / DAY));
    return Math.max(new Date(y, m - 1, d + days).getTime(), now + 8 * HOUR);
  };

  const blank = (id, kind) => ({
    id, kind: kind || 'word', stage: 0, due: 0, interval: 0,
    ease: 2.5, reps: 0, lapses: 0, last: 0, said: false, retired: false, lastEx: null
  });
  const recOf = item => NL.state.rec(item.id) || blank(item.id, item.kind);

  /* ---------------- choix de l'exercice ---------------- */
  /* `avoid` = les types déjà servis dans cette séance. Le gouverneur évite ce que
     l'élément a eu la dernière fois, puis ce qui vient de passer.
     `quiet` = une séance où l'on ne peut pas parler : rien à voix haute. */
  function exerciseFor(item, avoid, quiet) {
    const r = recOf(item);
    /* Un mot transparent n'a pas besoin qu'on lui enseigne son sens : sa
       première rencontre se fait à l'échelon suivant. Rien d'autre n'est sauté —
       ressembler à un mot connu ne dit ni son article ni comment il sonne. */
    const rung = (r.reps === 0 && item.cognate) ? 1 : clamp(r.stage, 0, 6);
    const set = (RUNGS[item.kind] || RUNGS.word)[rung] || ['pick'];
    let usable = set.filter(n => supports(item, n));
    if (quiet) usable = usable.filter(n => n !== 'speak');
    if (!usable.length) usable = [fallback(item)];
    /* Un élément jamais dit à voix haute l'est dès que son échelon le propose.
       Tiré au sort parmi les exercices de l'échelon, « dis-le » ne tombait qu'une
       fois sur deux ou trois, et le reste attendait l'échelon 5. */
    if (!r.said && usable.indexOf('speak') >= 0) return 'speak';

    let pick = usable.filter(n => n !== r.lastEx);
    if (!pick.length) pick = usable;
    if (avoid && avoid.size) {
      const fresher = pick.filter(n => !avoid.has(n));
      if (fresher.length) pick = fresher;
    }
    return pick[(Math.random() * pick.length) | 0];
  }

  /* Un type n'est proposé que si l'élément peut réellement le porter. */
  function supports(item, name) {
    /* Un mot muni d'une phrase d'exemple peut porter les exercices de phrase :
       c'est la phrase qu'on remet en ordre, pas le mot tout seul. */
    const carrier = (item.drills && item.drills.length) ? item.drills[0].nl : (item.nl || '');
    const words = NL.util.tiles(carrier).length;
    switch (name) {
      case 'article': return !!item.art;
      /* L'exercice propose la première forme flamande de l'élément : elle doit dire autre chose
         que le néerlandais standard. « ja, jaja » pour ja n'a rien à demander. */
      case 'vlaams': {
        const first = NL.content.beVariants(item)[0], bare = item.kind === 'word' ? NL.util.bare : String;
        return !!first && NL.util.norm(bare(first)) !== NL.util.norm(bare(item.nl));
      }
      case 'bank': case 'cloze': case 'order': case 'corrige': return words >= 3;
      case 'open': return !!item.open;
      case 'intrus': return item.kind === 'word' && !!item.art;
      default: return true;
    }
  }
  const fallback = item => (NL.util.tiles(item.nl || '').length >= 3 ? 'type' : 'pick');

  /* Vrai quand le prochain exercice de l'élément ne peut être que parlé : son
     échelon n'offre rien d'autre, ou bien il n'a jamais été dit et son échelon
     propose de le dire. Une séance où l'on ne peut pas parler laisse ces
     éléments attendre plutôt que de leur donner autre chose. */
  function needsVoice(item) {
    const r = recOf(item);
    const usable = ((RUNGS[item.kind] || RUNGS.word)[clamp(r.stage, 0, 6)] || []).filter(n => supports(item, n));
    return usable.indexOf('speak') >= 0 && (!r.said || usable.length === 1);
  }

  /* Vrai quand l'élément n'a jamais été dit et que son échelon propose de le
     dire à côté d'un autre exercice. Le dire ne déplace alors rien : réussi, il
     est dit et garde son échelon, et c'est l'exercice écrit qui suit, dans la
     même séance, qui le fait monter. Sans cela, lire un mot à voix haute
     suffirait à le compter parmi ceux que l'on sait produire. */
  function firstAloud(item) {
    const r = recOf(item);
    const usable = ((RUNGS[item.kind] || RUNGS.word)[clamp(r.stage, 0, 6)] || []).filter(n => supports(item, n));
    return !r.said && usable.length > 1 && usable.indexOf('speak') >= 0;
  }

  /* ---------------- notation ---------------- */
  function grade(item, ok, opts) {
    const r = recOf(item);
    const now = Date.now();
    const top = maxRung(item);
    r.kind = item.kind || r.kind;
    r.reps++; r.last = now;
    if (opts && opts.ex) r.lastEx = opts.ex;

    /* Dit pour la première fois, là où l'échelon propose aussi autre chose :
       l'élément est dit, et rien d'autre ne bouge. Un second exercice, en fin de
       séance, le redemande par écrit, et c'est cette réponse-là qui le fait
       monter. Si la séance s'arrête avant, il revient demain, par écrit. */
    const first = !!opts && opts.ex === 'speak' && firstAloud(item);
    if (ok && first && opts.spoken) {
      r.said = true;
      r.interval = STEP[0];
    } else if (ok) {
      if (opts && opts.spoken) r.said = true;
      /* Un transparent (de tram, de garage, direct) a été rencontré à l'échelon 1 :
         sa première réussite le mène donc à l'échelon 2. Un seul échelon sauté,
         celui du sens. Voir docs/adr/0004. */
      const jump = (r.reps === 1 && item.cognate) ? 2 : 1;
      r.stage = clamp(r.stage + jump, 0, top);
      /* Le défi ne fait pas passer à un élément jamais dit à voix haute le premier
         échelon où son genre le fait dire — le 3, et le 4 pour une règle de
         grammaire : son premier exercice parlé y vient encore. */
