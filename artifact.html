   jamais dans le tour où il s'est levé. Un changement venu d'un autre appareil le dit
   (`fromAccount`) ; la marque, comme l'avis, n'est pas enregistrée. */
NL.lang = (function () {
  'use strict';
  /* noticeKeys : les clés de NL.t que l'avis dit, dans l'ordre ; vide, il n'y a pas d'avis.
     tickOver : le tour où l'avis s'est levé est fini ; seen() peut alors l'effacer.
     tickTimer : le minuteur qui finit ce tour ; un second avis du même tour le remplace. */
  let applied = null, noticeKeys = [], tickOver = false, tickTimer = 0, fromSync = false;

  const current = () => NL.state.meta().displayLang === 'fr' ? 'fr' : 'en';

  /* Rend vrai si la langue de l'écran a changé. La marque de synchro vaut pour
     l'appel suivant, qu'il change la langue ou non. */
  function apply() {
    fromSync = false;
    const l = current();
    if (l === applied) return false;
    Object.keys(NL.t).forEach(k => { delete NL.t[k]; });
    Object.assign(NL.t, NL.tables[l]);
    NL.gloss.use(l);
    NL.content.refresh();
    document.documentElement.setAttribute('lang', NL.gloss.tag(l));
    applied = l;
    return true;
  }

  function applyAndTell() {
    const bySync = fromSync;
    if (!apply()) return;
    noticeKeys = bySync ? ['langSynced', 'langNotice'] : ['langNotice'];
    /* render() dessine l'avis dans le tour où il se lève. Un avis dessiné puis
       remplacé dans ce même tour n'a pas été vu : seen() ne l'efface qu'au tour d'après. */
    tickOver = false;
    clearTimeout(tickTimer);
    tickTimer = setTimeout(() => { tickOver = true; }, 0);
  }

  /* Enregistre le choix ; render() l'applique au premier écran hors séance. */
  function set(lang) {
    fromSync = false;
    NL.state.setMeta({ displayLang: lang });
  }

  /* sync.js écrit par `write` les réglages venus du compte. Une langue qui change
     ainsi vient d'un autre appareil : l'avis le dira. */
  function fromAccount(write) {
    const before = current();
    write();
    if (current() !== before) fromSync = true;
  }

  const text = () => noticeKeys.map(k => NL.t[k]).join(' ');
  const seen = () => { if (tickOver) noticeKeys = []; };

  return { current, apply, applyAndTell, set, fromAccount, notice: text, seen };
})();
</script>
<script>
/* The exercise types. Each exposes the same five functions so the session runner
   never needs to know which one it is holding. */
NL.ex = (function () {
  'use strict';
  const U = NL.util, esc = U.esc;

  /* ---------------- shared bits of view ---------------- */
  const ICON = {
    speaker: (s) => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9.5h3.2L12 5.2v13.6L7.2 14.5H4v-5Z"/><path d="M15.2 8.6a4.7 4.7 0 0 1 0 6.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M17.8 6a8.2 8.2 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>',
    turtle: () => '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9.5h3L11 6v12L7 14.5H4v-5Z"/><path d="M14.4 9.2a4 4 0 0 1 0 5.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M18.2 17.6 19.8 19.2M18.2 6.4 19.8 4.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>',
    mic: (s) => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 17.5v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
  };

  const speakerRow = (text, opts) => {
    opts = opts || {};
    return '<div class="speaker-row">' +
      '<button class="speaker" data-say="' + esc(text) + '" aria-label="' + NL.t.listen + '">' + ICON.speaker(26) + '</button>' +
      '<button class="speaker slow" data-say="' + esc(text) + '" data-slow="1" aria-label="' + NL.t.slow + '">' + ICON.turtle() + '</button>' +
      (opts.show ? '<div class="sentence"><span' + NL.gloss.attr('nl') + '>' + esc(text) + '</span>' + flemish(opts.be, text) + '</div>' : '') +
      '</div>';
  };

  const flemish = (be, std) => (be && NL.state.meta().showFlemish !== false && U.norm(be) !== U.norm(std))
    ? '<span class="be-line"><span class="be-tag">' + NL.t.beTag + '</span><span' + NL.gloss.attr('nl') + '>' + esc(be) + '</span></span>' : '';

  /* `lang` : l'attribut de la langue des libellés, NL.gloss.attr('nl') pour du néerlandais, NL.gloss.langAttr pour des sens. */
  function optList(opts, L, phase, lang) {
    return '<div class="opts">' + opts.map((o, i) => {
      let cls = '';
      if (phase === 'ask') cls = (L.sel && L.sel.i === i) ? ' sel' : '';
      else if (o.ok) cls = ' ok';
      else if (L.sel && L.sel.i === i) cls = ' no';
      return '<button class="opt' + cls + '" data-opt="' + i + '"' + (phase === 'ask' ? '' : ' disabled') + '>' +
        '<span class="opt-key">' + (i + 1) + '</span><span' + lang + '>' + esc(o.label) + '</span></button>';
    }).join('') + '</div>';
  }

  function tileArea(task, L, phase) {
    const src = task.bank;
    const chosen = L.picked.map(i =>
      '<button class="tile"' + NL.gloss.attr('nl') + ' data-unpick="' + i + '"' + (phase === 'ask' ? '' : ' disabled') + '>' + esc(src[i]) + '</button>').join('');
    const bank = src.map((w, i) => {
      const used = L.picked.indexOf(i) >= 0;
      return '<button class="tile' + (used ? ' spent' : '') + '"' + NL.gloss.attr('nl') + ' data-pick="' + i + '"' +
        (phase === 'ask' && !used ? '' : ' disabled') + '>' + esc(w) + '</button>';
    }).join('');
    return '<div class="answer-area' + (L.picked.length ? '' : ' hint') + '">' + chosen + '</div>' +
      '<div class="bank">' + tileShuffleGuard(bank) + '</div>';
  }
  const tileShuffleGuard = html => html || '<span class="muted">—</span>';

  const said = (task, L) => L.picked.map(i => task.bank[i]).join(' ');
  /* Le libellé de l'option choisie, null sans choix. */
  const chosenLabel = (task, L) => L.sel && task.opts[L.sel.i] ? task.opts[L.sel.i].label : null;

  /* Une note de prononciation se dit en mots reconnus, pas en pourcentage. */
  const wordScore = parts => NL.t.wordsHeard((parts || []).filter(p => p.ok).length, (parts || []).length);

  /* Ce que la réponse tapée accepte pour un élément : la cible, ses variantes
     flamandes (une par virgule pour un mot, la phrase entière pour une phrase) et
     sa liste « also ». Un mot se tape avec ou sans article, comme la cible. */
  function accepted(item) {
    const word = item.kind === 'word';
    return U.uniq([item.nl].concat(NL.content.beVariants(item), item.also || [])
      .map(x => U.norm(word ? U.bare(x) : x)).filter(Boolean));
  }
  /* Les éléments qui disent la même chose : taper l'un est juste pour l'autre. */
  const siblings = item => NL.content.allItems().filter(x => x.id !== item.id && x.nl && NL.gloss.sameSense(x, item));
  /* Les réponses acceptées (`list`) comprennent-elles le néerlandais de `b` ? */
  const accepts = (list, b) => list.indexOf(U.norm(U.bare(b.nl))) >= 0;

  /* Les mauvaises réponses décident de la difficulté d'un QCM. Tirées au hasard
     dans l'unité, elles s'éliminent sans connaître le mot : la bonne est la plus
     longue, ou la seule avec le bon article, ou la seule du bon champ lexical.
     On les choisit donc PROCHES de la bonne réponse — même genre, longueur
     comparable, graphie voisine — pour qu'il faille vraiment savoir.
     "field" : 'nl' pour des mots néerlandais, 'gloss' pour des sens. Les sens se
     jugent dans la langue lue de l'élément : on ne pose jamais contre des
     éléments qui n'ont rien dans cette langue. */
  function others(item, n, field) {
    const lang = NL.gloss.langOf(item);
    const label = x => field === 'gloss' ? NL.gloss.bare(x, lang) : U.bare(x.nl);
    const cls = NL.gloss.wordClass(item, lang);
    const target = label(item), tn = U.norm(target), len = target.length;

    let pool = NL.content.itemsOf(item.unit).filter(x => x.id !== item.id && x.kind === item.kind && NL.gloss.has(x, lang));
    /* Unité trop maigre : on élargit aux éléments déjà rencontrés ailleurs,
       jamais à ceux qui n'ont pas encore été introduits. */
    if (pool.length < n + 3) {
      pool = pool.concat(NL.content.allItems().filter(x =>
        x.kind === item.kind && x.unit !== item.unit && x.id !== item.id && NL.gloss.has(x, lang) && NL.srs.isSeen(x)));
    }
    /* Un leurre ne doit jamais être une autre bonne réponse. « bonjour » se dit
       « hallo » ET « goeiedag » : proposer les deux, c'est en compter un faux.
       On compare chaque sens (« s'il vous plaît / voilà » en a deux), dans les
       deux langues : c'est NL.gloss.sameMeaning. Le lexique sépare les sens par
       « / » ; une virgule, elle, appartient à la phrase et ne sépare rien. Ni un
       synonyme, ni une réponse que l'un des deux accepte : « dag » face à
       « bonjour » ne doit pas offrir « hallo » comme faux. */
    const mine = accepted(item);
    pool = pool.filter(x => U.norm(label(x)) !== tn && !NL.gloss.sameMeaning(x, item) && !accepts(mine, x) && !accepts(accepted(x), item));

    const score = x => {
      const s = label(x);
      let sc = 0;
      if (item.art && x.art && x.art === item.art) sc += 3;        // pas de tri par de/het
      if (NL.gloss.wordClass(x, lang) === cls) sc += 3;            // pas de tri par nature
      const gap = Math.abs(s.length - len) / Math.max(len, 1);
      sc += gap < 0.2 ? 3 : gap < 0.45 ? 2 : gap < 0.7 ? 1 : 0;    // pas de tri par longueur
      const d = U.lev(U.norm(s), tn);
      if (d <= Math.max(2, Math.round(len * 0.4))) sc += 2;        // voisin à l'œil et à l'oreille
      return sc;
    };

    /* On garde le peloton de tête puis on tire dedans : proche sans être
       toujours le même trio pour un mot donné. */
    const ranked = U.shuffle(pool).sort((a, b) => score(b) - score(a));
    const short = ranked.slice(0, Math.max(n, Math.min(ranked.length, n * 3)));
    return U.uniq(U.sample(short, n).map(label)).slice(0, n);
  }
  function bankFor(sentence, item, extra) {
    const right = U.tiles(sentence);
    const pool = [];
    NL.content.itemsOf(item.unit).forEach(x => {
      if (x.id === item.id || x.kind !== 'phrase') return;
      U.tiles(x.nl).forEach(t => pool.push(t));
    });
    const noise = U.sample(
      U.uniq(pool).filter(t => !right.some(r => U.norm(r) === U.norm(t))),
      Math.min(extra == null ? 4 : extra, 5)
    );
    return U.shuffle(right.concat(noise));
  }

  /* Picks a content word worth hiding: the longest, least function-like token. */
  function gapWord(sentence, forced) {
    const ts = U.tiles(sentence);
    if (forced && ts.some(t => U.norm(t) === U.norm(forced))) return ts.find(t => U.norm(t) === U.norm(forced));
    const stop = ['de', 'het', 'een', 'ik', 'je', 'ge', 'is', 'en', 'in', 'op', 'te', 'dat', 'niet', 'u', 'van'];
    const cands = ts.filter(t => stop.indexOf(U.norm(t)) < 0 && t.length > 2);
    return (cands.length ? cands : ts).sort((a, b) => b.length - a.length)[0];
  }

  /* ---------------- the types ----------------
     Chaque type dit en quoi il pose (`asks`) et en quoi il répond (`answers`) :
     'nl' du néerlandais, 'gloss' un sens dans sa langue, null les deux mêlés. Il
     dit aussi ce que la personne a donné (`given`) : l'option choisie, les tuiles,
     le texte tapé ou entendu, null quand rien ne se compare à la réponse. Le pied
     de la séance lit `answers` et `given` ; test/lang.js refuse un type sans les trois. */
  const R = {};

  R.pick = {
    id: 'pick', get kicker() { return NL.t.exPick; },
    asks: 'gloss', answers: 'nl',
    given: chosenLabel,
    build(item) {
      const right = U.bare(item.nl);
      /* Quatre options, pas trois : au hasard on tombe juste une fois sur quatre. */
      const opts = U.shuffle([{ label: right, ok: true }].concat(
        others(item, 3, 'nl').map(l => ({ label: l, ok: false }))));
      return { type: 'pick', item, prompt: NL.gloss.bare(item), opts };
    },
    view(t, L, phase) {
      return '<p class="sentence prompt"' + NL.gloss.langAttr(t.item) + '>' + esc(t.prompt) + '</p>' + optList(t.opts, L, phase, NL.gloss.attr('nl'));
    },
    ready: (t, L) => !!L.sel,
    judge: (t, L) => ({ ok: !!(L.sel && (t.opts[L.sel.i] || {}).ok) }),
    answer: t => U.bare(t.item.nl)
  };

  R.recall = {
    id: 'recall', get kicker() { return NL.t.exRecall; },
    asks: 'nl', answers: 'gloss',
    given: chosenLabel,
    build(item) {
      const opts = U.shuffle([{ label: NL.gloss.bare(item), ok: true }].concat(
        others(item, 3, 'gloss').map(l => ({ label: l, ok: false }))));
      return { type: 'recall', item, opts };
    },
    view(t, L, phase) {
      return speakerRow(U.bare(t.item.nl), { show: true, be: t.item.be }) + optList(t.opts, L, phase, NL.gloss.langAttr(t.item));
    },
    auto: t => U.bare(t.item.nl),
    ready: (t, L) => !!L.sel,
    judge: (t, L) => ({ ok: !!(L.sel && (t.opts[L.sel.i] || {}).ok) }),
    answer: t => NL.gloss.bare(t.item)
  };

  R.article = {
    id: 'article', get kicker() { return NL.t.exArticle; },
    asks: 'nl', answers: 'nl',
    given: chosenLabel,
    build: item => ({ type: 'article', item, opts: [{ label: 'de', ok: item.art === 'de' }, { label: 'het', ok: item.art === 'het' }] }),
    view(t, L, phase) {
      const n = U.bare(t.item.nl);
      return '<div class="speaker-row">' +
        '<button class="speaker" data-say="' + esc(t.item.art + ' ' + n) + '" aria-label="' + NL.t.listen + '">' + ICON.speaker(26) + '</button>' +
        '<div class="sentence">&hellip;&nbsp;<span' + NL.gloss.attr('nl') + '>' + esc(n) + '</span><span class="gloss"' + NL.gloss.langAttr(t.item) + '>' + esc(NL.gloss.bare(t.item)) + '</span></div></div>' +
        optList(t.opts, L, phase, NL.gloss.attr('nl'));
    },
    ready: (t, L) => !!L.sel,
    judge: (t, L) => ({ ok: !!(L.sel && (t.opts[L.sel.i] || {}).ok) }),
    answer: t => t.item.art + ' ' + U.bare(t.item.nl)
  };

  R.bank = {
    id: 'bank', get kicker() { return NL.t.exBank; },
    asks: 'gloss', answers: 'nl',
    given: said,
    build(item) {
      const d = (item.drills && item.drills.length) ? U.one(item.drills) : Object.assign({ nl: item.nl }, NL.gloss.meaning(item));
      return { type: 'bank', item, drill: d, target: d.nl, bank: bankFor(d.nl, item) };
    },
    view(t, L, phase) {
      return '<div class="sentence prompt"' + NL.gloss.langAttr(t.drill) + '>' + esc(NL.gloss.of(t.drill)) + '</div>' + tileArea(t, L, phase);
    },
    ready: (t, L) => L.picked.length > 0,
    judge: (t, L) => ({ ok: U.norm(said(t, L)) === U.norm(t.target) }),
    answer: t => t.target
  };

  R.order = {
    id: 'order', get kicker() { return NL.t.exOrder; },
    asks: 'gloss', answers: 'nl',
    given: said,
    build(item) {
      const d = U.one(item.drills || [Object.assign({ nl: item.nl }, NL.gloss.meaning(item))]);
      return { type: 'order', item, drill: d, target: d.nl, bank: U.shuffle(U.tiles(d.nl)) };
    },
    view(t, L, phase) {
      return '<div class="sentence prompt"' + NL.gloss.langAttr(t.drill) + '>' + esc(NL.gloss.of(t.drill)) + '</div>' +
        '<div class="rule-chip"' + NL.gloss.langAttr(t.item.rule) + '>' + NL.gloss.quoted(t.item.rule) + '</div>' + tileArea(t, L, phase);
    },
    ready: (t, L) => L.picked.length > 0,
    judge: (t, L) => ({ ok: U.norm(said(t, L)) === U.norm(t.target) }),
    answer: t => t.target
  };

  R.cloze = {
    id: 'cloze', get kicker() { return NL.t.exCloze; },
    asks: 'nl', answers: 'nl',
    given: chosenLabel,
    build(item) {
      const d = item.drills ? U.one(item.drills) : Object.assign({ nl: item.nl }, NL.gloss.meaning(item));
      /* Pour un mot, le trou tombe sur le mot enseigné, pas sur le plus long de
         la phrase : sinon on drille « gemeentehuis » en cachant « morgen ». */
      const forced = d.gap ||
        (item.kind === 'word' && U.tiles(U.bare(item.nl)).length === 1 ? U.bare(item.nl) : null);
      const gap = gapWord(d.nl, forced);
      /* Les leurres du texte à trous sortaient des mots de l'unité, articles et
         pronoms compris : « Het » face à « gemeentehuis » ne trompe personne et
         se raye sans lire la phrase. On ne garde que des mots pleins, et de
         longueur comparable au mot caché. */
      const FILLERS = ['het', 'de', 'een', 'ik', 'je', 'ge', 'gij', 'wij', 'hij', 'zij', 'ze', 'we',
        'is', 'ben', 'zijn', 'heb', 'hebt', 'heeft', 'en', 'in', 'op', 'aan', 'te', 'van', 'met',
        'voor', 'bij', 'naar', 'dat', 'dit', 'die', 'deze', 'niet', 'geen', 'om', 'zo', 'ook',
        'wel', 'uw', 'mijn', 'er', 'u', 'al'];
      const pool = U.uniq(NL.content.itemsOf(item.unit)
        .flatMap(x => U.tiles(x.nl || '').concat((x.drills || []).flatMap(d => U.tiles(d.nl))))
        .filter(w => w.length > 2 && U.norm(w) !== U.norm(gap) && FILLERS.indexOf(U.norm(w)) < 0));
      const near = pool.slice().sort((a, b) =>
        Math.abs(a.length - gap.length) - Math.abs(b.length - gap.length));
      const opts = U.shuffle([{ label: gap, ok: true }].concat(
        U.sample(near.slice(0, Math.max(8, Math.min(near.length, 14))), 3).map(l => ({ label: l, ok: false }))));
      return { type: 'cloze', item, drill: d, gap, opts, shown: d.nl.replace(new RegExp('(^|\\s)' + gap.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?=\\s|$|[.,!?])'), '$1     ') };
    },
    view(t, L, phase) {
      return '<div class="sentence cloze-line"' + NL.gloss.attr('nl') + '>' + esc(t.shown).replace(/ +/, '<span class="gap">' + (phase === 'ask' ? '' : esc(t.gap)) + '</span>') + '</div>' +
        '<div class="gloss-line"' + NL.gloss.langAttr(t.drill) + '>' + esc(NL.gloss.of(t.drill)) + '</div>' + optList(t.opts, L, phase, NL.gloss.attr('nl'));
    },
    ready: (t, L) => !!L.sel,
    judge: (t, L) => ({ ok: !!(L.sel && (t.opts[L.sel.i] || {}).ok) }),
    answer: t => t.gap
  };

  R.dictation = {
    id: 'dictation', get kicker() { return NL.t.exDictation; },
    asks: 'nl', answers: 'nl',
    given: (t, L) => t.bank ? said(t, L) : L.input,
    build(item) {
      const target = item.kind === 'word' ? U.bare(item.nl) : item.nl;
      return { type: 'dictation', item, target, bank: item.kind === 'word' ? null : bankFor(target, item, 3) };
    },
    view(t, L, phase) {
      const head = speakerRow(t.target, { show: phase !== 'ask', be: t.item.be });
      if (t.bank) return head + tileArea(t, L, phase);
      return head + '<input class="textin" type="text" value="' + esc(L.input) + '" autocomplete="off" ' +
        'autocapitalize="off" spellcheck="false" placeholder="' + NL.t.heardWhat + '"' + (phase === 'ask' ? '' : ' disabled') + '>';
    },
    auto: t => t.target,
    ready: (t, L) => t.bank ? L.picked.length > 0 : L.input.trim().length > 0,
    judge(t, L) {
      const got = t.bank ? said(t, L) : L.input;
      if (t.bank) return { ok: U.norm(got) === U.norm(t.target) };
      const ok = U.typedOk(got, t.target);
      return { ok, close: !ok && U.typedOk(got, t.target, 1) };
    },
    answer: t => t.target
  };

  R.type = {
    id: 'type', get kicker() { return NL.t.exType; },
    asks: 'gloss', answers: 'nl',
    given: (t, L) => L.input,
    build(item) {
      return { type: 'type', item, target: item.kind === 'word' ? U.bare(item.nl) : (item.drills ? item.nl : item.nl), prompt: item.kind === 'word' ? NL.gloss.bare(item) : NL.gloss.of(item) };
    },
    view(t, L, phase) {
      return '<div class="sentence prompt"' + NL.gloss.langAttr(t.item) + '>' + esc(t.prompt) + '</div>' +
        '<input class="textin" type="text" value="' + esc(L.input) + '" autocomplete="off" autocapitalize="off" ' +
        'spellcheck="false" placeholder="' + NL.t.typeHere + '"' + (phase === 'ask' ? '' : ' disabled') + '>' +
        '<div class="hintline"><span>' + NL.t.specialLetters + '</span>' +
        ['é', 'ë', 'ï', 'ö', 'è', 'ij'].map(c => '<button class="chip" data-ins="' + c + '">' + c + '</button>').join('') +
        '</div>';
    },
    ready: (t, L) => L.input.trim().length > 0,
    /* Juste si l'entrée vaut l'une des réponses de l'élément, ou de celle d'un
       autre élément au même sens (alors `other` : le panneau nomme le mot
       demandé). « Presque » se mesure contre toutes, à une lettre. */
    judge(t, L) {
      const own = accepted(t.item);
      if (own.some(a => U.typedOk(L.input, a))) return { ok: true };
      const others = [];
      siblings(t.item).forEach(x => accepted(x).forEach(a => others.push(a)));
      if (others.some(a => U.typedOk(L.input, a))) return { ok: true, other: true };
      return { ok: false, close: own.concat(others).some(a => U.typedOk(L.input, a, 1)) };
    },
    answer: t => t.target
  };

  R.speak = {
    id: 'speak', get kicker() { return NL.t.exSpeak; },
    asks: 'nl', answers: 'nl',
    given: (t, L) => L.speech.heard || null,
    build(item) {
      return { type: 'speak', item, target: item.kind === 'word' ? U.bare(item.nl) : item.nl, prompt: item.kind === 'word' ? NL.gloss.bare(item) : NL.gloss.of(item) };
    },
    view(t, L, phase) {
      const sp = L.speech;
      const panel = micPanel(sp, t.target);

      /* « Je ne peux pas parler » : proposé tant que rien n'a été tenté. Une fois
         la réponse donnée, c'est une réponse. */
      const untried = phase === 'ask' && sp.selfRated == null && sp.phase !== 'done' && sp.phase !== 'listening' &&
        sp.recState !== 'rec' && sp.recState !== 'done';
      const hush = untried ? '<div class="mic-actions"><button class="btn btn-ghost" data-quiet="1">' + NL.t.cantSpeak + '</button></div>' : '';

      return '<div class="sentence prompt"><span' + NL.gloss.attr('nl') + '>' + esc(t.target) + '</span>' + flemish(t.item.be, t.target) + '</div>' +
        '<div class="gloss-line"' + NL.gloss.langAttr(t.item) + '>' + esc(t.prompt) + '</div>' +
        speakerRow(t.target, {}) + panel + hush;
    },
    ready(t, L) {
      const sp = L.speech;
      return sp.phase === 'done' || sp.selfRated != null;
    },
    judge(t, L) {
      const sp = L.speech;
      const ok = sp.selfRated != null ? !!sp.selfRated : !!sp.ok;
      return { ok, spoken: ok };
    },
    answer: t => t.target
  };

  /* Le panneau du micro, le même sur les trois écrans qui font parler : cet exercice, le tour de
     parole d'une conversation (scenario.js) et le nazeggen (listen.js). Il écoute, puis montre le
     score, le mot à mot et ce que le micro a entendu ; quand le micro ne peut pas écouter, c'est
     recordPanel. Un appelant passe dans `opts` ce qui diffère d'un écran à l'autre ; ce qu'il omet
     est ce que fait cet exercice :
       icon       la taille du micro (34) ;
       taps       ce que portent les boutons qui lancent et arrêtent l'écoute, tel que le clic de
                  l'écran le lit (MIC_TAPS) ; le panneau leur ajoute leur aria-label ;
       after(sp)  ce qui suit le score : l'action qui accepte et la règle qui fait réessayer (ici,
                  réessayer jusqu'au troisième refus, puis s'évaluer) ;
       graded     false pour un écran qui ne note rien, le nazeggen : UNGRADED au lieu de GRADED. */
  function micPanel(sp, target, opts) {
    const screen = Object.assign({
      icon: 34, graded: true, after: retryThenRate,
      taps: MIC_TAPS
    }, opts);
    const grading = screen.graded ? GRADED : UNGRADED;
    const blocked = NL.speech.listenBlocked();
    if (blocked) return grading.blocked(sp, target, blocked);
    if (sp.phase === 'listening') {
      return '<div class="mic-panel live"><button class="mic big listening"' + micAttrs(screen.taps.stop, NL.t.stop) + '>' + ICON.mic(screen.icon) + '</button>' +
        '<p class="mic-why">' + NL.t.micListening + '</p>' +
        NL.ui.ifText(sp.partial, 'p', 'heard', 'nl') + '</div>';
    }
    if (sp.phase === 'done') {
      return '<div class="mic-panel ' + (sp.ok ? 'good' : 'bad') + '">' +
        '<div class="score-row"><span class="score">' + wordScore(sp.parts) + '</span>' +
        '<span class="score-bar"><span style="width:' + sp.pct + '%"></span></span></div>' +
        '<p class="word-diff"' + NL.gloss.attr('nl') + '>' + sp.parts.map(p =>
          '<span class="' + (p.ok ? (p.close ? 'w-close' : 'w-ok') : 'w-no') + '">' + esc(p.word) + '</span>').join(' ') + '</p>' +
        grading.heard(sp) + screen.after(sp) + '</div>';
    }
    /* Un refus s'affiche : sans ça, toucher le micro ne faisait rien, en silence. */
    return '<div class="mic-panel"><button class="mic big"' + micAttrs(screen.taps.start, NL.t.speak) + '>' + ICON.mic(screen.icon) + '</button>' +
      '<p class="mic-why">' + (sp.error ? esc(micError(sp.error)) : NL.t.micTap) + '</p>' +
      grading.afterError(sp) + '</div>';
  }

  /* Ce que portent les boutons du micro de l'exercice et du tour de parole : le clic de ces écrans
     lit data-mic. Le bouton « réessayer » (retryButton) porte celui qui lance l'écoute. */
  const MIC_TAPS = { start: { mic: 'start' }, stop: { mic: 'stop' } };

  /* Les attributs d'un bouton du micro : le data-* que lit le clic de l'écran (tapAttrs), et son
     nom pour un lecteur d'écran. */
  const tapAttrs = tap => Object.keys(tap).map(k => ' data-' + k + '="' + tap[k] + '"').join('');
  const micAttrs = (tap, label) => tapAttrs(tap) + ' aria-label="' + label + '"';

  /* Ce que le panneau ajoute sur un écran qui note : recordPanel quand le micro ne peut pas écouter,
     la ligne « entendu » sous le score, et l'auto-évaluation sous une erreur. Le nazeggen ne note
     rien : un simple avis à la place de recordPanel, et rien d'autre. */
  const GRADED = {
    blocked: recordPanel,
    heard: sp => sp.heard ? '<p class="heard">' + NL.t.micHeard + ' &ldquo;<span' + NL.gloss.attr('nl') + '>' + esc(sp.heard) + '</span>&rdquo;</p>' : '',
    afterError: sp => sp.error ? selfRate(sp) : ''
  };
  const UNGRADED = {
    blocked: () => '<div class="mic-panel offline"><p class="mic-why">' + NL.t.micNoBrowser + '</p></div>',
    heard: () => '',
    afterError: () => ''
  };

  /* Réessayer après un essai manqué, tant qu'il en reste : l'exercice et le tour de parole d'une
     conversation (scenario.js) suivent la même règle. `label(left)` donne le texte du bouton,
     `left` étant le nombre d'essais qui restent. */
  const TRIES = 3;
  const retryButton = (sp, label) => !sp.ok && sp.tries < TRIES
    ? '<button class="btn btn-blue"' + tapAttrs(MIC_TAPS.start) + '>' + label(TRIES - sp.tries) + '</button>' : '';

  /* Ce qui suit le score dans l'exercice : réessayer, puis s'évaluer. Trois refus (TRIES) : le
     micro n'entend peut-être simplement pas ce mot-là. Sans cette issue, l'élément serait redemandé
     chaque jour sans jamais monter. */
  const retryThenRate = sp => {
    const retry = retryButton(sp, NL.t.micRetry);
    return retry ? '<div class="mic-actions">' + retry + '</div>' : sp.ok ? '' : selfRate(sp);
  };

  /* No recogniser available. Record yourself instead and compare against the
     model — no service needed, works offline, works in Opera. Falls through to
     honest self-rating when even the microphone is out of reach. */
  function recordPanel(sp, target, blocked) {
    const T = NL.t;
    const hardStop = !NL.speech.canRecord() ||
      ['framed', 'denied', 'nomic', 'blocked', 'format'].indexOf(sp.recErr) >= 0;

    if (hardStop) {
      return '<div class="mic-panel offline">' +
        '<p class="mic-why">' + (sp.recErr ? recErr(sp.recErr) : blocked === 'offline' ? T.micOffline : T.micNoBrowser) + '</p>' +
        (sp.selfRated == null
          ? '<div class="mic-actions"><button class="btn btn-good" data-self="1">' + T.micSaidIt + '</button>' +
          '<button class="btn btn-ghost" data-self="0">' + T.micNotYet + '</button></div>'
          : '<p class="mic-verdict">' + (sp.selfRated ? T.micNotedOk : T.micNotedNo) + '</p>') +
        '</div>';
    }
    if (sp.recState === 'rec') {
      return '<div class="mic-panel live">' +
        '<button class="mic big listening" data-rec="stop" aria-label="' + T.recStop + '">' + ICON.mic(32) + '</button>' +
        '<p class="mic-why">' + T.recStop + '</p></div>';
    }
    if (sp.recState === 'done') {
      return '<div class="mic-panel compare">' +
        '<div class="mic-actions">' +
        '<button class="btn" data-say="' + esc(target) + '">' + T.recModel + '</button>' +
        '<button class="btn" data-rec="play">' + T.recYours + '</button>' +
        '<button class="btn btn-blue" data-rec="both">' + T.recBoth + '</button>' +
        '</div>' +
        '<p class="mic-why">' + T.recHint + '</p>' +
        (sp.selfRated == null
          ? '<div class="mic-actions"><button class="btn btn-ghost" data-rec="start">' + T.recAgain + '</button>' +
          '<button class="btn btn-good" data-self="1">' + T.micSaidIt + '</button>' +
          '<button class="btn btn-ghost" data-self="0">' + T.micNotYet + '</button></div>'
          : '<p class="mic-verdict">' + (sp.selfRated ? T.micNotedOk : T.micNotedNo) + '</p>') +
        '</div>';
    }
    return '<div class="mic-panel">' +
      '<button class="mic big" data-rec="start" aria-label="' + T.recRecord + '">' + ICON.mic(34) + '</button>' +
      '<p class="mic-why">' + T.recRecord + ' — ' + T.recHint + '</p></div>';
  }

  /* Le message d'erreur du micro promet « évalue-toi toi-même » : il faut donc
     les boutons qui le permettent, sinon la seule issue est de passer. */
  const selfRate = sp => sp.selfRated == null
    ? '<div class="mic-actions"><button class="btn btn-good" data-self="1">' + NL.t.micSaidIt + '</button>' +
    '<button class="btn btn-ghost" data-self="0">' + NL.t.micNotYet + '</button></div>'
    : '<p class="mic-verdict">' + (sp.selfRated ? NL.t.micNotedOk : NL.t.micNotedNo) + '</p>';

  const recErr = k => k === 'framed'
    ? NL.t.recErrFramed
    : k === 'denied' ? NL.t.micDenied
      : k === 'nomic' ? NL.t.recErrNoMic
        : NL.t.recErrOther;

  function micError(kind) {
    return kind === 'denied' ? NL.t.micDenied
      : kind === 'silence' ? NL.t.micSilence
        : kind === 'network' ? NL.t.micNetwork
          : NL.t.micFail;
  }

  /* ---------------- les types exigeants ---------------- */

  /* Trois mots partagent un article, un non. Transforme de/het en raisonnement
     au lieu d'un pile ou face. */
  R.intrus = {
    id: 'intrus', get kicker() { return NL.t.exIntrus; },
    asks: 'nl', answers: 'nl',
    given: chosenLabel,
    build(item) {
      const pool = NL.content.allItems().filter(x => x.kind === 'word' && x.art && x.id !== item.id);
      const same = U.sample(pool.filter(x => x.art === item.art), 2);
      const other = U.sample(pool.filter(x => x.art !== item.art), 1)[0];
      const opts = U.shuffle(
        [item].concat(same).map(x => ({ label: U.bare(x.nl), ok: false }))
          .concat([{ label: U.bare(other.nl), ok: true, art: other.art }]));
      /* Le mot qui n'est pas à sa place reste dans l'exercice : c'est son sens que donne le pied. */
      return { type: 'intrus', item, odd: other, opts, art: item.art };
    },
    view(t, L, phase) {
      return '<p class="sentence prompt">' + NL.t.intrusAsk(t.art) + '</p>' +
        optList(t.opts, L, phase, NL.gloss.attr('nl'));
    },
    ready: (t, L) => !!L.sel,
    judge: (t, L) => ({ ok: !!(L.sel && (t.opts[L.sel.i] || {}).ok) }),
    answer: t => (t.opts.find(o => o.ok) || {}).label || ''
  };

  /* Une faute est plantée dans la phrase : trouve-la. Le transfert vers la
     relecture de tes propres mails est direct. */
  R.corrige = {
    id: 'corrige', get kicker() { return NL.t.exCorrige; },
    asks: 'nl', answers: 'nl',
    given: () => null,
    build(item) {
      const toks = U.tiles(item.nl);
      const i = 1 + ((Math.random() * Math.max(1, toks.length - 2)) | 0);
      const bad = toks.slice();
      const j = Math.min(i + 1, bad.length - 1);
      const tmp = bad[i]; bad[i] = bad[j]; bad[j] = tmp;
      return { type: 'corrige', item, bad, faulty: i, other: j, target: item.nl };
    },
    view(t, L, phase) {
      return '<div class="gloss-line"' + NL.gloss.langAttr(t.item) + '>' + esc(NL.gloss.of(t.item)) + '</div>' +
        '<div class="corrige">' + t.bad.map((w, i) => {
          let cls = '';
          if (phase !== 'ask') { if (i === t.faulty || i === t.other) cls = ' bad'; }
          else if (L.sel && L.sel.i === i) cls = ' sel';
          return '<button class="ctok' + cls + '"' + NL.gloss.attr('nl') + ' data-opt="' + i + '"' + (phase === 'ask' ? '' : ' disabled') + '>' + esc(w) + '</button>';
        }).join('') + '</div>' +
        (phase !== 'ask' ? '<p class="corrige-fix"' + NL.gloss.attr('nl') + '>' + esc(t.target) + '</p>' : '');
    },
    ready: (t, L) => !!L.sel,
    judge: (t, L) => ({ ok: !!L.sel && (L.sel.i === t.faulty || L.sel.i === t.other) }),
    answer: t => t.target
  };

  /* Les deux mauvaises réponses de « Comment le dit-on ici ? ». Elles sont écrites pour l'élément
     (src/content/decoys.js) : deux fautes qu'un apprenant ferait, aussi flamandes à l'œil que la
     bonne. Tirées parmi les formes flamandes des autres éléments, elles parlaient d'autre chose, et
     la bonne se devinait sans rien savoir. Un élément sans leurres écrits (un mot à soi) les tire
     encore là : la forme que l'exercice propose pour un autre
     élément, jamais une qui serait juste ici, ni une forme que l'élément accepte (« salut », qui
     ouvre la liste de tot ziens, est aussi à hallo), ni celle d'un élément au même sens
     (goeiendag face à hallo). */
  function vlaamsDecoys(item) {
    if (item.decoys) return item.decoys;
    const mine = accepted(item), first = x => NL.content.beVariants(x)[0];
    const key = item.kind === 'word' ? f => U.norm(U.bare(f)) : U.norm;
    const any = NL.content.allItems().filter(x => x.be && x.id !== item.id && NL.srs.supports(x, 'vlaams') &&
      !NL.gloss.sameMeaning(x, item) && mine.indexOf(key(first(x))) < 0);
    /* Une phrase contre deux mots isolés se devine sans rien savoir : les
       leurres viennent d'abord du même genre d'élément. */
    const labels = xs => U.uniq(xs.map(first));
    const same = labels(any.filter(x => x.kind === item.kind));
    /* Une bonne option seule à porter un article (« een pintje » face à « hey » et « toe »), ou
       seule à n'en pas porter, se devine aussi : les leurres en ont d'abord un, ou aucun, comme elle. */
    const art = f => U.norm(U.bare(f)) !== U.norm(f), like = same.filter(f => art(f) === art(first(item)));
    return U.sample([like, same].find(xs => xs.length >= 2) || labels(any), 2);
  }

  /* La phrase standard est donnée : comment la dit-on ici ? Unique à cette app,
     et la donnée existe déjà sur chaque élément. Un mot y propose la première forme
     de sa liste (« hey » pour hallo, dont la liste est « hey, salut »). */
  R.vlaams = {
    id: 'vlaams', get kicker() { return NL.t.exVlaams; },
    asks: 'nl', answers: 'nl',
    given: chosenLabel,
    build(item) {
      const opts = U.shuffle([{ label: NL.content.beVariants(item)[0], ok: true }]
        .concat(vlaamsDecoys(item).map(label => ({ label, ok: false }))));
      return { type: 'vlaams', item, opts };
    },
    view(t, L, phase) {
      return '<div class="sentence prompt"' + NL.gloss.attr('nl') + '>' + esc(t.item.nl) + '</div>' +
        '<div class="gloss-line"' + NL.gloss.langAttr(t.item) + '>' + esc(NL.gloss.of(t.item)) + '</div>' + optList(t.opts, L, phase, NL.gloss.attr('nl'));
    },
    ready: (t, L) => !!L.sel,
    judge: (t, L) => ({ ok: !!(L.sel && (t.opts[L.sel.i] || {}).ok) }),
    answer: t => NL.content.beVariants(t.item)[0]
  };

  /* Les lettres d'un mot, accents compris. Dans une regex, `\w` et `\b` ne voient que
     l'ASCII : « geïnstalleerd » s'y coupe à « ï », et « één » n'y est pas un mot. Le
     barème récrit `\w`, `\W`, `\b` et `\B` sur ces lettres-ci (latin accentué, marques
     combinantes), hors des crochets ; entre crochets, `\w` seul. Un navigateur qui ne
     connaît pas le regard arrière garde la regex telle qu'écrite. */
  const LETTER = 'A-Za-z0-9_\\u00C0-\\u00D6\\u00D8-\\u00F6\\u00F8-\\u024F\\u0300-\\u036F';
  const IN = '[' + LETTER + ']';
  const WIDE = {
    w: IN, W: '[^' + LETTER + ']',
    b: '(?:(?<!' + IN + ')(?=' + IN + ')|(?<=' + IN + ')(?!' + IN + '))',
    B: '(?:(?<=' + IN + ')(?=' + IN + ')|(?<!' + IN + ')(?!' + IN + '))'
  };
  function wide(rx) {
    const src = rx.source;
    let out = '', inClass = false;
    for (let i = 0; i < src.length; i++) {
      const c = src[i];
      if (c === '\\') {
        const e = src[++i];
        out += inClass ? (e === 'w' ? LETTER : '\\' + e) : (WIDE[e] || '\\' + e);
        continue;
      }
      if (c === '[') inClass = true;
      else if (c === ']') inClass = false;
      out += c;
    }
    try { return new RegExp(out, rx.flags); } catch (e) { return rx; }
  }

  /* Une suite de mots entiers, dans l'ordre, parmi les mots de la réponse : « in »
     n'est pas dans « kind », et « om half » n'est pas dans « kom half ». */
  const hasRun = (words, run) => run.length > 0 && words.some((_, i) => run.every((y, j) => words[i + j] === y));

  /* Réponse libre, notée sur ce qu'elle CONTIENT et non sur sa formulation.
     Hors ligne, sans IA. C'est le passage de la reproduction à la composition. */
  function rubric(task, text) {
    const s = String(text || ''), w = U.words(s), met = [];
    (task.need || []).forEach(n => {
      if (n.rx && wide(n.rx).test(s)) { met.push(n.what); return; }
      if (n.any && n.any.some(a => hasRun(w, U.words(a)))) { met.push(n.what); return; }
      if (n.min && w.length >= n.min) { met.push(n.what); return; }
    });
    return met;
  }
  R.open = {
    id: 'open', get kicker() { return NL.t.exOpen; },
    asks: 'gloss', answers: 'nl',
    given: () => null,
    build: item => ({ type: 'open', item, task: item.open }),
    view(t, L, phase) {
      const met = phase === 'ask' ? null : rubric(t.task, L.input);
      return '<p class="sentence prompt"' + NL.gloss.langAttr(t.task.ask) + '>' + NL.gloss.quoted(t.task.ask) + '</p>' +
        '<textarea class="textin open-box" rows="3" spellcheck="false" ' +
        'placeholder="' + esc(NL.t.openPlaceholder) + '"' + (phase === 'ask' ? '' : ' disabled') + '>' +
        esc(L.input) + '</textarea>' +
        '<div class="need-list">' + (t.task.need || []).map(n => {
          const on = met ? met.indexOf(n.what) >= 0 : null;
          return '<span class="need' + (on === null ? '' : on ? ' ok' : ' no') + '"' + NL.gloss.langAttr(n.what) + '>' + NL.gloss.quoted(n.what) + '</span>';
        }).join('') + '</div>' +
        (phase !== 'ask' ? '<p class="model-answer"><i>' + NL.t.openModel + '</i> <span' + NL.gloss.attr('nl') + '>' + esc(t.task.model) + '</span></p>' : '');
    },
    ready: (t, L) => U.words(L.input).length >= 3,
    judge: (t, L) => ({ ok: rubric(t.task, L.input).length === (t.task.need || []).length }),
    answer: t => t.task.model
  };

  R.match = {
    id: 'match', get kicker() { return NL.t.exMatch; },
    asks: null, answers: null,
    given: () => null,
    build(items) {
      const pairs = items.slice(0, 5).map(it => ({ id: it.id, nl: U.bare(it.nl), gloss: NL.gloss.bare(it), lang: NL.gloss.langOf(it), item: it }));
      return {
        type: 'match', pairs, items,
        left: U.shuffle(pairs.map((p, i) => ({ t: p.nl, k: i, s: 'l' }))),
        right: U.shuffle(pairs.map((p, i) => ({ t: p.gloss, k: i, s: 'r' })))
      };
    },
    view(t, L) {
      const cell = c => {
        const id = c.s + c.k, gone = L.matchGone.indexOf(id) >= 0;
        const sel = L.matchSel && L.matchSel.id === id, bad = L.matchBad === id;
        return '<button class="pair' + (gone ? ' gone' : '') + (sel ? ' sel' : '') + (bad ? ' shake' : '') + '"' +
          ' data-match="' + id + '" data-k="' + c.k + '" data-side="' + c.s + '"' + (gone ? ' disabled' : '') + '>' +
          '<span class="pair-n">' + (c.s === 'l' ? 'NL' : t.pairs[c.k].lang.toUpperCase()) + '</span>' + '<span' + (c.s === 'l' ? NL.gloss.attr('nl') : NL.gloss.langAttr(t.pairs[c.k].item)) + '>' + esc(c.t) + '</span></button>';
      };
      let rows = '';
      for (let i = 0; i < t.pairs.length; i++) rows += cell(t.left[i]) + cell(t.right[i]);
      return '<div class="pairs">' + rows + '</div>';
    },
    /* matchGone retient les cartes par côté (« l3 », « r0 ») et non par paire :
       deux mots peuvent partager une traduction, et la carte choisie n'est alors
       pas forcément celle d'origine. */
    ready: (t, L) => L.matchGone.length >= t.pairs.length * 2,
    judge: () => ({ ok: true }),
    /* Affiché si l'on passe : les paires elles-mêmes, pas un pied vide. */
    answer: t => t.pairs.map(p => p.nl + ' = ' + p.gloss).join(' · '),
    /* Deux cartes vont ensemble si leurs TEXTES correspondent : « goeiedag » et
       « hallo » disent tous deux « bonjour », et l'écran ne permet pas de savoir
       quel « bonjour » était le sien. */
    fits(t, lk, rk) {
      const a = t.pairs[lk], b = t.pairs[rk];
      return lk === rk || U.norm(a.gloss) === U.norm(b.gloss) || U.norm(a.nl) === U.norm(b.nl);
    }
  };

  /* La ligne « Ici on dit » : les formes flamandes de l'élément, sans celle qui
     répète le néerlandais standard ni ce qui est déjà à l'écran (`shown` : la
     réponse, et ce que la personne a donné), sauf `keepSame` — dans « Comment
     le dit-on ici ? » manqué, la variante EST la réponse : toute la liste se
     montre ; choisie, elle est à l'écran et ne s'y redit pas. En
     gras, ce qui change par rapport au standard ; la ponctuation reste dehors. */
  const PUNCT = '[.,!?;:"()…]*';
  function boldForm(item, form) {
    const diff = U.diffWords(item.nl, form);
    let n = 0, out = '', open = false;
    form.split(/\s+/).filter(Boolean).forEach(tok => {
      const m = tok.match(new RegExp('^(' + PUNCT + ')(.*?)(' + PUNCT + ')$'));
      const lead = m[1], core = m[2], trail = m[3];
      const d = U.norm(core) ? diff[n++] : null;
      const changed = !!d && (!d.ok || d.close);
      const sep = out ? ' ' : '';
      if (changed && open && !lead) out += ' ' + esc(core);
      else {
        if (open) { out += '</b>'; open = false; }
        if (changed) { out += sep + esc(lead) + '<b>' + esc(core); open = true; }
        else out += sep + esc(lead + core + trail);
      }
      if (changed && trail) { out += '</b>' + esc(trail); open = false; }
    });
    return out + (open ? '</b>' : '');
  }
  function hereLine(item, shown, keepSame) {
    if (!item || !item.be) return '';
    const own = U.norm(U.bare(item.nl)), seen = [].concat(shown).filter(s => s != null).map(s => U.norm(U.bare(s)));
    const forms = NL.content.beVariants(item).filter(f => keepSame || (U.norm(U.bare(f)) !== own && seen.indexOf(U.norm(U.bare(f))) < 0));
    if (!forms.length) return '';
    return '<p class="v-be">' + NL.t.hereThey + ' ' + forms.map(f => '<span' + NL.gloss.attr('nl') + '>' + boldForm(item, f) + '</span>').join(', ') + '</p>';
  }

  /* L'explication d'un élément, que le pied montre sous son sens : la note d'un mot ou d'une
     phrase, la règle d'un motif. On la lit ici et nulle part ailleurs ; le pied la rend par
     NL.ui.ifProse, qui déclare nl-BE ce qu'elle cite. */
  const explanation = item => !item ? null : (item.kind === 'pattern' ? item.rule : item.note) || null;

  return { registry: R, get: id => R[id] || R.pick, ICON, speakerRow, flemish, micPanel, retryButton, wordScore, hereLine, rubric, explanation, accepted };
})();
</script>
<script>
/* Shell : routage, chrome, panneaux, et l'unique écouteur d'événements délégué.
   Les écrans sont de simples objets avec render(), et éventuellement click(), key(), input(). */
NL.ui = (function () {
  'use strict';
  const U = NL.util, esc = U.esc, t = NL.t;
  let root = null;
  let route = 'vandaag', arg = null, sheet = null, lastSheet = null, toastMsg = null, toastT = null;

  const I = {
    flame: '<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c2.2 3.4 1.2 5.1.2 6.3-.9 1.1-2 2-2 3.6a3.1 3.1 0 0 0 1.5 2.7c-.4-1.6.3-2.9 1.4-3.7.2 1.8 1.3 2.3 2.4 3.4a4.6 4.6 0 0 1 1.4 3.3A5.3 5.3 0 0 1 12 21.5a6 6 0 0 1-6-6c0-4.6 4.2-5.9 6-13Z"/></svg>',
    bolt: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 2 4 13.2h5.7L8.9 22 20 10.4h-6.2L13.5 2Z"/></svg>',
    due: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.4V12l3 2" stroke-linecap="round"/></svg>',
    x: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    back: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5 8 12l6.5 7"/></svg>',
    gear: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M21.2 12h-2.4M5.2 12H2.8M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7M18.5 18.5l-1.7-1.7M7.2 7.2 5.5 5.5"/></svg>'
  };

  const NAV_ICON = {
    vandaag: '<path d="M4 6.5h16M4 12h16M4 17.5h10"/>',
    leerpad: '<path d="M6 20V8.5a3.5 3.5 0 0 1 7 0v7a3.5 3.5 0 0 0 7 0V4"/>',
    praten: '<path d="M20 14.5a2.5 2.5 0 0 1-2.5 2.5H9l-5 3.5V6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5Z"/>',
    luisteren: '<path d="M4 13.5a8 8 0 0 1 16 0M4 13.5v3a2.5 2.5 0 0 0 5 0v-3M20 13.5v3a2.5 2.5 0 0 1-5 0v-3"/>',
    meer: '<circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/>'
  };
  const UNDER_MEER = ['woorden', 'spiek', 'register', 'klanken', 'doctor', 'dehet', 'fouten'];
  const FULLSCREEN = { sessie: 1, scenario: 1, doctor: 1, compte: 1 };
  /* Les écrans où un changement de langue attend, et son avis avec lui. */
  const LANG_WAITS = { sessie: 1, scenario: 1 };

  function go(to, a) {
    if (route === 'sessie' && to !== 'sessie' && NL.screens.sessie.active()) { sheet = 'quit-session'; return render(); }
    NL.speech.stop(); NL.speech.abort();
    NL.lang.seen();
    route = to; arg = a == null ? null : a; sheet = null;
    try { location.hash = '#' + to + (a ? '/' + a : ''); } catch (e) {}
    render();
    const b = document.querySelector('.screen');
    if (b) b.scrollTop = 0;
  }

  function fromHash() {
    const h = (location.hash || '').replace(/^#/, '');
    if (!h) return null;
    const [r, a] = h.split('/');
    return NL.screens[r] ? { r, a: a || null } : null;
  }

  /* The topbar carries identity and one way out. The scoreboard lives on
     Aujourd'hui and Plus, where you go when you want to look at it. */
  function topbar() {
    return '<header class="topbar"><div class="bar-in">' +
      '<div class="brand"><span class="mark">' +
      '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M5 18.5c3.5-1.5 4.5-5 4.5-8.5S8 4.5 8 4.5"/><path d="M19 18.5c-3.5-1.5-4.5-5-4.5-8.5S16 4.5 16 4.5"/><path d="M4.5 11.5h15"/></svg></span>' +
      '<span class="brand-txt"><b>Vlaams</b><i>' + esc(NL.content.fill(t.brandSub)) + '</i></span></div>' +
      '<button class="iconbtn gear" data-sheet="instellingen" aria-label="' + t.setTitle + '">' + I.gear + syncDot() + '</button>' +
      '</div></header>';
  }

  /* Un point discret sur l'engrenage quand la progression n'est pas à l'abri. */
  function syncDot() {
    if (!NL.sync.enabled) return '';
    const st = NL.sync.status();
    if (!st.user) return '<i class="sdot warn"></i>';
    if (st.state === 'error') return '<i class="sdot bad"></i>';
    return '';
  }

  function nav() {
    return '<nav class="nav"><div class="nav-in">' + t.nav.map(n => {
      const on = route === n.id || (n.id === 'meer' && UNDER_MEER.indexOf(route) >= 0);
      return '<button class="nav-btn' + (on ? ' on' : '') + '" data-go="' + n.id + '">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + NAV_ICON[n.id] + '</svg>' +
        '<span class="nav-fr">' + n.label + '</span><span class="nav-nl"' + NL.gloss.attr('nl') + '>' + n.nl + '</span></button>';
    }).join('') + '</div></nav>';
  }

  function render() {
    applyTheme();
    /* Un changement de langue n'entre jamais en pleine séance ni en pleine conversation. */
    if (!LANG_WAITS[route]) NL.lang.applyAndTell();
    const S = NL.screens[route] || NL.screens.vandaag;
    const full = !!FULLSCREEN[route];
    const note = LANG_WAITS[route] ? '' : NL.lang.notice();
    const noticeHtml = note ? '<div class="notice"><p>' + esc(note) + '</p></div>' : '';
    const html = full
      ? '<div class="screen full">' + noticeHtml + S.render(arg) + '</div>'
      : topbar() + '<main class="screen">' + noticeHtml + S.render(arg) + '</main>' + nav();
    /* La feuille redessinée telle quelle garde l'endroit où on l'avait fait défiler : un
       interrupteur, le thème, le rythme ou la langue la renvoyaient en haut (#103). Une autre
       feuille part du haut. */
    const oldCard = sheet && sheet === lastSheet ? root.querySelector('.sheet-card') : null;
    const at = oldCard ? oldCard.scrollTop : 0;
    root.innerHTML = html + (sheet ? sheetHtml() : '') + ifText(toastMsg, 'div', 'toast');
    lastSheet = sheet;
    const newCard = at ? root.querySelector('.sheet-card') : null;
    if (newCard) newCard.scrollTop = at;
    if (S.after) S.after(arg);
  }

  /* ---------------- panneaux ---------------- */
  function card(title, body, actions) {
    return '<div class="sheet" data-backdrop="1"><div class="sheet-card" role="dialog" aria-modal="true">' +
      '<h3>' + title + '</h3>' + (body || '') + '<div class="sheet-actions">' + actions + '</div></div></div>';
  }

  /* « Unité 5 · Chez le boulanger », ou « Unités 4–5 » : le même libellé sur la
     carte de l'accueil et sur l'écran de la séance. */
  function unitLabel(span) {
    if (span.from !== span.to) return t.unitsRange(span.from, span.to);
    const u = NL.content.units.find(x => x.n === span.from);
    return t.unitOne(span.from) + (u ? ' · ' + NL.gloss.of(u.name) : '');
  }

  /* Le texte `x` (lu par NL.gloss) dans une balise, s'il y en a un, montré par `show` ; sinon rien.
     `lang`, s'il est donné, déclare la langue du texte (NL.gloss.attr). */
  const inTag = (show, x, tag, cls, lang) => {
    const s = NL.gloss.of(x);
    return s ? '<' + tag + (cls ? ' class="' + cls + '"' : '') + (lang ? NL.gloss.attr(lang) : '') + '>' + show(s) + '</' + tag + '>' : '';
  };
  /* Un texte de l'app ou de la personne : échappé. Ce que le micro entend est du néerlandais : 'nl'. */
  const ifText = (x, tag, cls, lang) => inTag(esc, x, tag, cls, lang);
  /* Une prose du cours : échappée, et ce qu'elle cite déclaré nl-BE (NL.gloss.quoted). */
  const ifProse = (x, tag, cls) => inTag(NL.gloss.quoted, x, tag, cls);

  function sheetHtml() {
    const m = NL.state.meta();
    if (sheet === 'quit-session') {
      return card(t.quitTitle, '<p>' + t.quitBody + '</p>',
        '<button class="btn btn-bad wide" data-quit-yes="1">' + t.quitYes + '</button>' +
        '<button class="btn btn-ghost wide" data-close="1">' + t.quitNo + '</button>');
    }
    if (sheet === 'instellingen') {
      const v = NL.speech.voiceInfo();
      const mic = NL.speech.listenBlocked() || (NL.speech.micRefused() ? 'refused' : null);
      return card(t.setTitle,
        '<div class="set-block"><h4>' + t.setTheme + '</h4><div class="seg">' +
        [['system', t.setSystem], ['light', t.setLight], ['dark', t.setDark]].map(([k, label]) =>
          '<button class="seg-btn' + (m.theme === k ? ' on' : '') + '" data-theme="' + k + '">' + label + '</button>').join('') +
        '</div></div>' +

        '<div class="set-block"><h4>' + t.setLang + '</h4>' +
        '<button class="btn wide" data-display-lang="' + NL.gloss.other(NL.lang.current()) + '">' + t.langOther + '</button></div>' +

        '<div class="set-block"><h4>' + t.setPace + '</h4><div class="seg">' +
        ['calme', 'normal', 'intensif'].map(k =>
          '<button class="seg-btn' + ((m.pace || 'normal') === k ? ' on' : '') + '" data-pace="' + k + '">' +
          t['pace' + k.charAt(0).toUpperCase() + k.slice(1)] + '</button>').join('') + '</div>' +
        '<p class="set-note muted">' + t.paceNote(NL.srs.pace()) + '</p>' +
        '<p class="set-note muted">' + t.paceWhy + '</p></div>' +

        '<div class="set-block"><h4>' + t.setPractice + '</h4>' +
        toggle('showFlemish', t.setFlemish, m.showFlemish !== false) +
        toggle('autoplay', t.setAutoplay, m.autoplay !== false) +
        toggle('sfx', t.setSfx, m.sfx !== false) + '</div>' +

        '<div class="set-block"><h4>' + t.setMine + '</h4>' +
        '<p class="set-note muted">' + t.setMineNote + '</p>' +
        [['learnerName', t.setName, NL.content.DEFAULTS.naam],
         ['town', t.setTown, NL.content.DEFAULTS.stad],
         ['company', t.setCompany, NL.content.DEFAULTS.bedrijf]].map(([k, label, ph]) =>
          '<label class="mine"><span>' + label + '</span>' +
          '<input class="textin" data-mine="' + k + '" value="' + esc(m[k] || '') + '" placeholder="' + esc(ph) + '" spellcheck="false"></label>').join('') +
        '</div>' +

        (NL.sync.enabled ? accountBlock() : '') +

        '<div class="set-block"><h4>' + t.setVoice + '</h4>' +
        '<p class="set-note ' + (v.quality === 'be' ? 'good' : 'warn') + '">' + esc(t[v.noteKey]) +
        (v.name ? ' <span class="muted">(' + esc(v.name) + ')</span>' : '') + '</p>' +
        '<p class="set-note ' + (mic ? 'warn' : 'good') + '">' + esc(micLine(mic)) + '</p>' +
        '<button class="btn btn-blue wide" data-go="doctor">' + t.setDoctor + '</button></div>' +

        '<div class="set-block"><h4>' + t.setExport + '</h4>' +
        '<p class="set-note muted">' + t.setStorage + ' ' + NL.state.storage + '. ' + t.setBackupNote + '</p>' +
        '<div class="row"><button class="btn" data-export="1">' + t.setExport + '</button>' +
        '<button class="btn" data-import="1">' + t.setImport + '</button></div>' +
        '<div class="row"><button class="btn btn-ghost" data-act="copy-show">' + t.copyText + '</button>' +
        '<button class="btn btn-ghost" data-act="paste-show">' + t.pasteBackup + '</button></div>' +
        '<input type="file" id="import-file" accept="application/json" hidden></div>',

        '<button class="btn btn-ghost wide" data-close="1">' + t.close + '</button>' +
        '<button class="btn btn-ghost wide danger" data-reset="1">' + t.setReset + '</button>');
    }
    if (sheet === 'reset-confirm') {
      return card(t.setResetTitle, '<p>' + t.setResetBody + '</p>',
        '<button class="btn btn-bad wide" data-reset-yes="1">' + t.setResetYes + '</button>' +
        '<button class="btn btn-ghost wide" data-close="1">' + t.cancel + '</button>');
    }
    if (sheet && sheet.custom) return sheet.custom;
    return '';
  }

  function accountBlock() {
    const st = NL.sync.status();
    if (!st.user) {
      return '<div class="set-block"><h4>' + t.accEyebrow + '</h4>' +
        '<p class="set-note warn">' + t.syncLocalOnly + '</p>' +
        '<button class="btn btn-blue wide" data-go="compte">' + t.accSignInCta + '</button></div>';
    }
    const line = st.state === 'syncing' ? t.syncBusy
      : st.state === 'offline' ? t.syncOffline(st.pending)
      : st.state === 'error' ? t.syncError('')
      : st.pending ? t.syncPending(st.pending)
      : t.syncOk(st.lastSync ? t.syncAgo(Date.now() - st.lastSync) : t.syncNever);
    /* La sauvegarde quotidienne tourne ailleurs (dépôt privé). Si elle s'arrête,
       rien ne le dirait : d'où cette ligne, qui vieillit toute seule. */
    const lb = NL.state.meta().lastBackup;
    const old = lb && Date.now() - lb > 3 * U.DAY;
    const backup = '<p class="set-note ' + (!lb || old ? 'warn' : 'good') + '">' +
      (!lb ? t.backupNone : old ? t.backupStale(t.syncAgo(Date.now() - lb)) : t.backupLast(t.syncAgo(Date.now() - lb))) + '</p>';
    return '<div class="set-block"><h4>' + t.accEyebrow + '</h4>' +
      '<p class="set-note muted">' + esc(st.user.email || '') + '</p>' +
      '<p class="set-note ' + (st.state === 'error' ? 'warn' : 'good') + '">' + esc(line) + '</p>' +
      backup +
      '<button class="btn btn-blue wide" data-go="compte">' + t.accManage + '</button></div>';
  }

  const micLine = kind => kind === 'browser' ? (NL.speech.noService() === 'ios' ? t.micNoBrowserIOS : t.micNoBrowser)
    : kind === 'offline' ? t.micOffline
      /* Même règle que le docteur audio : après un refus, ne pas dire « active ». */
      : kind === 'refused' ? t.micRefusedLine
        : t.micActiveLine;

  const toggle = (k, label, on) =>
    '<label class="tog"><span>' + label + '</span>' +
    '<button class="switch' + (on ? ' on' : '') + '" data-toggle="' + k + '" role="switch" aria-checked="' + !!on + '"><span></span></button></label>';

  function openSheet(s) { sheet = s; render(); }
  function closeSheet() { sheet = null; render(); }

  /* Le toast se pose et s'en va sans redessiner la page : un rendu remettait en haut la feuille
     qu'on faisait défiler, à son arrivée puis à son départ. render() le garde tant qu'il dure. */
  function toast(msg) {
    toastMsg = msg; placeToast();
    clearTimeout(toastT);
    toastT = setTimeout(() => { toastMsg = null; placeToast(); }, 2400);
  }
  function placeToast() {
    const was = root.querySelector('.toast');
    if (was) was.remove();
    root.insertAdjacentHTML('beforeend', ifText(toastMsg, 'div', 'toast'));
  }

  function applyTheme() {
    const th = NL.state.meta().theme;
    const r = document.documentElement;
    if (th === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', th);
  }

  /* ---------------- sauvegarde ---------------- */
  /* Three routes out, because this page runs in three different places.
     Inside the claude.ai viewer a plain <a download> is inert, so the host's
     save capability is tried first; on a hosted or local copy that capability
     does not exist and the anchor works. Copy-paste always works. */
  const backupName = () => 'vlaams-' + U.dayKey() + '.json';
  const backupText = () => JSON.stringify(NL.state.exportAll(), null, 1);

  function anchorDownload(text) {
    const blob = new Blob([text], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = backupName();
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  function doExport() {
    const text = backupText();
    const host = window.claude && typeof window.claude.use === 'function' ? window.claude.use('downloads') : null;
    if (!host) { try { anchorDownload(text); toast(t.exported); } catch (e) { openCopy(text); } return; }
    Promise.resolve(host).then(dl => {
      if (!dl) { try { anchorDownload(text); toast(t.exported); } catch (e) { openCopy(text); } return; }
      dl.save({ filename: backupName(), data: text })
        .then(() => toast(t.exported))
        .catch(err => { if (!err || err.code !== 'declined') openCopy(text); });
    }).catch(() => openCopy(text));
  }

  function openCopy(text) {
    openSheet({ custom: card(t.setExport,
      '<p>' + t.copyHow(t.setImport) + '</p>' +
      '<textarea class="backup-box" id="backup-out" readonly spellcheck="false">' + esc(text) + '</textarea>',
      '<button class="btn btn-blue wide" data-act="copy-backup">' + t.copy + '</button>' +
      '<button class="btn btn-ghost wide" data-close="1">' + t.close + '</button>') });
  }

  /* Copie `text` : par le presse-papiers s'il existe, sinon par l'ancienne commande du
     navigateur, qui copie ce qui est sélectionné — `box`, sélectionné d'abord, d'où l'on peut
     aussi copier à la main. Sans presse-papiers ni `box` à sélectionner, il n'y a rien à copier
     que la sélection de quelqu'un d'autre : la promesse rend false et la commande ne part pas.
     Rend la promesse d'un booléen : copié ou non. La sauvegarde et le journal d'erreurs
     (doctor.js) copient par ici. */
  const copy = (text, box) => {
    if (box) box.select();
    return navigator.clipboard
      ? navigator.clipboard.writeText(text).then(() => true).catch(() => false)
      : Promise.resolve(!!(box && document.execCommand && document.execCommand('copy')));
  };

  function openPaste() {
    openSheet({ custom: card(t.setImport,
      '<p>' + t.pasteHow + '</p>' +
      '<textarea class="backup-box" id="backup-in" spellcheck="false" placeholder="{ &quot;app&quot;: &quot;vlaams-onderweg&quot; … }"></textarea>',
      '<button class="btn btn-good wide" data-act="paste-backup">' + t.setImport + '</button>' +
      '<button class="btn btn-ghost wide" data-close="1">' + t.cancel + '</button>') });
  }

  function restore(raw) {
    let data = null;
    try { data = JSON.parse(raw); } catch (e) { /* reported below */ }
    const old = NL.state.isOldBackup(data);
    if (NL.state.importAll(data)) {
      NL.content.refresh(); NL.srs.fold(); sheet = null;
      if (NL.sync.user) { NL.sync.queueAll(); NL.sync.flush(); }
      render(); toast(old ? t.importedOld : t.imported);
    }
    else toast(t.importFailed);
  }

  function doImport() {
    const inp = document.getElementById('import-file');
    if (!inp) return openPaste();
    inp.onchange = () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => restore(r.result);
      r.readAsText(f);
    };
    try { inp.click(); } catch (e) { openPaste(); }
  }

  /* ---------------- événements ---------------- */
  function bind(el) {
    root = el;

    root.addEventListener('click', e => {
      let hit = e.target.closest('[data-say],[data-go],[data-sheet],[data-close],[data-backdrop],[data-theme],' +
        '[data-toggle],[data-reset],[data-reset-yes],[data-quit-yes],[data-export],[data-import],[data-pace],[data-act],[data-display-lang]');
      /* Avec le thème Sombre ou Clair, <html> porte data-theme : closest()
         remontait jusqu'à lui, chaque clic devenait « choisir le thème », et plus
         aucune réponse ne passait. On ne garde que ce qui est dans l'app. */
      if (hit && !root.contains(hit)) hit = null;
      const S = NL.screens[route];

      if (hit) {
        const d = hit.dataset;
        if (d.say !== undefined) { NL.speech.say(d.say, { rate: d.slow ? 0.62 : 1 }); return; }
        if (d.backdrop !== undefined && hit === e.target) { closeSheet(); return; }
        if (d.close !== undefined) { closeSheet(); return; }
        if (d.go) { go(d.go); return; }
        if (d.sheet) { openSheet(d.sheet); return; }
        if (d.theme) { NL.state.setMeta({ theme: d.theme }); render(); return; }
        if (d.pace) { NL.state.setMeta({ pace: d.pace }); render(); return; }
        if (d.displayLang) { NL.lang.set(d.displayLang); render(); return; }
        if (d.toggle) { const m = NL.state.meta(); NL.state.setMeta({ [d.toggle]: m[d.toggle] === false }); render(); return; }
        if (d.export !== undefined) { doExport(); return; }
        if (d.import !== undefined) { doImport(); return; }
        if (d.act === 'copy-show') { openCopy(backupText()); return; }
        if (d.act === 'paste-show') { openPaste(); return; }
        if (d.act === 'copy-backup') {
          const box = document.getElementById('backup-out');
          if (box) copy(box.value, box).then(good => toast(good ? t.backupCopied : t.backupCopyByHand));
          return;
        }
        if (d.act === 'paste-backup') {
          const box = document.getElementById('backup-in');
          if (box) restore(box.value.trim());
          return;
        }
        if (d.reset !== undefined) { sheet = 'reset-confirm'; render(); return; }
        if (d.resetYes !== undefined) {
          /* La progression seulement : réglages, score et mots personnels
             restent. Connecté, le serveur est effacé avant d'être relu — sinon
             la synchro suivante rendrait tout ce qu'on vient d'effacer. */
          NL.state.resetProgress();
          NL.content.refresh(); sheet = null; route = 'vandaag'; render(); toast(t.wiped);
          if (NL.sync.user) NL.sync.flush();
          return;
        }
        if (d.quitYes !== undefined) { NL.screens.sessie.abandon(); sheet = null; go('vandaag'); return; }
      }

      if (S && S.click) {
        const target = e.target.closest('[data-act],[data-opt],[data-pick],[data-unpick],[data-match],[data-ins],' +
          '[data-mic],[data-self],[data-check],[data-next],[data-skip],[data-start],[data-unit],[data-scn],' +
          '[data-clip],[data-sheetid],[data-choice],[data-step],[data-del],[data-add],[data-rec],[data-quiet]');
        if (target) S.click(target, target.dataset, e);
      }
    });

    root.addEventListener('change', e => {
      if (e.target.matches('[data-goal]')) { NL.state.setMeta({ dailyGoal: +e.target.value }); return; }
      const S = NL.screens[route];
      if (S && S.change) S.change(e.target, e);
    });

    root.addEventListener('input', e => {
      if (e.target && e.target.dataset && e.target.dataset.mine) {
        NL.state.setMeta({ [e.target.dataset.mine]: e.target.value.trim() });
        NL.content.refresh();          // the whole course re-reads its placeholders
        return;
      }
      const S = NL.screens[route];
      if (S && S.input) S.input(e.target, e);
    });

    document.addEventListener('keydown', e => {
      if (sheet) { if (e.key === 'Escape') closeSheet(); return; }
      const S = NL.screens[route];
      if (S && S.key) S.key(e);
    });

    window.addEventListener('hashchange', () => {
      const h = fromHash();
      if (h && h.r !== route) { route = h.r; arg = h.a; render(); }
    });
  }

  /* Appelé par la synchro quand une connexion aboutit — au retour du lien
     magique par exemple. */
  function onAuth() { if (route === 'compte') go('vandaag'); else render(); }

  return {
    bind, render, go, toast, openSheet, closeSheet, I, card, unitLabel, ifText, ifProse, copy, onAuth,
    get route() { return route; },
    boot() { const h = fromHash(); if (h) { route = h.r; arg = h.a; } render(); }
  };
})();
NL.screens = NL.screens || {};
</script>
<script>
/* The session runner. Builds a queue from whatever the scheduler says is owed,
   runs it, grades it, and puts failures back on the end. */
NL.screens.sessie = (function () {
  'use strict';
  const U = NL.util, esc = U.esc, EX = NL.ex;
  let L = null;

  const MAX_TASKS = NL.srs.MAX_TASKS;

  function blankTurn() {
    return { sel: null, picked: [], input: '', close: false, other: false, matchSel: null, matchGone: [], matchBad: null, speech: { phase: 'idle', tries: 0, selfRated: null } };
  }

  /* ---------------- le défi ----------------
     Vingt exercices de PRODUCTION tirés de ce que tu as déjà rencontré, trois
     vies, pas de reprise. Parler en est exclu : l'auto-évaluation n'a pas sa
     place dans un score. Les réponses comptent comme de vraies révisions. */
  const DEFI_SIZE = 20, DEFI_LIVES = 3, DEFI_MIN = 10;
  const DEFI_TYPES = {
    word: ['type', 'dictation', 'cloze'],
    phrase: ['type', 'dictation', 'corrige', 'cloze'],
    chunk: ['type', 'dictation', 'cloze'],
    pattern: ['order', 'corrige', 'type']
  };
  const defiPool = () => NL.content.allItems().filter(it => NL.srs.stageOf(it) >= 1);
  const defiReady = () => defiPool().length >= DEFI_MIN;

  function startDefi() {
    const pool = defiPool();
    if (pool.length < DEFI_MIN) { L = null; return false; }
    const queue = [];
    let last = null;
    U.shuffle(pool).forEach(it => {
      if (queue.length >= DEFI_SIZE) return;
      let names = (DEFI_TYPES[it.kind] || DEFI_TYPES.word).filter(n => NL.srs.supports(it, n));
      if (!names.length) names = ['type'];
      const fresh = names.filter(n => n !== last);
      const name = U.one(fresh.length ? fresh : names);
      try { queue.push({ ex: name, task: EX.get(name).build(it), items: [it] }); last = name; } catch (e) {}
    });
    if (!queue.length) { L = null; return false; }
    L = Object.assign(blankTurn(), {
      source: 'defi', queue, at: 0, phase: 'ask', right: 0, wrong: 0, spoken: 0, xp: 0,
      started: Date.now(), finished: false, newCount: 0, combo: 0, bestCombo: 0, lives: DEFI_LIVES
    });
    return true;
  }

  /* Un exercice par élément. Le gouverneur retient les deux derniers types
     servis pour qu'aucun ne se répète coup sur coup. */
  function build(items, recent, quiet) {
    const out = [];
    items.forEach(it => {
      const name = NL.srs.exerciseFor(it, new Set(recent), quiet);
      try {
        out.push({ ex: name, task: EX.get(name).build(it), items: [it] });
        recent.push(name);
        if (recent.length > 2) recent.shift();
      } catch (e) {
        /* Un élément mal formé est sauté — mais plus en silence : sans trace,
           il pouvait n'être jamais drillé sans que personne le sache. */
        NL.errlog.note(e, 'exercise ' + name + ' · ' + it.id);
      }
    });
    return out;
  }

  /* Étalement optimal. Choisir « le premier qui diffère » ne suffit pas : quand
     un type domine la file, il faut le répartir activement. On puise donc à
     tour de rôle dans le plus gros paquet restant, ce qui est l'ordonnancement
     qui minimise réellement les voisins identiques. */
  function spread(list, last) {
    const bucket = {};
    list.forEach(x => { (bucket[x.ex] = bucket[x.ex] || []).push(x); });
    const out = [];
    const left = () => Object.keys(bucket).filter(k => bucket[k].length);
    while (left().length) {
      const keys = left().sort((a, b) => bucket[b].length - bucket[a].length);
      const k = keys.find(x => x !== last) || keys[0];
      out.push(bucket[k].shift());
      last = k;
    }
    return out;
  }

  /* Trois temps : les rencontres, les révisions, puis le renforcement de chaque
     rencontre. C'est ce renforcement qui remplace l'ancien retour à douze minutes :
     l'élément revient quelques minutes plus tard, dans la même séance, sans
     jamais devenir une échéance. Quand il trouve sa place, elle est réservée dès
     le départ, pour que le compteur de la séance ne s'allonge pas en cours de
     route ; sinon il n'est pas servi, et l'élément revient le lendemain. */
  function start(source) {
    NL.state.touchDay();
    if (source === 'defi') return startDefi();
    if (source === 'fouten') return startMistakes();
    /* Ce que la séance contient, c'est compose() qui le décide — le même appel
       que l'écran d'accueil. */
    const c = NL.srs.compose(source);

    const queue = [];
    /* Brand-new items get met as a matching warm-up before anything is demanded. */
    const newWords = c.fresh.filter(it => it.kind !== 'pattern');
    if (newWords.length >= 4) {
      queue.push({ ex: 'match', task: EX.registry.match.build(newWords.slice(0, 5)), items: newWords.slice(0, 5) });
    }
    /* La mémoire du dernier type traverse les séances : sans elle, chaque
       nouvelle séance repart aveugle. */
    const recent = [];
    const meetings = spread(build(c.fresh, recent), queue.length ? 'match' : NL.state.meta().lastEx || null);
    const reviews = spread(build(U.shuffle(c.due), recent), meetings.length ? meetings[meetings.length - 1].ex : NL.state.meta().lastEx || null);
    queue.push.apply(queue, NL.srs.lace(meetings, reviews, toSay, secondOf));
    queue.forEach((x, i) => { if (x.second) x.metAt = queue.findIndex(y => !y.second && y.ex !== 'match' && y.items[0] === x.items[0]); });

    if (queue.length === 0) { L = null; return false; }
    const built = meetings.concat(reviews);
    if (built.length) NL.state.setMeta({ lastEx: built[built.length - 1].ex });

    L = Object.assign(blankTurn(), {
      source: source || 'vandaag', queue, at: 0, cap: queue.length + 6,
      phase: 'ask', right: 0, wrong: 0, spoken: 0, xp: 0, started: Date.now(), finished: false,
      newCount: c.fresh.length, combo: 0, bestCombo: 0, lives: null
    });
    arm();
    return !!L.queue.length;
  }

  /* Un second exercice ne revient jamais à moins de SECOND_GAP exercices de son
     élément : la règle et la disposition de la séance sont dans NL.srs.lace().

     Un élément qu'on dit à voix haute pour la première fois revient lui aussi
     une seconde fois, et c'est ce second exercice qui décide de son échelon :
     par écrit s'il vient d'être dit, de nouveau à voix haute sinon. */
  const SECOND_GAP = NL.srs.SECOND_GAP;
  const toSay = x => x.ex === 'speak' && NL.srs.firstAloud(x.items[0]);
  const secondOf = x => ({ ex: null, task: null, items: x.items, second: true });

  /* Une séance sur ce qui résiste : les éléments le plus souvent ratés, chacun à
     l'échelon où il se trouve. Comme le défi, elle ne compte pas dans le budget
     du jour qu'elle n'a pas à attendre, et ses réponses sont de vraies révisions. */
  function startMistakes() {
    const items = NL.srs.mistakes().slice(0, MAX_TASKS).map(x => x.item);
    const queue = spread(build(items, []), NL.state.meta().lastEx || null);
    if (!queue.length) { L = null; return false; }
    L = Object.assign(blankTurn(), {
      source: 'fouten', queue, at: 0, cap: queue.length + 6,
      phase: 'ask', right: 0, wrong: 0, spoken: 0, xp: 0, started: Date.now(), finished: false,
      newCount: 0, combo: 0, bestCombo: 0, lives: null
    });
    return true;
  }

  /* Le renforcement d'une rencontre se construit quand son tour arrive : son exercice
     dépend de l'échelon que l'élément vient d'atteindre. Raté à la rencontre, il
     est redemandé au même échelon ; réussi, à l'échelon suivant.
     Quand plusieurs renforcements se suivent, on sert d'abord celui dont l'exercice
     diffère du précédent — sans jamais rapprocher un renforcement de sa rencontre. */
  function arm() {
    while (L && L.at < L.queue.length && !L.queue[L.at].task) {
      const prev = L.at > 0 ? L.queue[L.at - 1].ex : null;
      const after = L.queue[L.at + 1] && L.queue[L.at + 1].task ? L.queue[L.at + 1].ex : null;
      const avoid = new Set([prev, after].filter(Boolean));
      let at = L.at, name = NL.srs.exerciseFor(L.queue[L.at].items[0], avoid, L.quiet);
      for (let j = L.at + 1; name === prev && j < L.queue.length && !L.queue[j].task; j++) {
        if (!NL.srs.apart(L.queue[j].metAt, L.at)) continue;
        const n = NL.srs.exerciseFor(L.queue[j].items[0], avoid, L.quiet);
        if (n !== prev) { at = j; name = n; }
      }
      const c = L.queue[at];
      L.queue[at] = L.queue[L.at];
      L.queue[L.at] = c;
      try {
        c.ex = name;
        c.task = EX.get(name).build(c.items[0]);
      } catch (e) { L.queue.splice(L.at, 1); }
    }
  }

  /* Une faute sur un élément dont le renforcement attend plus loin n'ajoute pas de
     reprise : le renforcement EST sa seconde chance.

     Sauf à voix haute, tant que l'élément n'a jamais été dit : son second
     exercice doit rester libre pour l'écrire. On le redemande donc à voix haute
     sans l'attendre, quelques exercices plus loin. Dit cette fois, il est écrit
     dans la séance ; sinon c'est ce second exercice qui le redemande à voix
     haute, et l'écrit attend le lendemain. */
  function again(c) {
    const at = L.queue.findIndex((x, i) => i > L.at && x.second && !x.task && x.items[0] === c.items[0]);
    if (at < 0) { if (L.queue.length < L.cap) L.queue.push(retryOf(c)); return; }
    if (c.ex !== 'speak' || c.retry || L.queue.length >= L.cap || !NL.srs.firstAloud(c.items[0])) return;
    const pos = Math.max(L.at + 1, Math.min(L.at + 1 + SECOND_GAP, at - SECOND_GAP));
    L.queue.forEach(x => { if (x.second && x.metAt >= pos) x.metAt++; });
    L.queue.splice(pos, 0, retryOf(c));
    L.queue[at + 1].metAt = pos;
  }

  /* « Je ne peux pas parler » : plus rien à voix haute jusqu'à la fin de la
     séance. Les exercices parlés qui restaient sont retirés sans être notés et
     sans rien prendre au budget du jour : leurs éléments restent dus. Ceux que
     needsVoice() désigne, dont le prochain exercice ne peut être que parlé,
     reviendront à voix haute ; pour les autres, l'exercice sera tiré de
     nouveau, et ils pourront être demandés par écrit. D'autres éléments dus
     prennent leur place, choisis par compose() comme pour toute séance. Rien
     n'est retenu au-delà : la séance suivante redemande. Ce n'est pas un
     réglage, parce qu'un réglage suit l'appareil et s'oublie éteint. */
  function quiet() {
    const c = cur();
    if (!c || c.ex !== 'speak' || L.phase !== 'ask') return;
    NL.speech.abort(); NL.speech.clearRecording();
    L.quiet = true;
    /* Le bilan dira combien d'exercices parlés sont gardés pour la séance suivante. */
    L.putOff = (L.putOff || 0) + L.queue.slice(L.at).filter(x => x.ex === 'speak').length;
    const head = L.queue.slice(0, L.at), rest = L.queue.slice(L.at);
    const spoken = rest.filter(x => x.ex === 'speak').length;
    /* Le second exercice d'un élément qui ne peut être que dit part avec son
       exercice parlé : servi sans parler, il le ferait monter par écrit sans
       qu'il ait jamais été dit. Sa place, elle, est reprise ; la séance
       raccourcit donc d'un exercice par élément mis de côté. */
    const kept = rest.filter(x => x.ex !== 'speak' && !(!x.task && NL.srs.needsVoice(x.items[0])));
    /* Les séances à liste fixe, les fautes et le défi, ne se complètent pas. */
    let more = [];
    if (L.source !== 'fouten' && L.source !== 'defi') {
      const here = new Set();
      L.queue.forEach(x => x.items.forEach(it => here.add(it.id)));
      more = NL.srs.compose(L.source, undefined, { quiet: true, without: here }).due.slice(0, spoken);
    }
    L.queue = settle(head.concat(kept, spread(build(more, [], true), kept.length ? kept[kept.length - 1].ex : null)), L.at);
    Object.assign(L, blankTurn());
    L.phase = 'ask';
    /* Il ne restait que du parlé, et rien n'a encore été répondu : il n'y a pas
       de séance à conclure, ni de journée à compter. */
    if (L.at >= L.queue.length && L.right + L.wrong === 0) { L = null; NL.ui.go('vandaag'); NL.ui.toast(NL.t.quietOnly); return; }
    if (L.at >= L.queue.length) return finish();
    arm();
    if (L.at >= L.queue.length) return finish();
    NL.ui.render();
    autoplay();
  }

  /* Resserrée, la file peut rapprocher un second exercice de son élément : il
     attend alors que SECOND_GAP exercices l'en séparent de nouveau, comme dans
     NL.srs.lace(), et n'est pas servi s'il n'y arrive pas avant la fin. */
  function settle(queue, from) {
    const out = queue.slice(0, from), waiting = [];
    const ripe = () => waiting.findIndex(x => NL.srs.apart(x.metAt, out.length));
    const flush = () => { for (let k = ripe(); k >= 0; k = ripe()) out.push(waiting.splice(k, 1)[0]); };
    queue.slice(from).forEach(x => {
      flush();
      if (x.second) {
        let k = out.length - 1;
        while (k >= 0 && (out[k].second || out[k].ex === 'match' || out[k].items[0] !== x.items[0])) k--;
        x.metAt = k;
        if (!NL.srs.apart(k, out.length)) { waiting.push(x); return; }
      }
      out.push(x);
    });
    flush();
    return out;
  }

  const cur = () => L && L.queue[L.at];
  const active = () => !!(L && !L.finished);
  const abandon = () => { NL.speech.abort(); L = null; };

  function autoplay() {
    const c = cur();
    if (!c || NL.state.meta().autoplay === false) return;
    const ex = EX.get(c.ex);
    if (ex.auto) { const txt = ex.auto(c.task); if (txt) setTimeout(() => NL.speech.say(txt), 150); }
